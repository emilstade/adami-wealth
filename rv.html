<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa RV — recomendações e histórico</title>
<style>
  :root{
    --navy:#1B2A4A; --navy-pale:#EDF0F5; --gold:#C9A24B; --cream:#F7F4EE;
    --ink:#26313F; --muted:#8A93A6; --red:#B5563A; --green:#5C7A5C;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);font-family:var(--sans);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px}
  header .mark{font-family:var(--serif);font-size:17px;letter-spacing:2px}
  header .sub{font-size:12px;color:#9FB0CC}
  header nav{margin-left:auto;display:flex;gap:6px}
  header nav button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#C9D4E6;
    padding:7px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  header nav button.on{background:var(--gold);border-color:var(--gold);color:#26313F;font-weight:600}

  .layout{display:grid;grid-template-columns:420px 1fr;gap:24px;padding:24px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .wrap{padding:24px;max-width:1080px;margin:0 auto}
  .pane{background:#fff;border:1px solid #E3E7EE;border-radius:14px;padding:20px}
  .pane h2{font-family:var(--serif);color:var(--navy);font-size:16px;margin:0 0 14px}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .tab{padding:8px 12px;border:1px solid #D8DEE8;background:#fff;border-radius:8px;
       font-size:12.5px;cursor:pointer;color:var(--muted);font-family:var(--sans)}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
        color:var(--muted);margin:0 0 4px}
  input,select{width:100%;padding:9px 10px;border:1px solid #D8DEE8;border-radius:8px;
        font-size:14px;font-family:var(--sans);color:var(--ink);background:#fff}
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
  .field{margin-bottom:12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:end}

  fieldset{border:1px solid #E3E7EE;border-radius:10px;padding:14px;margin:0 0 12px}
  legend{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:0 6px}

  .derived{background:var(--navy-pale);border-radius:10px;padding:12px 14px;margin-top:6px}
  .derived div{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
  .derived .k{color:var(--muted)}
  .derived .v{font-family:var(--serif);color:var(--navy);font-weight:bold}
  .derived .v.warn{color:var(--red)}
  .derived .v.pos{color:var(--green)}
  .derived .v.neg{color:var(--red)}
  .sep{display:block;border-top:1px solid #D8DEE8;margin:7px 0}

  .btn{width:100%;padding:11px;border:0;border-radius:9px;background:var(--navy);color:#fff;
       font-size:13.5px;cursor:pointer;margin-top:10px;font-family:var(--sans)}
  .btn:hover{background:#24365C}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid #D8DEE8}
  .btn.gold{background:var(--gold);color:#26313F;font-weight:600}
  .btn.gold:hover{background:#D9B45F}
  .btn.mini{width:auto;padding:8px 12px;font-size:12px;margin:0}

  canvas{width:100%;max-width:540px;height:auto;border-radius:12px;
         box-shadow:0 6px 24px rgba(27,42,74,.16);display:block}
  .hint{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.55}
  .alerta{font-size:12px;color:var(--red);margin-top:10px;line-height:1.5;min-height:1em}

  /* histórico */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid #E3E7EE;border-radius:12px;padding:14px 16px}
  .stat .n{font-family:var(--serif);font-size:26px;color:var(--navy);font-weight:bold}
  .stat .n.pos{color:var(--green)} .stat .n.neg{color:var(--red)}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:3px}

  .op{background:#fff;border:1px solid #E3E7EE;border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .op-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .op-tk{font-family:var(--serif);font-size:22px;font-weight:bold;color:var(--navy)}
  .op-tipo{font-size:11px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
  .op-data{font-size:12px;color:var(--muted);margin-left:auto}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.4px}
  .badge.aberta{background:#EAF0FA;color:#3D5178}
  .badge.ganho{background:#E7F0E7;color:#3F5C3F}
  .badge.perda{background:#F8E9E5;color:#8E402A}
  .badge.neutra{background:#EFEFEF;color:#6A6A6A}
  .op-res{font-size:13px;color:var(--muted);margin:8px 0 0}
  .op-res b{font-family:var(--serif);color:var(--ink)}

  .aloc{margin-top:12px;border-top:1px solid #EDF0F5;padding-top:12px}
  .aloc table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
  .aloc td{padding:5px 0;border-bottom:1px solid #F2F4F8}
  .aloc td.num{text-align:right;font-family:var(--serif)}
  .aloc td.x{width:26px;text-align:right}
  .aloc .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  .aloc .rm:hover{color:var(--red)}
  .aloc-tot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
    padding-top:6px;border-top:1px solid #E3E7EE}
  .aloc-tot b{font-family:var(--serif);color:var(--navy)}
  .vazio{color:var(--muted);font-size:12.5px;padding:8px 0}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .filtro-linha{display:grid;grid-template-columns:1.6fr 1fr 1fr auto auto;gap:8px;align-items:center}
  @media(max-width:700px){.filtro-linha{grid-template-columns:1fr}}
  .fecha{background:#FBF6EA;border:1px solid #E8DBBB;border-radius:10px;padding:12px 14px;margin-top:10px}
  #awVoltar{position:fixed;bottom:18px;left:18px;z-index:99999;background:#1B3A5F;color:#fff;border:0;
  border-radius:999px;padding:10px 18px;font:500 13px "Segoe UI",system-ui,Arial,sans-serif;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.22);opacity:.92}
  #awVoltar:hover{background:#132B47;opacity:1}
  @media print{#awVoltar{display:none!important}}
</style>
</head>
<body>

<header>
  <span class="mark">ADAMI</span>
  <span class="sub">Mesa RV</span><span class="sub" style="opacity:.6">versão 2.16</span><span class="sub" id="selPerm" style="display:none;color:#C9A24B"></span>
  <nav>
    <button id="navNova" class="on" onclick="verView('nova')">Nova operação</button>
    <button id="navHist" onclick="verView('hist')">Histórico</button>
  </nav>
</header>

<!-- ============ NOVA OPERAÇÃO ============ -->
<div id="viewNova">
<div class="layout">
  <div class="pane">
    <div class="tabs" id="tabs"></div>

    <div class="row2">
      <div class="field"><label for="ticker">Ativo</label>
        <input id="ticker" value="BBDC4" oninput="desenhar()"></div>
      <div class="field"><label for="empresa">Nome da empresa</label>
        <input id="empresa" value="Bradesco PN" oninput="desenhar()"></div>
    </div>

    <div id="b_ordem" style="display:none">
      <div class="row2">
        <div class="field"><label for="direcao">Operação</label>
          <select id="direcao" onchange="desenhar()">
            <option value="compra">Compra</option>
            <option value="venda">Venda</option>
          </select></div>
        <div class="field"><label for="oPreco">Preço (R$)</label>
          <input id="oPreco" value="15,89" oninput="desenhar()"></div>
      </div>
      <div class="field">
        <label><input type="checkbox" id="temAlvo" checked onchange="desenhar()"
          style="width:auto;margin-right:7px;vertical-align:-1px">Definir alvo</label>
        <input id="oAlvo" value="17,00" oninput="desenhar()">
      </div>
      <div class="field">
        <label><input type="checkbox" id="temStop" checked onchange="desenhar()"
          style="width:auto;margin-right:7px;vertical-align:-1px">Com stop</label>
        <input id="oStop" value="15,25" oninput="desenhar()">
      </div>
      <div class="field"><label for="oObs">Observação</label>
        <input id="oObs" value="Ordem a mercado" oninput="desenhar()"></div>
      <div class="derived" id="derOrdem"></div>
    </div>

    <div id="b_swing">
      <div class="field"><label for="atual">Preço atual (R$)</label>
        <input id="atual" value="15,89" oninput="desenhar()"></div>
      <div class="row2">
        <div class="field"><label for="alvo">Alvo (R$)</label>
          <input id="alvo" value="17,00" oninput="desenhar()"></div>
        <div class="field"><label for="stop">Stop (R$)</label>
          <input id="stop" value="15,25" oninput="desenhar()"></div>
      </div>
      <div class="field"><label for="obs">Observação</label>
        <input id="obs" value="Ordem lançada no preço de fechamento" oninput="desenhar()"></div>
      <div class="derived" id="derSwing"></div>
    </div>

    <div id="b_coupon" style="display:none">
      <div class="row2">
        <div class="field"><label for="venc">Vencimento</label>
          <input id="venc" type="date" value="2026-10-05" oninput="ajustarIR();desenhar()"></div>
        <div class="field"><label for="barreira">Barreira de baixa (%)</label>
          <input id="barreira" value="12" oninput="desenhar()"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="premio">Prêmio bruto (%)</label>
          <input id="premio" value="2,32" oninput="desenhar()"></div>
        <div class="field"><label for="fee">Fee de estruturação (%)</label>
          <input id="fee" value="1" oninput="desenhar()"></div>
      </div>
      <fieldset>
        <legend>Comparação com o CDI</legend>
        <div class="field"><label for="cdi">CDI bruto (% a.a.)</label>
          <input id="cdi" value="14,90" oninput="desenhar()"></div>
        <div class="row2">
          <div class="field"><label for="irOp">IR da operação (%)</label>
            <input id="irOp" value="15" oninput="desenhar()"></div>
          <div class="field"><label for="irCdi">IR do CDI (%)</label>
            <input id="irCdi" value="22,5" oninput="desenhar()"></div>
        </div>
      </fieldset>
      <div class="derived" id="derCoupon"></div>
    </div>

    <div id="b_generica" style="display:none">
      <div class="field"><label for="gVenc">Vencimento</label>
        <input id="gVenc" type="date" value="2026-10-05" oninput="desenhar()"></div>
      <fieldset>
        <legend>Parâmetros da estrutura</legend>
        <div class="row2">
          <div class="field"><label for="gR1">Rótulo 1</label><input id="gR1" value="Proteção" oninput="desenhar()"></div>
          <div class="field"><label for="gV1">Valor 1</label><input id="gV1" value="−10%" oninput="desenhar()"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="gR2">Rótulo 2</label><input id="gR2" value="Participação" oninput="desenhar()"></div>
          <div class="field"><label for="gV2">Valor 2</label><input id="gV2" value="100%" oninput="desenhar()"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="gR3">Rótulo 3</label><input id="gR3" value="Teto" oninput="desenhar()"></div>
          <div class="field"><label for="gV3">Valor 3</label><input id="gV3" value="+18%" oninput="desenhar()"></div>
        </div>
      </fieldset>
      <div class="field"><label for="gPayoff">Como funciona (uma frase)</label>
        <input id="gPayoff" value="Protege a queda até 10% e mantém a alta até 18%." oninput="desenhar()"></div>
    </div>

    <button class="btn" onclick="baixar()">Baixar imagem para o grupo</button>
    <button class="btn ghost" onclick="copiar()">Copiar imagem</button>
    <button class="btn gold" id="btnReg" onclick="registrar()">Registrar no histórico</button>
    <p class="hint" id="hintReg">Registrar é opcional. Só o que for registrado entra nas
      estatísticas e aceita alocação de clientes.</p>
  </div>

  <div class="pane">
    <h2>Prévia</h2>
    <canvas id="cv" width="1080" height="1080"></canvas>
    <p class="alerta" id="aviso"></p>
  </div>
</div>
</div>

<!-- ============ HISTÓRICO ============ -->
<div id="viewHist" style="display:none">
<div class="wrap">
  <div class="pane" style="margin-bottom:20px"><div id="filtros"></div></div>
  <div class="stats" id="stats"></div>
  <div id="lista"></div>
</div>
</div>

function guardarSessao(d){
  SESSAO={access_token:d.access_token,refresh_token:d.refresh_token,
          email:(d.user&&d.user.email)||(SESSAO&&SESSAO.email),
          id:(d.user&&d.user.id)||(SESSAO&&SESSAO.id)};
  try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){}
  return SESSAO;
}
function renovar(){
  if(!SESSAO||!SESSAO.refresh_token) return Promise.reject(new Error("sem sessão"));
  return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:SESSAO.refresh_token})
  }).then(function(res){
    if(!res.ok) throw new Error("sessão expirada");
    return res.json().then(guardarSessao);
  });
}
function api(path,opts,jaTentou){
  opts=opts||{};
  var tk=(SESSAO&&SESSAO.access_token)||SB_KEY;
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"};
  if(opts.prefer) h["Prefer"]=opts.prefer;
  return fetch(SB_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,
      body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(res){
      if(res.status===401&&SESSAO&&!jaTentou){
        return renovar().then(function(){ return api(path,opts,true); })
          .catch(function(){ location.replace("index.html"); throw new Error("sessão expirada"); });
      }
      if(!res.ok) return res.text().then(function(t){ throw new Error(t||("HTTP "+res.status)); });
      return res.status===204?null:res.json();
    });
}

/* monta a lista OPS no formato que a tela usa, a partir das duas tabelas */
function baixarTudo(){
  carregando=true; erroCarga=null; renderHist();
  return Promise.all([
    api("rv_operacoes?select=*&order=criado_em.desc"),
    api("rv_alocacoes?select=*&order=em.asc")
  ]).then(function(r){
    var ops=r[0]||[], als=r[1]||[];
    var porOp={};
    ops.forEach(function(o){
      o.alocacoes=[];
      o.criadoEm=o.criado_em; o.encerradoEm=o.encerrado_em;
      o.resultadoPct=(o.resultado_pct==null?null:Number(o.resultado_pct));
      porOp[o.id]=o;
    });
    als.forEach(function(a){
      if(porOp[a.operacao_id]) porOp[a.operacao_id].alocacoes.push(
        {id:a.id,cliente:a.cliente_nome,cliente_id:a.cliente_id,valor:Number(a.valor),em:a.em});
    });
    OPS=ops; carregando=false; renderHist();
  }).catch(function(e){
    carregando=false; erroCarga=String(e.message||e); OPS=[]; renderHist();
  });
}

/* ===================== UTIL =====================
   Parser tolerante: aceita "15,89", "15.89", "1.234,56", "R$ 1.234,56" e "7%".
   O separador decimal é o ÚLTIMO que aparecer; ponto isolado seguido de exatamente
   3 dígitos é tratado como milhar.                                            */
function parseNum(t){
  t=String(t==null?'':t).trim().replace(/\s/g,'').replace(/R\$|%/g,'');
  if(!t) return NaN;
  var temV=t.indexOf(',')>=0, temP=t.indexOf('.')>=0;
  if(temV&&temP){
    t = t.lastIndexOf(',')>t.lastIndexOf('.')
        ? t.replace(/\./g,'').replace(',','.')
        : t.replace(/,/g,'');
  } else if(temV){
    t=t.replace(/,/g,'.');
  } else if(temP){
    var p=t.split('.');
    var milhar = p.length>2 || (p.length===2 && /^\d{3}$/.test(p[1]) && p[0].replace('-','').length<=3);
    if(milhar) t=t.replace(/\./g,'');
  }
  var v=parseFloat(t);
  return isNaN(v)?NaN:v;
}
function n(id){ var v=parseNum(document.getElementById(id).value); return isNaN(v)?0:v; }
function s(id){ return document.getElementById(id).value.trim(); }
function moeda(v){ return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function moedaC(v){
  if(Math.abs(v)>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+'M';
  if(Math.abs(v)>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k';
  return moeda(v);
}
/* cor sempre pelo SINAL do numero, nunca pelo papel do campo:
   numa venda o alvo pode ser negativo, e verde ali seria mentira. */
function corPct(v){ return (v==null||isNaN(v)) ? C.white : (v>=0 ? C.green : C.red); }
function pct(v,c){ c=c===undefined?2:c;
  return (v>=0?'+':'−')+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c})+'%'; }
function pctS(v,c){ c=c===undefined?2:c;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c})+'%'; }
function num(v,c){ c=c===undefined?2:c;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c}); }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dataBR(iso){ var d=new Date(iso); return isNaN(d.getTime())?'—':d.toLocaleDateString('pt-BR'); }
function diasAte(id){
  var hoje=new Date(); hoje.setHours(0,0,0,0);
  var v=document.getElementById(id).value;
  var dv=v?new Date(v+'T00:00:00'):hoje;
  return {dias:Math.max(1,Math.round((dv-hoje)/86400000)),data:dv};
}
function irRegressivo(d){ return d<=180?22.5:(d<=360?20:(d<=720?17.5:15)); }
function ajustarIR(){
  document.getElementById('irCdi').value=String(irRegressivo(diasAte('venc').dias)).replace('.',',');
}

/* ===================== CÁLCULOS ===================== */
function calcOrdem(){
  var dir=document.getElementById('direcao').value;
  var sinal = dir==='compra' ? 1 : -1;
  var p=n('oPreco'), al=n('oAlvo'), st=n('oStop');
  var temA=document.getElementById('temAlvo').checked;
  var temS=document.getElementById('temStop').checked;
  var pAlvo = (temA && p>0) ? sinal*(al/p-1)*100 : null;
  var pStop = (temS && p>0) ? sinal*(st/p-1)*100 : null;
  var rr = (pAlvo!==null && pStop!==null && pStop<0) ? Math.abs(pAlvo/pStop) : null;
  return {dir:dir,sinal:sinal,p:p,al:al,st:st,temAlvo:temA,temStop:temS,
          pAlvo:pAlvo,pStop:pStop,rr:rr};
}
function calcSwing(){
  var a=n('atual'),al=n('alvo'),st=n('stop');
  var pAlvo=a>0?(al/a-1)*100:0,pStop=a>0?(st/a-1)*100:0;
  return {a:a,al:al,st:st,pAlvo:pAlvo,pStop:pStop,rr:pStop<0?Math.abs(pAlvo/pStop):0};
}
function calcCoupon(){
  var d=diasAte('venc'),pr=n('premio'),fe=n('fee');
  var cdi=n('cdi'),irOp=n('irOp'),irCdi=n('irCdi');
  var liq=pr-fe;
  var anual=function(p){ return (Math.pow(1+p/100,365/d.dias)-1)*100; };
  var aBruto=anual(pr),aPosFee=anual(liq),aPosIR=aPosFee*(1-irOp/100);
  var equiv=irCdi<100?aPosIR/(1-irCdi/100):0;
  return {pr:pr,fe:fe,liq:liq,dias:d.dias,data:d.data,barreira:n('barreira'),
    aBruto:aBruto,aPosFee:aPosFee,aPosIR:aPosIR,equiv:equiv,
    cdi:cdi,cdiPosIR:cdi*(1-irCdi/100),doCDI:cdi>0?equiv/cdi*100:0,irOp:irOp,irCdi:irCdi};
}

/* ===================== CANVAS ===================== */
function txt(x,y,t,font,cor,align,tr){
  var g=cv.getContext('2d');
  g.font=font; g.fillStyle=cor; g.textAlign=align||'left'; g.textBaseline='alphabetic';
  if(tr){
    var str=String(t),tot=0,i;
    for(i=0;i<str.length;i++) tot+=g.measureText(str[i]).width+tr;
    tot-=tr;
    var cx=align==='center'?x-tot/2:(align==='right'?x-tot:x);
    g.textAlign='left';
    for(i=0;i<str.length;i++){ g.fillText(str[i],cx,y); cx+=g.measureText(str[i]).width+tr; }
  } else g.fillText(t,x,y);
}
function linha(x1,y,x2,cor,e){
  var g=cv.getContext('2d'); g.strokeStyle=cor; g.lineWidth=e||1;
  g.beginPath(); g.moveTo(x1,y); g.lineTo(x2,y); g.stroke();
}
function quebra(t,x,y,maxW,lh,font,cor){
  var g=cv.getContext('2d'); g.font=font; g.fillStyle=cor; g.textAlign='left';
  var pal=String(t).split(' '),ln='',yy=y;
  for(var i=0;i<pal.length;i++){
    var tst=ln?ln+' '+pal[i]:pal[i];
    if(g.measureText(tst).width>maxW&&ln){ g.fillText(ln,x,yy); ln=pal[i]; yy+=lh; }
    else ln=tst;
  }
  if(ln) g.fillText(ln,x,yy);
  return yy;
}

/* ===================== REGISTRO ===================== */
function registrar(){
  var T=tipoAtual(), tk=s('ticker');
  if(!tk){ alert('Informe o ativo antes de registrar.'); return; }
  var reg={ tipo:T.id, ativo:tk, empresa:s('empresa'), status:'aberta',
            criado_por:(SESSAO&&SESSAO.id)||null };

  if(T.render==='ordem'){
    var o=calcOrdem();
    reg.params={direcao:o.dir,preco:o.p,alvo:o.temAlvo?o.al:null,stop:o.temStop?o.st:null,
               pAlvo:o.pAlvo,pStop:o.pStop,rr:o.rr,temStop:o.temStop,obs:s('oObs')};
    reg.resumo=(o.dir==='compra'?'Compra':'Venda')+' a '+moeda(o.p)+
      (o.temAlvo&&o.pAlvo!==null?' · alvo '+pct(o.pAlvo):'')+
      (o.temStop&&o.pStop!==null?' · stop '+pct(o.pStop):' · sem stop')+
      (o.rr!==null?' · R/R '+num(o.rr)+':1':'');
  } else if(T.render==='swing'){
    var d=calcSwing();
    reg.params={entrada:d.a,alvo:d.al,stop:d.st,pAlvo:d.pAlvo,pStop:d.pStop,rr:d.rr,obs:s('obs')};
    reg.resumo='Entrada '+moeda(d.a)+' · alvo '+pct(d.pAlvo)+' · stop '+pct(d.pStop)+
              ' · R/R '+num(d.rr)+':1';
  } else if(T.render==='coupon'){
    var c=calcCoupon();
    reg.params={venc:s('venc'),barreira:c.barreira,premio:c.pr,fee:c.fe,liq:c.liq,
               dias:c.dias,aPosIR:c.aPosIR,doCDI:c.doCDI};
    reg.resumo='Barreira −'+pctS(c.barreira,0)+' · prêmio líquido '+pctS(c.liq)+
              ' · '+pctS(c.doCDI,0)+' do CDI · vence '+c.data.toLocaleDateString('pt-BR');
  } else {
    reg.params={venc:s('gVenc'),r1:s('gR1'),v1:s('gV1'),r2:s('gR2'),v2:s('gV2'),
               r3:s('gR3'),v3:s('gV3'),payoff:s('gPayoff')};
    reg.resumo=s('gR1')+' '+s('gV1')+' · '+s('gR2')+' '+s('gV2')+' · '+s('gR3')+' '+s('gV3');
  }
  var btn=document.getElementById('btnReg'); if(btn) btn.disabled=true;
  api("rv_operacoes",{method:"POST",body:reg,prefer:"return=representation"})
    .then(function(){
      document.getElementById('hintReg').textContent=
        tk+' registrada. Abra o Histórico para lançar os clientes.';
      return baixarTudo();
    })
    .catch(avisarErro)
    .then(function(){ if(btn) btn.disabled=false; });
}

function hoje(){ return new Date().toISOString().slice(0,10); }
function sugestao(op,desfecho){
  if(op.tipo==='swing'||op.tipo==='ordem'){
    if(desfecho==='alvo'&&op.params.pAlvo!=null) return op.params.pAlvo;
    if(desfecho==='stop'&&op.params.pStop!=null) return op.params.pStop;
  } else if(op.tipo==='coupon'){
    if(desfecho==='alvo') return op.params.liq;
    if(desfecho==='stop') return 0;
  }
  return null;
}
/* formulário de encerramento dentro do card, sem prompt do navegador */
function abrirFecha(id,desfecho){
  var op=acharOp(id); if(!op) return;
  fechando={id:id,desfecho:desfecho};
  renderHist();
  var el=document.getElementById('res_'+id);
  if(el){ el.focus(); el.select(); }
}
function cancelarFecha(){ fechando=null; renderHist(); }
function confirmarFecha(id){
  var op=acharOp(id); if(!op) return;
  var resEl=document.getElementById('res_'+id), dtEl=document.getElementById('dt_'+id);
  var v=parseNum(resEl.value);
  if(isNaN(v)){ alert('Informe o resultado em %. Aceita vírgula ou ponto.'); resEl.focus(); return; }
  var dt=dtEl.value||hoje();
  if(new Date(dt+'T00:00:00') < new Date(String(op.criadoEm).slice(0,10)+'T00:00:00')){
    if(!confirm('A data de fechamento é anterior à de abertura. Confirmar assim mesmo?')) return;
  }
  var corpo={status:'encerrada',desfecho:(fechando?fechando.desfecho:'manual'),
             resultado_pct:v,encerrado_em:new Date(dt+'T12:00:00').toISOString()};
  fechando=null;
  api("rv_operacoes?id=eq."+encodeURIComponent(id),{method:"PATCH",body:corpo})
    .then(baixarTudo).catch(avisarErro);
}
function reabrir(id){
  api("rv_operacoes?id=eq."+encodeURIComponent(id),
      {method:"PATCH",body:{status:'aberta',desfecho:null,resultado_pct:null,encerrado_em:null}})
    .then(baixarTudo).catch(avisarErro);
}
function apagar(id){
  var op=acharOp(id); if(!op) return;
  if(!confirm('Apagar a operação '+op.ativo+' e as '+op.alocacoes.length+
     ' alocação(ões) de cliente? Não dá para desfazer.')) return;
  api("rv_operacoes?id=eq."+encodeURIComponent(id),{method:"DELETE"})
    .then(baixarTudo).catch(avisarErro);
}

/* ===== formatacao do campo de valor enquanto digita =====
   1000 vira 1.000 e 1250000 vira 1.250.000. Aceita virgula para os
   centavos. O cursor volta para depois do mesmo digito, senao ele
   pula para o fim a cada tecla e digitar no meio fica impossivel.  */
function fmtMilhar(txt){
  var neg=/^\s*-/.test(txt);
  var t=String(txt).replace(/[^\d,]/g,'');
  if(!t) return neg?'-':'';
  var p=t.split(',');
  var inteiro=p[0].replace(/^0+(?=\d)/,'');
  var dec=(p.length>1)?','+p.slice(1).join('').slice(0,2):'';
  inteiro=inteiro.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'')+inteiro+dec;
}
function onValor(el){
  var pos=el.selectionStart==null?el.value.length:el.selectionStart;
  var digitosAntes=el.value.slice(0,pos).replace(/[^\d]/g,'').length;
  var novo=fmtMilhar(el.value);
  if(novo===el.value) return;
  el.value=novo;
  var i=0,d=0;
  while(i<novo.length && d<digitosAntes){ if(/\d/.test(novo.charAt(i))) d++; i++; }
  try{ el.setSelectionRange(i,i); }catch(e){}
}

function addAloc(id){
  var op=acharOp(id); if(!op) return;
  var sel=document.getElementById('cli_'+id), valEl=document.getElementById('val_'+id);
  var cid=sel.value;
  if(!cid){ alert('Escolha o cliente.'); sel.focus(); return; }
  var nome='';
  for(var i=0;i<CLIENTES.length;i++) if(CLIENTES[i].id===cid) nome=CLIENTES[i].nome;
  var val=parseNum(valEl.value);
  if(isNaN(val)||val<=0){ alert('Informe o valor enviado para esse cliente.'); valEl.focus(); return; }
  api("rv_alocacoes",{method:"POST",body:{operacao_id:id,cliente_id:cid,cliente_nome:nome,
      valor:val,lancado_por:(SESSAO&&SESSAO.id)||null}})
    .then(baixarTudo).catch(avisarErro);
}
function rmAloc(id,i){
  var op=acharOp(id); if(!op) return;
  var a=op.alocacoes[i]; if(!a||!a.id) return;
  if(!confirm('Remover '+a.cliente+' desta operação?')) return;
  api("rv_alocacoes?id=eq."+encodeURIComponent(a.id),{method:"DELETE"})
    .then(baixarTudo).catch(avisarErro);
}

/* ===================== HISTÓRICO ===================== */
var fechando=null;
var FILTRO={texto:'',status:'todas',tipo:'todos'};
function setFiltro(campo,valor){ FILTRO[campo]=valor; fechando=null; renderHist(); }
function limparFiltro(){
  FILTRO={texto:'',status:'todas',tipo:'todos'}; fechando=null; renderHist();
}
function filtradas(){
  var t=FILTRO.texto.trim().toLowerCase();
  return OPS.filter(function(o){
    if(FILTRO.status==='abertas'   && o.status!=='aberta')    return false;
    if(FILTRO.status==='encerradas'&& o.status!=='encerrada') return false;
    if(FILTRO.tipo!=='todos' && o.tipo!==FILTRO.tipo) return false;
    if(!t) return true;
    if(String(o.ativo).toLowerCase().indexOf(t)>=0) return true;
    if(String(o.empresa||'').toLowerCase().indexOf(t)>=0) return true;
    for(var i=0;i<o.alocacoes.length;i++)
      if(String(o.alocacoes[i].cliente).toLowerCase().indexOf(t)>=0) return true;
    return false;
  });
}
function estatisticas(lista){
  var OPS=lista;
  var enc=OPS.filter(function(o){ return o.status==='encerrada' && typeof o.resultadoPct==='number'; });
  var ganhos=enc.filter(function(o){ return o.resultadoPct>0; });
  var perdas=enc.filter(function(o){ return o.resultadoPct<=0; });
  var med=function(a){ return a.length? a.reduce(function(s,o){ return s+o.resultadoPct; },0)/a.length : 0; };
  var alocTotal=0, resultadoRs=0, clientes={};
  OPS.forEach(function(o){
    o.alocacoes.forEach(function(a){
      alocTotal+=a.valor;
      clientes[a.cliente]=true;
      if(o.status==='encerrada'&&typeof o.resultadoPct==='number')
        resultadoRs += a.valor*o.resultadoPct/100;
    });
  });
  var taxa = enc.length? ganhos.length/enc.length*100 : 0;
  var mg=med(ganhos), mp=med(perdas);
  return {total:OPS.length,abertas:OPS.length-enc.length,encerradas:enc.length,
    taxa:taxa,mediaGanho:mg,mediaPerda:mp,
    expectativa: enc.length? (taxa/100*mg)+((1-taxa/100)*mp) : 0,
    alocTotal:alocTotal,resultadoRs:resultadoRs,nClientes:Object.keys(clientes).length};
}

/* ===================== GERADOR DE XLSX =====================
   Um .xlsx e um ZIP com alguns XMLs dentro. Em vez de embutir uma
   biblioteca de 400 KB, monta-se o ZIP a mao usando o metodo STORE
   (sem compressao), que o Excel aceita normalmente. ~120 linhas.

   Suporta: texto, numero, data, negrito no cabecalho, largura de
   coluna, painel congelado na primeira linha.                     */

var CRC_TAB=(function(){
  var t=new Int32Array(256),c,k,i;
  for(i=0;i<256;i++){
    c=i;
    for(k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[i]=c;
  }
  return t;
})();
function crc32(bytes){
  var c=-1;
  for(var i=0;i<bytes.length;i++) c=(c>>>8) ^ CRC_TAB[(c ^ bytes[i]) & 0xFF];
  return (c ^ -1)>>>0;
}
function utf8(str){
  var out=[],i,cp;
  for(i=0;i<str.length;i++){
    cp=str.charCodeAt(i);
    if(cp<0x80) out.push(cp);
    else if(cp<0x800){ out.push(0xC0|cp>>6, 0x80|cp&63); }
    else if(cp>=0xD800&&cp<0xDC00){
      cp=0x10000+((cp-0xD800)<<10)+(str.charCodeAt(++i)-0xDC00);
      out.push(0xF0|cp>>18, 0x80|(cp>>12)&63, 0x80|(cp>>6)&63, 0x80|cp&63);
    }
    else out.push(0xE0|cp>>12, 0x80|(cp>>6)&63, 0x80|cp&63);
  }
  return new Uint8Array(out);
}
function n16(v){ return [v&255,(v>>8)&255]; }
function n32(v){ return [v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255]; }

function zipar(arquivos){
  var partes=[], central=[], offset=0;
  arquivos.forEach(function(f){
    var nome=utf8(f.nome), dados=utf8(f.texto), crc=crc32(dados);
    var local=[].concat([0x50,0x4B,0x03,0x04], n16(20), n16(0), n16(0),
      n16(0), n16(0), n32(crc), n32(dados.length), n32(dados.length),
      n16(nome.length), n16(0));
    partes.push(new Uint8Array(local), nome, dados);
    central.push([].concat([0x50,0x4B,0x01,0x02], n16(20), n16(20), n16(0), n16(0),
      n16(0), n16(0), n32(crc), n32(dados.length), n32(dados.length),
      n16(nome.length), n16(0), n16(0), n16(0), n16(0), n32(0), n32(offset)));
    central.push(nome);
    offset += local.length + nome.length + dados.length;
  });
  var cd=[], cdLen=0;
  central.forEach(function(x){
    var u = (x instanceof Uint8Array) ? x : new Uint8Array(x);
    cd.push(u); cdLen += u.length;
  });
  var fim=new Uint8Array([].concat([0x50,0x4B,0x05,0x06], n16(0), n16(0),
    n16(arquivos.length), n16(arquivos.length), n32(cdLen), n32(offset), n16(0)));
  var total=offset+cdLen+fim.length, buf=new Uint8Array(total), p=0;
  partes.concat(cd,[fim]).forEach(function(u){ buf.set(u,p); p+=u.length; });
  return buf;
}

function xmlEsc(t){
  return String(t==null?'':t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function colLetra(i){
  var s='';
  i++;
  while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; }
  return s;
}
/* linhas: array de arrays. Cada celula: numero, ou string, ou
   {v:valor, t:'n'|'s'} — a primeira linha vira cabecalho em negrito. */
function montarXlsx(linhas, larguras, nomeAba){
  var sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(larguras&&larguras.length){
    sheet+='<cols>'+larguras.map(function(w,i){
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';
    }).join('')+'</cols>';
  }
  sheet+='<sheetData>';
  linhas.forEach(function(linha,li){
    sheet+='<row r="'+(li+1)+'">';
    linha.forEach(function(cel,ci){
      var ref=colLetra(ci)+(li+1);
      var estilo=(li===0)?' s="1"':'';
      var num = (typeof cel==='number' && isFinite(cel));
      if(num){
        sheet+='<c r="'+ref+'"'+estilo+'><v>'+cel+'</v></c>';
      } else {
        var t=xmlEsc(cel);
        if(t==='') sheet+='<c r="'+ref+'"'+estilo+'/>';
        else sheet+='<c r="'+ref+'"'+estilo+' t="inlineStr"><is><t xml:space="preserve">'+t+'</t></is></c>';
      }
    });
    sheet+='</row>';
  });
  sheet+='</sheetData></worksheet>';

  var estilos='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill>'+
    '<fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FF1B2A4A"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';

  return zipar([
    {nome:'[Content_Types].xml', texto:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      '</Types>'},
    {nome:'_rels/.rels', texto:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>'},
    {nome:'xl/workbook.xml', texto:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets><sheet name="'+xmlEsc(nomeAba||'Dados')+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {nome:'xl/_rels/workbook.xml.rels', texto:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      '</Relationships>'},
    {nome:'xl/styles.xml', texto:estilos},
    {nome:'xl/worksheets/sheet1.xml', texto:sheet}
  ]);
}

/* ===================== EXPORTAR O HISTORICO =====================
   Uma linha por alocacao, com os dados da operacao repetidos ao lado.
   E o formato que o Excel precisa para tabela dinamica.
   Valores saem como NUMERO, nao texto, para somar direto na planilha. */
function dataISOparaBR(iso){
  if(!iso) return '';
  var d=new Date(iso);
  return isNaN(d.getTime())?'':d.toLocaleDateString('pt-BR');
}
function exportarExcel(){
  var lista=filtradas();
  if(!lista.length){ alert('Não há operações no filtro atual para exportar.'); return; }

  var linhas=[['Aberta em','Tipo','Ativo','Empresa','Status','Desfecho','Resultado %',
               'Fechada em','Cliente','Valor alocado','Resultado R$','Detalhes']];

  lista.forEach(function(o){
    var T=tipoPorId(o.tipo);
    var res=(typeof o.resultadoPct==='number')?o.resultadoPct:'';
    var base=[dataISOparaBR(o.criadoEm), T.rotulo, o.ativo, o.empresa||'',
              (o.status==='encerrada'?'Encerrada':'Em aberto'),
              (o.desfecho==='alvo'?'Alvo':(o.desfecho==='stop'?'Stop':(o.desfecho?'Manual':''))),
              res, dataISOparaBR(o.encerradoEm)];
    if(!o.alocacoes.length){
      linhas.push(base.concat(['','','',o.resumo||'']));
    } else {
      o.alocacoes.forEach(function(a){
        var rs=(res==='')?'':Math.round(a.valor*res)/100;
        linhas.push(base.concat([a.cliente, a.valor, rs, o.resumo||'']));
      });
    }
  });

  try{
    var buf=montarXlsx(linhas,[12,17,10,20,12,10,12,12,30,15,14,46],'Mesa RV');
    var b=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='ADAMI_MesaRV_'+new Date().toISOString().slice(0,10)+'.xlsx';
    a.click(); URL.revokeObjectURL(a.href);
  }catch(e){
    alert('Não foi possível gerar a planilha: '+(e.message||e));
  }
}

      h+='<button class="btn ghost mini" onclick="apagar(\''+o.id+'\')">Apagar</button></div>';
    }
    h+='</div>';
  });
  document.getElementById('lista').innerHTML=h;
}

/* ===================== EXPORTAÇÃO ===================== */
function baixar(){
  cv.toBlob(function(b){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='ADAMI_'+(s('ticker')||'RV')+'_'+new Date().toISOString().slice(0,10)+'.png';
    a.click(); URL.revokeObjectURL(a.href);
  },'image/png');
}
function copiar(){
  if(!navigator.clipboard||!window.ClipboardItem){ alert('Este navegador não copia imagem. Use "Baixar imagem".'); return; }
  cv.toBlob(function(b){
    navigator.clipboard.write([new ClipboardItem({'image/png':b})])
      .then(function(){ document.getElementById('aviso').textContent='Imagem copiada. Cole no WhatsApp.'; })
      .catch(function(){ alert('Não foi possível copiar. Use "Baixar imagem".'); });
  },'image/png');
}

var cv=document.getElementById('cv');
montarTabs(); ajustarIR(); desenhar(); renderHist();

/* ===================== ARRANQUE ===================== */
function aplicarPermissao(){
  var btn=document.getElementById('btnReg');
  var hint=document.getElementById('hintReg');
  if(!PODE_EDITAR){
    if(btn) btn.style.display='none';
    if(hint) hint.textContent='Seu acesso à Mesa RV é somente leitura. '+
      'Você pode gerar e baixar cards, mas o registro no histórico é feito pela mesa.';
    var s=document.getElementById('selPerm');
    if(s){ s.textContent='somente leitura'; s.style.display=''; }
  }
}
checarPermissao()
  .then(function(){ return PODE_EDITAR ? baixarClientes() : null; })
  .then(function(){ aplicarPermissao(); return baixarTudo(); })
  .catch(function(e){ aplicarPermissao(); erroCarga=String(e.message||e); carregando=false; renderHist(); });
</script>
