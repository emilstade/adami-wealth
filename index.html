<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>Adami Wealth — Consolidado de Carteiras</title>
<style>
:root{
  --navy:#1B3A5F; --navy-d:#132B47; --ink:#16324F; --ink-2:#3C4C60; --muted:#7A8698;
  --paper:#EDF0F4; --surface:#FFFFFF; --line:#DCE2EA; --line-2:#EDF1F5;
  --gold:#C0A265; --gold-2:#D9C79B; --blue-2:#3D6D9E; --blue-3:#7FA0C4; --blue-4:#A9C0D8;
  --green:#0A7344; --alert:#A03A2B;
  --display:"Iowan Old Style",Constantia,Cambria,"Palatino Linotype",Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"Courier New",monospace;
  --rail:280px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button{font-family:inherit;font-size:13px;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
table{border-collapse:collapse;width:100%}
input,select,textarea{font-family:inherit;font-size:13px}

/* ---------- rail ---------- */
.rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);background:var(--navy-d);color:#C7D3E0;padding:22px 18px;overflow-y:auto}
.rail-brand{font-family:var(--display);font-size:19px;color:#fff;line-height:1.2}
.rail-brand img{width:150px;max-width:100%;height:auto;display:block;margin-bottom:2px}
.rail-brand span{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-3);margin-top:7px}
.rail-block{margin-top:24px}
.rail-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#7A8DA3;margin-bottom:9px}
.rail select{width:100%;background:#16283C;color:#EAF1EF;border:1px solid #27394F;border-radius:3px;padding:8px 9px}
.cli-list{margin:0;padding:0;list-style:none}
.cli-list li{padding:9px 10px;border-radius:3px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cli-list li.grp{padding:12px 4px 5px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7A8DA3;cursor:default;display:block}
.cli-list li.grp:hover{background:transparent}
.cli-list li:hover{background:#1B2E44}
.cli-list li.on{background:var(--navy);color:#fff}
.cli-list li b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-list li i{font-style:normal;font-size:11px;color:#8AA8C6;font-family:var(--mono)}
.rail button{width:100%;background:#1B2E44;color:#DCE7F1;border:1px solid #2B3F57;border-radius:3px;padding:9px;margin-top:8px}
.rail button:hover{background:#22374F}
.rail .mini{font-size:11.5px;color:#7A8DA3;margin-top:14px;line-height:1.5}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8AA8C6;margin-top:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.err{background:var(--alert)} .dot.wait{background:var(--gold)}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr}
.auth-side{position:relative;background:var(--navy);color:#fff;padding:46px 54px;display:flex;flex-direction:column;overflow:hidden}
.auth-side:before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 12% 88%,rgba(61,109,158,.28) 0%,transparent 62%);
  pointer-events:none}
.auth-side>*{position:relative}
.auth-side img{height:36px;width:auto;align-self:flex-start;flex:none}
.auth-say{margin-top:auto;max-width:none}
.auth-say .rule{width:54px;height:2px;background:var(--gold);margin-bottom:22px}
.auth-say h2{font-family:var(--display);font-size:32px;font-weight:500;line-height:1.26;letter-spacing:.005em;max-width:11em}
.auth-say p{color:#A9C0D8;font-size:13.5px;line-height:1.65;margin:16px 0 0;max-width:24em}
.auth-meta{margin-top:auto;padding-top:44px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;color:#6E88A4;display:flex;gap:20px;flex-wrap:wrap}
.auth-copy{margin-top:14px;font-size:11px;color:#5E7690;letter-spacing:.01em}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 34px;background:#F7F9FB}
.auth-card{width:100%;max-width:344px;animation:sobe .5s ease both}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.auth-card .rule{width:34px;height:2px;background:var(--gold);margin-bottom:20px}
.auth-card h1{font-family:var(--display);font-size:23px;font-weight:600;color:var(--navy);letter-spacing:.01em;line-height:1.25}
.auth-card .hint{font-size:13px;color:var(--muted);margin:7px 0 28px}
.auth-card label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.auth-card input{width:100%;border:1px solid var(--line);border-radius:2px;padding:12px 13px;
  font-size:14px;background:#fff;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.auth-card input::placeholder{color:#B4BECA}
.auth-card input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,58,95,.09)}
.auth-card .campo{position:relative;margin-bottom:18px}
.auth-card .campo input{padding-right:50px}
.auth-card .olho{position:absolute;right:2px;top:2px;height:calc(100% - 4px);width:44px;border:0;
  background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.auth-card .olho:hover{color:var(--navy);background:transparent}
.auth-card .olho svg{width:18px;height:18px;display:block}
.auth-card button.entrar{width:100%;background:var(--navy);color:#fff;border:0;border-radius:2px;
  padding:13px;font-size:13.5px;font-weight:600;letter-spacing:.03em;margin-top:6px;transition:background .12s}
.auth-card button.entrar:hover{background:var(--navy-d)}
.auth-card button.entrar[disabled]{opacity:.55}
.auth-card .erro{border-left:2px solid var(--alert);background:#FBEDEB;color:#7E2C20;
  font-size:12.5px;line-height:1.5;padding:11px 13px;margin-bottom:22px}
.auth-card .pe{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){.auth-card{animation:none}}
@media(max-width:860px){
  .auth{grid-template-columns:1fr;min-height:100vh}
  .auth-side{padding:26px 24px 30px}
  .auth-side .auth-say{margin-top:26px}
  .auth-say h2{font-size:25px}
  .auth-say p,.auth-meta{display:none}
  .auth-form{padding:34px 24px 50px}
}
.rail-user{font-size:11.5px;color:#8AA8C6;margin-top:10px;overflow:hidden;text-overflow:ellipsis}

/* ---------- portal ---------- */
.hub{min-height:100vh;background:var(--navy);color:#fff;padding:0}
.hub-top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:26px 40px;border-bottom:1px solid #24405F;flex-wrap:wrap}
.hub-top img{height:30px;width:auto;flex:none}
.hub-top .sai{background:transparent;border:1px solid #35516F;color:#C3D2E2;border-radius:3px;padding:8px 16px}
.hub-top .sai:hover{background:#1B3A5F;color:#fff}
.hub-body{max-width:1040px;margin:0 auto;padding:64px 40px 80px}
.hub-hi{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#8AA8C6}
.hub-body h1{font-family:var(--display);font-size:38px;font-weight:500;margin:14px 0 8px;line-height:1.2}
.hub-body .sub{color:#A9C0D8;font-size:14.5px;max-width:44em}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px;margin-top:44px}
.app{background:#17324F;border:1px solid #27455F;border-radius:5px;padding:26px 24px 22px;
  text-align:left;color:#fff;display:flex;flex-direction:column;gap:9px;min-height:172px;
  transition:transform .12s ease,border-color .12s ease,background .12s ease}
.app.on{cursor:pointer}
.app.on:hover{background:#1C3C5D;border-color:var(--gold);transform:translateY(-2px)}
.app .ic{width:34px;height:34px;color:var(--gold-2);margin-bottom:4px}
.app .ic svg{width:100%;height:100%;display:block}
.app b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em}
.app span{font-size:12.8px;color:#A9C0D8;line-height:1.55}
.app .tag{margin-top:auto;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.app.off{opacity:.5;cursor:default}
.app.off .tag{color:#7C93AB}
.hub-foot{max-width:1040px;margin:0 auto;padding:0 40px 50px;color:#6E88A4;font-size:11.5px}
.voltar{background:transparent;border:1px solid var(--line);color:var(--ink-2);border-radius:3px;padding:9px 14px}
.voltar:hover{background:#F6F8FA}
@media(max-width:640px){ .hub-body{padding:40px 22px 60px} .hub-body h1{font-size:29px} .hub-top{padding:20px 22px} }

/* ---------- main ---------- */
.main{margin-left:var(--rail);padding:26px 30px 70px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:#DFE5EC;padding:3px;border-radius:4px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:3px;color:var(--ink-2);font-weight:500}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:3px}
.btn:hover{background:#F6F8FA}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-d)}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;margin-bottom:18px}
.sec-title{font-family:var(--display);font-size:17px;color:var(--navy);margin-bottom:4px}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.inp{width:100%;border:1px solid var(--line);border-radius:3px;padding:6px 7px;background:#fff}
.inp:focus{outline:0;border-color:var(--blue-2);box-shadow:0 0 0 2px #EBF1F8}
.inp.num{text-align:right;font-family:var(--mono)}
textarea.inp{min-height:150px;line-height:1.6;resize:vertical}
.grid-ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.grid-ind label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.xbtn{border:0;background:transparent;color:var(--alert);font-size:15px;padding:2px 6px}
.note{background:#EBF1F8;border-left:3px solid var(--blue-2);padding:12px 14px;font-size:12.5px;color:var(--ink-2);border-radius:0 3px 3px 0;margin-bottom:16px}
.note.err{background:#FBEDEB;border-left-color:var(--alert)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--navy);margin-bottom:8px}
.form th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.form td{padding:7px 8px;border-bottom:1px solid var(--line-2);font-size:13px}
.form tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:#F7F9FB;font-family:var(--mono)}
.num{text-align:right}

/* ---------- editor da carta ---------- */
.tb{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;padding:7px;background:#F7F9FB}
.tb button{border:1px solid transparent;background:transparent;border-radius:3px;padding:6px 10px;color:var(--ink-2);min-width:34px}
.tb button:hover{background:#fff;border-color:var(--line)}
.tb .sep{width:1px;background:var(--line);margin:2px 4px}
.tb select{border:1px solid var(--line);border-radius:3px;padding:5px 7px;background:#fff}
.ed{border:1px solid var(--line);border-radius:0 0 3px 3px;padding:22px 24px;min-height:320px;background:#fff;
    font-size:13.5px;line-height:1.75;color:var(--ink-2);overflow-wrap:anywhere}
.ed:focus{outline:0;border-color:var(--blue-2);box-shadow:0 0 0 2px #EBF1F8}
.ed:empty:before{content:attr(data-ph);color:#AAB4C0}
.ed p{margin:0 0 12px}
.ed h3{font-family:var(--display);font-size:17px;color:var(--navy);margin:18px 0 10px}
.ed img{max-width:100%;height:auto;display:block;margin:14px 0;border-radius:2px}
.ed ul,.ed ol{margin:0 0 12px;padding-left:22px}
.salvo{font-size:12.5px;color:var(--muted)}

/* ================= RELATÓRIO ================= */
.doc{max-width:880px;margin:0 auto}
.pg td,.pg th,.pg p,.pg .dn-rows div{overflow-wrap:anywhere}
.pg{background:#fff;border:1px solid var(--line);border-radius:2px;padding:52px 56px 40px;margin-bottom:22px;position:relative;min-height:560px}
.pg-mark{position:absolute;top:34px;right:52px;text-align:right;line-height:1}
.pg-mark img{height:26px;width:auto;display:block;margin-left:auto}
.pg-num{position:absolute;bottom:18px;right:56px;font-size:10.5px;color:var(--muted)}

/* capa */
.cover{background:var(--navy);border:0;padding:96px 62px 62px;min-height:820px;display:flex;flex-direction:column}
.cover .eyebrow{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:#93AECB}
.cover h1{font-family:var(--display);font-size:40px;line-height:1.18;color:#fff;font-weight:600;margin:16px 0 0;max-width:9.5em}
.cover .cli{font-size:15px;color:#C3D2E2;margin-top:36px}
.cover .rule{width:76px;height:1px;background:#6C86A3;margin:18px 0 22px}
.cover .ref{font-size:13px;color:#C3D2E2}
.cover .ref-base{font-family:var(--mono);font-size:11px;color:#93AECB;margin-top:7px;letter-spacing:.04em}
.cover .mark{margin-top:auto;text-align:center}
.cover .mark img{width:210px;max-width:56%;height:auto;display:block;margin:0 auto}
.cover .foot{text-align:center;font-size:9.5px;letter-spacing:.34em;color:#93AECB;margin-top:54px}

/* cabeçalho de seção */
.shead{display:flex;align-items:baseline;gap:11px;border-bottom:2px solid var(--navy);padding-bottom:7px;margin:34px 0 18px}
.shead:first-of-type{margin-top:0}
.shead .n{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.06em}
.shead h2{font-family:var(--display);font-size:21px;color:var(--navy);font-weight:600}
.shead .cap{margin-left:auto;font-size:11px;color:var(--muted)}
.dash{display:flex;align-items:baseline;gap:11px;border-bottom:2px solid var(--navy);padding-bottom:7px;margin-bottom:20px}
.dash i{font-style:normal;color:var(--gold)}
.dash h2{font-family:var(--display);font-size:22px;color:var(--navy)}

/* cabeçalho do cliente */
.rep-eyebrow{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.rep-name{font-family:var(--display);font-size:29px;color:var(--navy);margin-top:6px;font-weight:600}
.rep-ref{font-size:12.5px;color:var(--muted);margin-top:2px}

/* patrimônio + kpis */
.pat{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin-top:20px;text-align:center}
.pat .l{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.pat .v{font-family:var(--mono);font-size:34px;color:var(--navy);letter-spacing:.03em;margin:9px 0 4px}
.pat .s{font-size:11.5px;color:var(--muted)}
.pat-duo{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:16px}
.pat-col{text-align:center;min-width:135px}
.pat-col .d{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.pat-col .n{font-family:var(--mono);color:var(--navy);letter-spacing:.03em;margin:7px 0 4px;line-height:1.1}
.pat-col .c{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#93A2B4}
.pat-col.ant .n{font-size:20px;color:#61758C}
.pat-col.atual .n{font-size:34px}
.pat-sep{width:1px;height:46px;background:var(--line-2)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:3px solid var(--navy)}
.kbox{padding:19px 22px;background:var(--surface)}
.kbox .l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kbox .v{font-family:var(--mono);font-size:27px;font-weight:500;color:var(--navy);
  letter-spacing:-.015em;font-variant-numeric:tabular-nums;line-height:1.05;margin:10px 0 6px}
.kbox .s{font-size:11px;color:var(--muted)}
.kbox .s b{font-family:var(--mono);font-weight:400;color:var(--ink-2)}
.kbox .v.pos{color:var(--green)} .kbox .v.neg{color:var(--alert)}
/* simbolo de moeda e de porcentagem discretos: os digitos dominam */
.uni{font-style:normal;font-weight:400;font-size:.5em;color:#93A2B4;letter-spacing:.03em}
.kbox .v .uni:first-child,.pat .v .uni:first-child,.pat-col .n .uni:first-child{margin-right:.22em}
.kbox .v .uni:last-child{margin-left:.1em}

/* blocos */
.chk{border:1px solid var(--line);border-radius:3px;background:#fff;margin-bottom:22px;overflow:hidden}
.chk-top{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:#FAFBFD}
.chk-top h3{font-family:var(--display);font-size:16px;color:var(--navy);margin:0;flex:1;font-weight:400}
.chk-tag{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:2px;letter-spacing:.04em}
.chk-tag.ok{background:#E8F3ED;color:var(--green)}
.chk-tag.al{background:#F7E9E6;color:var(--alert)}
.chk-tag.at{background:#FBF3E2;color:#8A6A1F}
.chk-item{display:flex;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-2)}
.chk-item:last-child{border-bottom:0}
.chk-bar{width:3px;border-radius:2px;flex:none}
.chk-bar.alta{background:var(--alert)} .chk-bar.atencao{background:var(--gold)} .chk-bar.info{background:var(--blue-3)}
.chk-txt{flex:1;min-width:0}
.chk-txt b{display:block;font-size:13.5px;color:var(--ink);font-weight:500;margin-bottom:4px}
.chk-txt span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.chk-txt i{font-style:normal;font-family:var(--mono);color:var(--navy)}
.chk-onde{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.chk-mes{display:flex;align-items:baseline;gap:10px;padding:10px 20px;background:#F7F9FB;border-bottom:1px solid var(--line-2);border-top:1px solid var(--line-2)}
.chk-mes b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:400}
.chk-mes span{font-size:11px;color:var(--muted)}
.chk-rodape{padding:14px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2)}
.chk-vazio{padding:22px 20px;font-size:13px;color:var(--ink-2)}
.sum{margin-top:26px}
.sum-row{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.sum-row:last-child{border-bottom:0}
.sum-row .n{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.06em;min-width:22px}
.sum-row .t{font-family:var(--display);font-size:15px;color:var(--navy)}
.sum-row .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.sum-row .p{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel{border:1px solid var(--line);border-radius:3px;padding:22px;background:#fff}
.panel.tint{background:#FAFBFD}
.rt{width:100%}
.rt th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.rt td{padding:11px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.rt td.n,.rt th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt tr.tot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600;background:#F7F9FB}
.rt tr.tot td:first-child{font-family:var(--body)}
.rt.bm{table-layout:fixed}
.rt.bm th:first-child,.rt.bm td:first-child{width:31%}
.rt.bm th.n,.rt.bm td.n{width:17.25%}
.rt.bm tbody tr.destaque td{background:#F4F7FA;font-weight:600;border-bottom:1px solid var(--line)}
.rt.bm tbody tr.destaque td:first-child{font-family:var(--display);font-size:13.5px;color:var(--navy)}
.rt.bm tbody tr.ratio td{border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:11.5px}
.rt.bm tbody tr.ratio td:first-child{font-family:var(--body);font-style:italic}
.foot-note{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:14px}

/* donut */
.dn{display:block;margin:0 auto}
.dn-total{font-size:11.5px;color:var(--muted);margin-top:6px}
.dn-total b{font-family:var(--mono);color:var(--navy);font-weight:400;font-size:13px}
.rt.compact{table-layout:fixed}
.rt.compact th{padding:8px 3px;font-size:9px;letter-spacing:.02em}
.rt.compact td{padding:8px 3px;font-size:10.5px}
.rt.compact th:first-child,.rt.compact td:first-child{width:15%}
.rt.compact th.n,.rt.compact td.n{width:6.07%}
.rt.compact tr.ano td{font-weight:600;background:#F4F7FA}
.rt.compact tr.ano td:first-child{font-family:var(--display);font-size:13px;color:var(--navy)}
.rt.compact tr.sep td{border-bottom:1px solid var(--line)}
.rt.compact td:first-child,.rt.compact th:first-child{white-space:nowrap}
.dn-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin:18px 0 6px;font-size:11.5px;color:var(--ink-2)}
.dn-leg span{display:inline-flex;align-items:center;gap:6px}
.dn-leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.dn-rows{margin-top:14px}
.dn-rows div{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.dn-rows b{font-weight:400;font-family:var(--mono)}

/* carta */
.carta{border:1px solid var(--line);border-radius:3px;padding:32px 34px;background:#fff}
.carta h3{font-size:13.5px;color:var(--navy);margin-bottom:12px}
.carta .sub{font-style:italic;color:var(--ink-2);font-size:13px;margin-bottom:16px}
.carta p{margin:0 0 13px;font-size:12.8px;line-height:1.72;color:var(--ink-2);text-align:justify;overflow-wrap:anywhere;word-break:break-word}
.carta .sig{margin-top:20px;font-size:12.5px;color:var(--ink-2)}
.carta img{max-width:100%;height:auto;display:block;margin:14px auto;border-radius:2px}
.carta h3.tit{font-family:var(--display);font-size:16px;color:var(--navy);margin:16px 0 9px;text-align:left}
.carta ul,.carta ol{margin:0 0 13px;padding-left:22px;font-size:12.8px;line-height:1.72;color:var(--ink-2)}
.carta b,.carta strong{color:var(--ink)}

.disc p{font-size:11.6px;color:var(--ink-2);line-height:1.72;margin:0 0 13px;text-align:justify}

@media print{
  .rail,.topbar,.no-print{display:none!important}
  html,body{background:#fff;width:100%}
  .main{margin:0;padding:0}
  .doc{max-width:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:0}
  .pg{border:0;margin:0;padding:15mm 14mm 12mm;min-height:0;border-radius:0;
      break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg-mark{top:13mm;right:14mm}
  .pg-num{bottom:8mm;right:14mm}
  /* capa sangrando na folha inteira */
  .cover{margin:0;padding:46mm 22mm 20mm;height:297mm;border-radius:0;
         background:var(--navy)!important;display:flex;flex-direction:column}
  .cover h1{font-size:30pt}
  /* manter título junto do bloco e evitar sobras */
  .shead,.dash{break-after:avoid;page-break-after:avoid;margin:16px 0 11px}
  .panel,.carta,.rt,.kgrid,.pat{break-inside:avoid}
  .panel{padding:14px}
  .panel svg{max-height:46mm;width:auto;max-width:100%}
  .dn{max-height:42mm}
  .pat{padding:14px 0;margin-top:14px}
  .pat .v{font-size:26px}
  .pat-col.atual .n{font-size:26px}
  .pat-col.ant .n{font-size:17px}
  .pat-duo{gap:16px}
  .kbox{padding:13px 15px}
  .kbox .v{font-size:20px;margin:7px 0 4px}
  .kbox .l{letter-spacing:.14em}
  .rep-name{font-size:24px}
  .rt.compact td,.rt.compact th{padding:5px 2px;font-size:7.6pt}
  .rt td,.rt th{padding:6px 8px;font-size:11.5px}
  .dn-rows div{padding:6px 4px}
  .foot-note{margin-top:10px}
}
@media screen and (max-width:900px){
  :root{--rail:0px}
  .rail{position:static;width:auto;bottom:auto}
  .main{margin:0;padding:18px}
  .pg{padding:30px 22px}
  .pg-mark{display:none}
  .kgrid{grid-template-columns:1fr}
  .kbox{border-right:0!important;padding:16px 0!important;border-bottom:1px solid var(--line)}
}
</style>

<script>
/* ============ conexão e sessão ============ */
var SB_URL="https://mqhqbqiyrtlhhzjfuqxs.supabase.co";
var SB_KEY="sb_publishable_7CLSR1wwXFAD2y-it_bo9A_GtjAUnm3";
var SESSAO=null;
try{ SESSAO=JSON.parse(localStorage.getItem("aw_sessao")||"null"); }catch(e){}
var PERFIS={}, EU={admin:false,nome:"",id:null};

function idDoToken(tk){
  try{
    var b=tk.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(b+"===".slice((b.length+3)%4))))).sub||null;
  }catch(e){ return null; }
}
function guardarSessao(d){
  SESSAO={access_token:d.access_token,refresh_token:d.refresh_token,
          email:(d.user&&d.user.email)||"",
          id:(d.user&&d.user.id)||idDoToken(d.access_token||"")};
  try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){}
}
function limparSessao(){
  SESSAO=null;
  try{ localStorage.removeItem("aw_sessao"); }catch(e){}
}
function entrar(email,senha){
  return fetch(SB_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:senha})
  }).then(function(res){
    return res.json().then(function(d){
      if(!res.ok) throw new Error(d.error_description||d.msg||d.message||"E-mail ou senha incorretos.");
      guardarSessao(d);
    });
  });
}
function renovar(){
  if(!SESSAO||!SESSAO.refresh_token) return Promise.reject(new Error("sem sessão"));
  return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:SESSAO.refresh_token})
  }).then(function(res){
    if(!res.ok) throw new Error("sessão expirada");
    return res.json().then(guardarSessao);
  });
}
function sair(){
  if(!confirm("Sair da conta?")) return;
  var tk=SESSAO&&SESSAO.access_token;
  limparSessao();
  if(tk) fetch(SB_URL+"/auth/v1/logout",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+tk}}).catch(function(){});
  db={clientes:[],dados:{},cartas:{}}; S.cliente=null; S.rasc=null; S.app=null;
  try{ localStorage.removeItem("aw_app"); }catch(e){}
  render();
}
function api(path,opts,jaTentou){
  opts=opts||{};
  var tk=(SESSAO&&SESSAO.access_token)||SB_KEY;
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"};
  if(opts.prefer) h["Prefer"]=opts.prefer;
  return fetch(SB_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(res){
      if(res.status===401&&SESSAO&&!jaTentou){
        return renovar().then(function(){ return api(path,opts,true); })
          .catch(function(){ limparSessao(); render(); throw new Error("Sua sessão expirou. Entre novamente."); });
      }
      if(!res.ok) return res.text().then(function(t){ throw new Error(t||("HTTP "+res.status)); });
      return res.status===204?null:res.json();
    });
}
function status(estado,txt){
  var d=document.getElementById("dot"),t=document.getElementById("syncTxt");
  if(!d) return;
  d.className="dot"+(estado==="err"?" err":(estado==="wait"?" wait":""));
  t.textContent=txt;
}

function brl(v){ return "R$ "+Math.round(v||0).toLocaleString("pt-BR"); }
function brl2(v){ return "R$ "+(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function brlC(v){ var a=Math.abs(v||0); if(a>=1e6) return "R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi"; if(a>=1e3) return "R$ "+(v/1e3).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mil"; return brl(v); }
function usd(v){ return "US$ "+Math.round(v||0).toLocaleString("pt-BR"); }
function usd2(v){ return "US$ "+(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function usdC(v){ var a=Math.abs(v||0); if(a>=1e6) return "US$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi"; if(a>=1e3) return "US$ "+(v/1e3).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mil"; return usd(v); }
function mo(v,cur){ return cur==="USD"?usd(v):brl(v); }
function mo2(v,cur){ return cur==="USD"?usd2(v):brl2(v); }
function moC(v,cur){ return cur==="USD"?usdC(v):brlC(v); }
function ptaxFmt(v){ return v?"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:4,maximumFractionDigits:4}):"\u2014"; }
function pct(v,d){ d=d==null?2:d; return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%"; }
function sinal(v){ return v>0?"pos":(v<0?"neg":""); }
/* destaca os digitos: simbolo de moeda e de % ficam menores e discretos */
function nv(txt){
  return String(txt==null?"":txt)
    .replace(/^(R\$|US\$)\s*/,'<span class="uni">$1</span>')
    .replace(/%$/,'<span class="uni">%</span>');
}
function ref(m,a){ return MESES_C[m-1]+"/"+String(a).slice(2); }
function dataBase(m,a){
  var ultimo=new Date(a,m,0).getDate();
  return String(ultimo).padStart(2,"0")+"/"+String(m).padStart(2,"0")+"/"+a;
}
function moedaParse(str){
  var t=String(str==null?"":str).replace(/\./g,"").replace(",",".").replace(/[^0-9.\-]/g,"");
  var v=parseFloat(t); return isNaN(v)?0:v;
}
function moedaFmt(v){
  if(!v) return "";
  return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});
}
function onMoeda(el,cb){
  var bruto=el.value, fim=(el.selectionStart===bruto.length);
  var v=moedaParse(bruto);
  cb(v);
  var f=/,\d{0,2}$/.test(bruto)?bruto.replace(/[^0-9.,]/g,""):moedaFmt(v);
  el.value=f;
  if(fim){ try{ el.selectionStart=el.selectionEnd=el.value.length; }catch(e){} }
}
function contaVazia(cur){ return {nome:"",inst:"",saldo:0,apl:0,res:0,rendPct:0,rendRs:0,moeda:(cur==="USD"?"USD":"BRL")}; }
function curDe(c){ return (c&&c.moeda==="USD")?"USD":"BRL"; }
function contasDe(r,cur){ cur=(cur==="USD")?"USD":"BRL"; return ((r&&r.contas)?r.contas:[]).filter(function(c){ return curDe(c)===cur; }); }
function indVazio(){ var o={}; IND.forEach(function(p){o[p[0]]=0;}); o.carta=""; o.vencimentos=[]; o.estrategias={}; ESTRAT.forEach(function(e){o.estrategias[e[0]]=0;}); return o; }
function listaEstrat(ind){

  return ESTRAT.map(function(x){ return {nome:x[1],pc:n(e[x[0]])}; }).filter(function(x){ return x.pc>0; });
}
function vencVazio(){ return {ativo:"",inst:"",taxa:"",data:"",valor:0}; }
function listaVenc(ind){
  var v=(ind&&ind.vencimentos)||[];
  return v.filter(function(x){ return (x.ativo||"").trim()||n(x.valor)||x.data; })
          .sort(function(a,b){ return (a.data||"9999").localeCompare(b.data||"9999"); });
}
function dataBR(d){
  if(!d) return "—";
  var p=String(d).split("-");

}

function carregar(){

  return Promise.all([

    api("lancamentos?select=cliente_id,mes,ano,contas,indicadores"),
    api("cartas?select=mes,ano,conteudo").catch(function(){ return []; }),
    api("perfis?select=user_id,nome,admin").catch(function(){ return []; })
  ]).then(function(r){
    if(SESSAO&&!SESSAO.id){ SESSAO.id=idDoToken(SESSAO.access_token||""); try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){} }
    PERFIS={}; (r[3]||[]).forEach(function(x){ PERFIS[x.user_id]={nome:x.nome||"",admin:!!x.admin}; });

    });

    S.erro=null; status("ok","Sincronizado");
  }).catch(function(e){ S.erro=e.message; status("err","Sem conexão"); });
}
function recarregar(){
  var atual=S.cliente;
  carregar().then(function(){
    var existe=db.clientes.some(function(c){return c.id===atual;});
    S.cliente=existe?atual:(db.clientes.length?db.clientes[0].id:null);
    montarRascunho(); render();
  });
}
function montarRascunho(){
  var id=S.cliente; if(!id){S.rasc=null;return;}
  var r=reg(id,S.mes,S.ano);
  if(r){ S.rasc=JSON.parse(JSON.stringify(r)); if(!S.rasc.ind) S.rasc.ind=indVazio(); S.rasc._herdado=false; aplicarIndices(); herdarOffshore(); return; }
  var p=anterior(S.mes,S.ano),ant=null,t=0;
  while(t<24&&!ant){ ant=reg(id,p.mes,p.ano); if(!ant)p=anterior(p.mes,p.ano); t++; }
  if(ant){
    S.rasc={_herdado:true,contas:ant.contas.map(function(c){return {nome:c.nome,inst:c.inst,saldo:n(c.saldo),apl:0,res:0,rendPct:0,rendRs:0,moeda:curDe(c)};}),ind:indVazio()};
    if(ant.ind&&ant.ind.secoes) S.rasc.ind.secoes=JSON.parse(JSON.stringify(ant.ind.secoes));
  }else{
    S.rasc={_herdado:false,contas:[contaVazia(),contaVazia()],ind:indVazio()};
  }
  aplicarIndices(); herdarOffshore();
}
/* se o mes nao tem conta offshore mas algum mes anterior tinha, traz os saldos */
function herdarOffshore(){
  if(!S.rasc) return;
  S.rasc._offHerdado=false;
  if(contasDe(S.rasc,"USD").length) return;
  var p=anterior(S.mes,S.ano),ant=null,t=0;
  while(t<24&&!ant){
    var rr=reg(S.cliente,p.mes,p.ano);
    if(rr&&contasDe(rr,"USD").length) ant=rr; else p=anterior(p.mes,p.ano);
    t++;
  }
  if(!ant) return;
  contasDe(ant,"USD").forEach(function(c){
    S.rasc.contas.push({nome:c.nome,inst:c.inst,saldo:n(c.saldo),apl:0,res:0,rendPct:0,rendRs:0,moeda:"USD"});
  });
  S.rasc._offHerdado=true;
}

/* ---- indicadores de mercado: valem para todos os clientes no mes ---- */
var INDGLOB=IND.map(function(x){return x[0];}).concat(["ptax"]);
var SECOES=[["comentarios","Coment\u00e1rios do m\u00eas"],["estrategia","Aloca\u00e7\u00e3o por estrat\u00e9gia"],
  ["instituicao","Distribui\u00e7\u00e3o por institui\u00e7\u00e3o"],["retornos","Retornos mensais"],
  ["benchmarks","Carteira contra os indicadores"],["contas","Desempenho por conta"],
  ["evolucao","Evolu\u00e7\u00e3o do patrim\u00f4nio"],["vencimentos","Pr\u00f3ximos vencimentos"],
  ["offshore","Bloco offshore"]];
function secOn(ind,k){ var o=ind&&ind.secoes; return (!o||o[k]===undefined)?true:!!o[k]; }
function setSecao(k,v){ if(!S.rasc.ind.secoes) S.rasc.ind.secoes={}; S.rasc.ind.secoes[k]=!!v; }
/* patrimonio do ultimo mes lancado antes de (mes/ano) */
function patAnterior(id,mes,ano,cur){
  var p=anterior(mes,ano),t=0;
  while(t<24){
    var r=reg(id,p.mes,p.ano);
    if(r&&contasDe(r,cur).length) return {pl:totais(r,cur).pl,mes:p.mes,ano:p.ano};
    p=anterior(p.mes,p.ano); t++;
  }
  return null;
}
function blocoPatrimonio(id,mes,ano,cur,pl,rotulo,nota){
  var a=patAnterior(id,mes,ano,cur);
  var h='<div class="pat"><div class="l">'+esc(rotulo)+'</div>';
  if(!a){
    h+='<div class="v">'+nv(mo(pl,cur))+'</div><div class="s">posi\u00e7\u00e3o em '+dataBase(mes,ano)+(nota?' \u00b7 '+nota:'')+'</div>';
    return h+'</div>';
  }
  h+='<div class="pat-duo">'+
     '<div class="pat-col ant"><div class="d">'+dataBase(a.mes,a.ano)+'</div><div class="n">'+nv(mo(a.pl,cur))+'</div><div class="c">m\u00eas anterior</div></div>'+
     '<div class="pat-sep"></div>'+
     '<div class="pat-col atual"><div class="d">'+dataBase(mes,ano)+'</div><div class="n">'+nv(mo(pl,cur))+'</div><div class="c">posi\u00e7\u00e3o atual</div></div>'+
     '</div>';
  if(nota) h+='<div class="s" style="margin-top:13px">'+nota+'</div>';
  return h+'</div>';
}
function indicesDoMes(mes,ano,excluiId){
  var achado=null;
  db.clientes.forEach(function(c){
    if(achado||c.id===excluiId) return;
    var rr=reg(c.id,mes,ano); if(!rr||!rr.ind) return;
    for(var i=0;i<INDGLOB.length;i++){ if(n(rr.ind[INDGLOB[i]])){ achado=rr.ind; return; } }
  });
  return achado;
}
function aplicarIndices(){
  if(!S.rasc) return;
  S.rasc._indHerdados=false;
  for(var i=0;i<INDGLOB.length;i++){ if(n(S.rasc.ind[INDGLOB[i]])) return; }
  var g=indicesDoMes(S.mes,S.ano,S.cliente); if(!g) return;
  var algum=false;
  INDGLOB.forEach(function(k){ var v=n(g[k]); if(v){ S.rasc.ind[k]=v; algum=true; } });
  S.rasc._indHerdados=algum;
}
function replicarIndices(mes,ano,origemId,ind){
  var vals={},chaves=[];
  INDGLOB.forEach(function(k){ var v=n(ind&&ind[k]); if(v){ vals[k]=v; chaves.push(k); } });
  if(!chaves.length) return Promise.resolve(0);
  var fila=[],qtd=0;
  db.clientes.forEach(function(c){
    if(c.id===origemId) return;
    var rr=reg(c.id,mes,ano); if(!rr) return;
    var dif=chaves.some(function(k){ return n(rr.ind&&rr.ind[k])!==vals[k]; });
    if(!dif) return;
    var novo=JSON.parse(JSON.stringify(rr.ind||{}));
    chaves.forEach(function(k){ novo[k]=vals[k]; });
    qtd++;
    fila.push(api("lancamentos?cliente_id=eq."+c.id+"&mes=eq."+mes+"&ano=eq."+ano,
      {method:"PATCH",prefer:"return=minimal",body:{indicadores:novo,atualizado_em:new Date().toISOString()}})
      .then(function(){ var d=db.dados[chave(c.id,mes,ano)]; if(d) d.ind=novo; }));
  });
  if(!fila.length) return Promise.resolve(0);
  return Promise.all(fila).then(function(){
    registrar("replicou indicadores",MESES[mes-1]+"/"+ano,qtd+(qtd===1?" cliente atualizado":" clientes atualizados"));
    return qtd;
  }).catch(function(){ return 0; });
}

/* ============ cálculos ============ */
/* saldo de abertura de uma conta = saldo final - rendimento - aplicações + resgates */
function abertura(c){
  var b=n(c.saldo)-n(c.rendRs)-n(c.apl)+n(c.res);
  return b>0?b:n(c.saldo);
}
function totais(r,cur){
  cur=(cur==="USD")?"USD":"BRL";
  if(!r) return {pl:0,rendRs:0,rendPct:0,apl:0,res:0,base:0};
  var pl=0,rs=0,apl=0,res=0,peso=0,pond=0;
  contasDe(r,cur).forEach(function(c){
    pl+=n(c.saldo); rs+=n(c.rendRs); apl+=n(c.apl); res+=n(c.res);
    var b=abertura(c);
    if(b>0){ peso+=b; pond+=n(c.rendPct)*b; }
  });
  return {pl:pl,rendRs:rs,rendPct:peso>0?pond/peso:0,apl:apl,res:res,base:peso};
}
function serieAno(id,ano,ateMes,cur){
  cur=(cur==="USD")?"USD":"BRL";
  var out=[],lim=ateMes||12;
  for(var m=1;m<=lim;m++){ var r=reg(id,m,ano); if(!r) continue; if(!contasDe(r,cur).length) continue; var t=totais(r,cur);
    out.push({mes:m,ano:ano,pl:t.pl,rendPct:t.rendPct,rendRs:t.rendRs,apl:t.apl,res:t.res,cdi:n(r.ind&&r.ind.cdi)}); }
  return out;
}
function comp(vals){ var f=1; vals.forEach(function(v){ f*=(1+v/100); }); return (f-1)*100; }
/* serie mes a mes ate (mes/ano); nMeses=0 -> desde o primeiro lancamento */
function serieHist(id,mes,ano,cur,nMeses){
  cur=(cur==="USD")?"USD":"BRL";
  var out=[],p={mes:mes,ano:ano},lim=nMeses||600,vazios=0;
  for(var i=0;i<lim;i++){
    var r=reg(id,p.mes,p.ano);
    if(r&&contasDe(r,cur).length){
      var t=totais(r,cur);
      out.unshift({mes:p.mes,ano:p.ano,pl:t.pl,rendPct:t.rendPct,rendRs:t.rendRs,ind:r.ind||{}});
      vazios=0;
    }else{
      vazios++;
      if(!nMeses&&out.length&&vazios>24) break;
      if(!nMeses&&!out.length&&vazios>240) break;
    }
    p=anterior(p.mes,p.ano);
  }
  return out;
}
/* rentabilidade composta da carteira e resultado somado num recorte */
function agregado(serie){
  return { pct:comp(serie.map(function(x){return x.rendPct;})),
           rs:serie.reduce(function(a,x){return a+x.rendRs;},0),
           meses:serie.length };
}
/* rentabilidade composta de um indicador no recorte; null se nunca informado */
function benchAcum(serie,chaveInd){
  var tem=false,vals=serie.map(function(x){ var v=n(x.ind&&x.ind[chaveInd]); if(v) tem=true; return v; });
  return tem?comp(vals):null;
}
/* quantos meses do recorte tem o indicador preenchido */
function benchMeses(serie,chaveInd){
  return serie.filter(function(x){ return n(x.ind&&x.ind[chaveInd])!==0; }).length;
}
/* rentabilidade composta de uma conta nos últimos N meses até (mes/ano) */
function contaAcum(id,nome,mes,ano,nMeses){
  var vals=[],p={mes:mes,ano:ano};
  for(var i=0;i<nMeses;i++){
    var r=reg(id,p.mes,p.ano);
    if(r){ r.contas.forEach(function(c){ if((c.nome||"")===nome) vals.unshift(n(c.rendPct)); }); }
    p=anterior(p.mes,p.ano);
  }
  return vals.length?comp(vals):null;
}
function porInstituicao(r,cur){
  var map={},tot=0;
  contasDe(r,cur).forEach(function(c){
    var k=((c.inst||"").trim())||"Sem instituição";
    if(!map[k]) map[k]={nome:k,valor:0,rendRs:0};
    map[k].valor+=n(c.saldo); map[k].rendRs+=n(c.rendRs); tot+=n(c.saldo);
  });
  return Object.keys(map).map(function(k){var o=map[k];o.pc=tot>0?o.valor/tot*100:0;return o;}).sort(function(a,b){return b.valor-a.valor;});
}

    .then(function(r){ var c=r[0]; db.clientes.push({id:c.id,nome:c.nome,assessor_id:c.assessor_id});
      db.clientes.sort(function(a,b){return a.nome.localeCompare(b.nome);});
      S.cliente=c.id; registrar("criou cliente",c.nome,""); status("ok","Sincronizado"); montarRascunho(); render(); }).catch(falha);

function transferirCliente(){
  var c=cli(); if(!c) return;
  if(!EU.admin){ alert("Apenas o administrador pode trocar o assessor de um cliente."); return; }
  var lista=Object.keys(PERFIS).map(function(k){ return {id:k,nome:PERFIS[k].nome||k}; })
    .sort(function(a,b){ return a.nome.localeCompare(b.nome); });
  if(!lista.length){ alert("Nenhum assessor cadastrado."); return; }
  var txt="Transferir “"+c.nome+"” para qual assessor?\n\n"+
    lista.map(function(x,i){ return (i+1)+". "+x.nome+(x.id===c.assessor_id?"  (atual)":""); }).join("\n")+
    "\n\nDigite o numero:";
  var esc1=prompt(txt); if(!esc1) return;
  var idx=parseInt(esc1,10)-1;
  if(isNaN(idx)||idx<0||idx>=lista.length){ alert("Numero invalido."); return; }
  var novo=lista[idx];
  if(novo.id===c.assessor_id) return;
  status("wait","Salvando\u2026");
  api("clientes?id=eq."+c.id,{method:"PATCH",body:{assessor_id:novo.id}})
    .then(function(){
      c.assessor_id=novo.id;
      registrar("trocou assessor",c.nome,"agora com "+novo.nome);
      status("ok","Sincronizado"); render();
    }).catch(falha);
}
function renomear(){
  var c=cli(); if(!c) return;
  var nome=prompt("Nome do cliente:",c.nome); if(!nome) return;
  status("wait","Salvando…");
  api("clientes?id=eq."+c.id,{method:"PATCH",body:{nome:nome.trim()}})
    .then(function(){ registrar("renomeou cliente",c.nome,"para "+nome.trim()); c.nome=nome.trim(); status("ok","Sincronizado"); render(); }).catch(falha);
}
function excluirCliente(){
  var c=cli(); if(!c) return;
  if(!confirm("Excluir "+c.nome+" e todos os meses lançados? Não é possível desfazer.")) return;
  status("wait","Excluindo…");
  var nomeExcluido=c.nome;
  api("clientes?id=eq."+c.id,{method:"DELETE"}).then(function(){
    registrar("excluiu cliente",nomeExcluido,"");
    db.clientes=db.clientes.filter(function(x){return x.id!==c.id;});
    Object.keys(db.dados).forEach(function(k){ if(k.indexOf(c.id+"|")===0) delete db.dados[k]; });
    S.cliente=db.clientes.length?db.clientes[0].id:null;
    status("ok","Sincronizado"); montarRascunho(); render();
  }).catch(falha);
}
function salvarMes(){
  if(!S.cliente){ alert("Selecione um cliente."); return; }
  var contas=S.rasc.contas.filter(function(c){return (c.nome||"").trim()||n(c.saldo);});
  if(!contas.length){ alert("Informe ao menos uma conta com nome ou saldo."); return; }
  var b=document.getElementById("btnSalvar"); if(b){b.disabled=true;b.textContent="Salvando…";}
  status("wait","Salvando…");
  api("lancamentos?on_conflict=cliente_id,mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=representation",
    body:{cliente_id:S.cliente,mes:S.mes,ano:S.ano,contas:contas,indicadores:S.rasc.ind,atualizado_em:new Date().toISOString()}})
    .then(function(){
      db.dados[chave(S.cliente,S.mes,S.ano)]={contas:contas,ind:S.rasc.ind};
      registrar("salvou lançamento",(cli()||{}).nome||"",MESES[S.mes-1]+"/"+S.ano+" · "+contas.length+(contas.length===1?" conta · ":" contas · ")+brl(totais({contas:contas}).pl));
      return replicarIndices(S.mes,S.ano,S.cliente,S.rasc.ind);
    })
    .then(function(qtd){
      status("ok",qtd?("Sincronizado · índices replicados para "+qtd+(qtd===1?" cliente":" clientes")):"Sincronizado");
      montarRascunho(); S.tab="relatorio"; render();
    }).catch(function(e){ falha(e); if(b){b.disabled=false;b.textContent="Salvar mês e ver relatório";} });

function inserirImagem(inp){
  var f=inp.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ alert("Imagem muito grande. Use um arquivo de até 8 MB."); inp.value=""; return; }
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=900, esc2=Math.min(1,max/img.width);
      var cv=document.createElement("canvas");
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      var dados=cv.toDataURL("image/jpeg",0.82);
      document.getElementById("edCarta").focus();
      document.execCommand("insertImage",false,dados);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
  inp.value="";
}

/* ---------- backup automático ---------- */
function backupAutomatico(){
  if(!EU.admin) return Promise.resolve(null);
  return api("backups?select=quando&order=quando.desc&limit=1").then(function(r){
    var ultimo=(r&&r[0])?new Date(r[0].quando):null;
    var horas=ultimo?(Date.now()-ultimo.getTime())/36e5:999;
    if(horas<24) return null;
    return api("backups",{method:"POST",prefer:"return=minimal",
      body:{usuario:(SESSAO&&SESSAO.email)||"",conteudo:{clientes:db.clientes,dados:db.dados,cartas:db.cartas}}})
      .then(function(){ return limparBackupsAntigos(); });
  }).catch(function(){ return null; });
}
function limparBackupsAntigos(){
  return api("backups?select=id&order=quando.desc").then(function(r){
    if(!r||r.length<=30) return null;
    var velhos=r.slice(30).map(function(x){return x.id;});
    return api("backups?id=in.("+velhos.join(",")+")",{method:"DELETE"});
  }).catch(function(){ return null; });
}
function listarBackups(){
  return api("backups?select=id,quando,usuario&order=quando.desc&limit=30").catch(function(){ return null; });
}
function restaurarBackup(id,rotulo){
  if(!confirm("Restaurar a cópia de "+rotulo+"?\n\nTudo o que foi lançado depois dessa data será substituído. Esta ação não pode ser desfeita.")) return;
  status("wait","Restaurando…");
  api("backups?id=eq."+id+"&select=conteudo").then(function(r){
    if(!r||!r[0]) throw new Error("Cópia não encontrada.");
    var b=r[0].conteudo;
    var fila=[];
    (b.clientes||[]).forEach(function(c){
      fila.push(api("clientes?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:{id:c.id,nome:c.nome}}));
    });
    Object.keys(b.dados||{}).forEach(function(k){
      var partes=k.split("|"), cid=partes[0], ano=parseInt(partes[1].slice(0,4),10), mes=parseInt(partes[1].slice(5,7),10);
      var d=b.dados[k];
      fila.push(api("lancamentos?on_conflict=cliente_id,mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{cliente_id:cid,mes:mes,ano:ano,contas:d.contas||[],indicadores:d.ind||{}}}));
    });
    Object.keys(b.cartas||{}).forEach(function(k){
      fila.push(api("cartas?on_conflict=mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{mes:parseInt(k.slice(5,7),10),ano:parseInt(k.slice(0,4),10),conteudo:b.cartas[k]}}));
    });
    return Promise.all(fila);
  }).then(function(){
    return registrar("restaurou backup","",rotulo);
  }).then(function(){
    return carregar();
  }).then(function(){
    S.cliente=db.clientes.length?db.clientes[0].id:null;
    montarRascunho(); render();
    alert("Cópia restaurada.");
  }).catch(falha);
}

function ptaxAuto(){
  var k=S.cliente+"|"+S.mes+"|"+S.ano;
  if(PTAX_TENTADO[k]) return;
  if(n(S.rasc&&S.rasc.ind&&S.rasc.ind.ptax)>0) return;
  PTAX_TENTADO[k]=1; buscarPtax();
}
function buscarPtax(){
  var msg=document.getElementById("ptaxMsg");
  if(msg){ msg.textContent="Consultando Banco Central..."; msg.style.color="var(--muted)"; }
  function f(d){ return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"-"+d.getFullYear(); }
  var ini=new Date(S.ano,S.mes-1,1), fim=new Date(S.ano,S.mes,0);
  var url="https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)"+
    "?@dataInicial='"+f(ini)+"'&@dataFinalCotacao='"+f(fim)+"'&$format=json&$select=cotacaoVenda,dataHoraCotacao";
  fetch(url).then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); })
  .then(function(j){
    var arr=(j&&j.value)||[]; if(!arr.length) throw new Error("sem cotacao");
    var ult=arr[arr.length-1], v=Number(ult.cotacaoVenda);
    if(!v) throw new Error("cotacao invalida");
    setInd("ptax",v);
    var el=document.getElementById("inpPtax"); if(el) el.value=v;
    var d=String(ult.dataHoraCotacao||"").slice(0,10).split("-");
    if(msg){ msg.textContent="PTAX venda de "+(d.length===3?d[2]+"/"+d[1]+"/"+d[0]:"fechamento")+"."; msg.style.color="var(--muted)"; }
  })
  .catch(function(){
    if(msg){ msg.textContent="Nao foi possivel consultar. Digite a PTAX manualmente."; msg.style.color="var(--alert)"; }
  });
}

function eixoY(max,H,pt,pb,W,fmt){
  var out="",linhas=5;
  for(var i=0;i<linhas;i++){
    var v=max*i/(linhas-1), y=H-pb-(v/max)*(H-pt-pb);
    out+='<line x1="52" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#EDF1F5"/>'+
         '<text x="46" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+fmt(v)+'</text>';
  }
  return out;
}
function chartCarteiraCdi(serie){
  if(!serie.length) return '<p class="foot-note">Sem histórico no ano.</p>';
  var W=Math.max(420,serie.length*74+70),H=210,pt=16,pb=30;
  var max=Math.max.apply(null,serie.map(function(s){return Math.max(s.rendPct,s.cdi);}));
  if(max<=0) max=1; max=max*1.15;
  var slot=(W-62)/serie.length,bw=Math.min(19,slot/3.2),out=eixoY(max,H,pt,pb,W,function(v){return pct(v,2);});
  serie.forEach(function(s,i){
    var cx=52+i*slot+slot/2;
    [[s.rendPct,"#1B3A5F",-1],[s.cdi,"#C0A265",1]].forEach(function(p){
      var hh=Math.max(0,(p[0]/max)*(H-pt-pb)),x=cx+(p[2]<0?-bw-2:2),y=H-pb-hh;
      out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="'+p[1]+'"/>';
    });
    out+='<text x="'+cx+'" y="'+(H-11)+'" text-anchor="middle" font-size="9" fill="#7A8698">'+ref(s.mes,s.ano)+'</text>';
  });
  out+='<line x1="52" y1="'+(H-pb)+'" x2="'+(W-8)+'" y2="'+(H-pb)+'" stroke="#DCE2EA"/>';
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;display:block;margin:0 auto">'+out+'</svg></div>'+
         '<div class="dn-leg" style="margin-top:14px"><span><i style="background:#1B3A5F"></i>Rendimento da carteira</span><span><i style="background:#C0A265"></i>CDI</span></div>';

function pizza(items){
  var R=88,cx=100,cy=100,ang=-Math.PI/2,out="";
  var tot=items.reduce(function(a,b){return a+b.valor;},0);
  if(tot<=0) return "";
  if(items.length===1){
    out='<circle cx="100" cy="100" r="88" fill="'+CORES[0]+'"/>';
  }else{
    items.forEach(function(it,i){
      var a2=ang+(it.valor/tot)*Math.PI*2,big=(a2-ang)>Math.PI?1:0;
      var x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      out+='<path d="M'+cx+' '+cy+' L'+x1+' '+y1+' A'+R+' '+R+' 0 '+big+' 1 '+x2+' '+y2+' Z" fill="'+CORES[i%CORES.length]+'" stroke="#fff" stroke-width="1.5"/>';
      ang=a2;
    });
  }
  return '<svg class="dn" viewBox="0 0 200 200" width="210" height="210">'+out+'</svg>';
}

/* tabela de retornos por ano (carteira x CDI) */
function tabelaRetornos(id,cur){
  cur=(cur==="USD")?"USD":"BRL";
  var anos=[];
  Object.keys(db.dados).forEach(function(k){
    if(k.indexOf(id+"|")===0){
      var y=parseInt(k.split("|")[1].slice(0,4),10);
      if(anos.indexOf(y)<0) anos.push(y);
    }
  });
  anos.sort(function(a,b){return a-b;});
  var fc=1,fd=1,linhas=[];
  anos.forEach(function(y){
    var meses=[];
    for(var m=1;m<=12;m++){
      var r=reg(id,m,y);
      var ok=r&&contasDe(r,cur).length;
      meses.push(ok?{p:totais(r,cur).rendPct,c:(cur==="BRL"?n(r.ind&&r.ind.cdi):0)}:null);
    }
    var vivos=meses.filter(function(x){return x;});
    if(!vivos.length) return;
    var noAnoP=comp(vivos.map(function(x){return x.p;}));
    var noAnoC=comp(vivos.map(function(x){return x.c;}));
    fc*=(1+noAnoP/100); fd*=(1+noAnoC/100);
    linhas.push({ano:y,meses:meses,noAnoP:noAnoP,noAnoC:noAnoC,accP:(fc-1)*100,accC:(fd-1)*100});
  });
  return linhas.reverse();
}

           cel(L.noAnoC)+cel(L.accC)+'</tr>';
    var r3='<tr class="sep"><td>% do CDI</td>'+L.meses.map(function(x){

           }).join("")+
           (L.noAnoC>0?'<td class="n">'+pct(L.noAnoP/L.noAnoC*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>')+
           (L.accC>0?'<td class="n">'+pct(L.accP/L.accC*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>')+'</tr>';

function marca(){ return '<div class="pg-mark"><img src="'+LOGO_AZUL+'" alt="Adami Wealth"></div>'; }
var SNUM=0;
/* ===== conferencia de consistencia dos lancamentos =====
   Regras deterministicas: cada achado aponta a conta, o numero encontrado
   e o numero esperado, para dar pra conferir na mao. */
function conferir(id,mes,ano){
  var r=reg(id,mes,ano), out=[];
  if(!r) return out;
  var add=function(nivel,onde,titulo,detalhe){ out.push({nivel:nivel,onde:onde,titulo:titulo,detalhe:detalhe}); };
  var ant=null,pa=anterior(mes,ano),tt=0;
  while(tt<24&&!ant){ var rr=reg(id,pa.mes,pa.ano); if(rr) ant=rr; else pa=anterior(pa.mes,pa.ano); tt++; }

  ["BRL","USD"].forEach(function(cur){
    var contas=contasDe(r,cur); if(!contas.length) return;
    var fm=function(v){ return mo2(v,cur); };
    var antC=ant?contasDe(ant,cur):[];
    var achaAnt=function(nome){
      for(var i=0;i<antC.length;i++){ if((antC[i].nome||"")===(nome||"")) return antC[i]; }
      return null;
    };

    contas.forEach(function(c){
      var nome=(c.nome||"sem nome")+(cur==="USD"?" (offshore)":"");
      var saldo=n(c.saldo), rs=n(c.rendRs), pc=n(c.rendPct), apl=n(c.apl), res=n(c.res);
      var base=saldo-rs-apl+res;

      if(saldo===0&&rs===0&&pc===0&&apl===0&&res===0) return;

      if(base<0){
        add("alta",nome,"Saldo de abertura negativo",
          "Pelo saldo final de "+fm(saldo)+", resultado de "+fm(rs)+", aplica\u00e7\u00f5es de "+fm(apl)+" e resgates de "+fm(res)+
          ", a abertura do m\u00eas daria <i>"+fm(base)+"</i>. Algum dos quatro campos est\u00e1 trocado ou com sinal invertido.");
      }else if(base===0&&saldo>0&&(rs!==0||apl!==0)){
        add("atencao",nome,"Abertura zerada",
          "A conta fecha em "+fm(saldo)+" mas a abertura calculada d\u00e1 zero. Confira se a aplica\u00e7\u00e3o e o resultado est\u00e3o certos.");
      }

      var foraEscala=Math.abs(pc)>50;
      if(foraEscala){
        add("alta",nome,"Rentabilidade fora de escala",
          "Foi informado <i>"+pct(pc)+"</i> no m\u00eas. Se a inten\u00e7\u00e3o era "+pct(pc/100)+", o valor foi digitado cem vezes maior.");
      }

      if(base>0&&rs!==0&&pc!==0&&!foraEscala){
        var impl=(rs/base)*100, dif=Math.abs(impl-pc);
        var tol=Math.max(0.20,Math.abs(pc)*0.25);
        if(dif>tol){
          add(dif>Math.max(1,Math.abs(pc))?"alta":"atencao",nome,"Resultado e percentual n\u00e3o batem",
            "O resultado de "+fm(rs)+" sobre uma abertura de "+fm(base)+" equivale a <i>"+pct(impl)+"</i>, mas foi informado <i>"+pct(pc)+"</i>. "+
            "Os dois campos s\u00e3o independentes de prop\u00f3sito, ent\u00e3o alguma diferen\u00e7a \u00e9 normal \u2014 essa est\u00e1 grande.");
        }
      }
      if(saldo>0&&pc!==0&&rs===0)
        add("atencao",nome,"Falta o resultado em "+(cur==="USD"?"d\u00f3lar":"reais"),
          "A rentabilidade de "+pct(pc)+" foi informada, mas o campo de resultado est\u00e1 zerado. Ele alimenta o resultado da carteira.");
      if(saldo>0&&rs!==0&&pc===0)
        add("atencao",nome,"Falta a rentabilidade em %",
          "O resultado de "+fm(rs)+" foi informado, mas o percentual est\u00e1 zerado. Ele alimenta a rentabilidade da carteira, que \u00e9 m\u00e9dia ponderada.");
      if(saldo>0&&rs===0&&pc===0&&apl===0)
        add("atencao",nome,"M\u00eas sem resultado",
          "A conta tem "+fm(saldo)+" em saldo e nenhum resultado informado. Se ficou parada mesmo, ignore.");

      var a=achaAnt(c.nome);
      if(a){
        var fech=n(a.saldo), delta=base-fech, lim=Math.max(1,Math.abs(fech)*0.005);
        if(Math.abs(delta)>lim){
          add(Math.abs(delta)>Math.abs(fech)*0.05?"alta":"atencao",nome,"N\u00e3o fecha com o m\u00eas anterior",
            "O m\u00eas anterior fechou em "+fm(fech)+" e a abertura deste m\u00eas d\u00e1 "+fm(base)+", diferen\u00e7a de <i>"+fm(delta)+"</i>. "+
            "Costuma ser aplica\u00e7\u00e3o ou resgate que n\u00e3o foi lan\u00e7ado.");
        }
      }else if(ant&&antC.length&&saldo>0&&apl===0){
        add("atencao",nome,"Conta nova sem aplica\u00e7\u00e3o",

      }

        hp=anterior(hp.mes,hp.ano); h++;
      }
      if(hist.length>=4&&pc!==0){

function mesesDoCliente(id){
  var out=[];
  Object.keys(db.dados).forEach(function(k){
    if(k.indexOf(id+"|")!==0) return;
    var mm=(k.split("|")[1]||"").split("-");
    if(mm.length!==2) return;
    out.push({ano:parseInt(mm[0],10),mes:parseInt(mm[1],10)});
  });
  out.sort(function(a,b){ return (b.ano-a.ano)||(b.mes-a.mes); });
  return out;
}
function painelConferencia(id){

  meses.forEach(function(p){

    if(!f.length){ limpos++; return; }
    alta+=f.filter(function(x){return x.nivel==="alta";}).length;
    aten+=f.filter(function(x){return x.nivel==="atencao";}).length;
    grupos.push({mes:p.mes,ano:p.ano,f:f});
  });
  var tag="";
  if(alta) tag+='<span class="chk-tag al">'+alta+(alta===1?" cr\u00edtico":" cr\u00edticos")+'</span>';
  if(aten) tag+='<span class="chk-tag at">'+aten+' a conferir</span>';
  if(!grupos.length) tag='<span class="chk-tag ok">nada a apontar</span>';

  var corpo;

    corpo='<div class="chk-vazio">Este cliente ainda n\u00e3o tem nenhum m\u00eas lan\u00e7ado.</div>';
  }else if(!grupos.length){
    corpo='<div class="chk-vazio">Os '+meses.length+(meses.length===1?" m\u00eas lan\u00e7ado passou":" meses lan\u00e7ados passaram")+
      ' por todas as verifica\u00e7\u00f5es: saldos de abertura, coer\u00eancia entre resultado e percentual, continuidade entre um m\u00eas e o seguinte, contas novas ou encerradas e desvios em rela\u00e7\u00e3o ao hist\u00f3rico de cada conta.</div>';
  }else{
    corpo=grupos.map(function(g){
      var a=g.f.filter(function(x){return x.nivel==="alta";}).length;
      var t=g.f.filter(function(x){return x.nivel==="atencao";}).length;
      var resumo=[]; if(a) resumo.push(a+(a===1?" cr\u00edtico":" cr\u00edticos")); if(t) resumo.push(t+" a conferir");
      return '<div class="chk-mes"><b>'+MESES_C[g.mes-1]+"/"+String(g.ano).slice(2)+'</b><span>'+resumo.join(" \u00b7 ")+'</span></div>'+

        }).join("");

    '<button class="btn" onclick="S._chk=false;render()">Fechar</button></div>'+corpo+

function tabelaBenchmarks(id,mes,ano,cur){

      var a=agregado(c.s);

    }).join("")+'</tr>';

    cols.map(function(c){return '<th class="n">'+c.r+'</th>';}).join("")+

    if(instU.length>1){

    pag(p3);
  }

  /* --- vencimentos (página própria quando houver) --- */
  var venc=listaVenc(r.ind);
  if(venc.length && secOn(r.ind,"vencimentos")){
    pag(shead(nx(),"Próximos vencimentos","valores aproximados")+
      '<div class="panel"><table class="rt"><thead><tr><th>Ativo</th><th>Instituição</th><th>Taxa</th><th class="n">Vencimento</th><th class="n">Valor aproximado</th></tr></thead><tbody>'+

        '<td class="n">'+dataBR(v.data)+'</td><td class="n">'+(n(v.valor)?brl(n(v.valor)):"—")+'</td></tr>';
      }).join("")+
      '<tr class="tot"><td colspan="4">Total</td><td class="n">'+brl(venc.reduce(function(a,v){return a+n(v.valor);},0))+'</td></tr>'+
      '</tbody></table><p class="foot-note">Valores estimados na data de referência, sujeitos a marcação a mercado e à incidência de tributos no resgate.</p></div>');
  }

  /* --- informações importantes --- */
  sumAdd("","Informações importantes");
  pag('<div class="dash"><i>—</i><h2>Informações importantes</h2></div>'+
     '<div class="panel disc">'+
     '<p>Este material foi preparado com finalidade exclusivamente informativa e não constitui oferta, recomendação individualizada de investimento, análise de valores mobiliários ou solicitação de compra ou venda de qualquer ativo.</p>'+
     '<p>As posições e os saldos aqui apresentados refletem as informações fornecidas pelas instituições custodiantes na data de referência e podem divergir dos extratos oficiais em razão de prazos de atualização, marcação a mercado, provisionamento de proventos e eventos societários. Em caso de divergência, prevalece sempre o extrato da instituição custodiante.</p>'+
     '<p>Rentabilidade passada não representa garantia de rentabilidade futura. Os valores são brutos, salvo indicação em contrário, e não consideram a incidência de tributos, taxas de saída, come-cotas ou custos de transação que podem reduzir o resultado efetivo do investidor.</p>'+
     '<p>Investimentos envolvem riscos, inclusive de perda do capital investido. Produtos de renda fixa emitidos por instituições financeiras contam com a cobertura do Fundo Garantidor de Créditos nos limites e condições previstos em seu regulamento; demais ativos não contam com garantia do FGC nem do administrador. Leia atentamente os documentos de cada produto antes de investir.</p>'+
     '<p>Dúvidas sobre este relatório devem ser tratadas diretamente com o assessor responsável.</p>'+
     '</div>');

  /* --- sumário: inserido como página 2, empurrando o resto ---
     as entradas ja tem o indice da pagina em que foram criadas;
     como o sumario entra no indice 1, tudo dali pra frente anda um. */
  if(SUM.length){
    var linhas=SUM.map(function(e){
      return '<div class="sum-row"><span class="n">'+esc(e.num)+'</span>'+
        '<span class="t">'+esc(e.titulo)+'</span><span class="dots"></span>'+
        '<span class="p">'+((e.pg>=1?e.pg+1:e.pg)+1)+'</span></div>';
    }).join("");
    PGS.splice(1,0,{html:'<div class="dash"><i>\u2014</i><h2>Sum\u00e1rio</h2></div>'+
      '<div class="sum">'+linhas+'</div>',capa:false});
  }

  /* --- montagem com numeração real --- */
  var total=PGS.length;
  PGS.forEach(function(P,i){
    if(P.capa){ h+='<div class="pg cover">'+P.html+'</div>'; }
    else { h+='<div class="pg">'+marca()+P.html+'<div class="pg-num">'+(i+1)+' de '+total+'</div></div>'; }
  });

  h+='</div>';
  return h;
}

var avisoImpressao=true;
function tituloPdf(){
  var c=cli(); if(!c) return "Carteira Consolidada";
  var m=MESES[S.mes-1]; m=m.charAt(0).toUpperCase()+m.slice(1);
  return ("Carteira Consolidada "+c.nome+" "+m+" "+S.ano).replace(/[\\/:*?"<>|]/g," ").replace(/\s+/g," ").trim();
}
function imprimir(){
  var tituloAntigo=document.title;
  document.title=tituloPdf();
  var restaurar=function(){ document.title=tituloAntigo; window.removeEventListener("afterprint",restaurar); };
  window.addEventListener("afterprint",restaurar);
  setTimeout(restaurar,120000);
  if(avisoImpressao){
    avisoImpressao=false;
    alert("Na janela de impressão que vai abrir:\n\n1. Destino: Salvar como PDF\n2. Margens: Padrão\n3. Desmarque \u201cCabeçalhos e rodapés\u201d\n4. Marque \u201cGráficos de segundo plano\u201d\n\nSem esses dois últimos ajustes a capa sai branca e aparece a data e o endereço do arquivo no topo.");
  }
  window.print();
}

function irParaApp(id){
  var a=APPS.filter(function(x){return x.id===id;})[0];
  if(!a||!a.ativo) return;
  if(a.url){
    registrar("abriu sistema",a.nome,"");
    location.href=a.url;
    return;
  }
  S.app=id; S.tab="preencher";
  try{ localStorage.setItem("aw_app",id); }catch(e){}
  render();
}
function irParaHub(){
  S.app=null;
  try{ localStorage.removeItem("aw_app"); }catch(e){}
  render();
}
function viewHub(){

function iconeOlho(aberto){
  var base='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
  if(aberto){
    return base+'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line x1="3.5" y1="3.5" x2="20.5" y2="20.5"/></svg>';
  }
  return base+'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
}
function verSenha(){
  var i=document.getElementById("lgSenha"), b=document.getElementById("lgOlho");
  if(!i) return;
  var mostrar=(i.type==="password");
  i.type=mostrar?"text":"password";
  b.innerHTML=iconeOlho(mostrar);
  b.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha");
  b.setAttribute("title",mostrar?"Ocultar senha":"Mostrar senha");
  i.focus();
}
function viewLogin(erro){
  return '<div class="auth">'+
    '<div class="auth-side">'+
      '<img src="'+LOGO_BRANCO+'" alt="Adami Wealth">'+
      '<div class="auth-say"><div class="rule"></div>'+
        '<h2>Apoiando famílias, planejando o futuro</h2>'+
        '<p>Ambiente administrativo da Adami Wealth. Carteiras, planejamento e relatórios em um só lugar.</p>'+
      '</div>'+
      '<div class="auth-meta"><span>Acesso restrito</span><span>'+VERSAO+'</span></div>'+
      '<div class="auth-copy">&copy; '+new Date().getFullYear()+' Adami Wealth. Todos os direitos reservados.</div>'+
    '</div>'+
    '<div class="auth-form"><div class="auth-card">'+
      '<div class="rule"></div>'+
      '<h1>Admin Adami Wealth</h1>'+
      '<p class="hint">Entre com o e-mail cadastrado pela empresa.</p>'+
      (erro?'<div class="erro">'+esc(erro)+'</div>':'')+
      '<label for="lgEmail">E-mail</label>'+
      '<div class="campo"><input type="email" id="lgEmail" autocomplete="username" placeholder="nome@adamiwealth.com.br"></div>'+
      '<label for="lgSenha">Senha</label>'+
      '<div class="campo"><input type="password" id="lgSenha" autocomplete="current-password" placeholder="••••••••">'+
        '<button type="button" class="olho" id="lgOlho" onclick="verSenha()" aria-label="Mostrar senha" title="Mostrar senha">'+iconeOlho(false)+'</button></div>'+
      '<button class="entrar" id="lgBtn" onclick="fazerLogin()">Entrar</button>'+
      '<p class="pe">Esqueceu a senha ou precisa de acesso? Fale com o administrador do sistema.</p>'+
    '</div></div>'+
  '</div>';
}
function fazerLogin(){
  var e=document.getElementById("lgEmail").value.trim();
  var p=document.getElementById("lgSenha").value;
  if(!e||!p){ document.getElementById("view").innerHTML=viewLogin("Preencha e-mail e senha."); return; }
  var b=document.getElementById("lgBtn"); b.disabled=true; b.textContent="Entrando…";
  entrar(e,p).then(function(){
    return carregar().then(function(){
      if(db.clientes.length) S.cliente=db.clientes[0].id;
      S.app=null; S.tab="preencher"; montarRascunho(); render();
      registrar("entrou","","");
      backupAutomatico();
    });
  }).catch(function(err){
    document.getElementById("view").innerHTML=viewLogin(err.message);
  });
}
function render(){
  var logado=!!(SESSAO&&SESSAO.access_token);
  document.querySelector(".rail").style.display=logado?"":"none";
  document.querySelector(".topbar").style.display=logado?"":"none";
  if(!logado){
    document.querySelector(".main").style.margin="0";
    document.querySelector(".main").style.padding="0";
    document.getElementById("view").innerHTML=viewLogin(null);
    setTimeout(function(){
      var i=document.getElementById("lgEmail"); if(i) i.focus();
      ["lgEmail","lgSenha"].forEach(function(id){
        var el=document.getElementById(id);
        if(el) el.addEventListener("keydown",function(ev){ if(ev.key==="Enter") fazerLogin(); });
      });
    },30);
    return;
  }
  if(!S.app){
    document.querySelector(".rail").style.display="none";
    document.querySelector(".topbar").style.display="none";
    document.querySelector(".main").style.margin="0";
    document.querySelector(".main").style.padding="0";
    document.getElementById("view").innerHTML=viewHub();
    return;
  }
  document.querySelector(".main").style.margin="";
  document.querySelector(".main").style.padding="";
  var rb=document.getElementById("railBrand");
  if(rb&&!rb.querySelector("img")) rb.insertAdjacentHTML("afterbegin",'<img src="'+LOGO_BRANCO+'" alt="Adami Wealth">');
  renderRail();
  var ru=document.getElementById("railUser"); if(ru) ru.textContent=SESSAO.email||"";
  document.getElementById("tabP").className=S.tab==="preencher"?"on":"";
  document.getElementById("tabC").className=S.tab==="carta"?"on":"";
  document.getElementById("tabR").className=S.tab==="relatorio"?"on":"";
  document.getElementById("tabH").className=S.tab==="historico"?"on":"";
  document.getElementById("btnPdf").style.display=S.tab==="relatorio"?"":"none";
  document.getElementById("btnChk").style.display=S.tab==="relatorio"?"":"none";
  document.getElementById("view").innerHTML=
    S.tab==="preencher"?viewPreencher():
    (S.tab==="carta"?viewCarta():
    (S.tab==="historico"?viewHistorico():viewRelatorio()));
  window.scrollTo(0,0);
}

if(SESSAO&&SESSAO.access_token){
  carregar().then(function(){
    if(db.clientes.length) S.cliente=db.clientes[0].id;
    montarRascunho(); render();
    backupAutomatico();
  });
}else{
  render();
}
