<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adami Wealth - Gestão de Investimentos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
        }

        .header h1 {
            max-width: 1200px;
            margin: 0 auto;
            font-size: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .controls label {
            display: block;
            font-size: 12px;
            color: #666;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .controls select, .controls input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 12px 30px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:hover {
            background: #0f2847;
        }

        .capa {
            background: #1e3c72;
            color: white;
            padding: 60px 40px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 40px;
        }

        .capa h1 {
            font-size: 40px;
            margin: 20px 0;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .kpi {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-top: 3px solid #1e3c72;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .kpi-label {
            font-size: 11px;
            color: #999;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 24px;
            font-weight: bold;
            color: #1e3c72;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        thead {
            background: #f9f9f9;
            border-bottom: 2px solid #1e3c72;
        }

        th {
            padding: 12px;
            text-align: left;
            color: #1e3c72;
            font-weight: bold;
            font-size: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }

        h2 {
            color: #1e3c72;
            margin-bottom: 15px;
            margin-top: 30px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .info {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #1e3c72;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏛️ Adami Wealth - Gestão de Investimentos</h1>
    </div>

    <div class="container">
        <div class="controls">
            <div>
                <label>Cliente</label>
                <select id="cliente">
                    <option value="">Carregando clientes...</option>
                </select>
            </div>
            <div>
                <label>Mês</label>
                <select id="mes">
                    <option value="">Selecione um mês...</option>
                    <option value="Janeiro">Janeiro</option>
                    <option value="Fevereiro">Fevereiro</option>
                    <option value="Março">Março</option>
                    <option value="Abril">Abril</option>
                    <option value="Maio">Maio</option>
                    <option value="Junho">Junho</option>
                    <option value="Julho">Julho</option>
                    <option value="Agosto">Agosto</option>
                    <option value="Setembro">Setembro</option>
                    <option value="Outubro">Outubro</option>
                    <option value="Novembro">Novembro</option>
                    <option value="Dezembro">Dezembro</option>
                </select>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button onclick="gerarRelatorio()">📊 Gerar Relatório</button>
            </div>
        </div>

        <div id="relatorio"></div>
    </div>

    <script>
        let SHEET_ID = localStorage.getItem('SHEET_ID') || '';
        const API_KEY = 'AIzaSyAkIcwSALXa5MsJz90sI_f6gG5pz-6fNJQ';
        let dadosSheet = [];

        async function carregarDados() {
            if (!SHEET_ID) {
                document.getElementById('relatorio').innerHTML = `
                    <div class="info">
                        <strong>📋 Como usar:</strong><br>
                        1. Crie um Google Sheet com abas por cliente<br>
                        2. Preencha as colunas: Mês | Conta | Instituição | Saldo | Rend % | Rend R$<br>
                        3. Publique o sheet (File → Share → Anyone with the link)<br>
                        4. Copie o Sheet ID da URL (entre /d/ e /edit)<br>
                        5. Cole aqui:
                        <br><br>
                        <input type="text" id="sheetId" placeholder="Cole o Google Sheet ID aqui">
                        <button onclick="salvarSheetId()">Conectar Google Sheet</button>
                    </div>
                `;
                return;
            }

            try {
                const url = \`https://sheets.googleapis.com/v4/spreadsheets/\${SHEET_ID}?key=\${API_KEY}&includeGridData=true\`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error('Sheet ID inválido ou sheet não é público');
                }

                processarDados(data);
                preencherClientes();
            } catch (error) {
                document.getElementById('relatorio').innerHTML = \`
                    <div class="error">
                        ⚠️ Erro ao carregar dados: \${error.message}<br>
                        <button onclick="resetarSheetId()" style="margin-top: 10px;">🔄 Tentar outro Sheet ID</button>
                    </div>
                \`;
            }
        }

        function salvarSheetId() {
            const id = document.getElementById('sheetId').value.trim();
            if (id) {
                localStorage.setItem('SHEET_ID', id);
                SHEET_ID = id;
                location.reload();
            }
        }

        function resetarSheetId() {
            localStorage.removeItem('SHEET_ID');
            SHEET_ID = '';
            location.reload();
        }

        function processarDados(data) {
            dadosSheet = [];
            const sheets = data.sheets || [];
            
            sheets.forEach(sheet => {
                const nomeCliente = sheet.properties.title;
                if (!sheet.data || !sheet.data[0]) return;
                
                const grid = sheet.data[0];
                const rows = grid.rowData || [];
                if (rows.length < 2) return;
                
                const headers = [];
                if (rows[0].values) {
                    rows[0].values.forEach(cell => {
                        headers.push(cell.userEnteredValue?.stringValue || '');
                    });
                }
                
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].values) continue;
                    const rowData = {};
                    rows[i].values.forEach((cell, idx) => {
                        const value = cell.userEnteredValue?.stringValue || 
                                    cell.userEnteredValue?.numberValue || '';
                        rowData[headers[idx]] = value;
                    });
                    
                    if (rowData.Mês) {
                        rowData.Cliente = nomeCliente;
                        dadosSheet.push(rowData);
                    }
                }
            });
        }

        function preencherClientes() {
            const clientes = [...new Set(dadosSheet.map(d => d.Cliente))];
            const select = document.getElementById('cliente');
            select.innerHTML = '<option value="">Selecione um cliente...</option>';
            
            clientes.forEach(cliente => {
                const option = document.createElement('option');
                option.value = cliente;
                option.textContent = cliente;
                select.appendChild(option);
            });
        }

        function gerarRelatorio() {
            const cliente = document.getElementById('cliente').value;
            const mes = document.getElementById('mes').value;
            
            if (!cliente || !mes) {
                document.getElementById('relatorio').innerHTML = 
                    '<div class="error">⚠️ Selecione cliente e mês!</div>';
                return;
            }
            
            const dados = dadosSheet.filter(d => d.Cliente === cliente && d.Mês === mes);
            
            if (dados.length === 0) {
                document.getElementById('relatorio').innerHTML = 
                    '<div class="error">⚠️ Nenhum dado encontrado para este cliente e mês!</div>';
                return;
            }
            
            const plTotal = dados.reduce((sum, d) => sum + (parseFloat(d.Saldo) || 0), 0);
            const rendTotal = dados.reduce((sum, d) => sum + (parseFloat(d['Rend R$']) || 0), 0);
            const rendPct = plTotal > 0 ? (rendTotal / plTotal) * 100 : 0;
            
            let html = \`
                <div class="capa">
                    <p>Relatório</p>
                    <h1>Relatório Consolidado de Investimentos</h1>
                    <p>\${cliente}</p>
                    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.3); margin: 30px 0;">
                    <p>\${mes} 2025</p>
                    <p style="margin-top: 60px; font-size: 12px;">🏛️ ADAMI WEALTH</p>
                </div>
                
                <div class="kpis">
                    <div class="kpi">
                        <div class="kpi-label">Patrimônio</div>
                        <div class="kpi-value">R$ \${(plTotal / 1000000).toFixed(2)}M</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Rentabilidade</div>
                        <div class="kpi-value">\${rendPct.toFixed(2)}%</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-label">Resultado</div>
                        <div class="kpi-value">R$ \${rendTotal.toLocaleString('pt-BR')}</div>
                    </div>
                </div>
                
                <h2>Contas</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Conta</th>
                            <th>Instituição</th>
                            <th style="text-align: right;">Saldo</th>
                            <th style="text-align: right;">Rend %</th>
                            <th style="text-align: right;">Rend R$</th>
                        </tr>
                    </thead>
                    <tbody>
            \`;
            
            dados.forEach(d => {
                html += \`
                    <tr>
                        <td>\${d.Conta || '-'}</td>
                        <td>\${d.Instituição || '-'}</td>
                        <td style="text-align: right;">R$ \${parseFloat(d.Saldo || 0).toLocaleString('pt-BR')}</td>
                        <td style="text-align: right;">\${d['Rend %'] || '-'}%</td>
                        <td style="text-align: right;">R$ \${parseFloat(d['Rend R$'] || 0).toLocaleString('pt-BR')}</td>
                    </tr>
                \`;
            });
            
            html += \`
                    </tbody>
                </table>
                <div class="btn-group">
                    <button onclick="alert('📥 PDF - Em breve!')">📥 Baixar PDF</button>
                </div>
            \`;
            
            document.getElementById('relatorio').innerHTML = html;
        }

        window.addEventListener('load', carregarDados);
    </script>
</body>
</html>
