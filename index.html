<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>Adami Wealth — Consolidado de Carteiras</title>
<style>
:root{
  --navy:#1B3A5F; --navy-d:#132B47; --ink:#16324F; --ink-2:#3C4C60; --muted:#7A8698;
  --paper:#EDF0F4; --surface:#FFFFFF; --line:#DCE2EA; --line-2:#EDF1F5;
  --gold:#C0A265; --gold-2:#D9C79B; --blue-2:#3D6D9E; --blue-3:#7FA0C4; --blue-4:#A9C0D8;
  --green:#0A7344; --alert:#A03A2B;
  --display:"Iowan Old Style",Constantia,Cambria,"Palatino Linotype",Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"Courier New",monospace;
  --rail:280px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button{font-family:inherit;font-size:13px;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
table{border-collapse:collapse;width:100%}
input,select,textarea{font-family:inherit;font-size:13px}

/* ---------- rail ---------- */
.rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);background:var(--navy-d);color:#C7D3E0;padding:22px 18px;overflow-y:auto}
.rail-brand{font-family:var(--display);font-size:19px;color:#fff;line-height:1.2}
.rail-brand img{width:150px;max-width:100%;height:auto;display:block;margin-bottom:2px}
.rail-brand span{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-3);margin-top:7px}
.rail-block{margin-top:24px}
.rail-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#7A8DA3;margin-bottom:9px}
.rail select{width:100%;background:#16283C;color:#EAF1EF;border:1px solid #27394F;border-radius:3px;padding:8px 9px}
.cli-list{margin:0;padding:0;list-style:none}
.cli-list li{padding:9px 10px;border-radius:3px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cli-list li:hover{background:#1B2E44}
.cli-list li.on{background:var(--navy);color:#fff}
.cli-list li b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-list li i{font-style:normal;font-size:11px;color:#8AA8C6;font-family:var(--mono)}
.rail button{width:100%;background:#1B2E44;color:#DCE7F1;border:1px solid #2B3F57;border-radius:3px;padding:9px;margin-top:8px}
.rail button:hover{background:#22374F}
.rail .mini{font-size:11.5px;color:#7A8DA3;margin-top:14px;line-height:1.5}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8AA8C6;margin-top:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.err{background:var(--alert)} .dot.wait{background:var(--gold)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:24px}
.login{background:#fff;border-radius:4px;padding:44px 40px;width:100%;max-width:390px;box-shadow:0 18px 60px rgba(0,0,0,.28)}
.login .brand{text-align:center;margin-bottom:30px}
.login .brand img{width:180px;max-width:80%;height:auto;display:block;margin:0 auto}
.login label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.login input{width:100%;border:1px solid var(--line);border-radius:3px;padding:11px 12px;margin-bottom:16px;font-size:14px}
.login input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 2px #EBF1F8}
.login button{width:100%;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:12px;font-weight:600;letter-spacing:.02em}
.login button:hover{background:var(--navy-d)}
.login button[disabled]{opacity:.6}
.login .erro{background:#FBEDEB;color:var(--alert);font-size:12.5px;padding:10px 12px;border-radius:3px;margin-bottom:16px}
.login .campo{position:relative}
.login .campo input{padding-right:52px}
.login .olho{position:absolute;right:1px;top:1px;height:41px;width:44px;border:0;background:transparent;
  color:var(--muted);padding:0;display:flex;align-items:center;justify-content:center}
.login .olho:hover{color:var(--navy);background:transparent}
.login .olho svg{width:19px;height:19px;display:block}
.login .pe{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.6}
.rail-user{font-size:11.5px;color:#8AA8C6;margin-top:10px;overflow:hidden;text-overflow:ellipsis}

/* ---------- portal ---------- */
.hub{min-height:100vh;background:var(--navy);color:#fff;padding:0}
.hub-top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:26px 40px;border-bottom:1px solid #24405F;flex-wrap:wrap}
.hub-top img{height:30px;width:auto}
.hub-top .sai{background:transparent;border:1px solid #35516F;color:#C3D2E2;border-radius:3px;padding:8px 16px}
.hub-top .sai:hover{background:#1B3A5F;color:#fff}
.hub-body{max-width:1040px;margin:0 auto;padding:64px 40px 80px}
.hub-hi{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#8AA8C6}
.hub-body h1{font-family:var(--display);font-size:38px;font-weight:500;margin:14px 0 8px;line-height:1.2}
.hub-body .sub{color:#A9C0D8;font-size:14.5px;max-width:44em}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px;margin-top:44px}
.app{background:#17324F;border:1px solid #27455F;border-radius:5px;padding:26px 24px 22px;
  text-align:left;color:#fff;display:flex;flex-direction:column;gap:9px;min-height:172px;
  transition:transform .12s ease,border-color .12s ease,background .12s ease}
.app.on{cursor:pointer}
.app.on:hover{background:#1C3C5D;border-color:var(--gold);transform:translateY(-2px)}
.app .ic{width:34px;height:34px;color:var(--gold-2);margin-bottom:4px}
.app .ic svg{width:100%;height:100%;display:block}
.app b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em}
.app span{font-size:12.8px;color:#A9C0D8;line-height:1.55}
.app .tag{margin-top:auto;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.app.off{opacity:.5;cursor:default}
.app.off .tag{color:#7C93AB}
.hub-foot{max-width:1040px;margin:0 auto;padding:0 40px 50px;color:#6E88A4;font-size:11.5px}
.voltar{background:transparent;border:1px solid var(--line);color:var(--ink-2);border-radius:3px;padding:9px 14px}
.voltar:hover{background:#F6F8FA}
@media(max-width:640px){ .hub-body{padding:40px 22px 60px} .hub-body h1{font-size:29px} .hub-top{padding:20px 22px} }

/* ---------- main ---------- */
.main{margin-left:var(--rail);padding:26px 30px 70px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:#DFE5EC;padding:3px;border-radius:4px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:3px;color:var(--ink-2);font-weight:500}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:3px}
.btn:hover{background:#F6F8FA}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-d)}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;margin-bottom:18px}
.sec-title{font-family:var(--display);font-size:17px;color:var(--navy);margin-bottom:4px}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.inp{width:100%;border:1px solid var(--line);border-radius:3px;padding:6px 7px;background:#fff}
.inp:focus{outline:0;border-color:var(--blue-2);box-shadow:0 0 0 2px #EBF1F8}
.inp.num{text-align:right;font-family:var(--mono)}
textarea.inp{min-height:150px;line-height:1.6;resize:vertical}
.grid-ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.grid-ind label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.xbtn{border:0;background:transparent;color:var(--alert);font-size:15px;padding:2px 6px}
.note{background:#EBF1F8;border-left:3px solid var(--blue-2);padding:12px 14px;font-size:12.5px;color:var(--ink-2);border-radius:0 3px 3px 0;margin-bottom:16px}
.note.err{background:#FBEDEB;border-left-color:var(--alert)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--navy);margin-bottom:8px}
.form th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.form td{padding:7px 8px;border-bottom:1px solid var(--line-2);font-size:13px}
.form tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:#F7F9FB;font-family:var(--mono)}
.num{text-align:right}

/* ---------- editor da carta ---------- */
.tb{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;padding:7px;background:#F7F9FB}
.tb button{border:1px solid transparent;background:transparent;border-radius:3px;padding:6px 10px;color:var(--ink-2);min-width:34px}
.tb button:hover{background:#fff;border-color:var(--line)}
.tb .sep{width:1px;background:var(--line);margin:2px 4px}
.tb select{border:1px solid var(--line);border-radius:3px;padding:5px 7px;background:#fff}
.ed{border:1px solid var(--line);border-radius:0 0 3px 3px;padding:22px 24px;min-height:320px;background:#fff;
    font-size:13.5px;line-height:1.75;color:var(--ink-2);overflow-wrap:anywhere}
.ed:focus{outline:0;border-color:var(--blue-2);box-shadow:0 0 0 2px #EBF1F8}
.ed:empty:before{content:attr(data-ph);color:#AAB4C0}
.ed p{margin:0 0 12px}
.ed h3{font-family:var(--display);font-size:17px;color:var(--navy);margin:18px 0 10px}
.ed img{max-width:100%;height:auto;display:block;margin:14px 0;border-radius:2px}
.ed ul,.ed ol{margin:0 0 12px;padding-left:22px}
.salvo{font-size:12.5px;color:var(--muted)}

/* ================= RELATÓRIO ================= */
.doc{max-width:880px;margin:0 auto}
.pg td,.pg th,.pg p,.pg .dn-rows div{overflow-wrap:anywhere}
.pg{background:#fff;border:1px solid var(--line);border-radius:2px;padding:52px 56px 40px;margin-bottom:22px;position:relative;min-height:560px}
.pg-mark{position:absolute;top:34px;right:52px;text-align:right;line-height:1}
.pg-mark img{height:26px;width:auto;display:block;margin-left:auto}
.pg-num{position:absolute;bottom:18px;right:56px;font-size:10.5px;color:var(--muted)}

/* capa */
.cover{background:var(--navy);border:0;padding:96px 62px 62px;min-height:820px;display:flex;flex-direction:column}
.cover .eyebrow{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:#93AECB}
.cover h1{font-family:var(--display);font-size:40px;line-height:1.18;color:#fff;font-weight:600;margin:16px 0 0;max-width:9.5em}
.cover .cli{font-size:15px;color:#C3D2E2;margin-top:36px}
.cover .rule{width:76px;height:1px;background:#6C86A3;margin:18px 0 22px}
.cover .ref{font-size:13px;color:#C3D2E2}
.cover .mark{margin-top:auto;text-align:center}
.cover .mark img{width:210px;max-width:56%;height:auto;display:block;margin:0 auto}
.cover .foot{text-align:center;font-size:9.5px;letter-spacing:.34em;color:#93AECB;margin-top:54px}

/* cabeçalho de seção */
.shead{display:flex;align-items:baseline;gap:11px;border-bottom:2px solid var(--navy);padding-bottom:7px;margin:34px 0 18px}
.shead:first-of-type{margin-top:0}
.shead .n{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.06em}
.shead h2{font-family:var(--display);font-size:21px;color:var(--navy);font-weight:600}
.shead .cap{margin-left:auto;font-size:11px;color:var(--muted)}
.dash{display:flex;align-items:baseline;gap:11px;border-bottom:2px solid var(--navy);padding-bottom:7px;margin-bottom:20px}
.dash i{font-style:normal;color:var(--gold)}
.dash h2{font-family:var(--display);font-size:22px;color:var(--navy)}

/* cabeçalho do cliente */
.rep-eyebrow{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.rep-name{font-family:var(--display);font-size:29px;color:var(--navy);margin-top:6px;font-weight:600}
.rep-ref{font-size:12.5px;color:var(--muted);margin-top:2px}

/* patrimônio + kpis */
.pat{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin-top:20px;text-align:center}
.pat .l{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.pat .v{font-family:var(--mono);font-size:34px;color:var(--navy);letter-spacing:.03em;margin:9px 0 4px}
.pat .s{font-size:11.5px;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;border-bottom:3px solid var(--navy)}
.kbox{padding:18px 0 16px}
.kbox:nth-child(odd){border-right:1px solid var(--line);padding-right:22px}
.kbox:nth-child(even){padding-left:22px}
.kbox:nth-child(1),.kbox:nth-child(2){border-bottom:1px solid var(--line)}
.kbox .l{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.kbox .v{font-family:var(--mono);font-size:21px;color:var(--navy);margin:7px 0 3px}
.kbox .s{font-size:11.5px;color:var(--muted)}
.kbox .v.pos{color:var(--green)} .kbox .v.neg{color:var(--alert)}

/* blocos */
.panel{border:1px solid var(--line);border-radius:3px;padding:22px;background:#fff}
.panel.tint{background:#FAFBFD}
.rt{width:100%}
.rt th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.rt td{padding:11px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.rt td.n,.rt th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rt tr.tot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600;background:#F7F9FB}
.rt tr.tot td:first-child{font-family:var(--body)}
.foot-note{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:14px}

/* donut */
.dn{display:block;margin:0 auto}
.dn-total{font-size:11.5px;color:var(--muted);margin-top:6px}
.dn-total b{font-family:var(--mono);color:var(--navy);font-weight:400;font-size:13px}
.rt.compact th{padding:8px 6px;font-size:9.5px;letter-spacing:.06em}
.rt.compact td{padding:8px 6px;font-size:11px}
.rt.compact tr.ano td{font-weight:600;background:#F4F7FA}
.rt.compact tr.ano td:first-child{font-family:var(--display);font-size:13px;color:var(--navy)}
.rt.compact tr.sep td{border-bottom:1px solid var(--line)}
.rt.compact td:first-child,.rt.compact th:first-child{white-space:nowrap}
.dn-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin:18px 0 6px;font-size:11.5px;color:var(--ink-2)}
.dn-leg span{display:inline-flex;align-items:center;gap:6px}
.dn-leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.dn-rows{margin-top:14px}
.dn-rows div{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.dn-rows b{font-weight:400;font-family:var(--mono)}

/* carta */
.carta{border:1px solid var(--line);border-radius:3px;padding:32px 34px;background:#fff}
.carta h3{font-size:13.5px;color:var(--navy);margin-bottom:12px}
.carta .sub{font-style:italic;color:var(--ink-2);font-size:13px;margin-bottom:16px}
.carta p{margin:0 0 13px;font-size:12.8px;line-height:1.72;color:var(--ink-2);text-align:justify;overflow-wrap:anywhere;word-break:break-word}
.carta .sig{margin-top:20px;font-size:12.5px;color:var(--ink-2)}
.carta img{max-width:100%;height:auto;display:block;margin:14px auto;border-radius:2px}
.carta h3.tit{font-family:var(--display);font-size:16px;color:var(--navy);margin:16px 0 9px;text-align:left}
.carta ul,.carta ol{margin:0 0 13px;padding-left:22px;font-size:12.8px;line-height:1.72;color:var(--ink-2)}
.carta b,.carta strong{color:var(--ink)}

.disc p{font-size:11.6px;color:var(--ink-2);line-height:1.72;margin:0 0 13px;text-align:justify}

@media print{
  .rail,.topbar,.no-print{display:none!important}
  html,body{background:#fff;width:100%}
  .main{margin:0;padding:0}
  .doc{max-width:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:0}
  .pg{border:0;margin:0;padding:15mm 14mm 12mm;min-height:0;border-radius:0;
      break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg-mark{top:13mm;right:14mm}
  .pg-num{bottom:8mm;right:14mm}
  /* capa sangrando na folha inteira */
  .cover{margin:0;padding:46mm 22mm 20mm;height:297mm;border-radius:0;
         background:var(--navy)!important;display:flex;flex-direction:column}
  .cover h1{font-size:30pt}
  /* manter título junto do bloco e evitar sobras */
  .shead,.dash{break-after:avoid;page-break-after:avoid;margin:16px 0 11px}
  .panel,.carta,.rt,.kgrid,.pat{break-inside:avoid}
  .panel{padding:14px}
  .panel svg{max-height:46mm;width:auto;max-width:100%}
  .dn{max-height:42mm}
  .pat{padding:14px 0;margin-top:14px}
  .pat .v{font-size:26px}
  .kbox{padding:12px 0 10px}
  .kbox .v{font-size:18px}
  .rep-name{font-size:24px}
  .rt.compact td,.rt.compact th{padding:5px 4px;font-size:8.5pt}
  .rt td,.rt th{padding:6px 8px;font-size:11.5px}
  .dn-rows div{padding:6px 4px}
  .foot-note{margin-top:10px}
}
@media screen and (max-width:900px){
  :root{--rail:0px}
  .rail{position:static;width:auto;bottom:auto}
  .main{margin:0;padding:18px}
  .pg{padding:30px 22px}
  .pg-mark{display:none}
  .kgrid{grid-template-columns:1fr}
  .kbox{border-right:0!important;padding:16px 0!important;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>

<nav class="rail">
  <div class="rail-brand" id="railBrand"><span>Consolidado de carteiras</span></div>
  <div class="rail-block">
    <div class="rail-label">Clientes</div>
    <ul class="cli-list" id="cliList"></ul>
    <button onclick="novoCliente()">+ Novo cliente</button>
  </div>
  <div class="rail-block">
    <div class="rail-label">Mês de referência</div>
    <select id="selMes" onchange="mudarRef()"></select>
    <select id="selAno" onchange="mudarRef()" style="margin-top:8px"></select>
  </div>
  <div class="rail-block">
    <div class="rail-label">Dados</div>
    <button onclick="recarregar()">Atualizar da nuvem</button>
    <button onclick="exportar()">Baixar backup (.json)</button>
    <button onclick="sair()">Sair da conta</button>
    <div class="rail-user" id="railUser"></div>
    <div class="rail-user" style="opacity:.6">versão 14</div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Conectando…</span></div>
    <div class="mini">Os dados ficam no servidor. Qualquer assessor que abrir este link vê as mesmas carteiras.</div>
  </div>
</nav>

<main class="main">
  <div class="topbar">
    <button class="voltar" onclick="irParaHub()" title="Voltar ao início">&#8592; Início</button>
    <div class="tabs">
      <button id="tabP" class="on" onclick="setTab('preencher')">Preencher</button>
      <button id="tabC" onclick="setTab('carta')">Carta do mês</button>
      <button id="tabR" onclick="setTab('relatorio')">Relatório</button>
      <button id="tabH" onclick="setTab('historico')">Histórico</button>

try{ SESSAO=JSON.parse(localStorage.getItem("aw_sessao")||"null"); }catch(e){}

function guardarSessao(d){
  SESSAO={access_token:d.access_token,refresh_token:d.refresh_token,email:(d.user&&d.user.email)||""};
  try{ localStorage.setItem("aw_sessao",JSON.stringify(SESSAO)); }catch(e){}
}
function limparSessao(){
  SESSAO=null;
  try{ localStorage.removeItem("aw_sessao"); }catch(e){}
}
function entrar(email,senha){
  return fetch(SB_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:senha})
  }).then(function(res){
    return res.json().then(function(d){
      if(!res.ok) throw new Error(d.error_description||d.msg||d.message||"E-mail ou senha incorretos.");
      guardarSessao(d);
    });
  });
}
function renovar(){
  if(!SESSAO||!SESSAO.refresh_token) return Promise.reject(new Error("sem sessão"));
  return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:SESSAO.refresh_token})
  }).then(function(res){
    if(!res.ok) throw new Error("sessão expirada");
    return res.json().then(guardarSessao);
  });
}
function sair(){
  if(!confirm("Sair da conta?")) return;
  var tk=SESSAO&&SESSAO.access_token;

}
function api(path,opts,jaTentou){
  opts=opts||{};
  var tk=(SESSAO&&SESSAO.access_token)||SB_KEY;
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"};
  if(opts.prefer) h["Prefer"]=opts.prefer;
  return fetch(SB_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(res){
      if(res.status===401&&SESSAO&&!jaTentou){
        return renovar().then(function(){ return api(path,opts,true); })
          .catch(function(){ limparSessao(); render(); throw new Error("Sua sessão expirou. Entre novamente."); });
      }
      if(!res.ok) return res.text().then(function(t){ throw new Error(t||("HTTP "+res.status)); });
      return res.status===204?null:res.json();
    });
}

var ESTRAT=[["pos","Pós-fixado"],["infl","Inflação"],["pre","Pré-fixado"],["ma","Retorno Absoluto (MM)"],["rv","Renda Variável"],["intl","Internacional"],["alt","Alternativo"]];
var IND=[["cdi","CDI"],["ipca","IPCA"],["ibov","Ibovespa"],["sp500","S&P 500"],["poup","Poupança"],["dolar","Dólar"],["ouro","Ouro"],["ifix","IFIX"]];
var db={clientes:[],dados:{},cartas:{}};
var S={cliente:null,mes:new Date().getMonth()+1,ano:new Date().getFullYear(),tab:"preencher",rasc:null,erro:null,app:null};

function chave(id,mes,ano){ return id+"|"+ano+"-"+String(mes).padStart(2,"0"); }
function chaveCarta(mes,ano){ return ano+"-"+String(mes).padStart(2,"0"); }
function cartaDoMes(mes,ano){ return (db.cartas&&db.cartas[chaveCarta(mes,ano)])||""; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function n(v){ var x=parseFloat(String(v).replace(",",".")); return isNaN(x)?0:x; }
function brl(v){ return "R$ "+Math.round(v||0).toLocaleString("pt-BR"); }
function brl2(v){ return "R$ "+(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function brlC(v){ var a=Math.abs(v||0); if(a>=1e6) return "R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi"; if(a>=1e3) return "R$ "+(v/1e3).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mil"; return brl(v); }
function pct(v,d){ d=d==null?2:d; return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%"; }
function sinal(v){ return v>0?"pos":(v<0?"neg":""); }
function ref(m,a){ return MESES_C[m-1]+"/"+String(a).slice(2); }
function moedaParse(str){
  var t=String(str==null?"":str).replace(/\./g,"").replace(",",".").replace(/[^0-9.\-]/g,"");
  var v=parseFloat(t); return isNaN(v)?0:v;
}
function moedaFmt(v){
  if(!v) return "";
  return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});
}
function onMoeda(el,cb){
  var bruto=el.value, fim=(el.selectionStart===bruto.length);
  var v=moedaParse(bruto);
  cb(v);
  var f=/,\d{0,2}$/.test(bruto)?bruto.replace(/[^0-9.,]/g,""):moedaFmt(v);
  el.value=f;
  if(fim){ try{ el.selectionStart=el.selectionEnd=el.value.length; }catch(e){} }
}
function contaVazia(){ return {nome:"",inst:"",saldo:0,apl:0,res:0,rendPct:0,rendRs:0}; }
function indVazio(){ var o={}; IND.forEach(function(p){o[p[0]]=0;}); o.carta=""; o.vencimentos=[]; o.estrategias={}; ESTRAT.forEach(function(e){o.estrategias[e[0]]=0;}); return o; }
function listaEstrat(ind){
  var e=(ind&&ind.estrategias)||{};
  return ESTRAT.map(function(x){ return {nome:x[1],pc:n(e[x[0]])}; }).filter(function(x){ return x.pc>0; });
}
function vencVazio(){ return {ativo:"",inst:"",taxa:"",data:"",valor:0}; }
function listaVenc(ind){
  var v=(ind&&ind.vencimentos)||[];
  return v.filter(function(x){ return (x.ativo||"").trim()||n(x.valor)||x.data; })
          .sort(function(a,b){ return (a.data||"9999").localeCompare(b.data||"9999"); });
}
function dataBR(d){
  if(!d) return "—";
  var p=String(d).split("-");
  return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d;
}
function reg(id,mes,ano){ return db.dados[chave(id,mes,ano)]||null; }
function anterior(mes,ano){ return mes===1?{mes:12,ano:ano-1}:{mes:mes-1,ano:ano}; }
function cli(){ var id=S.cliente; return db.clientes.filter(function(c){return c.id===id;})[0]||null; }

/* ============ carga ============ */
function carregar(){
  status("wait","Carregando…");
  return Promise.all([
    api("clientes?select=id,nome&order=nome.asc"),
    api("lancamentos?select=cliente_id,mes,ano,contas,indicadores"),
    api("cartas?select=mes,ano,conteudo").catch(function(){ return []; })
  ]).then(function(r){
    db.clientes=r[0]||[];
    db.dados={};
    (r[1]||[]).forEach(function(l){
      db.dados[chave(l.cliente_id,l.mes,l.ano)]={contas:l.contas||[],ind:l.indicadores||indVazio()};
    });
    db.cartas={};
    (r[2]||[]).forEach(function(k){ db.cartas[chaveCarta(k.mes,k.ano)]=k.conteudo||""; });
    S.erro=null; status("ok","Sincronizado");
  }).catch(function(e){ S.erro=e.message; status("err","Sem conexão"); });
}
function recarregar(){
  var atual=S.cliente;
  carregar().then(function(){
    var existe=db.clientes.some(function(c){return c.id===atual;});
    S.cliente=existe?atual:(db.clientes.length?db.clientes[0].id:null);
    montarRascunho(); render();
  });
}
function montarRascunho(){
  var id=S.cliente; if(!id){S.rasc=null;return;}
  var r=reg(id,S.mes,S.ano);
  if(r){ S.rasc=JSON.parse(JSON.stringify(r)); if(!S.rasc.ind) S.rasc.ind=indVazio(); S.rasc._herdado=false; return; }
  var p=anterior(S.mes,S.ano),ant=null,t=0;
  while(t<24&&!ant){ ant=reg(id,p.mes,p.ano); if(!ant)p=anterior(p.mes,p.ano); t++; }
  if(ant){
    S.rasc={_herdado:true,contas:ant.contas.map(function(c){return {nome:c.nome,inst:c.inst,saldo:n(c.saldo),apl:0,res:0,rendPct:0,rendRs:0};}),ind:indVazio()};
  }else{
    S.rasc={_herdado:false,contas:[contaVazia(),contaVazia()],ind:indVazio()};
  }
}

/* ============ cálculos ============ */
/* saldo de abertura de uma conta = saldo final - rendimento - aplicações + resgates */
function abertura(c){
  var b=n(c.saldo)-n(c.rendRs)-n(c.apl)+n(c.res);
  return b>0?b:n(c.saldo);
}
function totais(r){
  if(!r) return {pl:0,rendRs:0,rendPct:0,apl:0,res:0,base:0};
  var pl=0,rs=0,apl=0,res=0,peso=0,pond=0;
  r.contas.forEach(function(c){
    pl+=n(c.saldo); rs+=n(c.rendRs); apl+=n(c.apl); res+=n(c.res);
    var b=abertura(c);
    if(b>0){ peso+=b; pond+=n(c.rendPct)*b; }
  });
  return {pl:pl,rendRs:rs,rendPct:peso>0?pond/peso:0,apl:apl,res:res,base:peso};
}
function serieAno(id,ano,ateMes){
  var out=[],lim=ateMes||12;
  for(var m=1;m<=lim;m++){ var r=reg(id,m,ano); if(!r) continue; var t=totais(r);
    out.push({mes:m,ano:ano,pl:t.pl,rendPct:t.rendPct,rendRs:t.rendRs,apl:t.apl,res:t.res,cdi:n(r.ind&&r.ind.cdi)}); }
  return out;
}
function comp(vals){ var f=1; vals.forEach(function(v){ f*=(1+v/100); }); return (f-1)*100; }
/* rentabilidade composta de uma conta nos últimos N meses até (mes/ano) */
function contaAcum(id,nome,mes,ano,nMeses){
  var vals=[],p={mes:mes,ano:ano};
  for(var i=0;i<nMeses;i++){
    var r=reg(id,p.mes,p.ano);
    if(r){ r.contas.forEach(function(c){ if((c.nome||"")===nome) vals.unshift(n(c.rendPct)); }); }
    p=anterior(p.mes,p.ano);
  }
  return vals.length?comp(vals):null;
}
function porInstituicao(r){
  var map={},tot=0;
  r.contas.forEach(function(c){
    var k=((c.inst||"").trim())||"Sem instituição";
    if(!map[k]) map[k]={nome:k,valor:0,rendRs:0};
    map[k].valor+=n(c.saldo); map[k].rendRs+=n(c.rendRs); tot+=n(c.saldo);
  });
  return Object.keys(map).map(function(k){var o=map[k];o.pc=tot>0?o.valor/tot*100:0;return o;}).sort(function(a,b){return b.valor-a.valor;});
}

function inserirImagem(inp){
  var f=inp.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ alert("Imagem muito grande. Use um arquivo de até 8 MB."); inp.value=""; return; }
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=900, esc2=Math.min(1,max/img.width);
      var cv=document.createElement("canvas");
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      var dados=cv.toDataURL("image/jpeg",0.82);
      document.getElementById("edCarta").focus();
      document.execCommand("insertImage",false,dados);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
  inp.value="";
}

function backupAutomatico(){
  return api("backups?select=quando&order=quando.desc&limit=1").then(function(r){
    var ultimo=(r&&r[0])?new Date(r[0].quando):null;
    var horas=ultimo?(Date.now()-ultimo.getTime())/36e5:999;
    if(horas<24) return null;
    return api("backups",{method:"POST",prefer:"return=minimal",
      body:{usuario:(SESSAO&&SESSAO.email)||"",conteudo:{clientes:db.clientes,dados:db.dados,cartas:db.cartas}}})
      .then(function(){ return limparBackupsAntigos(); });
  }).catch(function(){ return null; });
}
function limparBackupsAntigos(){
  return api("backups?select=id&order=quando.desc").then(function(r){
    if(!r||r.length<=30) return null;
    var velhos=r.slice(30).map(function(x){return x.id;});
    return api("backups?id=in.("+velhos.join(",")+")",{method:"DELETE"});
  }).catch(function(){ return null; });
}
function listarBackups(){

function restaurarBackup(id,rotulo){
  if(!confirm("Restaurar a cópia de "+rotulo+"?\n\nTudo o que foi lançado depois dessa data será substituído. Esta ação não pode ser desfeita.")) return;
  status("wait","Restaurando…");
  api("backups?id=eq."+id+"&select=conteudo").then(function(r){
    if(!r||!r[0]) throw new Error("Cópia não encontrada.");
    var b=r[0].conteudo;
    var fila=[];
    (b.clientes||[]).forEach(function(c){
      fila.push(api("clientes?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:{id:c.id,nome:c.nome}}));
    });
    Object.keys(b.dados||{}).forEach(function(k){
      var partes=k.split("|"), cid=partes[0], ano=parseInt(partes[1].slice(0,4),10), mes=parseInt(partes[1].slice(5,7),10);
      var d=b.dados[k];
      fila.push(api("lancamentos?on_conflict=cliente_id,mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{cliente_id:cid,mes:mes,ano:ano,contas:d.contas||[],indicadores:d.ind||{}}}));
    });
    Object.keys(b.cartas||{}).forEach(function(k){
      fila.push(api("cartas?on_conflict=mes,ano",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",
        body:{mes:parseInt(k.slice(5,7),10),ano:parseInt(k.slice(0,4),10),conteudo:b.cartas[k]}}));
    });
    return Promise.all(fila);
  }).then(function(){
    return registrar("restaurou backup","",rotulo);
  }).then(function(){
    return carregar();
  }).then(function(){
    S.cliente=db.clientes.length?db.clientes[0].id:null;
    montarRascunho(); render();
    alert("Cópia restaurada.");
  }).catch(falha);
}

/* ============ gráficos ============ */
function eixoY(max,H,pt,pb,W,fmt){
  var out="",linhas=5;
  for(var i=0;i<linhas;i++){
    var v=max*i/(linhas-1), y=H-pb-(v/max)*(H-pt-pb);
    out+='<line x1="52" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#EDF1F5"/>'+
         '<text x="46" y="'+(y+3)+'" text-anchor="end" font-size="8.5" fill="#9AA6B5" font-family="Segoe UI, Arial, sans-serif">'+fmt(v)+'</text>';
  }
  return out;
}
function chartCarteiraCdi(serie){
  if(!serie.length) return '<p class="foot-note">Sem histórico no ano.</p>';
  var W=Math.max(420,serie.length*74+70),H=210,pt=16,pb=30;
  var max=Math.max.apply(null,serie.map(function(s){return Math.max(s.rendPct,s.cdi);}));
  if(max<=0) max=1; max=max*1.15;
  var slot=(W-62)/serie.length,bw=Math.min(19,slot/3.2),out=eixoY(max,H,pt,pb,W,function(v){return pct(v,2);});
  serie.forEach(function(s,i){
    var cx=52+i*slot+slot/2;
    [[s.rendPct,"#1B3A5F",-1],[s.cdi,"#C0A265",1]].forEach(function(p){
      var hh=Math.max(0,(p[0]/max)*(H-pt-pb)),x=cx+(p[2]<0?-bw-2:2),y=H-pb-hh;
      out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="'+p[1]+'"/>';
    });
    out+='<text x="'+cx+'" y="'+(H-11)+'" text-anchor="middle" font-size="9" fill="#7A8698">'+ref(s.mes,s.ano)+'</text>';
  });
  out+='<line x1="52" y1="'+(H-pb)+'" x2="'+(W-8)+'" y2="'+(H-pb)+'" stroke="#DCE2EA"/>';
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;display:block;margin:0 auto">'+out+'</svg></div>'+
         '<div class="dn-leg" style="margin-top:14px"><span><i style="background:#1B3A5F"></i>Rendimento da carteira</span><span><i style="background:#C0A265"></i>CDI</span></div>';
}
function pizza(items){
  var R=88,cx=100,cy=100,ang=-Math.PI/2,out="";
  var tot=items.reduce(function(a,b){return a+b.valor;},0);
  if(tot<=0) return "";
  if(items.length===1){
    out='<circle cx="100" cy="100" r="88" fill="'+CORES[0]+'"/>';
  }else{
    items.forEach(function(it,i){
      var a2=ang+(it.valor/tot)*Math.PI*2,big=(a2-ang)>Math.PI?1:0;
      var x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      out+='<path d="M'+cx+' '+cy+' L'+x1+' '+y1+' A'+R+' '+R+' 0 '+big+' 1 '+x2+' '+y2+' Z" fill="'+CORES[i%CORES.length]+'" stroke="#fff" stroke-width="1.5"/>';
      ang=a2;
    });
  }
  return '<svg class="dn" viewBox="0 0 200 200" width="210" height="210">'+out+'</svg>';
}
function chartEvolucao(serie){
  if(!serie.length) return "";
  var W=Math.max(420,serie.length*84+70),H=210,pt=24,pb=30;
  var max=Math.max.apply(null,serie.map(function(s){return s.pl;}))*1.12||1;
  var slot=(W-62)/serie.length,bw=Math.min(62,slot-26);
  var out=eixoY(max,H,pt,pb,W,function(v){return brlC(v);});
  serie.forEach(function(s,i){
    var hh=(s.pl/max)*(H-pt-pb),x=52+i*slot+(slot-bw)/2,y=H-pb-hh;
    out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="#1B3A5F"/>'+
         '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="9" fill="#3C4C60" font-family="Consolas, Menlo, monospace">'+brl(s.pl)+'</text>'+
         '<text x="'+(x+bw/2)+'" y="'+(H-11)+'" text-anchor="middle" font-size="9" fill="#7A8698">'+ref(s.mes,s.ano)+'</text>';
  });
  out+='<line x1="52" y1="'+(H-pb)+'" x2="'+(W-8)+'" y2="'+(H-pb)+'" stroke="#DCE2EA"/>';
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;display:block;margin:0 auto">'+out+'</svg></div>';
}

/* tabela de retornos por ano (carteira x CDI) */
function tabelaRetornos(id){
  var anos=[];
  Object.keys(db.dados).forEach(function(k){
    if(k.indexOf(id+"|")===0){
      var y=parseInt(k.split("|")[1].slice(0,4),10);
      if(anos.indexOf(y)<0) anos.push(y);
    }
  });
  anos.sort(function(a,b){return a-b;});
  var fc=1,fd=1,linhas=[];
  anos.forEach(function(y){
    var meses=[];
    for(var m=1;m<=12;m++){
      var r=reg(id,m,y);
      meses.push(r?{p:totais(r).rendPct,c:n(r.ind&&r.ind.cdi)}:null);
    }
    var vivos=meses.filter(function(x){return x;});
    var noAnoP=comp(vivos.map(function(x){return x.p;}));
    var noAnoC=comp(vivos.map(function(x){return x.c;}));
    fc*=(1+noAnoP/100); fd*=(1+noAnoC/100);
    linhas.push({ano:y,meses:meses,noAnoP:noAnoP,noAnoC:noAnoC,accP:(fc-1)*100,accC:(fd-1)*100});
  });
  return linhas.reverse();
}
function blocoRetornos(id){
  var linhas=tabelaRetornos(id);
  if(!linhas.length) return '<p class="foot-note">Sem histórico lançado.</p>';
  var cab='<tr><th>Retorno mensal (%)</th>'+
    MESES_C.map(function(m){return '<th class="n">'+m.charAt(0).toUpperCase()+m.slice(1)+'</th>';}).join("")+
    '<th class="n">No ano</th><th class="n">Acum.</th></tr>';
  var corpo=linhas.map(function(L){
    var cel=function(v,d){ return v==null?'<td class="n" style="color:#B7C0CB">–</td>':'<td class="n">'+pct(v,d==null?2:d)+'</td>'; };
    var r1='<tr class="ano"><td>'+L.ano+'</td>'+L.meses.map(function(x){return cel(x?x.p:null);}).join("")+
           cel(L.noAnoP)+cel(L.accP)+'</tr>';
    var r2='<tr><td>CDI</td>'+L.meses.map(function(x){return cel(x?x.c:null);}).join("")+
           cel(L.noAnoC)+cel(L.accC)+'</tr>';
    var r3='<tr class="sep"><td>% do CDI</td>'+L.meses.map(function(x){
             return (x&&x.c>0)?'<td class="n">'+pct(x.p/x.c*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>';
           }).join("")+
           (L.noAnoC>0?'<td class="n">'+pct(L.noAnoP/L.noAnoC*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>')+
           (L.accC>0?'<td class="n">'+pct(L.accP/L.accC*100,0)+'</td>':'<td class="n" style="color:#B7C0CB">–</td>')+'</tr>';
    return r1+r2+r3;
  }).join("");
  return '<div style="overflow-x:auto"><table class="rt compact"><thead>'+cab+'</thead><tbody>'+corpo+'</tbody></table></div>'+
    '<p class="foot-note">Rentabilidade da carteira ponderada pelo saldo de abertura de cada conta. “No ano” e “Acumulado” são compostos pelos meses lançados; o acumulado considera todo o histórico até o fim de cada ano.</p>';
}

       var mov=s2.apl-s2.res, ant=i>0?serie[i-1].pl:null;
       var varia=ant?((s2.pl-ant)/ant)*100:null;
       return '<tr><td>'+MESES[s2.mes-1]+'/'+String(s2.ano).slice(2)+'</td><td class="n">'+brl(s2.pl)+'</td>'+
       '<td class="n">'+(mov?brl(mov):"—")+'</td><td class="n '+sinal(s2.rendRs)+'">'+brl(s2.rendRs)+'</td>'+
       '<td class="n '+sinal(varia)+'">'+(varia!=null?pct(varia):"—")+'</td></tr>';
     }).join("")+
     '</tbody></table></div>';
  pag(p2);

  /* --- vencimentos (página própria quando houver) --- */
  var venc=listaVenc(r.ind);
  if(venc.length){
    pag(shead(nx(),"Próximos vencimentos","valores aproximados")+
      '<div class="panel"><table class="rt"><thead><tr><th>Ativo</th><th>Instituição</th><th>Taxa</th><th class="n">Vencimento</th><th class="n">Valor aproximado</th></tr></thead><tbody>'+
      venc.map(function(v){
        return '<tr><td>'+esc(v.ativo||"—")+'</td><td>'+esc(v.inst||"—")+'</td><td>'+esc(v.taxa||"—")+'</td>'+
        '<td class="n">'+dataBR(v.data)+'</td><td class="n">'+(n(v.valor)?brl(n(v.valor)):"—")+'</td></tr>';
      }).join("")+
      '<tr class="tot"><td colspan="4">Total</td><td class="n">'+brl(venc.reduce(function(a,v){return a+n(v.valor);},0))+'</td></tr>'+
      '</tbody></table><p class="foot-note">Valores estimados na data de referência, sujeitos a marcação a mercado e à incidência de tributos no resgate.</p></div>');
  }

  /* --- informações importantes --- */
  pag('<div class="dash"><i>—</i><h2>Informações importantes</h2></div>'+
     '<div class="panel disc">'+
     '<p>Este material foi preparado com finalidade exclusivamente informativa e não constitui oferta, recomendação individualizada de investimento, análise de valores mobiliários ou solicitação de compra ou venda de qualquer ativo.</p>'+
     '<p>As posições e os saldos aqui apresentados refletem as informações fornecidas pelas instituições custodiantes na data de referência e podem divergir dos extratos oficiais em razão de prazos de atualização, marcação a mercado, provisionamento de proventos e eventos societários. Em caso de divergência, prevalece sempre o extrato da instituição custodiante.</p>'+
     '<p>Rentabilidade passada não representa garantia de rentabilidade futura. Os valores são brutos, salvo indicação em contrário, e não consideram a incidência de tributos, taxas de saída, come-cotas ou custos de transação que podem reduzir o resultado efetivo do investidor.</p>'+
     '<p>Investimentos envolvem riscos, inclusive de perda do capital investido. Produtos de renda fixa emitidos por instituições financeiras contam com a cobertura do Fundo Garantidor de Créditos nos limites e condições previstos em seu regulamento; demais ativos não contam com garantia do FGC nem do administrador. Leia atentamente os documentos de cada produto antes de investir.</p>'+
     '<p>Dúvidas sobre este relatório devem ser tratadas diretamente com o assessor responsável.</p>'+
     '</div>');

  /* --- montagem com numeração real --- */
  var total=PGS.length;
  PGS.forEach(function(P,i){
    if(P.capa){ h+='<div class="pg cover">'+P.html+'</div>'; }
    else { h+='<div class="pg">'+marca()+P.html+'<div class="pg-num">'+(i+1)+' de '+total+'</div></div>'; }
  });

  h+='</div>';
  return h;
}

var avisoImpressao=true;
function imprimir(){
  if(avisoImpressao){
    avisoImpressao=false;
    alert("Na janela de impressão que vai abrir:\n\n1. Destino: Salvar como PDF\n2. Margens: Padrão\n3. Desmarque \u201cCabeçalhos e rodapés\u201d\n4. Marque \u201cGráficos de segundo plano\u201d\n\nSem esses dois últimos ajustes a capa sai branca e aparece a data e o endereço do arquivo no topo.");
  }
  window.print();
}
/* ---------- portal de sistemas ---------- */
var VERSAO="versão 14";
var APPS=[
  {id:"carteiras",nome:"Carteiras",desc:"Lançamento mensal das carteiras e geração do relatório consolidado em PDF.",tag:"Disponível",ativo:true,
   ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7h18v13H3z"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>'},
  {id:"planos",nome:"Gerador de Planos Patrimoniais",desc:"Planos patrimoniais completos para clientes private.",tag:"Em breve",ativo:false,
   ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9.5 12h6M9.5 15.5h6M9.5 8.5h2.5"/></svg>'},
  {id:"diagnostico",nome:"Diagnóstico Patrimonial",desc:"Composição do patrimônio, projeções, estruturação, alavancagem e proteção.",tag:"Disponível",ativo:true,url:"diagnostico.html",
   ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3v18h18"/><path d="M7 15l4-5 3.5 3L21 6"/></svg>'},
  {id:"imobiliario",nome:"Relatório Imobiliário",desc:"Imóveis, projetos, histórico de retornos e apresentação para clientes private.",tag:"Disponível",ativo:true,url:"imobiliario.html",
   ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>'}
];
function irParaApp(id){
  var a=APPS.filter(function(x){return x.id===id;})[0];
  if(!a||!a.ativo) return;
  if(a.url){
    registrar("abriu sistema",a.nome,"");
    location.href=a.url;
    return;
  }
  S.app=id; S.tab="preencher";
  try{ localStorage.setItem("aw_app",id); }catch(e){}
  render();
}
function irParaHub(){
  S.app=null;
  try{ localStorage.removeItem("aw_app"); }catch(e){}
  render();
}
function viewHub(){
  var nome=((SESSAO&&SESSAO.email)||"").split("@")[0].split(/[._-]/)[0];
  nome=nome?nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase():"";
  var hora=new Date().getHours();
  var saud=hora<12?"Bom dia":(hora<18?"Boa tarde":"Boa noite");
  return '<div class="hub">'+
    '<div class="hub-top"><img src="'+LOGO_BRANCO+'" alt="Adami Wealth">'+
    '<button class="sai" onclick="sair()">Sair</button></div>'+
    '<div class="hub-body">'+
    '<div class="hub-hi">'+saud+(nome?", "+esc(nome):"")+'</div>'+
    '<h1>Sistemas Adami Wealth</h1>'+
    '<p class="sub">Escolha abaixo a ferramenta que deseja abrir.</p>'+
    '<div class="hub-grid">'+
    APPS.map(function(a){
      return '<div class="app '+(a.ativo?"on":"off")+'"'+(a.ativo?' onclick="irParaApp(\''+a.id+'\')"':'')+'>'+
        '<div class="ic">'+a.ic+'</div>'+
        '<b>'+esc(a.nome)+'</b><span>'+esc(a.desc)+'</span>'+
        '<div class="tag">'+esc(a.tag)+'</div></div>';
    }).join("")+
    '</div></div>'+
    '<div class="hub-foot">Acesso restrito aos colaboradores. Todas as ações ficam registradas. &nbsp;·&nbsp; '+VERSAO+'</div>'+
    '</div>';
}
function viewLogin(erro){
  return '<div class="login-wrap"><div class="login">'+
    '<div class="brand"><img src="'+LOGO_AZUL+'" alt="Adami Wealth"></div>'+
    (erro?'<div class="erro">'+esc(erro)+'</div>':'')+
    '<label>E-mail</label><input type="email" id="lgEmail" autocomplete="username" placeholder="seu@email.com">'+
    '<label>Senha</label><div class="campo"><input type="password" id="lgSenha" autocomplete="current-password" placeholder="••••••••">'+
    '<button type="button" class="olho" id="lgOlho" onclick="verSenha()" aria-label="Mostrar senha" title="Mostrar senha">'+iconeOlho(false)+'</button></div>'+
    '<button id="lgBtn" onclick="fazerLogin()">Entrar</button>'+
    '<div class="pe">Acesso restrito.<br>versão 14</div>'+
    '</div></div>';
}
function iconeOlho(aberto){
  var base='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
  if(aberto){
    return base+'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line x1="3.5" y1="3.5" x2="20.5" y2="20.5"/></svg>';
  }
  return base+'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
}
function verSenha(){
  var i=document.getElementById("lgSenha"), b=document.getElementById("lgOlho");
  if(!i) return;
  var mostrar=(i.type==="password");
  i.type=mostrar?"text":"password";
  b.innerHTML=iconeOlho(mostrar);
  b.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha");
  b.setAttribute("title",mostrar?"Ocultar senha":"Mostrar senha");
  i.focus();
}
function fazerLogin(){
  var e=document.getElementById("lgEmail").value.trim();
  var p=document.getElementById("lgSenha").value;
  if(!e||!p){ document.getElementById("view").innerHTML=viewLogin("Preencha e-mail e senha."); return; }
  var b=document.getElementById("lgBtn"); b.disabled=true; b.textContent="Entrando…";
  entrar(e,p).then(function(){
    return carregar().then(function(){
      if(db.clientes.length) S.cliente=db.clientes[0].id;
      S.app=null; S.tab="preencher"; montarRascunho(); render();
      registrar("entrou","","");
      backupAutomatico();
    });
  }).catch(function(err){
    document.getElementById("view").innerHTML=viewLogin(err.message);
  });
}
function render(){
  var logado=!!(SESSAO&&SESSAO.access_token);
  document.querySelector(".rail").style.display=logado?"":"none";
  document.querySelector(".topbar").style.display=logado?"":"none";
  if(!logado){
    document.querySelector(".main").style.margin="0";
    document.querySelector(".main").style.padding="0";
    document.getElementById("view").innerHTML=viewLogin(null);
    setTimeout(function(){
      var i=document.getElementById("lgEmail"); if(i) i.focus();
      ["lgEmail","lgSenha"].forEach(function(id){
        var el=document.getElementById(id);
        if(el) el.addEventListener("keydown",function(ev){ if(ev.key==="Enter") fazerLogin(); });
      });
    },30);
    return;
  }
  if(!S.app){
    document.querySelector(".rail").style.display="none";
    document.querySelector(".topbar").style.display="none";
    document.querySelector(".main").style.margin="0";
    document.querySelector(".main").style.padding="0";
    document.getElementById("view").innerHTML=viewHub();
    return;
  }
  document.querySelector(".main").style.margin="";
  document.querySelector(".main").style.padding="";
  var rb=document.getElementById("railBrand");
  if(rb&&!rb.querySelector("img")) rb.insertAdjacentHTML("afterbegin",'<img src="'+LOGO_BRANCO+'" alt="Adami Wealth">');
  renderRail();
  var ru=document.getElementById("railUser"); if(ru) ru.textContent=SESSAO.email||"";
  document.getElementById("tabP").className=S.tab==="preencher"?"on":"";
  document.getElementById("tabC").className=S.tab==="carta"?"on":"";
  document.getElementById("tabR").className=S.tab==="relatorio"?"on":"";
  document.getElementById("tabH").className=S.tab==="historico"?"on":"";
  document.getElementById("btnPdf").style.display=S.tab==="relatorio"?"":"none";
  document.getElementById("view").innerHTML=
    S.tab==="preencher"?viewPreencher():
    (S.tab==="carta"?viewCarta():
    (S.tab==="historico"?viewHistorico():viewRelatorio()));
  window.scrollTo(0,0);
}

if(SESSAO&&SESSAO.access_token){
  carregar().then(function(){
    if(db.clientes.length) S.cliente=db.clientes[0].id;
    montarRascunho(); render();
    backupAutomatico();
  });
}else{
  render();
}
</script>
