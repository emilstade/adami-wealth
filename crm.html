/* ================= KPI Dashboard ================= */
function monthKey(ts){ const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function lastMonths(n){
  const arr = []; const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    let label = d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    label = label.charAt(0).toUpperCase() + label.slice(1);
    arr.push({ key, label });
  }
  return arr;
}
function fmtBRLCompact(n){
  if(n >= 1000000) return 'R$ ' + (n/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'M';
  if(n >= 1000) return 'R$ ' + (n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'mil';
  return fmtBRL(n);
}
function fmtUSDCompact(n){
  if(n >= 1000000) return 'US$ ' + (n/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'M';
  if(n >= 1000) return 'US$ ' + (n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'mil';
  return fmtUSD(n);
}

/* Linha de análise. Duas alturas: identificação e número em cima, barra
   embaixo em largura cheia — o número deixa de disputar espaço com a barra.
   `meta` desenha a marca do alvo sobre a trilha, para o realizado ser lido
   contra o prazo em vez de isolado. */
/* Série mensal em SVG: área para o volume criado, linhas para os desfechos.
   Barras lado a lado obrigam a comparar alturas isoladas; a linha mostra a
   trajetória, que é a pergunta real de "como o mês passado se compara". */
function GraficoMensal({ meses, max }){
  if(!meses || meses.length === 0) return h('div',{className:'empty-kpi'},'Sem dados no período.');

  const L = 34, R = 14, T = 14, B = 26, W = 560, H = 190;
  const largura = W - L - R, altura = H - T - B;
  const passo = meses.length > 1 ? largura / (meses.length - 1) : 0;
  const x = (i) => L + i * passo;
  const y = (v) => T + altura - (max > 0 ? (v / max) * altura : 0);

  const linha = (campo) => meses.map((m, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(m[campo]).toFixed(1)).join(' ');
  const area = linha('criados') + ' L' + x(meses.length-1).toFixed(1) + ' ' + (T+altura)
    + ' L' + x(0).toFixed(1) + ' ' + (T+altura) + ' Z';

  /* Quatro linhas de grade bastam para situar a escala sem virar papel milimetrado. */
  const niveis = [0, 0.25, 0.5, 0.75, 1].map(f => ({ v: Math.round(max * f), y: y(max * f) }));

  const series = [
    { campo:'criados',  cor:'var(--primary)', nome:'Criados' },
    { campo:'ganhos',   cor:'var(--success)', nome:'Ganhos' },
    { campo:'perdidos', cor:'var(--danger)',  nome:'Perdidos' },
  ];

  return h('div',{className:'grafico-mensal'},
    h('svg',{ viewBox:'0 0 ' + W + ' ' + H, className:'grafico-svg',
      role:'img', 'aria-label':'Evolução mensal de negócios criados, ganhos e perdidos' },
      h('defs',null,
        h('linearGradient',{ id:'areaCriados', x1:'0', y1:'0', x2:'0', y2:'1' },
          h('stop',{offset:'0%', stopColor:'var(--primary)', stopOpacity:'.18'}),
          h('stop',{offset:'100%', stopColor:'var(--primary)', stopOpacity:'0'})
        )
      ),
      niveis.map((n, i) => h('g',{key:i},
        h('line',{ x1:L, y1:n.y, x2:W-R, y2:n.y, className:'grade' }),
        h('text',{ x:L-8, y:n.y+3.5, className:'grade-num', textAnchor:'end' }, n.v)
      )),
      h('path',{ d:area, fill:'url(#areaCriados)' }),
      series.map(se => h('path',{
        key:se.campo, d:linha(se.campo), fill:'none', stroke:se.cor,
        strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round',
        className:'grafico-linha',
      })),
      series.map(se => meses.map((m, i) => h('circle',{
        key:se.campo+i, cx:x(i), cy:y(m[se.campo]), r:3.2, fill:'#fff',
        stroke:se.cor, strokeWidth:2, className:'grafico-ponto',
      }))),
      meses.map((m, i) => h('text',{
        key:'r'+i, x:x(i), y:H-7, className:'grafico-mes', textAnchor:'middle',
      }, m.label))
    ),
    h('div',{className:'month-legend'},
      series.map(se => h('div',{key:se.campo, className:'month-legend-item'},
        h('span',{className:'month-legend-dot', style:{background:se.cor}}), se.nome))
    )
  );
}

function BarRow({ label, value, display, max, color, dotColor, posicao, secundario, meta, metaLabel, semDados }){
  /* Sem dado não se desenha barra: um toco colorido ao lado de "—" sugere
     um valor pequeno, quando o caso é ausência de informação. */
  if(semDados){
    return h('div',{className:'bar-row vazio'},
      h('div',{className:'bar-row-topo'},
        h('div',{className:'bar-row-label'},
          dotColor ? h('span',{className:'stage-dot', style:{background:dotColor}}) : null, label),
        h('div',{className:'bar-row-value'}, display)
      ),
      h('div',{className:'bar-track tracejada'})
    );
  }

  const pct = max > 0 ? Math.max(1.5, Math.min(100, (value/max)*100)) : 0;
  const metaPct = (meta && max > 0) ? Math.min(100, (meta/max)*100) : null;
  const passou = metaPct !== null && pct > metaPct;

  return h('div',{className:'bar-row'},
    h('div',{className:'bar-row-topo'},
      h('div',{className:'bar-row-label'},
        posicao ? h('span',{className:'bar-row-pos'}, String(posicao).padStart(2,'0')) : null,
        dotColor ? h('span',{className:'stage-dot', style:{background:dotColor}}) : null,
        h('span',{className:'bar-row-nome'}, label)
      ),
      h('div',{className:'bar-row-value'},
        h('span',{className:'bar-row-num'}, display),
        secundario ? h('span',{className:'bar-row-sec'}, secundario) : null
      )
    ),
    h('div',{className:'bar-track'},
      h('div',{className:'bar-fill', style:{width:pct+'%', background:color}}),
      metaPct !== null ? h('span',{
        className:'bar-meta' + (passou ? ' passou' : ''),
        style:{left:metaPct+'%'},
        title: metaLabel || 'Meta',
      }) : null
    ),
    metaLabel ? h('div',{className:'bar-row-meta-label'}, metaLabel) : null
  );
}

/* O mesmo recorte de período usado pelos indicadores e pela visão offshore.
   Estava embutido em computeAssessoriaStats; virou função quando um segundo
   cálculo passou a precisar dele — duas cópias divergiriam no primeiro ajuste. */
function dentroDoRecorte(filtros, quando){
  if(!filtros || !filtros.periodo || filtros.periodo === 'all') return true;
  if(!quando) return false;
  if(filtros.periodo === 'custom'){
    if(filtros.de && quando < new Date(filtros.de + 'T00:00:00').getTime()) return false;
    if(filtros.ate && quando > new Date(filtros.ate + 'T23:59:59').getTime()) return false;
    return true;
  }
  return quando >= inicioDoPeriodo(filtros.periodo);
}

/* ================= Indicadores da assessoria =================
   Perguntas diferentes das de venda: aqui interessa o tamanho e a composição
   da carteira, se a jornada está fluindo dentro dos SLAs e de onde vem
   patrimônio — não taxa de fechamento nem ticket. */
function computeAssessoriaStats(scopedLeads, users, filtros, cotacao){
  const ativos = scopedLeads.filter(l => !l.perdido);
  const patrimonio = (l) => parseValor(l.valorPotencial) || 0;
  const somar = (lista) => lista.reduce((acc, l) => acc + patrimonio(l), 0);

  /* Sob gestão passa a ser a soma das duas custódias. Sem cotação, o offshore
     não entra — e `offshoreConsolidado` conta essa verdade para a tela, em vez
     de deixar um total menor passar por completo. */
  const consolidado = (l) => valorEmCarteiraTotal(l, cotacao);
  const totalOnshore = ativos.reduce((acc,l) => acc + valorEmCarteira(l), 0);
  const totalOffshoreUsd = ativos.reduce((acc,l) => acc + valorEmCarteiraOffshore(l), 0);
  const totalOffshoreBrl = emReais(totalOffshoreUsd, cotacao);
  const totalCarteira = totalOnshore + (totalOffshoreBrl === null ? 0 : totalOffshoreBrl);
  /* Conta clientes, não centavos: o total soma tudo, mas "quantos têm
     offshore" não inclui quem só tem resíduo lá fora. */
  const comOffshore = ativos.filter(l => valorEmCarteiraOffshore(l) >= OFFSHORE_PISO_USD);
  const offshore = {
    usd: totalOffshoreUsd,
    brl: totalOffshoreBrl,
    consolidado: cotacaoValida(cotacao),
    clientes: comOffshore.length,
    participacao: totalCarteira > 0 && totalOffshoreBrl !== null ? totalOffshoreBrl / totalCarteira : 0,
  };

  /* Captação líquida: TODO dinheiro novo menos TODO dinheiro que saiu.
     Inclui o patrimônio que entra com um cliente recém-captado, não só os
     aportes de quem já era da casa — sem isso, captar um cliente de 2 mi
     não aparecia como captação, que é o contrário do nome do indicador.
     Respeita o período: uma movimentação de 2020 não pertence a "30 dias".

     O saldo de cliente da base NÃO é captação: o dinheiro já estava em casa
     quando ele entrou no CRM. Captação dele é o aporte novo — 250 mil sob
     gestão mais um aporte de 100 mil dão 350 mil de carteira e 100 mil de
     líquido naquele mês; no mês seguinte o líquido recomeça e a carteira
     continua 350. Contar o saldo inflava o indicador com a base inteira: a
     carga das 507 contas dava "captação" de R$ 686M. */
  const dentro = (quando) => dentroDoRecorte(filtros, quando);

  const fluxo = { aportes:0, retiradas:0, entradas:0, comRetirada:0 };
  ativos.forEach(l => {
    /* Patrimônio que entrou junto com o cliente, no momento em que ele
       passou a ser gerido. As duas custódias entram juntas: o cliente não
       chega em duas datas diferentes. */
    const entrada = entradaNaCarteira(l);
    if(entrada && dentro(entrada) && (l.esteira || 'novo') !== 'base'){
      fluxo.entradas += valorInicialEmCarteira(l) || 0;
      const offBrl = emReais(valorInicialOffshore(l) || 0, cotacao);
      if(offBrl !== null) fluxo.entradas += offBrl;
    }

    /* Só quem já é carteira. Movimentação lançada num cliente que ainda não
       foi captado é dinheiro que não está sob gestão: contá-la inflava a
       captação líquida sem mexer no total, e as duas têm de fechar. */
    if(!naCarteira(l)) return;

    let retirouNoPeriodo = false;
    ((l.movimentacoes) || []).forEach(m => {
      const v = parseValor(m.valor);
      if(v === null || !m.data) return;
      if(!dentro(new Date(m.data + 'T12:00:00').getTime())) return;
      /* Movimentação offshore é dólar. Sem cotação ela fica de fora da
         captação líquida — somar 25.000 dólares a reais daria um número que
         não existe em moeda nenhuma. */
      let valor = v;
      if(ehOffshore(m)){
        const convertido = emReais(v, cotacao);
        if(convertido === null) return;
        valor = convertido;
      }
      if(m.tipo === 'retirada'){ fluxo.retiradas += valor; retirouNoPeriodo = true; }
      else fluxo.aportes += valor;
    });
    /* Quem sacou é quem merece atenção do assessor. */
    if(retirouNoPeriodo) fluxo.comRetirada += 1;
  });
  fluxo.entrou = fluxo.entradas + fluxo.aportes;
  fluxo.liquido = fluxo.entrou - fluxo.retiradas;
  const emCaptacao = ativos.reduce((acc,l) => acc + valorEmCaptacao(l, cotacao), 0);
  /* Conta quem tem qualquer uma das duas custódias: um cliente com carteira
     só lá fora está sob gestão do mesmo jeito. Isso independe de haver
     cotação — é contagem de gente, não soma de dinheiro. */
  const sobGestao = ativos.filter(l => valorEmCarteira(l) > 0 || valorEmCarteiraOffshore(l) > 0).length;
  const semPatrimonio = ativos.filter(l =>
    parseValor(l.valorPotencial) === null && parseValor(l.valorOffshore) === null).length;

  const emCarteira = (lista) => lista.reduce((acc,l) => acc + consolidado(l), 0);
  const porSegmento = SEGMENTOS.map(sg => {
    const doSegmento = ativos.filter(l => l.segmento === sg.key);
    return { key: sg.key, faixa: sg.faixa, count: doSegmento.length, valor: emCarteira(doSegmento) };
  });

  const porEtapa = STAGES_ASSESSOR.map(st => {
    const naEtapa = ativos.filter(l => l.etapa === st.key);
    return { key: st.key, color: st.color, count: naEtapa.length, valor: somar(naEtapa) };
  });

  /* SLA por etapa: quantos estão dentro e quantos passaram do prazo. */
  const slaPorEtapa = Object.keys(SLA_DIAS).map(etapa => {
    const naEtapa = ativos.filter(l => l.etapa === etapa);
    const fora = naEtapa.filter(l => { const r = slaRestante(l); return r !== null && r < 0; });
    return { etapa, prazo: SLA_DIAS[etapa], total: naEtapa.length, fora: fora.length };
  });
  const slaEstourado = slaPorEtapa.reduce((acc, x) => acc + x.fora, 0);

  const porOrigem = ORIGENS.map(o => {
    const daOrigem = ativos.filter(l => l.origem === o);
    return { key: o, count: daOrigem.length, valor: emCarteira(daOrigem) };
  }).filter(x => x.count > 0).sort((a,b) => b.valor - a.valor);
  const semOrigem = ativos.filter(l => !l.origem).length;

  /* Tempo real entre reuniões, lido do histórico de movimentações. */
  const tempoEtapa = {};
  scopedLeads.forEach(l => {
    const hist = (l.historico || []).filter(x => x.de);
    hist.forEach((mov, i) => {
      const anterior = i === 0 ? (l.criadoEm || mov.data) : hist[i-1].data;
      const etapa = mov.de;
      if(!tempoEtapa[etapa]) tempoEtapa[etapa] = { total:0, count:0 };
      tempoEtapa[etapa].total += (mov.data - anterior);
      tempoEtapa[etapa].count += 1;
    });
  });
  const diasPorEtapa = STAGES_ASSESSOR.map(st => {
    const t = tempoEtapa[st.key];
    return { key: st.key, color: st.color, days: t ? (t.total/t.count)/86400000 : null,
             prazo: SLA_DIAS[st.key] || null };
  });

  const ranking = users
    .filter(u => scopedLeads.some(l => l.responsavelId === u.id))
    .map(u => {
      const carteira = ativos.filter(l => l.responsavelId === u.id);
      return { id:u.id, nome:u.nome, count:carteira.length, valor: emCarteira(carteira) };
    })
    .sort((a,b) => b.valor - a.valor);
  const rankingMax = Math.max(1, ...ranking.map(v => v.valor));

  const pj = ativos.filter(l => l.tipoPessoa === 'PJ').length;
  const daBase = ativos.filter(l => l.esteira === 'base').length;
  const onboardingIncompleto = ativos.filter(l => onboardingPendentes(l).length > 0).length;

  return { ativos, totalCarteira, totalOnshore, offshore, emCaptacao, sobGestao, semPatrimonio, fluxo,
           porSegmento, porEtapa, slaPorEtapa, slaEstourado,
           porOrigem, semOrigem, diasPorEtapa, ranking, rankingMax, pj, daBase, onboardingIncompleto };
}

/* ================= Em captação, por temperatura =================
   Tudo o que está em jogo na assessoria, de cliente novo ou da base, lido
   pela temperatura: quanto está quente, com quem, e o quê. Uma captação é o
   prospect ainda não efetivado ou o cliente da base com valor em
   negociação — o mesmo corte de valorEmCaptacao, para o total bater com o
   "Em captação" do topo do painel. Cliente da base sem valor negociado não
   entra: sem valor não há captação, só uma leitura de relacionamento.
   "Sem classificação" é um dos grupos e não um resto: é o que diz se a
   temperatura virou rotina. */
function computeCaptacaoTemperatura(scopedLeads, users, cotacao){
  const emJogo = scopedLeads.filter(l => !l.excluido && !l.perdido
    && (l.funil || 'assessor') !== 'especialista'
    && (clienteDaBase(l) ? valorCaptacaoNaMoeda(l) > 0 : !l.ganho));
  const chaveDe = (l) => temperaturaInfo(l.temperatura) ? l.temperatura : 'sem';
  /* Soma em reais: a captação offshore entra pela cotação, e sem ela fica
     fora — contada, listada em dólar, mas não somada. */
  const somar = (lista) => lista.reduce((a, l) => a + valorEmCaptacao(l, cotacao), 0);

  const porTemperatura = [...TEMPERATURAS.map(t => t.key), 'sem'].map(k => {
    const t = temperaturaInfo(k);
    const grupo = emJogo.filter(l => chaveDe(l) === k);
    return { key:k, label: t ? t.label : 'Sem classificação', cor: t ? t.cor : '#C9D1DC',
             count: grupo.length, novos: grupo.filter(l => !clienteDaBase(l)).length,
             base: grupo.filter(clienteDaBase).length, valor: somar(grupo) };
  });

  /* Maior valor em jogo primeiro; o quanto disso está quente vem ao lado. */
  const porAssessor = (users || []).map(u => {
    const deles = emJogo.filter(l => l.responsavelId === u.id);
    const quentes = deles.filter(l => chaveDe(l) === 'quente');
    return { id:u.id, nome:u.nome, total: deles.length, valor: somar(deles),
             quente: quentes.length, valorQuente: somar(quentes) };
  }).filter(x => x.total > 0)
    .sort((a, b) => b.valor - a.valor || b.valorQuente - a.valorQuente);

  /* Quentes primeiro, e dentro de cada temperatura o maior valor: é a ordem
     em que alguém liga para os clientes. */
  const ordem = { quente:0, morno:1, frio:2, sem:3 };
  const captacoes = emJogo
    .map(l => ({ id:l.id, lead:l, cliente: nomeCliente(l), responsavelId: l.responsavelId,
                 tipo: clienteDaBase(l) ? 'base' : 'novo',
                 custodia: clienteDaBase(l) ? custodiaCaptacao(l) : 'onshore',
                 temperatura: chaveDe(l), valor: valorEmCaptacao(l, cotacao), valorMoeda: valorCaptacaoNaMoeda(l) }))
    .sort((a, b) => ordem[a.temperatura] - ordem[b.temperatura] || b.valor - a.valor);

  const offshore = emJogo.filter(l => clienteDaBase(l) && custodiaCaptacao(l) === 'offshore');
  return { total: emJogo.length, valor: somar(emJogo),
           classificados: emJogo.filter(l => chaveDe(l) !== 'sem').length,
           porTemperatura, porAssessor, captacoes,
           offshore: { total: offshore.length, semCotacao: !cotacaoValida(cotacao),
                       usd: offshore.reduce((a, l) => a + valorCaptacaoNaMoeda(l), 0) } };
}

/* ================= A carteira do lado de fora =================
   Mesma base de clientes, outra pergunta: quanto o escritório administra no
   exterior, de quem, e como isso se move. Tudo em dólar — a conversão para
   real aparece só onde o número precisa conversar com a carteira onshore. */
function computeOffshore(scopedLeads, users, filtros, cotacao){
  const ativos = scopedLeads.filter(l => !l.perdido && (l.funil || 'assessor') !== 'especialista');
  /* Entra quem tem saldo lá fora e também quem tem valor declarado mas ainda
     não captado: some da soma, não da lista — é carteira em formação. */
  const comOffshore = ativos.filter(l => temOffshore(l));

  const totalUsd = ativos.reduce((acc,l) => acc + valorEmCarteiraOffshore(l), 0);
  const totalBrl = emReais(totalUsd, cotacao);
  const totalOnshore = ativos.reduce((acc,l) => acc + valorEmCarteira(l), 0);
  const consolidado = totalOnshore + (totalBrl === null ? 0 : totalBrl);
  const participacao = consolidado > 0 && totalBrl !== null ? totalBrl / consolidado : 0;

  const clientes = comOffshore.map(l => {
    const usd = valorEmCarteiraOffshore(l);
    const brl = emReais(usd, cotacao);
    const onshore = valorEmCarteira(l);
    const total = onshore + (brl === null ? 0 : brl);
    return {
      id: l.id, lead: l, cliente: nomeCliente(l),
      responsavelId: l.responsavelId, segmento: l.segmento,
      usd, brl, onshore, total,
      /* Quanto do patrimônio deste cliente está fora: é o que diz se ele é um
         cliente offshore com uma conta no Brasil, ou o contrário. */
      fatia: total > 0 && brl !== null ? brl / total : 0,
      emFormacao: usd === 0,
    };
  }).sort((a,b) => b.usd - a.usd);

  const porAssessor = users
    .filter(u => comOffshore.some(l => l.responsavelId === u.id))
    .map(u => {
      const carteira = comOffshore.filter(l => l.responsavelId === u.id);
      return { id:u.id, nome:u.nome, count:carteira.length,
               valor: carteira.reduce((a,l) => a + valorEmCarteiraOffshore(l), 0) };
    })
    .sort((a,b) => b.valor - a.valor);
  const porAssessorMax = Math.max(1, ...porAssessor.map(x => x.valor));

  const porSegmento = SEGMENTOS.map(sg => {
    const doSegmento = comOffshore.filter(l => l.segmento === sg.key);
    return { key: sg.key, count: doSegmento.length,
             valor: doSegmento.reduce((a,l) => a + valorEmCarteiraOffshore(l), 0) };
  });

  /* Extrato do escritório: as movimentações offshore de todo mundo numa
     linha do tempo só, dentro do período filtrado. */
  const movimentos = [];
  const fluxo = { aportes:0, retiradas:0 };
  ativos.forEach(l => {
    /* Mesmo corte do onshore: o extrato do escritório é o que se moveu DENTRO
       da carteira. Movimentação de quem ainda não entrou não pertence a ela. */
    if(!naCarteira(l)) return;
    ((l.movimentacoes) || []).filter(ehOffshore).forEach(m => {
      const v = parseValor(m.valor);
      if(v === null || !m.data) return;
      const quando = new Date(m.data + 'T12:00:00').getTime();
      if(!dentroDoRecorte(filtros, quando)) return;
      if(m.tipo === 'retirada') fluxo.retiradas += v; else fluxo.aportes += v;
      movimentos.push({ id: l.id + ':' + m.id, lead: l, cliente: nomeCliente(l),
                        tipo: m.tipo, valor: v, data: m.data, nota: m.nota, autor: m.autor });
    });
  });
  movimentos.sort((a,b) => (b.data || '').localeCompare(a.data || ''));
  fluxo.liquido = fluxo.aportes - fluxo.retiradas;

  return { ativos, clientes, totalUsd, totalBrl, totalOnshore, consolidado, participacao,
           porAssessor, porAssessorMax, porSegmento, movimentos, fluxo,
           temCotacao: cotacaoValida(cotacao),
           emFormacao: clientes.filter(c => c.emFormacao).length };
}

/* ================= Evolução da carteira =================
   Não guardamos fotografias mensais do patrimônio, mas a data em que cada
   cliente entrou sob gestão já está registrada: criação, para quem veio da
   base, e captação efetivada, para o cliente novo. Isso basta para
   reconstruir a curva acumulada mês a mês. */
function entradaNaCarteira(lead){
  /* Decide pelo que entrou, não pelo saldo de hoje. Gatilhar em
     valorEmCarteira criava um degrau: quem sacava tudo ficava com saldo zero,
     perdia a data de entrada e sobrava só a retirada no cálculo — um resgate
     integral de 1 mi virava captação líquida de -1 mi, enquanto resgatar
     999.999 dava +1. Cliente que entrou e saiu tem que dar líquido zero. */
  if(valorInicialEmCarteira(lead) === null) return null;
  if((lead.esteira || 'novo') === 'base') return lead.criadoEm || null;
  /* ganhoEm é a data certa da captação, mas registro antigo pode não tê-la.
     Sem alternativa o cliente contava no total da carteira e sumia da
     captação, inclusive com o período em "todo o período". */
  return lead.ganhoEm || lead.etapaDesde || lead.criadoEm || null;
}

/* Uma curva só, montada a partir de eventos datados: a entrada do cliente, os
   aportes e as retiradas. O que muda entre a carteira consolidada e a curva
   offshore é apenas de onde vem o valor inicial e quais movimentações contam —
   o resto do cálculo é idêntico, e duplicá-lo faria as duas divergirem no
   primeiro ajuste. */
function serieDeEventos(leads, quantosMeses, base, valorDaMov){
  const meses = lastMonths(quantosMeses || 6);

  const eventos = [];
  leads.forEach(l => {
    const inicial = base(l);
    const entrada = entradaNaCarteira(l);
    if(inicial === null) return;
    /* O saldo de quem veio da base entra na curva da carteira — é dinheiro
       sob gestão — mas não como captação nem como cliente novo no mês: ele
       já estava em casa. Sem essa distinção, o mês da carga mostraria a
       carteira inteira como "captado". */
    if(entrada) eventos.push({ quando: entrada, valor: inicial,
      tipo: (l.esteira || 'novo') === 'base' ? 'saldo' : 'entrada' });
    ((l.movimentacoes) || []).forEach(m => {
      if(!m.data) return;
      const valor = valorDaMov(m);
      if(valor === null) return;
      eventos.push({
        quando: new Date(m.data + 'T12:00:00').getTime(),
        valor: valor * sinalMov(m.tipo),
        tipo: m.tipo,
      });
    });
  });

  const clientesEntrada = leads
    .map(l => ({ quando: entradaNaCarteira(l), base: base(l) }))
    .filter(e => e.quando && e.base !== null);

  const serie = meses.map(m => {
    const [ano, mes] = m.key.split('-').map(Number);
    const limite = new Date(ano, mes, 1).getTime();
    const ate = eventos.filter(e => e.quando < limite);
    const doMes = eventos.filter(e => monthKey(e.quando) === m.key);
    const somar = (lista, filtro) => lista.filter(filtro).reduce((a,e) => a + e.valor, 0);
    return {
      ...m,
      carteira: Math.max(0, ate.reduce((a,e) => a + e.valor, 0)),
      clientes: clientesEntrada.filter(e => e.quando < limite).length,
      captado: somar(doMes, e => e.valor > 0 && e.tipo !== 'saldo'),
      retirado: Math.abs(somar(doMes, e => e.valor < 0)),
      novos: doMes.filter(e => e.tipo === 'entrada').length,
    };
  });

  const ultimo = serie[serie.length - 1] || { carteira:0 };
  const anterior = serie.length > 1 ? serie[serie.length - 2] : null;
  const variacao = (anterior && anterior.carteira > 0)
    ? ((ultimo.carteira - anterior.carteira) / anterior.carteira) * 100
    : null;

  return {
    serie,
    maxCarteira: Math.max(1, ...serie.map(x => x.carteira)),
    maxCaptado: Math.max(1, ...serie.map(x => Math.max(x.captado, x.retirado))),
    variacao,
  };
}

/* A carteira consolidada, em reais. Todo evento offshore entra convertido pela
   cotação de hoje, inclusive nos meses passados: é simplificação consciente —
   não guardamos cotação histórica, e reconstruir a curva com câmbios
   inventados seria pior do que assumir um câmbio só. Sem cotação, o offshore
   fica fora da curva, como em todo o resto do sistema. */
function computeEvolucaoCarteira(leads, quantosMeses, cotacao){
  const converter = (v) => emReais(v, cotacao);
  return serieDeEventos(leads, quantosMeses,
    (l) => {
      const base = valorInicialEmCarteira(l);
      if(base === null) return null;
      const off = converter(valorInicialOffshore(l) || 0);
      return base + (off === null ? 0 : off);
    },
    (m) => {
      const v = parseValor(m.valor);
      if(v === null) return null;
      return ehOffshore(m) ? converter(v) : v;
    });
}

/* A mesma curva, só do que está lá fora — e em dólar, sem depender de câmbio
   nenhum. É a leitura que a visão offshore e o painel do admin pedem: se a
   carteira no exterior cresceu, encolheu, ou só oscilou com o câmbio. */
function computeEvolucaoOffshore(leads, quantosMeses){
  return serieDeEventos(leads, quantosMeses,
    /* Toda a base é carteira e começa com offshore zero; a curva conta como
       cliente offshore só quem tem saldo ou movimentação lá fora — senão as
       507 contas entrariam no número de clientes da curva. */
    (l) => {
      const v = valorInicialOffshore(l);
      return (v === 0 && movimentacoesDe(l, 'offshore').length === 0) ? null : v;
    },
    (m) => ehOffshore(m) ? parseValor(m.valor) : null);
}

/* Curva acumulada com as entradas do mês ao pé. Duas grandezas no mesmo
   desenho: onde a carteira chegou e o que a alimentou. */
function GraficoCarteira({ dados, formato, cor, id, rotuloAcumulado, descricao }){
  const { serie, maxCarteira, maxCaptado, variacao } = dados;
  const fmt = formato || fmtBRLCompact;
  const tom = cor || 'var(--gold)';
  /* Id único por instância: dois gráficos na mesma página com o mesmo id de
     gradiente fazem o segundo pintar com o gradiente do primeiro. */
  const gradId = id || 'areaCarteira';
  if(!serie || serie.length === 0) return h('div',{className:'empty-kpi'},'Sem dados no período.');

  const L = 46, R = 16, T = 18, B = 58, W = 620, H = 236;
  const largura = W - L - R, altura = H - T - B;
  const passo = serie.length > 1 ? largura / (serie.length - 1) : 0;
  const x = (i) => L + i * passo;
  const y = (v) => T + altura - (maxCarteira > 0 ? (v / maxCarteira) * altura : 0);
  const larguraCol = Math.min(26, passo * 0.42);

  const linha = serie.map((m, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(m.carteira).toFixed(1)).join(' ');
  const area = linha + ' L' + x(serie.length-1).toFixed(1) + ' ' + (T+altura)
    + ' L' + x(0).toFixed(1) + ' ' + (T+altura) + ' Z';
  const niveis = [0, 0.5, 1].map(f => ({ v: maxCarteira * f, y: y(maxCarteira * f) }));

  return h('div',{className:'grafico-mensal'},
    variacao !== null ? h('div',{className:'carteira-variacao' + (variacao < 0 ? ' baixa' : '')},
      (variacao >= 0 ? '▲ ' : '▼ ') + Math.abs(variacao).toFixed(1) + '%',
      h('span',null,'em relação ao mês anterior')
    ) : null,
    h('svg',{ viewBox:'0 0 ' + W + ' ' + H, className:'grafico-svg',
      role:'img', 'aria-label': descricao || 'Evolução do patrimônio sob gestão nos últimos meses' },
      h('defs',null,
        h('linearGradient',{ id:gradId, x1:'0', y1:'0', x2:'0', y2:'1' },
          h('stop',{offset:'0%', stopColor:tom, stopOpacity:'.26'}),
          h('stop',{offset:'100%', stopColor:tom, stopOpacity:'0'})
        )
      ),
      niveis.map((n, i) => h('g',{key:i},
        h('line',{ x1:L, y1:n.y, x2:W-R, y2:n.y, className:'grade' }),
        h('text',{ x:L-8, y:n.y+3.5, className:'grade-num', textAnchor:'end' }, fmt(n.v))
      )),
      /* Colunas ao pé: entradas para cima, retiradas para baixo da mesma
         linha de base — o mês de saída fica visível de imediato. */
      serie.map((m, i) => {
        const escala = (v) => maxCaptado > 0 ? (v / maxCaptado) * (altura * 0.34) : 0;
        const base = T + altura;
        return h('g',{key:'c'+i},
          m.captado > 0 ? h('rect',{
            x:x(i) - larguraCol/2, y: base - escala(m.captado),
            width:larguraCol, height: escala(m.captado), rx:3,
            className:'carteira-col', style:{ animationDelay:(i*0.06)+'s' },
          }) : null,
          m.retirado > 0 ? h('rect',{
            x:x(i) - larguraCol/2, y: base,
            width:larguraCol, height: escala(m.retirado), rx:3,
            className:'carteira-col saida', style:{ animationDelay:(i*0.06)+'s' },
          }) : null
        );
      }),
      h('path',{ d:area, fill:'url(#' + gradId + ')' }),
      h('path',{ d:linha, fill:'none', stroke:tom, strokeWidth:2.5,
        strokeLinecap:'round', strokeLinejoin:'round', className:'grafico-linha' }),
      serie.map((m, i) => h('circle',{
        key:'p'+i, cx:x(i), cy:y(m.carteira), r:3.5, fill:'var(--surface)',
        stroke:tom, strokeWidth:2, className:'grafico-ponto',
      })),
      serie.map((m, i) => h('text',{
        key:'r'+i, x:x(i), y:H-9, className:'grafico-mes', textAnchor:'middle',
      }, m.label))
    ),
    h('div',{className:'month-legend'},
      h('div',{className:'month-legend-item'},
        h('span',{className:'month-legend-dot', style:{background:tom}}),
        rotuloAcumulado || 'Patrimônio sob gestão'),
      h('div',{className:'month-legend-item'},
        h('span',{className:'month-legend-dot', style:{background:'var(--primary)', opacity:.5}}), 'Entrou no mês'),
      h('div',{className:'month-legend-item'},
        h('span',{className:'month-legend-dot', style:{background:'var(--danger)', opacity:.5}}), 'Saiu no mês')
    )
  );
}

/* ================= Produção por produto e por especialista =================
   A pergunta da gestão é dupla: quanto cada produto está entregando, e quem
   dentro dele está entregando. Um número consolidado esconde a segunda. */
function computeProducaoStats(leads, users){
  const valorDe = (l) => parseValor(l.valorFechado) || parseValor(l.valorPotencial) || 0;

  const resumir = (lista) => {
    const ganhos = lista.filter(l => l.ganho);
    const perdidos = lista.filter(l => l.perdido);
    const abertos = lista.filter(l => !l.ganho && !l.perdido);
    const encerrados = ganhos.length + perdidos.length;
    return {
      total: lista.length,
      ganhos: ganhos.length,
      perdidos: perdidos.length,
      abertos: abertos.length,
      valorGanho: ganhos.reduce((a,l) => a + valorDe(l), 0),
      valorAberto: abertos.reduce((a,l) => a + valorDe(l), 0),
      /* null quando nada foi encerrado: 0% sugeriria fracasso, e o caso é
         "ainda não deu tempo". */
      conversao: encerrados > 0 ? Math.round((ganhos.length / encerrados) * 100) : null,
      ticket: ganhos.length > 0 ? ganhos.reduce((a,l) => a + valorDe(l), 0) / ganhos.length : null,
    };
  };

  const porProduto = PRODUTOS.map(p => ({
    produto: p, ...resumir(leads.filter(l => l.produto === p)),
  })).filter(x => x.total > 0);

  /* Um especialista pode atender mais de um produto: a linha é a dupla
     especialista + produto, senão os números se somam indevidamente. */
  const porEspecialista = [];
  PRODUTOS.forEach(p => {
    const doProduto = leads.filter(l => l.produto === p);
    const donos = Array.from(new Set(doProduto.map(l => l.responsavelId)));
    donos.forEach(id => {
      const u = users.find(x => x.id === id);
      porEspecialista.push({
        id: id + ':' + p, nome: (u && u.nome) || 'Sem responsável', produto: p,
        ...resumir(doProduto.filter(l => l.responsavelId === id)),
      });
    });
  });
  porEspecialista.sort((a,b) => b.valorGanho - a.valorGanho);

  const maxProduto = Math.max(1, ...porProduto.map(x => x.valorGanho));
  const maxEspecialista = Math.max(1, ...porEspecialista.map(x => x.valorGanho));

  return { porProduto, porEspecialista, maxProduto, maxEspecialista };
}

function computeKpiStats(scopedLeads, allLeads, users){
  const ativos = scopedLeads.filter(l => !l.perdido && !l.ganho);
  const ganhos = scopedLeads.filter(l => l.ganho);
  const perdidos = scopedLeads.filter(l => l.perdido);
  const valorPipeline = ativos.reduce((s,l) => s + (parseValor(l.valorPotencial)||0), 0);
  const valorGanho = ganhos.reduce((s,l) => s + (parseValor(l.valorFechado) ?? parseValor(l.valorPotencial) ?? 0), 0);
  const valorPerdido = perdidos.reduce((s,l) => s + (parseValor(l.valorPotencial)||0), 0);
  const decididos = ganhos.length + perdidos.length;
  const taxaConversao = decididos > 0 ? Math.round((ganhos.length/decididos)*100) : null;
  const ticketMedio = ganhos.length > 0 ? valorGanho/ganhos.length : null;

  const funnelStages = [...STAGES.map(s=>s.key), 'Fechado (venda)'];
  const funnelCounts = funnelStages.map(stage => {
    if(stage === 'Fechado (venda)') return scopedLeads.filter(l => l.ganho).length;
    return scopedLeads.filter(l => (l.historico||[]).some(h => h.para === stage)).length;
  });
  const funnelBase = scopedLeads.length;

  const stageTime = {};
  scopedLeads.forEach(lead => {
    const hist = (lead.historico||[]).slice().sort((a,b)=>a.data-b.data);
    for(let i=0;i<hist.length-1;i++){
      const stage = hist[i].para;
      const dur = hist[i+1].data - hist[i].data;
      if(!stageTime[stage]) stageTime[stage] = { total:0, count:0 };
      stageTime[stage].total += dur;
      stageTime[stage].count += 1;
    }
  });
  const avgStageDays = STAGES.map(s => {
    const t = stageTime[s.key];
    return { key: s.key, color: s.color, days: t ? (t.total/t.count)/86400000 : null };
  });

  const months = lastMonths(6);
  const monthly = months.map(m => ({
    ...m,
    criados: allLeads.filter(l => monthKey(l.criadoEm) === m.key).length,
    ganhos: allLeads.filter(l => l.ganhoEm && monthKey(l.ganhoEm) === m.key).length,
    perdidos: allLeads.filter(l => l.perdidoEm && monthKey(l.perdidoEm) === m.key).length,
  }));
  const monthlyMax = Math.max(1, ...monthly.flatMap(m => [m.criados, m.ganhos, m.perdidos]));

  const vendorRanking = users.filter(u=>u.role==='vendedor' || allLeads.some(l=>l.responsavelId===u.id)).map(u => {
    const own = allLeads.filter(l => l.responsavelId === u.id);
    const ownGanhos = own.filter(l=>l.ganho);
    const ownValor = ownGanhos.reduce((s,l)=> s + (parseValor(l.valorFechado) ?? parseValor(l.valorPotencial) ?? 0), 0);
    return { id:u.id, nome:u.nome, ativos: own.filter(l=>!l.perdido && !l.ganho).length, ganhos: ownGanhos.length, valor: ownValor };
  }).sort((a,b) => b.valor - a.valor);
  const vendorMax = Math.max(1, ...vendorRanking.map(v=>v.valor));

  return { ativos, ganhos, perdidos, valorPipeline, valorGanho, valorPerdido, taxaConversao, ticketMedio, funnelStages, funnelCounts, funnelBase, avgStageDays, monthly, monthlyMax, vendorRanking, vendorMax };
}

/* ================= PDF export (jsPDF) ================= */
const PDF_COLOR = {
  navy: [5,19,42], navy2: [12,34,70], blue: [25,90,180], gold: [176,138,46],
  success: [47,122,86], danger: [179,64,58], ink: [12,22,38], inkMuted: [92,107,127],
  inkFaint: [149,161,176], border: [226,230,237], bg: [244,246,249], white: [255,255,255],
  stageNovo: [138,151,168], stageR1: [74,127,201], stageR2: [25,90,180],
};

function generateKpiPdf(stats, meta){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 15;
  const contentW = pageW - margin*2;
  let y = 0;

  const setFill = (c) => doc.setFillColor(c[0],c[1],c[2]);
  const setText = (c) => doc.setTextColor(c[0],c[1],c[2]);
  const setDraw = (c) => doc.setDrawColor(c[0],c[1],c[2]);

  function ensureSpace(h){
    if(y + h > pageH - 18){
      doc.addPage();
      y = 20;
      setText(PDF_COLOR.inkFaint);
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text('Pipeline — Relatório de Indicadores Comerciais (continuação)', margin, 12);
    }
  }

  function drawHeader(){
    setFill(PDF_COLOR.navy); doc.rect(0,0,pageW,30,'F');
    setFill(PDF_COLOR.gold); doc.rect(0,30,pageW,1.4,'F');
    setText(PDF_COLOR.white); doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('PIPELINE', margin, 14);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); setText([170,190,220]);
    doc.text('CRM Comercial', margin, 20);

    y = 40;
    setText(PDF_COLOR.ink); doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text('Relatório de Indicadores Comerciais', margin, y);
    y += 7;
    setText(PDF_COLOR.inkMuted); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('Escopo: ' + meta.scopeLabel + '   ·   Gerado em ' + meta.generatedAt + '   ·   por ' + meta.generatedBy, margin, y);
    y += 5;
    setDraw(PDF_COLOR.border); doc.setLineWidth(0.3); doc.line(margin, y, pageW-margin, y);
    y += 9;
  }

  function sectionTitle(text, sub){
    ensureSpace(14);
    setText(PDF_COLOR.ink); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    doc.text(text, margin, y);
    if(sub){ setText(PDF_COLOR.inkFaint); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text(sub, pageW-margin, y, {align:'right'}); }
    y += 6;
  }

  function kpiTiles(tiles){
    const cols = 3, gap = 4;
    const tileW = (contentW - gap*(cols-1))/cols;
    const tileH = 22;
    ensureSpace(tileH*2 + gap*2);
    tiles.forEach((t,i) => {
      const col = i % cols, row = Math.floor(i/cols);
      const x = margin + col*(tileW+gap);
      const ty = y + row*(tileH+gap);
      setFill(t.fill || PDF_COLOR.white); setDraw(PDF_COLOR.border); doc.setLineWidth(0.25);
      doc.roundedRect(x, ty, tileW, tileH, 2, 2, t.fill ? 'F' : 'FD');
      setText(t.labelColor || PDF_COLOR.inkMuted); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      doc.text(t.label.toUpperCase(), x+4, ty+7);
      setText(t.numColor || PDF_COLOR.ink); doc.setFont('helvetica','bold'); doc.setFontSize(15);
      doc.text(String(t.value), x+4, ty+15.5);
      setText(t.subColor || PDF_COLOR.inkFaint); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      doc.text(t.sub || '', x+4, ty+19.5);
    });
    y += tileH*2 + gap + 8;
  }

  function barRows(rows, unit){
    const labelW = 42, valueW = 26;
    const trackW = contentW - labelW - valueW;
    rows.forEach(r => {
      ensureSpace(8);
      setText(PDF_COLOR.inkMuted); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
      doc.text(String(r.label).slice(0,26), margin, y+3.2);
      setFill(PDF_COLOR.bg); doc.roundedRect(margin+labelW, y, trackW, 3.6, 1, 1, 'F');
      const pct = r.max > 0 ? Math.max(0.02, r.value/r.max) : 0;
      setFill(r.color); doc.roundedRect(margin+labelW, y, Math.max(2, trackW*pct), 3.6, 1, 1, 'F');
      setText(PDF_COLOR.inkMuted); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(r.display, margin+labelW+trackW+valueW, y+3.2, {align:'right'});
      y += 8.5;
    });
    y += 4;
  }

  function monthlyChart(monthly, monthlyMax){
    ensureSpace(48);
    const chartH = 32, colW = contentW/monthly.length;
    const baseY = y + chartH;
    monthly.forEach((m,i) => {
      const cx = margin + i*colW + colW/2;
      const bars = [
        { v:m.criados, c:PDF_COLOR.blue },
        { v:m.ganhos, c:PDF_COLOR.success },
        { v:m.perdidos, c:PDF_COLOR.danger },
      ];
      bars.forEach((b,bi) => {
        const h = monthlyMax>0 ? (b.v/monthlyMax)*chartH : 0;
        setFill(b.c);
        doc.rect(cx - 6 + bi*4.2, baseY - h, 3.2, Math.max(0.3,h), 'F');
      });
      setText(PDF_COLOR.inkFaint); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      doc.text(m.label, cx, baseY+5, {align:'center'});
    });
    y = baseY + 11;
    const legend = [['Criados',PDF_COLOR.blue],['Ganhos',PDF_COLOR.success],['Perdidos',PDF_COLOR.danger]];
    let lx = margin;
    legend.forEach(([label,color]) => {
      setFill(color); doc.rect(lx, y-2.6, 2.6, 2.6, 'F');
      setText(PDF_COLOR.inkMuted); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(label, lx+4, y);
      lx += doc.getTextWidth(label) + 14;
    });
    y += 8;
  }

  const s = stats;
  drawHeader();

  sectionTitle('Visão geral');
  kpiTiles([
    { label:'Leads ativos', value:s.ativos.length, sub:fmtBRLCompact(s.valorPipeline)+' em pipeline', fill:PDF_COLOR.navy, labelColor:[170,190,220], numColor:PDF_COLOR.white, subColor:[170,190,220] },
    { label:'Vendas fechadas', value:s.ganhos.length, sub:fmtBRLCompact(s.valorGanho)+' faturados', numColor:PDF_COLOR.success },
    { label:'Negócios perdidos', value:s.perdidos.length, sub:fmtBRLCompact(s.valorPerdido)+' em perdas', numColor:PDF_COLOR.danger },
    { label:'Taxa de conversão', value:(s.taxaConversao===null?'—':s.taxaConversao+'%'), sub:'ganhos / (ganhos+perdidos)' },
    { label:'Ticket médio', value:(s.ticketMedio===null?'—':fmtBRLCompact(s.ticketMedio)), sub:'por venda fechada', numColor:PDF_COLOR.gold },
    { label:'Total de leads', value: s.funnelBase, sub:'no período total' },
  ]);

  sectionTitle('Funil de conversão', 'leads que já alcançaram cada etapa');
  barRows(s.funnelStages.map((stage,i) => ({
    label: stage === 'Fechado (venda)' ? stage : etapaCurta(stage), value: s.funnelCounts[i], max: s.funnelBase,
    display: s.funnelCounts[i] + ' (' + (s.funnelBase>0?Math.round((s.funnelCounts[i]/s.funnelBase)*100):0) + '%)',
    color: stage==='Fechado (venda)' ? PDF_COLOR.success : stageInfo(stage).color === 'var(--stage-novo)' ? PDF_COLOR.stageNovo
      : stageInfo(stage).color === 'var(--stage-r1)' ? PDF_COLOR.stageR1
      : stageInfo(stage).color === 'var(--stage-r2)' ? PDF_COLOR.stageR2
      : stageInfo(stage).color === 'var(--stage-negociando)' ? PDF_COLOR.gold : PDF_COLOR.navy2,
  })));

  sectionTitle('Ranking por vendedor', 'valor fechado');
  if(s.vendorRanking.length === 0){
    setText(PDF_COLOR.inkFaint); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    doc.text('Nenhum vendedor cadastrado.', margin, y+2); y += 10;
  } else {
    barRows(s.vendorRanking.map(v => ({ label:v.nome, value:v.valor, max:s.vendorMax, display:fmtBRLCompact(v.valor), color:PDF_COLOR.blue })));
  }

  sectionTitle('Tempo médio por etapa', 'em dias');
  const maxDays = Math.max(1, ...s.avgStageDays.map(x=>x.days||0));
  barRows(s.avgStageDays.map(x => ({
    label: etapaCurta(x.key), value: x.days||0, max: maxDays,
    display: x.days===null ? '—' : x.days.toLocaleString('pt-BR',{maximumFractionDigits:1})+'d',
    color: x.color === 'var(--stage-novo)' ? PDF_COLOR.stageNovo
      : x.color === 'var(--stage-r1)' ? PDF_COLOR.stageR1
      : x.color === 'var(--stage-r2)' ? PDF_COLOR.stageR2
      : x.color === 'var(--stage-negociando)' ? PDF_COLOR.gold : PDF_COLOR.navy2,
  })));

  sectionTitle('Evolução mensal', 'últimos 6 meses · toda a equipe');
  monthlyChart(s.monthly, s.monthlyMax);

  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);
    setText(PDF_COLOR.inkFaint); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text('Pipeline CRM · gerado em ' + meta.generatedAt, margin, pageH-9);
    doc.text('Página ' + p + ' de ' + totalPages, pageW-margin, pageH-9, {align:'right'});
  }

  doc.save('relatorio-indicadores-' + todayISO() + '.pdf');
}

/* Conta de zero até o valor ao abrir o painel. Serve ao instrumento: o
   número "assentando" sinaliza dado apurado agora, não página estática.
   Respeita quem pede movimento reduzido — nesse caso já entra no valor. */
function useContagem(valor, duracao){
  const reduzido = typeof window !== 'undefined' && window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [atual, setAtual] = useState(reduzido ? valor : 0);
  useEffect(() => {
    if(reduzido){ setAtual(valor); return; }
    const inicio = performance.now();
    const total = duracao || 900;
    let frame;
    const passo = (agora) => {
      const t = Math.min(1, (agora - inicio) / total);
      /* Desacelera no fim: o número chega, não freia de repente. */
      const eased = 1 - Math.pow(1 - t, 3);
      setAtual(valor * eased);
      if(t < 1) frame = requestAnimationFrame(passo);
    };
    frame = requestAnimationFrame(passo);
    return () => cancelAnimationFrame(frame);
  }, [valor, duracao, reduzido]);
  return atual;
}

/* Número grande do painel, com rótulo e contexto. */
function Indicador({ rotulo, valor, formato, contexto, tom, largo }){
  const animado = useContagem(valor);
  return h('div',{className:'ind' + (tom ? ' ' + tom : '') + (largo ? ' largo' : '')},
    h('div',{className:'ind-rotulo'}, rotulo),
    h('div',{className:'ind-valor'}, formato(animado)),
    contexto ? h('div',{className:'ind-contexto'}, contexto) : null
  );
}

/* Barra de composição: uma faixa contínua dividida pelos segmentos da
   carteira. Mesma gramática do espectro do funil, aplicada ao patrimônio. */
function BarraComposicao({ partes, total }){
  return h('div',{className:'composicao'},
    h('div',{className:'composicao-faixa'},
      partes.filter(p => p.valor > 0).map(p => h('span',{
        key:p.chave, className:'composicao-parte',
        style:{ width: (total > 0 ? (p.valor / total) * 100 : 0) + '%', background:p.cor },
        title: p.chave + ' · ' + fmtBRLCompact(p.valor),
      }))
    ),
    h('div',{className:'composicao-legenda'},
      partes.map(p => h('div',{key:p.chave, className:'composicao-item'},

        h('span',{className:'composicao-nome'}, p.chave),

        h('span',{className:'composicao-qtd'}, p.count)
      ))
    )
  );
}

/* Rosca de composição. Legenda ao lado com valor e percentual, no formato
   que um gestor já lê em painel — o rótulo fica fora do gráfico, não sobre
   as fatias, para funcionar mesmo com fatias pequenas. */
function Rosca({ partes, formato }){
  const total = partes.reduce((a,p) => a + p.valor, 0);
  const raio = 54, espessura = 22, circ = 2 * Math.PI * raio;
  let acumulado = 0;

  if(total <= 0) return h('div',{className:'empty-kpi'},'Sem dados no período.');

  return h('div',{className:'rosca'},
    h('div',{className:'rosca-grafico'},
      h('svg',{ viewBox:'0 0 140 140', role:'img',
        'aria-label': partes.map(p => p.chave + ': ' + formato(p.valor)).join(', ') },
        h('g',{ transform:'rotate(-90 70 70)' },
          partes.filter(p => p.valor > 0).map((p, i) => {
            const fatia = (p.valor / total) * circ;
            const offset = -acumulado;
            acumulado += fatia;
            return h('circle',{
              key:p.chave, cx:70, cy:70, r:raio, fill:'none',
              stroke:p.cor, strokeWidth:espessura,
              strokeDasharray: fatia + ' ' + (circ - fatia),
              strokeDashoffset: offset,
              className:'rosca-fatia', style:{ animationDelay: (i * 0.12) + 's' },
            });
          })
        ),
        /* O total mora dentro do furo da rosca, que tem largura fixa. Um
           rotulo curto cabe; "US$ 625mil" nao. Como e texto SVG, ele nao
           quebra nem aperta - transborda por cima do anel, em silencio, e a
           auditoria de layout nao ve texto de SVG. Encolher pelo numero de
           caracteres e o que mantem o valor inteiro e dentro. */
        h('text',{ x:70, y:66, textAnchor:'middle',
          className:'rosca-total' + (String(formato(total)).length > 8 ? ' longo' : '') }, formato(total)),
        h('text',{ x:70, y:82, className:'rosca-legenda-total', textAnchor:'middle' }, 'total')
      )
    ),
    h('div',{className:'rosca-legenda'},
      partes.map(p => h('div',{key:p.chave, className:'rosca-item'},
        h('span',{className:'rosca-ponto', style:{background:p.cor}}),
        h('span',{className:'rosca-nome'}, p.chave),
        h('span',{className:'rosca-valor'}, formato(p.valor)),
        h('span',{className:'rosca-pct'}, Math.round((p.valor/total)*100) + '%')
      ))
    )
  );
}

/* Barras verticais para rankings curtos: a comparação entre pares fica mais
   direta na vertical do que em linhas empilhadas. */
function BarrasVerticais({ itens, formato }){
  if(!itens || itens.length === 0) return h('div',{className:'empty-kpi'},'Sem dados no período.');
  const max = Math.max(1, ...itens.map(i => i.valor));
  return h('div',{className:'barras-v'},
    itens.map((it, i) => h('div',{key:it.chave, className:'barra-v-col', title: it.chave + ' · ' + formato(it.valor)},
      h('div',{className:'barra-v-num'}, formato(it.valor)),
      h('div',{className:'barra-v-trilha'},
        h('div',{className:'barra-v-fill', style:{
          height: Math.max(2, (it.valor/max)*100) + '%',
          background: it.cor || 'var(--primary)',
          animationDelay: (i * 0.05) + 's',
        }})
      ),
      h('div',{className:'barra-v-nome'}, it.chave)
    ))
  );
}

/* ================= Painel consolidado do admin =================
   Uma página só com os dois lados do negócio: a carteira sob gestão na
   jornada e a produção dos especialistas. A gestão não deveria precisar
   trocar de funil para saber como o escritório está. */
/* Barra de filtros dos indicadores. Só o admin a vê: quem não é admin já
   enxerga apenas a própria carteira, e os controles não teriam efeito. */
function KpiFiltros({ filtros, onChange, funil, users, leads, consolidado, coluna, simples }){
  const set = (campo, valor) => onChange({ ...filtros, [campo]: valor });
  /* Na página consolidada os filtros de produto e especialista sempre valem,
     porque ela mostra os dois lados ao mesmo tempo. */
  /* Sem os recortes de equipe: quem não é admin já vê só o que é seu, e os
     seletores de assessor e especialista não teriam efeito. */
  const especialista = !simples && (consolidado || funil === 'especialista');

  const assessores = users.filter(u => u.status === 'ativo' && u.role !== 'especialista');
  const especialistas = users.filter(u => u.status === 'ativo' && u.role === 'especialista');

  const alternarProduto = (p) => {
    const atual = filtros.produtos;
    set('produtos', atual.indexOf(p) === -1 ? [...atual, p] : atual.filter(x => x !== p));
  };

  const temperaturas = filtros.temperatura || [];
  const alternarTemperatura = (k) => set('temperatura',
    temperaturas.indexOf(k) === -1 ? [...temperaturas, k] : temperaturas.filter(x => x !== k));

  const limpo = filtros.periodo === 'mes' && filtros.assessor === 'all'
    && filtros.produtos.length === 0 && filtros.especialista === 'all'
    && temperaturas.length === 0;

  return h('div',{className:'filtros-panel kpi-filtros' + (coluna ? ' em-coluna' : '')},
    h('div',{className:'filtro-grupo'},
      h('div',{className:'filtro-titulo'},'Período'),
      h('div',{className:'filtro-chips'},
        PERIODOS.map(p => h('button',{
          key:p.valor, type:'button',
          className:'filtro-chip' + (filtros.periodo === p.valor ? ' ativo' : ''),
          onClick:()=>set('periodo', p.valor),
        }, p.label))
      ),
      /* As datas só aparecem quando escolhidas, para não pesar a barra. */
      filtros.periodo === 'custom' ? h('div',{className:'kpi-datas'},
        h('input',{ className:'select-sm', type:'date', value:filtros.de, 'aria-label':'Data inicial',
          onChange:e=>set('de', e.target.value) }),
        h('span',{className:'kpi-datas-sep'},'até'),
        h('input',{ className:'select-sm', type:'date', value:filtros.ate, 'aria-label':'Data final',
          onChange:e=>set('ate', e.target.value) })
      ) : null
    ),

    simples ? null : h('div',{className:'filtro-grupo'},
      h('div',{className:'filtro-titulo'},'Assessor'),
      h('select',{ className:'select-sm', value:filtros.assessor, onChange:e=>set('assessor', e.target.value) },
        h('option',{value:'all'},'Todos os assessores'),
        assessores.map(u => h('option',{key:u.id, value:u.id}, u.nome)))
    ),

    especialista ? h('div',{className:'filtro-grupo'},
      h('div',{className:'filtro-titulo'},'Produto'),
      h('div',{className:'filtro-chips'},
        PRODUTOS.map(p => h('button',{
          key:p, type:'button',
          className:'filtro-chip' + (filtros.produtos.indexOf(p) !== -1 ? ' ativo' : ''),
          onClick:()=>alternarProduto(p),
        }, p))
      )
    ) : null,

    especialista ? h('div',{className:'filtro-grupo'},
      h('div',{className:'filtro-titulo'},'Especialista'),
      h('select',{ className:'select-sm', value:filtros.especialista, onChange:e=>set('especialista', e.target.value) },
        h('option',{value:'all'},'Todos os especialistas'),
        especialistas.map(u => h('option',{key:u.id, value:u.id},
          u.nome + (u.produtos && u.produtos.length ? ' · ' + u.produtos.join(', ') : ''))))
    ) : null,

    /* Vale para os dois lados do painel: o negócio do especialista também
       tem temperatura, e recortar só a carteira daria dois números que não
       conversam na mesma tela. */
    h('div',{className:'filtro-grupo'},
      h('div',{className:'filtro-titulo'},'Temperatura'),
      h('div',{className:'filtro-chips'},
        TEMPERATURAS.concat([{ key:'sem', label:'Sem classificação', cor:null }]).map(t => h('button',{
          key:t.key, type:'button',
          className:'filtro-chip' + (t.cor ? ' temp-chip' : '') + (temperaturas.indexOf(t.key) !== -1 ? ' ativo' : ''),
          onClick:()=>alternarTemperatura(t.key),
        }, t.cor ? h('span',{className:'temp-dot', style:{background:t.cor}}) : null, t.label))
      )
    ),

    !limpo ? h('button',{className:'link-btn filtro-limpar',
      onClick:()=>onChange({ periodo:'mes', de:'', ate:'', assessor:'all', produtos:[], especialista:'all', temperatura:[] })
    }, 'Limpar filtros') : null
  );
}

function AdminKpis({ jornada, negocios, users, currentUser, filtros, onFiltros, leads }){
  const cotacao = useCotacao();
  const carteira = useMemo(() => computeAssessoriaStats(jornada, users, filtros, cotacao), [jornada, users, filtros, cotacao]);
  /* Mesmo cálculo da aba Offshore: a gestão tem de ver o mesmo número nas duas
     telas, e um segundo cálculo "resumido" divergiria no primeiro ajuste. */
  const offshore = useMemo(() => computeOffshore(jornada, users, filtros, cotacao),
    [jornada, users, filtros, cotacao]);
  const evolucaoOff = useMemo(() => computeEvolucaoOffshore(jornada, 6), [jornada]);
  /* O que está em jogo, novo e da base, pelo mesmo recorte da barra. */
  const captacaoTemp = useMemo(() => computeCaptacaoTemperatura(jornada, users, cotacao), [jornada, users, cotacao]);
  const nomeCurto = (id) => ((users.find(u => u.id === id) || {}).nome || '—').split(' ')[0];
  const prod = useMemo(() => computeProducaoStats(negocios, users), [negocios, users]);
  const evolucao = useMemo(() => computeKpiStats(negocios, negocios, users), [negocios, users]);

  const valorDe = (l) => parseValor(l.valorFechado) || parseValor(l.valorPotencial) || 0;
  const fechados = negocios.filter(l => l.ganho);
  const abertos = negocios.filter(l => !l.ganho && !l.perdido);
  const producaoTotal = fechados.reduce((a,l) => a + valorDe(l), 0);
  const emJogo = abertos.reduce((a,l) => a + valorDe(l), 0);

  const numero = (n) => String(Math.round(n));

  return h('div',{className:'painel'},
    h('div',{className:'print-header'},
      h('div',{className:'print-brand'}, h('span',{className:'brand-mark'}), h('span',null,'Pipeline')),
      h('h1',null,'Panorama do escritório'),
      /* O papel precisa dizer sobre o que ele fala: sem os filtros escritos,
         dois relatórios do mesmo dia ficam indistinguíveis. */
      h('div',{className:'print-meta'}, descreverRecorte(filtros, users),
        ' · Gerado em ', new Date().toLocaleString('pt-BR'), ' por ', currentUser.nome),
      h('hr')
    ),

    /* Filtros na coluna, painel na área maior: os recortes ficam sempre à
       vista enquanto os números mudam ao lado. */
    h('aside',{className:'painel-lado'},
      h(KpiFiltros,{ filtros, onChange:onFiltros, funil:'especialista', users, leads, consolidado:true, coluna:true })
    ),

    h('div',{className:'painel-area'},
      /* Faixa de números: a leitura de abertura, em linha única. */
      h('div',{className:'painel-linha'},
        h(Indicador,{ rotulo:'Total da carteira', largo:true,
          valor: carteira.totalCarteira, formato: fmtBRLCompact,
          /* Onshore e offshore no mesmo número: o contexto diz de que ele é
             feito, senão o admin não sabe o que está olhando. */
          contexto: carteira.offshore.usd > 0
            ? (carteira.offshore.consolidado
                ? carteira.sobGestao + ' clientes · ' + fmtUSDCompact(carteira.offshore.usd) + ' offshore incluídos'
                : carteira.sobGestao + ' clientes · ' + fmtUSDCompact(carteira.offshore.usd) + ' offshore FORA, sem cotação')
            : carteira.sobGestao + ' de ' + carteira.ativos.length + ' clientes sob gestão' }),
        h(Indicador,{ rotulo:'Em captação', tom:'ouro',
          valor: carteira.emCaptacao, formato: fmtBRLCompact, contexto:'clientes novos e da base' }),
        h(Indicador,{ rotulo:'Produção', tom:'verde',
          valor: producaoTotal, formato: fmtBRLCompact,
          contexto: fechados.length + (fechados.length === 1 ? ' negócio fechado' : ' negócios fechados') }),
        h(Indicador,{ rotulo:'Em negociação',
          valor: emJogo, formato: fmtBRLCompact, contexto: abertos.length + ' em aberto' }),
        h(Indicador,{ rotulo:'Net New Money',
          tom: carteira.fluxo.liquido < 0 ? 'alerta' : 'verde',
          valor: carteira.fluxo.liquido, formato: (n) => (n >= 0 ? '+' : '−') + fmtBRLCompact(Math.abs(n)),
          contexto: fmtBRLCompact(carteira.fluxo.entrou) + ' entrou · ' + fmtBRLCompact(carteira.fluxo.retiradas) + ' saiu' }),

                  h('span',null,'em jogo · quanto está quente')),
