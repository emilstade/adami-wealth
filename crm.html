        ),
        h('div',{className:'painel-caixa'},
          h('div',{className:'painel-caixa-titulo'},'Negócios dos especialistas',
            h('span',null,'por mês')),
          h(GraficoMensal,{ meses: evolucao.monthly, max: evolucao.monthlyMax })
        )
      ),

      h(ProducaoSecoes,{ leads: negocios, users })
    )
  );
}

/* Os gráficos da carteira no exterior. Um componente só, usado no painel do
   admin e em "Minha carteira" do assessor: dois desenhos separados para a
   mesma pergunta divergiriam no primeiro ajuste, e cada perfil leria um
   número diferente da mesma carteira.

   O recorte de "por assessor" só faz sentido para quem vê mais de uma
   carteira; para o assessor, a mesma caixa mostra os clientes dele. */
function OffshoreGraficos({ s, evolucao, admin }){
  return h(Fragment, null,
    h('div',{className:'painel-duplo'},
      h('div',{className:'painel-caixa'},
        h('div',{className:'painel-caixa-titulo'},'Composição da carteira',
          h('span',null,'onshore e offshore')),
        /* A rosca só existe em reais: é a única forma de as duas custódias
           dividirem o mesmo círculo. Sem cotação não há proporção a desenhar —
           e a tela diz isso em vez de inventar. */
        s.temCotacao
          ? h(Rosca,{ formato: fmtBRLCompact, partes: [
              { chave:'Onshore',  valor: s.totalOnshore, cor:'#195AB4' },
              { chave:'Offshore', valor: s.totalBrl,     cor:'#0F766E' },
            ] })
          : h('div',{className:'empty-kpi'},'Defina a cotação do dólar para comparar as duas custódias na mesma moeda.')
      ),
      h('div',{className:'painel-caixa'},
        h('div',{className:'painel-caixa-titulo'},
          admin ? 'Offshore por assessor' : 'Onde está o offshore',
          h('span',null,'em dólar')),
        admin
          ? h(BarrasVerticais,{ formato: fmtUSDCompact,
              itens: s.porAssessor.slice(0,12).map(v => ({ chave:v.nome, valor:v.valor, cor:'#0F766E' })) })
          : (s.clientes.length === 0
              ? h('div',{className:'empty-kpi'},'Nenhum cliente com carteira no exterior.')
              : s.clientes.slice(0,8).map((c,i) => h(BarRow,{
                  key:c.id, label:c.cliente, value:c.usd, posicao:i+1,
                  max: Math.max(1, ...s.clientes.map(x => x.usd)),
                  display: c.emFormacao ? 'em captação' : fmtUSDCompact(c.usd),
                  secundario: s.temCotacao && !c.emFormacao ? (c.fatia*100).toFixed(0) + '% do patrimônio' : null,
                  color:'#0F766E', semDados: c.emFormacao,
                })))
      )
    ),

    h('div',{className:'painel-duplo'},
      h('div',{className:'painel-caixa'},
        h('div',{className:'painel-caixa-titulo'},'Evolução da carteira offshore',
          h('span',null,'últimos 6 meses, em dólar')),
        /* Em dólar de propósito: a curva mostra se a carteira lá fora cresceu,
           e não se o câmbio mexeu. */
        h(GraficoCarteira,{ dados: evolucao, formato: fmtUSDCompact,
          cor:'#0F766E', id: admin ? 'areaOffshore' : 'areaOffshoreCarteira',
          rotuloAcumulado:'Patrimônio offshore',
          descricao:'Evolução da carteira offshore em dólares nos últimos meses' })
      ),
      h('div',{className:'painel-caixa'},
        h('div',{className:'painel-caixa-titulo'},'Offshore por segmento',
          h('span',null,'em dólar')),
        s.porSegmento.every(x => x.valor === 0)
          ? h('div',{className:'empty-kpi'},'Nenhum cliente offshore com patrimônio classificado.')
          : h(Rosca,{ formato: fmtUSDCompact,
              partes: s.porSegmento.map(sg => ({ chave:sg.key, valor:sg.valor, cor:CORES_SEGMENTO[sg.key] })) })
      )
    )
  );
}

/* ================= Visao offshore =================
   Tela propria porque a pergunta e outra: no painel a carteira aparece
   consolidada em reais, e e assim que ela deve aparecer la. Aqui interessa o
   dolar - quanto, de quem, e o que se moveu. */
/* ================= Atualização da base BTG (admin) =================
   Duas etapas obrigatórias: ler o arquivo e mostrar a prévia; só então
   gravar. A prévia não é cortesia — é o único ponto em que alguém confere
   centenas de linhas antes de elas mexerem na carteira do escritório. */
function ImportacaoBaseView({ leads, users, currentUser, onAplicar, onOpen }){
  const [estado, setEstado] = useState('vazio'); /* vazio | lendo | previa | aplicando */
  const [erro, setErro] = useState('');
  const [res, setRes] = useState(null);
  const [arquivo, setArquivo] = useState('');
  const [abertas, setAbertas] = useState({});
  const inputRef = useRef(null);

  const abrir = (k) => setAbertas(a => ({ ...a, [k]: !a[k] }));

  const receber = async (file) => {
    if(!file) return;
    setEstado('lendo'); setErro(''); setRes(null); setArquivo(file.name);
    try {
      const linhas = await lerXlsx(await file.arrayBuffer());
      const r = identificarExport(linhas) === 'offshore'
        ? reconciliarOffshoreBTG(linhas, leads)
        : reconciliarBaseBTG(linhas, leads, users);
      setRes(r); setEstado('previa');
    } catch(e){
      setErro(e && e.message ? e.message : 'Não foi possível ler o arquivo.');
      setEstado('vazio');
    }
  };

  const aplicar = async () => {
    setEstado('aplicando');
    try {
      await onAplicar(res);
      setEstado('vazio'); setRes(null); setArquivo('');
      if(inputRef.current) inputRef.current.value = '';
    } catch(e){
      setErro(e && e.message ? e.message : 'Falha ao gravar as alterações.');
      setEstado('previa');
    }
  };

  const descartar = () => {
    setEstado('vazio'); setRes(null); setErro(''); setArquivo('');
    if(inputRef.current) inputRef.current.value = '';
  };

  const seletor = h('div',{className:'imp-drop'},
    h('span',{className:'imp-drop-mark'}),
    h('h2',null,'Atualização semanal da base'),
    h('p',null,'Envie o export do BTG em .xlsx — o da carteira ou o ',
      h('strong',null,'AuC offshore'),'. A tela reconhece qual é pelas colunas, lê o arquivo aqui no navegador e o compara com a base pela ',
      h('strong',null,'conta onshore'),'. Nada é gravado antes de você conferir a prévia.'),
    h('p',null,'Se a planilha tiver uma coluna ', h('strong',null,'Código do assessor'),
      ' — o código que aparece na tela de Equipe do hub —, a importação usa ela para vincular '
      + 'cada conta ao assessor certo, inclusive cadastrando sozinha quem ainda não tem conta na '
      + 'base. Sem código que bata com ninguém, o assessor fica como está e a diferença vira só um '
      + 'aviso; e cadastro, nesse caso, é manual.'),
    h('input',{ ref:inputRef, type:'file', accept:'.xlsx', id:'imp-file', className:'imp-file',
      onChange:(e)=>receber(e.target.files && e.target.files[0]) }),
    h('label',{htmlFor:'imp-file', className:'btn btn-primary imp-botao'}, 'Escolher arquivo'),
    erro ? h('p',{className:'imp-erro'}, erro) : null
  );

  if(estado === 'vazio') return h('div',{className:'painel importacao'}, h('div',{className:'painel-area'}, seletor));
  if(estado === 'lendo') return h('div',{className:'painel importacao'}, h('div',{className:'painel-area'},
    h('div',{className:'imp-drop'}, h('h2',null,'Lendo a planilha…'),
      h('p',null,'São algumas centenas de linhas; leva um instante.'))));

  const r = res, R = r.resumo;
  /* Os dois exports passam pela mesma prévia; muda a moeda e o vocabulário.
     Offshore é dólar do começo ao fim — converter aqui faria a prévia
     depender de uma cotação que o arquivo não traz. */
  const off = r.tipo === 'offshore';
  const fmt = off ? fmtUSD : fmtBRL;
  const fmtC = off ? fmtUSDCompact : fmtBRLCompact;
  const conflitos = r.conflitos || [];
  const comAlerta = r.atualizacoes.filter(a => a.alerta);
  const vinculos = r.atualizacoes.filter(a => a.vinculo && !a.alerta);
  /* Troca de assessor sai da lista comum: quem confere a prévia precisa ver
     as transferências juntas, não espalhadas entre trezentas linhas de
     rendimento. Alerta de saldo continua vindo primeiro — é o mais grave. */
  const trocasPorCodigo = r.atualizacoes.filter(a => a.vinculoAssessor && !a.alerta && !a.vinculo);
  const semAlerta = r.atualizacoes.filter(a => !a.alerta && !a.vinculo && !a.vinculoAssessor);
  /* Conta nova entra em duas listas: a que a importação cadastra sozinha
     (código bateu com um assessor) e a que continua exigindo alguém abrir
     a tela e cadastrar — só o nome do BTG não é instrução suficiente.
     Offshore nunca cria, então as duas ficam vazias lá. */
  const novasCriar = off ? [] : r.novas.filter(n => n.donoPorCodigo);
  const novasManual = off ? r.novas : r.novas.filter(n => !n.donoPorCodigo);
  const totalAplicar = r.atualizacoes.length + novasCriar.length;

  /* Um bloco por natureza de divergência. Todos recolhíveis e nenhum
     escondido: mesmo o que a importação não vai tocar precisa ser visto. */
  const secao = (chave, titulo, itens, render, explicacao, tom) => {
    if(!itens.length) return null;
    const aberto = !!abertas[chave];
    return h('div',{className:'imp-secao' + (tom ? ' ' + tom : ''), key:chave},
      h('button',{className:'imp-secao-cab', onClick:()=>abrir(chave)},
        h('span',{className:'imp-secao-titulo'}, titulo),
        h('span',{className:'imp-secao-count'}, itens.length),
        h('span',{className:'imp-secao-seta'}, aberto ? '–' : '+')),
      h('p',{className:'imp-secao-exp'}, explicacao),
      aberto ? h('div',{className:'imp-lista'}, itens.map(render)) : null
    );
  };

  const linhaSaldo = (a) => {
    /* Cadastro pode mudar sem o saldo mudar. Mostrar "→ mesmo valor · +R$ 0"
       faria o olho procurar uma diferença que não existe: quando o saldo não
       se moveu, a linha fala só do que mudou. */
    const moveu = Math.abs(a.delta) >= 0.01;
    return h('div',{className:'imp-linha clicavel', key:a.conta,
        onClick: a.lead ? () => onOpen(a.lead) : null},
      /* O nome que o CRM conhece, não o do arquivo. O export traz só o
         primeiro nome, e depois que alguém digita o sobrenome os dois
         divergem — mostrar o do arquivo faria o admin não reconhecer o
         cliente que ele está prestes a atualizar. */
      h('span',{className:'imp-nome'}, nomeSemConta(a.lead && a.lead.cliente, a.conta) || a.nome || a.conta,
        h('span',{className:'imp-conta'}, off ? a.contaOffshore : a.conta)),
      /* No vínculo não há "de": o zero anterior não é saldo, é ausência de
         registro, e "US$ 0 → US$ 257 mil" leria como aporte. */
      moveu && !a.vinculo ? h('span',{className:'imp-de'}, fmt(a.saldoAtual)) : null,
      moveu && !a.vinculo ? h('span',{className:'imp-seta'}, '→') : null,
      h('span',{className:'imp-para'}, fmt(a.saldoBTG)),
      a.vinculo
        ? h('span',{className:'imp-delta neutro'}, 'ponto de partida')
        : moveu
        ? h('span',{className:'imp-delta' + (a.delta > 0 ? ' pos' : ' neg')},
            (a.delta > 0 ? '+' : '−') + fmt(Math.abs(a.delta)))
        : h('span',{className:'imp-delta neutro'}, 'saldo inalterado'),
      a.campos.length && !a.vinculo ? h('span',{className:'imp-campos'},
        a.campos.map(c => c.rotulo).join(', ')) : null
    );
  };

  return h('div',{className:'painel importacao'},
    h('div',{className:'painel-area'},

      h('div',{className:'imp-cabecalho'},
        h('div',{className:'imp-cabecalho-texto'},
          h('h2',null, off ? 'Prévia da atualização offshore' : 'Prévia da atualização'),
          h('p',{className:'sub'}, arquivo, ' · ', R.linhas, ' linhas lidas · ',
            R.conciliadas, off ? ' ligadas pela conta onshore' : ' conciliadas pela conta',
            R.dataPosicao ? ' · posição de ' + R.dataPosicao.split('-').reverse().join('/') : '')),
        h('div',{className:'imp-acoes'},
          h('button',{className:'btn', onClick:descartar}, 'Descartar'),
          h('button',{className:'btn btn-primary', disabled: estado==='aplicando' || !totalAplicar,
            onClick:aplicar},
            estado === 'aplicando' ? 'Gravando…'
              : totalAplicar ? 'Aplicar ' + totalAplicar + (totalAplicar === 1 ? ' alteração' : ' alterações')
              : 'Nada a aplicar'))
      ),

      erro ? h('p',{className:'imp-erro'}, erro) : null,

      h('div',{className:'painel-linha linha-4'},
        h(Indicador,{ rotulo:'Clientes alterados', valor: R.alteradas, formato:(n)=>String(n),
          contexto: R.vinculosAssessor
            ? 'inclui ' + R.vinculosAssessor + (R.vinculosAssessor === 1 ? ' troca de assessor' : ' trocas de assessor')
            : R.alteradas ? 'saldo ou cadastro' : 'nada mudou nesta semana' }),
        h(Indicador,{ rotulo: off ? 'Variação offshore' : 'Variação da carteira', tom:'ouro', valor: R.deltaTotal,
          formato:(n)=>(n >= 0 ? '+' : '−') + fmtC(Math.abs(n)),
          contexto: R.vinculos ? 'inclui ' + R.vinculos + (R.vinculos === 1 ? ' vínculo inicial' : ' vínculos iniciais')
            : 'soma das diferenças do arquivo' }),
        h(Indicador,{ rotulo:'Cadastros novos', valor: R.novasComCodigo || 0, formato:(n)=>String(n),
          contexto: off ? 'offshore nunca cadastra' : (R.novasComCodigo ? 'contas novas com código reconhecido' : 'nenhuma conta nova com código') }),
        h(Indicador,{ rotulo:'Não tocados', valor: R.novas - (R.novasComCodigo || 0) + R.ausentes + R.trocas + (R.conflitos || 0), formato:(n)=>String(n),
          contexto: off ? 'fora da base, ausentes e conflitos' : 'contas novas sem código, ausentes e trocas' })
      ),

      (!r.atualizacoes.length && !r.novas.length && !r.ausentes.length && !r.trocaAssessor.length && !conflitos.length)
        ? h('div',{className:'board-empty'},
            h('span',{className:'board-empty-mark'}),
            h('h2',null,'Nada mudou desde a última importação'),
            h('p',null,'Todas as contas do arquivo batem com a base, dentro da faixa de rendimento. Não há o que gravar.'))
        : null,

      secao('alertas', 'Divergências de saldo', comAlerta, linhaSaldo,
        'Variação acima de 0,5% sem movimentação lançada que a explique. O saldo é atualizado assim mesmo, e cada um destes ganha um alerta no card do cliente para o assessor responder.',
        'grave'),

      secao('vinculos', 'Contas offshore vinculadas agora', vinculos, linhaSaldo,
        'Primeira vez que estas contas aparecem ligadas ao cliente, pela conta onshore. O saldo entra como ponto de partida, sem alerta — sair do zero não é divergência, é o começo do registro. Cada vínculo fica no histórico do cliente.'),

      secao('ok', 'Atualizações dentro do esperado', semAlerta, linhaSaldo,
        'Rendimento dentro da faixa de 0,5%, ou variação já explicada por movimentação lançada na semana. Atualiza o saldo em silêncio: sem alerta e sem entrada no histórico, que senão viraria extrato de rendimento semanal. Mudança de cadastro, essa sim, fica registrada.'
          + (off ? ' Saldos abaixo de US$ ' + OFFSHORE_PISO_USD + ' são resíduo e nunca geram alerta.' : '')),

      secao('novascriar', 'Contas novas — card automático', novasCriar,
        (n) => h('div',{className:'imp-linha', key:n.conta},
          h('span',{className:'imp-nome'}, n.nome, h('span',{className:'imp-conta'}, n.conta)),
          h('span',{className:'imp-para'}, fmt(n.saldo)),
          h('span',{className:'imp-campos'}, n.assessor + ' · código ' + n.codigo)),
        'Estão no BTG, não estão na nossa base, e a coluna de código diz de quem são. Ao aplicar, '
        + 'a importação cadastra o cliente sozinha — esteira da base, etapa Cliente Novo, saldo '
        + 'inicial igual ao do arquivo — já com o assessor vinculado pelo código.',
        'grave'),

      secao('novasmanual', off ? 'Conta onshore fora da base' : 'Contas novas sem código', novasManual,
        (n) => h('div',{className:'imp-linha', key:n.conta},
          h('span',{className:'imp-nome'}, n.nome, h('span',{className:'imp-conta'}, n.conta)),
          h('span',{className:'imp-para'}, fmt(n.saldo)),
          off ? h('span',{className:'imp-campos'}, 'offshore ' + n.contaOffshore)
            : n.assessor ? h('span',{className:'imp-campos'}, n.assessor) : null),
        off
          ? 'A conta onshore destes clientes não está na nossa base — em geral, conta zerada no Brasil que ficou fora da carga. A importação NÃO cria cliente: cadastrado com essa conta, a importação seguinte faz o vínculo sozinha.'
          : 'Estão no BTG e não na nossa base, mas a planilha não trouxe um código de assessor que bata com ninguém — o nome sozinho não autoriza cadastro. Cadastre pela tela normal, com esteira e etapa conferidas por quem conhece o caso.'),

      secao('ausentes', 'Sumiram do arquivo', r.ausentes,
        (a) => h('div',{className:'imp-linha', key:a.conta, onClick:()=>onOpen(a.lead)},
          h('span',{className:'imp-nome'}, nomeSemConta(a.lead.cliente, a.conta),
            h('span',{className:'imp-conta'}, off ? a.lead.contaOffshore : a.conta)),
          h('span',{className:'imp-de'}, fmt(a.saldo)),
          h('span',{className:'imp-campos'}, 'mantido como está')),
        off
          ? 'Têm conta offshore ligada e não vieram no arquivo desta semana. Nada é alterado: pode ser encerramento, mas pode ser export incompleto — e um arquivo truncado não pode apagar carteira.'
          : 'Estão na nossa base e não vieram no arquivo desta semana. Nada é alterado: pode ser encerramento de conta, mas pode ser export incompleto — e um arquivo truncado não pode apagar carteira.'),

      secao('conflitos', 'Não aplicados', conflitos,
        (c) => h('div',{className:'imp-linha clicavel', key:'c-' + c.conta, onClick:()=>onOpen(c.lead)},
          h('span',{className:'imp-nome'}, nomeSemConta(c.lead.cliente, c.lead.conta) || c.nome,
            h('span',{className:'imp-conta'}, c.conta)),
          h('span',{className:'imp-campos'}, c.motivo)),
        'A mesma conta offshore não pode estar em dois clientes, e duas contas offshore sob a mesma onshore não cabem num saldo só sem uma apagar a outra. Ficam como estão até alguém conferir.',
        'grave'),

      secao('vincassessor', 'Assessor definido pela planilha', trocasPorCodigo,
        (a) => h('div',{className:'imp-linha clicavel', key:'va-' + a.conta,
            onClick: a.lead ? () => onOpen(a.lead) : null},
          h('span',{className:'imp-nome'}, nomeSemConta(a.lead && a.lead.cliente, a.conta) || a.nome || a.conta,
            h('span',{className:'imp-conta'}, a.conta)),
          h('span',{className:'imp-de'}, a.vinculoAssessor.de),
          h('span',{className:'imp-seta'}, '→'),
          h('span',{className:'imp-para'}, a.vinculoAssessor.para),
          h('span',{className:'imp-campos'}, 'código ' + a.vinculoAssessor.codigo)),
        'A coluna de código diz de quem é cada conta, e aqui a importação obedece: o vínculo é '
        + 'gravado e fica no histórico do cliente. É a única forma de transferir carteira pelo '
        + 'arquivo — pelo nome do BTG, nunca. Confira antes de aplicar: transferência mexe em '
        + 'comissão.',
        'grave'),

      secao('codigosruins', 'Código que não é de ninguém', r.codigosDesconhecidos || [],
        (c) => h('div',{className:'imp-linha', key:'cd-' + c.codigo},
          h('span',{className:'imp-nome'}, c.codigo,
            h('span',{className:'imp-conta'}, c.contas.length + (c.contas.length === 1 ? ' conta' : ' contas'))),
          h('span',{className:'imp-campos'}, c.contas.slice(0, 6).map(x => x.conta).join(', ')
            + (c.contas.length > 6 ? ' e mais ' + (c.contas.length - 6) : ''))),
        'A planilha traz estes códigos e nenhum assessor tem. Nada é alterado nessas contas: o '
        + 'assessor atual continua. Confira a grafia na tela de Equipe do hub — é lá que o código '
        + 'de cada pessoa aparece, e é lá que se troca.',
        'grave'),

      secao('trocas', 'Assessor diferente do nosso', r.trocaAssessor,
        (t) => h('div',{className:'imp-linha', key:t.conta, onClick:()=>onOpen(t.lead)},
          h('span',{className:'imp-nome'}, nomeSemConta(t.lead.cliente, t.conta) || t.nome,
            h('span',{className:'imp-conta'}, t.conta)),
          h('span',{className:'imp-de'}, t.de),
          h('span',{className:'imp-seta'}, '→'),
          h('span',{className:'imp-para'}, t.para)),
        'O BTG registra outro assessor. A importação não transfere carteira — isso se faz na tela de Equipe, de propósito, porque transferência mexe em comissão e em relacionamento.'),

      r.semConta.length
        ? h('p',{className:'imp-rodape'}, r.semConta.length,
            ' linha(s) do arquivo sem número de conta foram ignoradas — sem conta não há como saber de quem é.')
        : null,

      r.tipo === 'onshore' && !r.usaCodigo
        ? h('p',{className:'imp-rodape'}, r.colunaCodigo
            ? 'A coluna “' + r.colunaCodigo + '” foi ignorada: nenhum assessor tem código cadastrado ainda. '
              + 'Defina os códigos na tela de Equipe do hub e importe de novo.'
            : 'Sem coluna de código nesta planilha — o assessor de cada conta ficou como está. '
              + 'Para vincular pelo arquivo, acrescente uma coluna “Código do assessor”.')
        : null
    )
  );
}

function OffshoreView({ leads, users, filtros, currentUser, isAdmin, onOpen, onSalvarCotacao }){
  const cotacao = useCotacao();
  const s = useMemo(() => computeOffshore(leads, users, filtros, cotacao),
    [leads, users, filtros, cotacao]);
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome || '—';
  const maxSegmento = Math.max(1, ...s.porSegmento.map(y => y.valor));

  return h('div',{className:'painel offshore'},
    h('div',{className:'print-header'},
      h('div',{className:'print-brand'}, h('span',{className:'brand-mark'}), h('span',null,'Pipeline')),
      h('h1',null,'Carteira offshore'),
      h('div',{className:'print-meta'}, descreverRecorte(filtros, users),
        ' · Gerado em ', new Date().toLocaleString('pt-BR'), ' por ', currentUser.nome),
      h('hr')

/* A cotacao em si: quem edita e o admin, quem le e todo mundo. Fica no topo
   da tela offshore porque e ali que ela explica os numeros logo abaixo. */
function CotacaoBox({ isAdmin, onSalvar }){
  const cotacao = useCotacao();
  const [editando, setEditando] = useState(false);
  const [valor, setValor] = useState(cotacao ? String(cotacao.valor).replace('.', ',') : '');
  const [erro, setErro] = useState('');
  const [salvando, setSalvando] = useState(false);

  const salvar = async () => {
    const n = parseValor(valor);
    if(n === null || n <= 0){ setErro('Informe uma cotação maior que zero.'); return; }
    setSalvando(true);
    try{
      await onSalvar(n);
      setEditando(false); setErro('');
    }catch(e){
      setErro('Não foi possível gravar a cotação. ' + (e.message || ''));
    }finally{ setSalvando(false); }
  };

  if(editando){
    return h('div',{className:'cotacao-box editando'},
      h('div',{className:'cotacao-campo'},
        h('label',null,'Reais por dólar'),
        h('input',{ className:'select-sm', value:valor, inputMode:'decimal', autoFocus:true,
          placeholder:'Ex: 5,42',
          onChange:e=>{ setValor(e.target.value); if(erro) setErro(''); },
          onKeyDown:(e)=>{ if(e.key === 'Enter') salvar(); } })
      ),
      h('button',{className:'btn btn-primary', disabled:salvando, onClick:salvar},
        salvando ? 'Salvando...' : 'Salvar cotação'),
      h('button',{className:'btn btn-ghost', onClick:()=>{ setEditando(false); setErro(''); }},'Cancelar'),
      erro ? h('div',{className:'field-error'}, erro) : null
    );
  }

  /* Ausencia de cotacao tem forma propria: a tela diz o que falta, o que isso
     custa e quem resolve, em vez de mostrar um numero convertido por chute. */
  if(!cotacaoValida(cotacao)){
    return h('div',{className:'cotacao-box vazia'},
      h('div',null,
        h('strong',null,'Sem cotação do dólar definida.'),
        h('span',null,' O patrimônio offshore aparece em dólar, mas fica fora do total da carteira até alguém definir por quanto converter.')
      ),
      isAdmin
        ? h('button',{className:'btn btn-primary', onClick:()=>setEditando(true)},'Definir cotação')
        : h('span',{className:'cotacao-nota'},'Peça ao administrador.')
    );
  }

  return h('div',{className:'cotacao-box'},
    h('div',{className:'cotacao-valor'},
      h('span',{className:'cotacao-num'}, fmtBRL(cotacao.valor)),
      h('span',{className:'cotacao-rotulo'},'por dólar')
    ),
    h('div',{className:'cotacao-nota'},
      cotacao.atualizadoEm
        ? 'Definida em ' + new Date(cotacao.atualizadoEm).toLocaleDateString('pt-BR')
        : 'Sem data de atualização',
      ' · usada em todo o consolidado'
    ),
    isAdmin ? h('button',{className:'link-btn', onClick:()=>{
      setValor(String(cotacao.valor).replace('.', ',')); setEditando(true);
    }},'Atualizar') : null
  );
}

function AssessoriaKpis({ scopedLeads, users, vendorFilter, currentUser, periodo }){
  const cotacao = useCotacao();
  const s = computeAssessoriaStats(scopedLeads, users, periodo, cotacao);
  /* O assessor não tem aba Offshore: a carteira dele é uma só, e separá-la em
     duas telas o obrigaria a somar de cabeça. As mesmas leituras entram aqui,
     recortadas para o que é dele — e só aparecem quando ele tem offshore, que
     é a maioria menor. Um bloco de zeros não é informação. */
  const off = useMemo(() => computeOffshore(scopedLeads, users, periodo, cotacao),
    [scopedLeads, users, periodo, cotacao]);
  const evolucaoOff = useMemo(() => computeEvolucaoOffshore(scopedLeads, 6), [scopedLeads]);
  const captacaoTemp = useMemo(() => computeCaptacaoTemperatura(scopedLeads, users, cotacao), [scopedLeads, users, cotacao]);

  const maxEtapa = Math.max(1, ...s.porEtapa.map(x => x.count));
  const maxOrigem = Math.max(1, ...s.porOrigem.map(x => x.valor));
  const maxDias = Math.max(1, ...s.diasPorEtapa.map(x => x.days || 0));

  return h(Fragment, null,
    h('div',{className:'print-header'},
      h('h1',null,'Indicadores da assessoria'),
      h('div',{className:'print-meta'}, 'Escopo: ', escopo, ' · ', periodoLabel(periodo),

          s.offshore.usd > 0

        h('div',{className:'kpi-sub'},'com documento ou termo em aberto')

/* Seções analíticas da carteira. Extraídas para o painel consolidado do
   admin poder mostrá-las junto com a produção dos especialistas. */
function CarteiraSecoes({ stats, leads, admin }){
  const s = stats;
  const cotacao = useCotacao();
  const evolucao = useMemo(() => computeEvolucaoCarteira(leads || [], 6, cotacao), [leads, cotacao]);
  const maxSegmento = Math.max(1, ...s.porSegmento.map(x => x.valor));
  const maxEtapa = Math.max(1, ...s.porEtapa.map(x => x.count));
  const maxOrigem = Math.max(1, ...s.porOrigem.map(x => x.valor));
  const maxDias = Math.max(1, ...s.diasPorEtapa.map(x => x.days || 0));
  return h(Fragment, null,
    /* A curva de patrimônio sob gestão abre a análise: é a pergunta que o
       assessor faz sobre a própria carteira antes de qualquer recorte. */
    h('div',{className:'kpi-section'},
      h('div',{className:'kpi-section-head'},
        h('h2',null,'Evolução da carteira'),
        h('span',null,'patrimônio sob gestão · últimos 6 meses')),
      h(GraficoCarteira,{ dados: evolucao })
    ),

    h('div',{className:'kpi-two-col'},
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Carteira por segmento'), h('span',null,'patrimônio e número de clientes')),
        s.ativos.length === 0 ? h('div',{className:'empty-kpi'},'Nenhum cliente na carteira ainda.') :
        s.porSegmento.map(sg => h(BarRow,{
          key:sg.key, label:sg.key, value:sg.valor, max:maxSegmento,
          display: fmtBRLCompact(sg.valor),
          secundario: sg.count + (sg.count === 1 ? ' cliente' : ' clientes'),
          /* Mesmo tom da barra de composição do topo. */
          color: CORES_SEGMENTO[sg.key],
        }))
      ),
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Clientes por etapa'), h('span',null,'onde a carteira está parada')),
        s.ativos.length === 0 ? h('div',{className:'empty-kpi'},'Sem dados ainda.') :
        s.porEtapa.map(e => h(BarRow,{
          key:e.key, label:etapaCurta(e.key), dotColor:e.color, value:e.count, max:maxEtapa,
          display: String(e.count), color:e.color,
        }))
      )
    ),

    h('div',{className:'kpi-two-col'},
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'De onde vem o patrimônio'), h('span',null,'por canal de origem')),
        s.porOrigem.length === 0
          ? h('div',{className:'empty-kpi'},'Nenhuma origem registrada. Preencha "como chegou" no cadastro.')
          : h(Fragment, null,
              s.porOrigem.map((o, i) => h(BarRow,{
                key:o.key, label:o.key, value:o.valor, max:maxOrigem, posicao:i+1,
                display: fmtBRLCompact(o.valor),
                secundario: o.count + (o.count === 1 ? ' cliente' : ' clientes'),
                color:'var(--primary)',
              })),
              s.semOrigem ? h('div',{className:'field-hint', style:{marginTop:10}},
                s.semOrigem + ' cliente(s) sem origem informada.') : null
            )
      ),
      /* SLA, ranking e tempo por etapa comparam pessoas e prazos do processo:
         são leituras de gestão. Na carteira do assessor, distraem do que ele
         de fato controla. */
      admin ? h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Cumprimento de SLA'), h('span',null,'fora do prazo por etapa')),
        s.slaPorEtapa.every(x => x.total === 0)
          ? h('div',{className:'empty-kpi'},'Nenhum cliente nas etapas com prazo definido.')
          : s.slaPorEtapa.map(x => h(BarRow,{
              key:x.etapa, label:etapaCurta(x.etapa),
              value:x.fora, max:Math.max(1, ...s.slaPorEtapa.map(y=>y.total)),
              semDados: x.total === 0,
              display: x.total === 0 ? 'nenhum cliente' : x.fora + ' de ' + x.total,
              secundario: x.total === 0 ? null : 'prazo de ' + x.prazo + ' dias',
              color: x.fora > 0 ? 'var(--danger)' : 'var(--success)',
            }))
      ) : null
    ),

    admin ? h('div',{className:'kpi-two-col'},
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Carteira por assessor'), h('span',null,'patrimônio sob acompanhamento')),
        s.ranking.length === 0 ? h('div',{className:'empty-kpi'},'Nenhum assessor com carteira.') :
        s.ranking.map((v, i) => h(BarRow,{
          key:v.id, label:v.nome, value:v.valor, max:s.rankingMax, posicao:i+1,
          display: fmtBRLCompact(v.valor),
          secundario: v.count + (v.count === 1 ? ' cliente' : ' clientes'),
          color:'var(--primary)',
        }))
      ),
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Tempo médio por etapa'), h('span',null,'dias reais versus prazo')),
        s.diasPorEtapa.every(x => x.days === null)
          ? h('div',{className:'empty-kpi'},'Ainda sem movimentações suficientes.')
          : s.diasPorEtapa.map(x => h(BarRow,{
              key:x.key, label:etapaCurta(x.key), dotColor:x.color, value:x.days || 0, max:maxDias,
              semDados: x.days === null,
              display: x.days === null ? 'sem movimentações'
                : x.days.toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'd',
              secundario: (x.days !== null && x.prazo)
                ? (x.days > x.prazo ? 'acima do prazo' : 'dentro do prazo') : null,
              meta: x.prazo, metaLabel: x.prazo ? 'Prazo do processo: ' + x.prazo + ' dias' : null,
              /* Vermelho quando a média real já passou do prazo do processo. */
              color: (x.prazo && x.days > x.prazo) ? 'var(--danger)' : x.color,
            }))
      )
    ) : null
  );
}

/* Produção por produto e por especialista. Componente próprio porque a
   página consolidada do admin mostra as mesmas seções. */
function ProducaoSecoes({ leads, users }){
  const prod = useMemo(() => computeProducaoStats(leads, users), [leads, users]);
  return h(Fragment, null,
    /* Produção por produto: quanto cada linha entrega e quanto ainda está
       em jogo. Fica antes do funil porque é a leitura de abertura da gestão. */
    h('div',{className:'kpi-section'},
      h('div',{className:'kpi-section-head'},
        h('h2',null,'Produção por produto'),
        h('span',null,'fechado, em aberto e conversão')),
      prod.porProduto.length === 0
        ? h('div',{className:'empty-kpi'},'Nenhum negócio no recorte selecionado.')
        : h('div',{className:'producao-tabela'},
            h('div',{className:'producao-head'},
              h('span',null,'Produto'), h('span',null,'Fechado'), h('span',null,'Em aberto'),
              h('span',null,'Conversão'), h('span',null,'Ticket')),
            prod.porProduto.map(p => {
              const cor = p.produto === 'Seguro' ? '#1F6B52' : '#2E343D';
              const totalValor = p.valorGanho + p.valorAberto;
              const fatiaFechada = totalValor > 0 ? (p.valorGanho / totalValor) * 100 : 0;
              return h('div',{key:p.produto, className:'producao-linha'},
                h('span',{className:'producao-nome'},
                  h('span',{className:'stat-dot', style:{background:cor}}),
                  p.produto,
                  h('em',null, p.ganhos + ' de ' + p.total),
                  /* Barra de dois estados: quanto do valor já virou receita
                     e quanto ainda depende de fechamento. */
                  h('span',{className:'producao-barra', title: fmtBRLCompact(p.valorGanho) + ' fechado de ' + fmtBRLCompact(totalValor)},
                    h('i',{style:{width:fatiaFechada+'%', background:cor}}))
                ),
                h('span',{className:'producao-num forte'}, fmtBRLCompact(p.valorGanho)),
                h('span',{className:'producao-num'}, fmtBRLCompact(p.valorAberto),
                  h('em',null, p.abertos + ' negócio' + (p.abertos === 1 ? '' : 's'))),
                h('span',{className:'producao-num'},
                  p.conversao === null ? '—' : h('span',{className:'producao-anel',
                    style:{'--pct': p.conversao + '%', '--cor': cor}},
                    h('span',null, p.conversao + '%'))),
                h('span',{className:'producao-num'}, p.ticket === null ? '—' : fmtBRLCompact(p.ticket))
              );
            })
          )
    ),

    /* Quem entrega dentro de cada produto. A linha é a dupla especialista +
       produto: quem atende dois não pode ter os números somados. */
    h('div',{className:'kpi-section'},
      h('div',{className:'kpi-section-head'},
        h('h2',null,'Produção por especialista'),
        h('span',null,'valor fechado no período')),
      prod.porEspecialista.length === 0
        ? h('div',{className:'empty-kpi'},'Nenhum especialista com negócios no recorte.')
        : prod.porEspecialista.map((e, i) => h(BarRow,{
            key:e.id, label:e.nome + ' · ' + e.produto, posicao:i+1,
            value:e.valorGanho, max:prod.maxEspecialista,
            display: fmtBRLCompact(e.valorGanho),
            secundario: e.ganhos + ' de ' + e.total
              + (e.conversao === null ? '' : ' · ' + e.conversao + '% conversão'),
            color: e.produto === 'Seguro' ? '#1F6B52' : '#2E343D',
          }))
    )
  );
}

function KpisView({ scopedLeads, allLeads, users, vendorFilter, currentUser, periodo }){
  const stats = useMemo(() => computeKpiStats(scopedLeads, allLeads, users), [scopedLeads, allLeads, users]);

  const s = stats;
  const scopeLabel = vendorFilter === 'all' ? 'Toda a equipe' : ((users.find(u=>u.id===vendorFilter)||{}).nome || 'Toda a equipe');

  /* Fechamento do mês corrente, independente do filtro de período: é a
     pergunta "como estou este mês", que não muda de recorte. */
  const mesAtual = useMemo(() => {
    const agora = new Date();
    const chave = monthKey(agora.getTime());
    const anteriorChave = monthKey(new Date(agora.getFullYear(), agora.getMonth()-1, 1).getTime());
    const valorDe = (l) => parseValor(l.valorFechado) || parseValor(l.valorPotencial) || 0;
    const doMes = (k) => scopedLeads.filter(l => l.ganho && l.ganhoEm && monthKey(l.ganhoEm) === k);
    const atuais = doMes(chave);
    let rotulo = agora.toLocaleDateString('pt-BR',{month:'long'});
    rotulo = rotulo.charAt(0).toUpperCase() + rotulo.slice(1);
    return {
      rotulo,
      valor: atuais.reduce((a,l) => a + valorDe(l), 0),
      quantidade: atuais.length,
      anterior: doMes(anteriorChave).reduce((a,l) => a + valorDe(l), 0),
    };
  }, [scopedLeads]);
  const generatedAt = new Date().toLocaleString('pt-BR');

  return h(Fragment, null,
    h('div',{className:'print-header'},
      h('div',{className:'print-brand'}, h('span',{className:'brand-mark'}), h('span',null,'Pipeline')),
      h('h1',null,'Relatório de indicadores comerciais'),
      h('div',{className:'print-meta'}, 'Escopo: ', scopeLabel, ' · ', periodoLabel(periodo), ' · Gerado em ', generatedAt, ' por ', currentUser.nome),
      h('hr')
    ),
    h('div',{className:'kpi-grid'},
      /* Herói: o que ainda está em jogo e o que já virou receita neste mês.
         Pipeline sozinho não diz se o mês está indo bem. */
      h('div',{className:'kpi-tile navy'},
        h('div',null,
          h('div',{className:'kpi-label'},'Pipeline em aberto'),
          h('div',{className:'kpi-num'}, fmtBRLCompact(s.valorPipeline)),
          h('div',{className:'kpi-sub'},
            s.ativos.length, s.ativos.length === 1 ? ' negócio ativo' : ' negócios ativos')
        ),
        h('div',{className:'heroi-mes'},
          h('div',{className:'kpi-label'},'Fechado em ', mesAtual.rotulo),
          h('div',{className:'heroi-mes-valor'}, fmtBRLCompact(mesAtual.valor)),
          h('div',{className:'kpi-sub'},
            mesAtual.quantidade,
            mesAtual.quantidade === 1 ? ' venda no mês' : ' vendas no mês',
            mesAtual.anterior > 0
              ? h('span',{className:'heroi-mes-var' + (mesAtual.valor >= mesAtual.anterior ? '' : ' baixa')},
                  (mesAtual.valor >= mesAtual.anterior ? '▲' : '▼') + ' '
                  + Math.abs(Math.round(((mesAtual.valor - mesAtual.anterior) / mesAtual.anterior) * 100)) + '%')
              : null
          )
        )
      ),
      h('div',{className:'kpi-tile span2 success'}, h('div',{className:'kpi-label'},'Vendas fechadas'), h('div',{className:'kpi-num'}, s.ganhos.length), h('div',{className:'kpi-sub'}, fmtBRLCompact(s.valorGanho), ' faturados')),
      h('div',{className:'kpi-tile span2 danger'}, h('div',{className:'kpi-label'},'Negócios perdidos'), h('div',{className:'kpi-num'}, s.perdidos.length), h('div',{className:'kpi-sub'}, fmtBRLCompact(s.valorPerdido), ' em perdas')),
      h('div',{className:'kpi-tile span2'},
        h('div',{className:'kpi-label'},'Taxa de conversão'),
        h('div',{className:'kpi-num'}, s.taxaConversao===null ? '—' : s.taxaConversao+'%'),
        s.taxaConversao===null
          ? h('div',{className:'kpi-sub'},'sem negócios encerrados ainda')
          : h(Fragment, null,
              h('div',{className:'kpi-meter'}, h('div',{className:'kpi-meter-fill', style:{width:s.taxaConversao+'%'}})),
              h('div',{className:'kpi-sub'},'ganhos ÷ (ganhos + perdidos)')
            )
      ),
      h('div',{className:'kpi-tile span2 gold'}, h('div',{className:'kpi-label'},'Ticket médio'), h('div',{className:'kpi-num'}, s.ticketMedio===null ? '—' : fmtBRLCompact(s.ticketMedio)), h('div',{className:'kpi-sub'}, 'por venda fechada'))
    ),

    h(ProducaoSecoes,{ leads: scopedLeads, users }),

    h('div',{className:'kpi-two-col'},
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Funil de conversão'), h('span',null, 'quantos leads já alcançaram cada etapa')),
        s.funnelBase === 0 ? h('div',{className:'empty-kpi'},'Ainda não há dados suficientes.') :
        s.funnelStages.map((stage,i) => h(BarRow,{
          key:stage, label: stage === 'Fechado (venda)' ? stage : etapaCurta(stage),
          value: s.funnelCounts[i], max: s.funnelBase,
          display: s.funnelCounts[i] + ' (' + Math.round((s.funnelCounts[i]/s.funnelBase)*100) + '%)',
          color: stage==='Fechado (venda)' ? 'var(--success)' : stageInfo(stage).color,
        }))
      ),
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Ranking por vendedor'), h('span',null,'valor fechado')),
        s.vendorRanking.length === 0 ? h('div',{className:'empty-kpi'},'Nenhum vendedor cadastrado.') :
        s.vendorRanking.map(v => h(BarRow,{
          key:v.id, label: v.nome, value: v.valor, max: s.vendorMax,
          display: fmtBRLCompact(v.valor), color:'var(--primary)',
        }))
      )
    ),

    h('div',{className:'kpi-two-col'},
    h('div',{className:'kpi-section'},
      h('div',{className:'kpi-section-head'}, h('h2',null,'Evolução mensal'), h('span',null,'últimos 6 meses · toda a equipe')),
      h(GraficoMensal,{ meses: s.monthly, max: s.monthlyMax })
    ),
      h('div',{className:'kpi-section'},
        h('div',{className:'kpi-section-head'}, h('h2',null,'Tempo médio por etapa'), h('span',null,'em dias')),
        s.avgStageDays.every(x=>x.days===null) ? h('div',{className:'empty-kpi'},'Ainda sem movimentações suficientes.') :
        s.avgStageDays.map(x => h(BarRow,{
          key:x.key, label:etapaCurta(x.key), dotColor:x.color,
          value: x.days || 0, max: Math.max(1, ...s.avgStageDays.map(y=>y.days||0)),
          display: x.days===null ? '—' : x.days.toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'd',
          color: x.color,
        }))
      )
    )
  );
}

/* ================= Visão geral do funil (Bento) =================
   Substitui a antiga fileira de cards iguais. Três tamanhos de bloco:
   herói (valor em pipeline), tiles de contagem e um bloco acionável
   com os contatos vencidos — as únicas linhas da tela que pedem ação hoje. */
function PipelineOverview({ leads, onOpen, funil }){
  const cotacao = useCotacao();
  const hoje = todayISO();
  const jornada = funil !== 'especialista';
  const t = termos(funil);

  const valores = leads.map(l => parseValor(l.valorPotencial)).filter(v => v !== null);
  /* Na jornada o herói mostra o que já está sob gestão; o potencial ainda
     em disputa aparece embaixo, para os dois números não se confundirem. */
  const totalCarteira = leads.reduce((acc,l) => acc + valorEmCarteiraTotal(l, cotacao), 0);
  const totalOffshoreUsd = leads.reduce((acc,l) => acc + valorEmCarteiraOffshore(l), 0);
  const totalCaptacao = leads.reduce((acc,l) => acc + valorEmCaptacao(l, cotacao), 0);
  const totalValor = jornada ? totalCarteira : valores.reduce((a,b) => a+b, 0);

  const porEtapa = stagesDo(funil).map(s => ({
    key: s.key, color: s.color,
    count: leads.filter(l => l.etapa === s.key).length,
  }));
  const countOf = (k) => (porEtapa.find(s => s.key === k) || {}).count || 0;
  const emReuniao = countOf('R1') + countOf('R2') + countOf('R2.1');
  const emNegociacao = countOf('Negociando') + countOf('Contato Futuro');
  const avancados = countOf('R3') + countOf('R4');
  const semProximo = leads.filter(l => !l.proximoContato).length;

  const notificacoes = notificacoesDe(leads, hoje);

  return h('div',{className:'bento'},

    /* --- Herói: o número que resume o funil inteiro --- */
    h('div',{className:'bento-block bento-hero navy'},
      h('div',null,
        h('div',{className:'bento-eyebrow'}, jornada ? 'Total da carteira' : 'Valor em pipeline'),
        h('div',{className:'hero-figure'}, fmtBRL(totalValor)),
        h('div',{className:'hero-sub'},
          h('strong',null, leads.length), ' ',
          leads.length === 1 ? t.sing : t.plur,
          jornada ? ' na jornada' : ' ativos',
          jornada && totalCaptacao > 0
            ? h(Fragment, null, ' · ', h('strong',null, fmtBRLCompact(totalCaptacao)), ' em captação')
            : (valores.length < leads.length
                ? ' · ' + (leads.length - valores.length) + ' sem valor informado'
                : null)
        ),
        /* O total consolidado não deixa ver quanto está lá fora, e essa é a
           primeira pergunta de quem abriu a visão offshore. */
        (jornada && totalOffshoreUsd > 0) ? h('div',{className:'hero-offshore'},
          h('span',{className:'off-tag'},'OFF'),
          fmtUSDCompact(totalOffshoreUsd), ' offshore',
          cotacaoValida(cotacao) ? ' · já no total' : ' · fora do total, sem cotação'
        ) : null
      ),
      leads.length === 0
        ? h('div',{className:'spectrum-empty'},'Cadastre ' + t.art + ' primeiro ' + t.sing + ' para ver a distribuição.')
        : h('div',null,
            h('div',{className:'spectrum', role:'img',
              'aria-label':'Distribuição por etapa: ' + porEtapa.map(s=>etapaCurta(s.key)+', '+s.count).join('; ')},
              porEtapa.filter(s => s.count > 0).map(s =>
                h('div',{key:s.key, className:'spectrum-seg',
                  style:{flexGrow:s.count, background:s.color}})
              )
            ),
            h('div',{className:'spectrum-legend','aria-hidden':'true'},
              porEtapa.map(s => h('div',{key:s.key, className:'spectrum-key'},
                h('span',{className:'spectrum-dot', style:{background:s.color}}),
                etapaCurta(s.key), ' ', h('b',null, s.count)
              ))
            )
          )
    ),

    /* --- Tiles de contagem --- */
    h('div',{className:'bento-block bento-tile'},
      h('div',{className:'tile-figure'}, countOf('Cliente Novo')),
      h('div',{className:'tile-label'}, h('span',{className:'stat-dot', style:{background:'var(--stage-novo)'}}),
        jornada ? 'Sem primeira reunião' : 'Sem contato ainda')
    ),
    h('div',{className:'bento-block bento-tile'},
      h('div',{className:'tile-figure'}, jornada ? emReuniao : countOf('R1') + countOf('R2')),
      h('div',{className:'tile-label'}, h('span',{className:'stat-dot', style:{background:'var(--stage-r2)'}}), 'Em reunião')
    ),

    /* --- Notificações: alertas e contatos que pedem ação hoje --- */
    h('div',{className:'bento-block bento-wide'},
      h('div',{className:'attention-head'},
        h('div',{className:'bento-eyebrow'},'Notificações'),
        h('span',{className:'attention-count' + (notificacoes.length === 0 ? ' zero' : '')}, notificacoes.length)
      ),
      notificacoes.length === 0
        ? h('div',{className:'attention-empty'},
            h('div',null,'Nada pendente para hoje.'),
            h('span',null,'Alertas e contatos agendados aparecem aqui quando vencem.')
          )
        : h('div',{className:'attention-list'},
              notificacoes.map(i => h('button',{
                key:i.id, className:'attention-row', type:'button',
                onClick:()=>onOpen(i.lead),
                title:'Abrir ' + (nomeCliente(i.lead) || 'cliente'),
              },
                h('span',{className:'task-dot ' + i.urgencia, 'aria-hidden':'true'}),
                h('span',{className:'attention-row-main'},
                  h('span',{className:'attention-row-name'}, nomeCliente(i.lead)),
                  h('span',{className:'attention-row-stage'}, i.rotulo, ' · ', i.texto)
                ),
                h('span',{className:'attention-row-when ' + i.urgencia},
                  i.urgencia === 'today' ? 'hoje' : (i.data ? fmtDate(i.data) : ''))
              ))
          )
    ),

    h('div',{className:'bento-block bento-tile'},
      h('div',{className:'tile-figure'}, jornada ? countOf('Jornada Concluída') : emNegociacao),
      h('div',{className:'tile-label'}, h('span',{className:'stat-dot', style:{background: jornada ? 'var(--success)' : 'var(--stage-negociando)'}}),
        jornada ? 'Jornadas concluídas' : 'Em negociação')
    ),
    h('div',{className:'bento-block bento-tile' + (semProximo > 0 ? ' alert' : ' clear')},
      h('div',{className:'tile-figure'}, semProximo),
      h('div',{className:'tile-label'},
        h('span',{className:'stat-dot', style:{background: semProximo > 0 ? 'var(--danger)' : 'var(--success)'}}),
        'Sem próximo contato'
      )
    )
  );
}

/* ================= Board ================= */
/* Visão em lista: a carteira inteira de uma vez, ordenável. O quadro mostra
   o processo; a lista mostra a base. São perguntas diferentes — "onde cada
   cliente está" contra "o que eu tenho". */
function ListaClientes({ leads, onOpen, users, showOwner, funil, podeEditar }){
  const cotacao = useCotacao();
  const [ordem, setOrdem] = useState({ campo:'valor', desc:true });
  const jornada = funil !== 'especialista';
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome || '—';

  const valorDe = (l) => jornada
    ? valorEmCarteiraTotal(l, cotacao)
    : (parseValor(l.valorFechado) || parseValor(l.valorPotencial) || 0);

  const campos = {
    cliente:  (l) => (l.cliente || '').toLowerCase(),
    grupo:    (l) => (l.grupoFamiliar || '').toLowerCase(),
    segmento: (l) => l.segmento || '',
    etapa:    (l) => stagesDo(funil).findIndex(x => x.key === l.etapa),
    valor:    valorDe,
    /* Sem data vai para o fim: quem não tem contato agendado não é o mais
       urgente da lista, mas também não pode encabeçá-la. */
    proximo:  (l) => l.proximoContato || '9999-99-99',
    responsavel: (l) => nomeDe(l.responsavelId).toLowerCase(),
  };

  const ordenados = useMemo(() => {
    const fn = campos[ordem.campo] || campos.cliente;
    return leads.slice().sort((a,b) => {
      const va = fn(a), vb = fn(b);
      const cmp = typeof va === 'string' ? va.localeCompare(vb,'pt-BR') : (va - vb);
      return ordem.desc ? -cmp : cmp;
    });
  }, [leads, ordem, funil]);

  const alternar = (campo) => setOrdem(o =>
    o.campo === campo ? { campo, desc: !o.desc } : { campo, desc: campo === 'valor' });

  const total = ordenados.reduce((a,l) => a + valorDe(l), 0);

  const cabecalho = (campo, rotulo, classe) => h('th',{
    className: (classe || '') + (ordem.campo === campo ? ' ordenado' : ''),
    onClick:()=>alternar(campo), role:'button', tabIndex:0,
    'aria-sort': ordem.campo === campo ? (ordem.desc ? 'descending' : 'ascending') : 'none',
    onKeyDown:(e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); alternar(campo); } },
  }, rotulo, ordem.campo === campo ? h('span',{className:'lista-seta'}, ordem.desc ? '▾' : '▴') : null);

  if(leads.length === 0){
    return h('div',{className:'board-empty'},
      h('span',{className:'board-empty-mark'}),
      h('h2',null,'Nada para listar'),
      h('p',null,'Nenhum registro corresponde à busca ou aos filtros aplicados.')
    );
  }

  return h('div',{className:'lista-wrap'},
    h('table',{className:'lista'},
      h('thead',null, h('tr',null,
        cabecalho('cliente','Cliente'),
        jornada ? cabecalho('grupo','Grupo familiar') : null,
        jornada ? cabecalho('segmento','Segmento') : null,
        cabecalho('etapa','Etapa'),
        cabecalho('valor', jornada ? 'Sob gestão' : 'Valor', 'num'),
        cabecalho('proximo','Próximo contato','num'),
        showOwner ? cabecalho('responsavel','Responsável') : null
      )),
      h('tbody',null,
        ordenados.map(l => h('tr',{
          key:l.id, onClick:()=>onOpen(l), tabIndex:0,
          onKeyDown:(e)=>{ if(e.key === 'Enter'){ e.preventDefault(); onOpen(l); } },
          className: (podeEditar && !podeEditar(l)) ? 'somente-leitura' : '',
        },
          h('td',null,
            h('span',{className:'lista-cliente'},
              l.tipoPessoa === 'PJ' ? h('span',{className:'pj-tag'},'PJ') : null,
              nomeCliente(l)),
            l.oportunidade ? h('span',{className:'lista-sub'}, l.oportunidade) : null
          ),
          jornada ? h('td',{className:'lista-fraco'}, l.grupoFamiliar || '—') : null,
          jornada ? h('td',null, h('span',{className:'lista-chip'},
            h('span',{className:'stat-dot', style:{background:CORES_SEGMENTO[l.segmento]}}),
            l.segmento)) : null,
          h('td',null, h('span',{className:'lista-chip'},
            h('span',{className:'stat-dot', style:{background:stageInfo(l.etapa, l.funil).color}}),
            etapaCurta(l.etapa, l.funil))),
          h('td',{className:'num forte'}, fmtBRL(valorDe(l))),
          h('td',{className:'num'},
            l.proximoContato
              ? h('span',{className:'lista-data ' + taskUrgency(l)}, fmtDate(l.proximoContato))
              : h('span',{className:'lista-fraco'},'—')),
          showOwner ? h('td',{className:'lista-fraco'}, nomeDe(l.responsavelId)) : null
        ))
      ),
      h('tfoot',null, h('tr',null,
        h('td',{colSpan: 2 + (jornada ? 2 : 0)},
          ordenados.length + (ordenados.length === 1 ? ' registro' : ' registros')),
        h('td',{className:'num forte'}, fmtBRL(total)),
        h('td',{colSpan: showOwner ? 2 : 1})
      ))
    )
  );
}

function Board({ leads, onOpen, users, showOwner, onQuickAdd, onLose, onWin, onRequestMove, emptyAll, funil, podeEditar, podeCriar, pendentesIndicacao }){
  const [draggingId, setDraggingId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const nameFor = (id) => (users.find(u=>u.id===id)||{}).nome;
  /* Colunas recolhidas: em telas menores o funil tem 6 etapas e nem todas
     interessam ao mesmo tempo. Recolher preserva a contagem à vista. */
  const [colapsadas, setColapsadas] = useState([]);
  const recolher = (chave) => setColapsadas(prev =>
    prev.indexOf(chave) === -1 ? [...prev, chave] : prev.filter(k => k !== chave));

  /* Funil sem nenhum negócio: um convite, não cinco colunas vazias repetindo a mesma frase. */
  if(emptyAll){
    const deProduto = funil === 'especialista';
    return h('div',{className:'board-empty'},
      h('span',{className:'board-empty-mark'}),
      h('h2',null, deProduto ? 'Nenhum negócio aqui ainda' : 'Sua carteira começa aqui'),
      h('p',null, deProduto
        ? 'Os negócios deste produto chegam quando um assessor encaminha um cliente na R4.'
        : 'Cadastre o primeiro cliente para acompanhar a jornada reunião a reunião, com histórico do que foi tratado em cada etapa.'),
      (deProduto || !podeCriar) ? null
        : h('button',{className:'btn btn-primary', onClick:()=>onQuickAdd('Cliente Novo')}, h(IconPlus,{size:14}), 'Cadastrar o primeiro cliente')
    );
  }

  const draggingLead = draggingId ? leads.find(l => l.id === draggingId) : null;
  return h('div',{className:'board'},
    stagesDo(funil).map(stage => {
      const colLeads = leads.filter(l => l.etapa === stage.key);
      const valores = colLeads.map(l => parseValor(l.valorPotencial)).filter(v => v !== null);
      const total = valores.reduce((a,b) => a+b, 0);
      const isOver = overCol === stage.key;
      const isValidTarget = draggingLead && podeEditar(draggingLead) && canMove(draggingLead, stage.key);
      if(colapsadas.indexOf(stage.key) !== -1){
        return h('button',{
          key: stage.key, className:'column colapsada', type:'button',
          title:'Expandir ' + etapaLonga(stage.key, funil),
          onClick:()=>recolher(stage.key),
          /* Soltar um card sobre a coluna recolhida a expande, para o
             arrasto não ficar sem destino. */
          onDragOver:(e)=>{ e.preventDefault(); },
          onDrop:()=>recolher(stage.key),
        },
          h('span',{className:'colapsada-rule', style:{background:stage.color}}),
          h('span',{className:'colapsada-count'}, colLeads.length),
          h('span',{className:'colapsada-nome'}, etapaCurta(stage.key, funil))
        );
      }

      return h('div',{ key: stage.key, className:'column' },
        h('div',{className:'column-rule', style:{background:stage.color}}),
        h('div',{className:'column-head'},
          h('div',{className:'column-title'},
            h('div',{className:'column-title-left'}, h('span',{className:'stage-dot', style:{background:stage.color}}), h('span',null, etapaLonga(stage.key, funil))),
            h('span',{style:{display:'flex',alignItems:'center',gap:6}},
              h('span',{className:'column-count'}, colLeads.length),
              h('button',{className:'column-toggle', type:'button', title:'Recolher ' + etapaLonga(stage.key, funil),
                'aria-label':'Recolher coluna ' + etapaLonga(stage.key, funil),
                onClick:(e)=>{ e.stopPropagation(); recolher(stage.key); }},
                h(Icon,{path:'M15 18l-6-6 6-6', size:13}))
            )
          ),
          valores.length > 0 ? h('div',{className:'column-total'}, fmtBRL(total)) : null
        ),
        h('div',{
          className:'column-body' + (isOver && isValidTarget ? ' drag-over' : isOver && draggingLead && stage.key !== draggingLead.etapa ? ' drag-over-invalid' : ''),
          onDragOver:(e)=>{ e.preventDefault(); setOverCol(stage.key); },
          onDragLeave:()=>setOverCol(prev => prev===stage.key ? null : prev),
          onDrop:(e)=>{
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            if(id) onRequestMove(id, stage.key);
            setOverCol(null); setDraggingId(null);
          },
        },
          colLeads.length === 0
            ? h('div',{className:'empty-col'}, 'Nenhum lead aqui ainda.')
            : colLeads.map(lead => h(LeadCard,{
                key: lead.id, lead, onOpen, dragging: draggingId===lead.id, showOwner, onLose, onWin,
                ownerName: nameFor(lead.responsavelId),
                onAdvance: onRequestMove,
                editavel: podeEditar(lead),
                pendenteIndicacao: pendentesIndicacao && pendentesIndicacao.has(lead.id),
                onDragStart:(id)=>setDraggingId(id),
                onDragEnd:()=>{ setDraggingId(null); setOverCol(null); },
              }))
        ),
        null
      );
    })
  );
}

/* ================= App ================= */
function App(){
  const [motivoBloqueio, setMotivoBloqueio] = useState('');
  const [phase, setPhase] = useState('loading'); // loading | login | app
  const [users, setUsers] = useState([]);
  const [convites, setConvites] = useState([]);
  const [leads, setLeads] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);
  const [query, setQuery] = useState('');
  const [vendorFilter, setVendorFilter] = useState('all');
  const [openLead, setOpenLead] = useState(null);
  const [creating, setCreating] = useState(false);
  const [quickAddStage, setQuickAddStage] = useState(null);
  const [managingTeam, setManagingTeam] = useState(false);
  const [saveStatus, setSaveStatus] = useState('idle');
  const [view, setView] = useState('kanban'); // kanban | perdidos
  const [losingLead, setLosingLead] = useState(null);
  const [winningLead, setWinningLead] = useState(null);
  const [movingLead, setMovingLead] = useState(null);
  const [overviewOpen, setOverviewOpen] = useState(true);
  const [encaminhando, setEncaminhando] = useState(null);
  const [verNotificacoes, setVerNotificacoes] = useState(false);
  const [filtros, setFiltros] = useState({ ...FILTROS_VAZIOS });
  /* Cotação do dólar: uma para o app inteiro, vinda do banco. Fica aqui e não
     em cada tela porque o consolidado tem de ser o mesmo em todas elas. */
  const [cotacao, setCotacao] = useState(null);
  /* Abre no mês corrente: captação líquida é número do mês, e é esse o
     primeiro que se quer ver. A carteira não depende do período. */
  const [kpiFiltros, setKpiFiltros] = useState({
    periodo:'mes', de:'', ate:'', assessor:'all', produtos:[], especialista:'all',
    temperatura:[],
  });
  const grupos = useMemo(() => gruposExistentes(leads), [leads]);
  const [filtrosAbertos, setFiltrosAbertos] = useState(false);
  const [modoBoard, setModoBoard] = useState('quadro');   // quadro | lista
  const notificacoesMostradas = useRef(false);
  const [funil, setFunil] = useState('assessor');
  const [produtoFiltro, setProdutoFiltro] = useState(PRODUTOS[0]);
  const [toasts, setToasts] = useState([]);

  /* Fila de avisos: toda mutação agora confirma o que aconteceu.
     Antes só o bloqueio de trajeto falava com o usuário. */
  const toastSeq = useRef(0);
  const pushToast = (mensagem, tipo = 'info') => {
    const id = ++toastSeq.current;
    setToasts(prev => [...prev.slice(-2), { id, mensagem, tipo }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), tipo === 'error' ? 5000 : 3200);
  };

  const loadedOnce = useRef(false);

  /* ---------- Carga inicial e sessão ---------- */
  const carregarDados = async () => {
    const [ls, ps] = await Promise.all([ fetchLeads(), fetchProfiles() ]);
    setLeads(ls); setUsers(ps);
    /* Convites só interessam ao admin, e a política do banco recusa a
       leitura para os demais — por isso a busca fica separada e tolerante. */
    try{ setConvites(await fetchConvites()); }catch(e){ setConvites([]); }
    /* Tolerante pelo mesmo motivo: num banco onde a migração da cotação ainda
       não rodou, a tabela não existe. Sem cotação o app funciona — só não
       consolida o offshore, e diz isso na tela. */
    try{ setCotacao(await fetchConfig(COTACAO_CHAVE)); }catch(e){ setCotacao(null); }
  };

  useEffect(() => {
    if(MODO_DEMO){ semearDemo(); setPhase('login'); loadedOnce.current = true; return; }
    if(!libPronta){ setPhase('semlib'); return; }
    if(!configurado){ setPhase('config'); return; }
    if(invertido || chaveSecreta || !sb){ setPhase('chaves'); return; }
    (async () => {
      /* Login único. O portal guarda a sessão em aw_sessao, com chave
         própria; o supabase-js guarda na dele. Mesmo projeto, mesmos
         tokens — só não se enxergavam, e por isso o assessor logava
         duas vezes. Aqui a sessão do portal é adotada antes de o CRM
         procurar a sua.                                             */
      await adotarSessaoDoPortal();
      const { data } = await sb.auth.getSession();
      if(data && data.session){
        const entrou = await abrirSessao(data.session.user);
        if(!entrou) setPhase('login');
      } else {
        setPhase('login');
      }
      loadedOnce.current = true;
    })();
    /* Sessão expirada ou logout em outra aba derruba esta também. */
    const { data: sub } = sb.auth.onAuthStateChange((evento, sessao) => {
      if(evento === 'SIGNED_OUT'){
        setCurrentUser(null); setPhase('login');
        try { localStorage.removeItem('aw_sessao'); } catch(e){}
      } else if(evento === 'TOKEN_REFRESHED' || evento === 'SIGNED_IN'){
        devolverSessaoAoPortal(sessao);
      }
    });
    return () => { if(sub && sub.subscription) sub.subscription.unsubscribe(); };
  }, []);

  /* ---------- Login único com o portal ---------- */
  async function adotarSessaoDoPortal(){
    let portal = null;
    try { portal = JSON.parse(localStorage.getItem('aw_sessao') || 'null'); } catch(e){}
    if(!portal || !portal.access_token || !portal.refresh_token) return false;
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.access_token === portal.access_token) return true;
    const { error } = await sb.auth.setSession({
      access_token: portal.access_token,
      refresh_token: portal.refresh_token
    });
    if(error){
      try { localStorage.removeItem('aw_sessao'); } catch(e){}
      return false;
    }
    return true;
  }
  /* Quando o supabase-js renova o token, o portal precisa saber — senão
     fica com o token velho e cai no login na próxima visita. */
  function devolverSessaoAoPortal(sessao){
    if(!sessao || !sessao.access_token) return;
    try {
      const atual = JSON.parse(localStorage.getItem('aw_sessao') || 'null') || {};
      atual.access_token  = sessao.access_token;
      atual.refresh_token = sessao.refresh_token;
      if(sessao.expires_at) atual.expires_at = sessao.expires_at;
      if(sessao.user){ atual.id = sessao.user.id; atual.email = sessao.user.email; }
      localStorage.setItem('aw_sessao', JSON.stringify(atual));
    } catch(e){}
  }

  /* Carrega o perfil do usuário autenticado e decide se ele pode entrar. */
  const abrirSessao = async (authUser) => {
    const { data, error } = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
    /* Recusar acesso ao CRM NAO e logout. Com o login unico, derrubar a
       sessao aqui expulsaria a pessoa do portal inteiro — bastaria abrir
       o card do CRM sem ter perfil ativo para perder tudo.            */
    if(error || !data){ setMotivoBloqueio('sem-perfil'); setPhase('bloqueado'); return true; }
    if(data.status !== 'ativo'){ setMotivoBloqueio(data.status); setPhase('bloqueado'); return true; }
    setCurrentUser({ id:data.id, nome:data.nome, role:data.role, status:data.status,
      produtos:data.produtos || [], especialistasPadrao:data.especialistas_padrao || {} });
    if(data.role === 'especialista'){
      setFunil('especialista');
      const meus = (data.produtos || []).filter(x => PRODUTOS.indexOf(x) !== -1);
      if(meus.length) setProdutoFiltro(meus[0]);
    }
    await carregarDados();
    setPhase('app');
    return true;
  };

  /* ---------- Tempo real ----------
     Substitui a sincronização manual: a alteração de um colega chega
     na tela sem precisar trocar de aba. */
  useEffect(() => {
    if(phase !== 'app' || !sb || MODO_DEMO) return;
    const canal = sb.channel('leads-stream')
      .on('postgres_changes', { event:'*', schema:'public', table:'leads' }, (payload) => {
        const novo = payload.new && payload.new.id ? leadFromRow(payload.new) : null;
        if(!novo) return;
        setLeads(prev => {
          const i = prev.findIndex(l => l.id === novo.id);
          /* Ignora o eco da própria gravação para não sobrescrever o que
             o usuário já está editando na tela. */
          if(i >= 0 && prev[i].atualizadoEm >= novo.atualizadoEm) return prev;
          if(i >= 0){ const copia = prev.slice(); copia[i] = novo; return copia; }
          return [...prev, novo];
        });
      })
      .subscribe();
    return () => { sb.removeChannel(canal); };
  }, [phase]);

  /* Rede cai, aba volta: recarrega para não ficar com dados velhos. */
  useEffect(() => {
    if(phase !== 'app' || MODO_DEMO) return;
    const sincronizar = () => { if(document.visibilityState === 'visible') carregarDados().catch(()=>{}); };
    window.addEventListener('focus', sincronizar);
    return () => window.removeEventListener('focus', sincronizar);
  }, [phase]);

  /* ---------- Persistência ----------
     Grava um negócio de cada vez. Em caso de falha, o estado local segue
     com a alteração e o banner oferece nova tentativa. */
  const pendentesSalvar = useRef(new Map());

  const persistir = async (lead) => {
    pendentesSalvar.current.set(lead.id, lead);
    setSaveStatus('saving');
    try{
      await upsertLead(lead);
      pendentesSalvar.current.delete(lead.id);
      setSaveStatus(pendentesSalvar.current.size ? 'error' : 'idle');
    }catch(e){
      console.error('Falha ao salvar negócio', e);
      setSaveStatus('error');
    }
  };

  const retrySave = async () => {
    const fila = Array.from(pendentesSalvar.current.values());
    setSaveStatus('saving');
    for(const lead of fila){
      try{ await upsertLead(lead); pendentesSalvar.current.delete(lead.id); }
      catch(e){ console.error(e); }
    }
    const ok = pendentesSalvar.current.size === 0;
    setSaveStatus(ok ? 'idle' : 'error');
    if(ok) pushToast('Alterações salvas.', 'success');
  };

  /* ---------- Autenticação ---------- */
  const traduzErroAuth = (msg) => {
    const m = (msg || '').toLowerCase();
    if(m.includes('invalid login')) return 'E-mail ou senha incorretos.';
    if(m.includes('already registered') || m.includes('already been registered')) return 'Já existe uma conta com esse e-mail.';
    if(m.includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar.';
    if(m.includes('signups not allowed') || m.includes('signup is disabled')) return 'O cadastro está desativado no painel do Supabase (Authentication > Sign In / Providers > Email).';
    if(m.includes('database error')) return 'O banco recusou a criação do perfil. Verifique se o schema.sql foi executado por completo.';
    if(m.includes('password')) return 'Senha recusada: ' + msg;
    if(m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas. Aguarde um minuto.';
    /* Mostrar o texto original é melhor do que esconder a causa atrás
       de uma mensagem vaga que não ajuda ninguém a resolver. */
    return 'Erro do servidor: ' + (msg || 'sem detalhes');
  };

  const handleLogin = async (email, senha) => {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error){ console.error('login falhou:', error); return traduzErroAuth(error.message); }
    const entrou = await abrirSessao(data.user);
    return entrou ? true : 'Sua conta ainda não foi liberada por um administrador.';
  };

  const handleRegister = async (nome, email, senha) => {
    const { error } = await sb.auth.signUp({ email, password: senha, options:{ data:{ nome } } });
    if(error){ console.error('signUp falhou:', error); return traduzErroAuth(error.message); }
    await sb.auth.signOut();
    return true;
  };

  const handleReset = async (email) => {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    if(error) return traduzErroAuth(error.message);
    return true;
  };

  /* Entrada sem senha, exclusiva do modo demonstração. */
  const entrarDemo = async (userId) => {
    const perfil = demoStore.profiles.find(p => p.id === userId);
    if(!perfil) return;
    setCurrentUser({ ...perfil });
    if(perfil.role === 'especialista'){
      setFunil('especialista');
      const meus = (perfil.produtos || []).filter(x => PRODUTOS.indexOf(x) !== -1);
      if(meus.length) setProdutoFiltro(meus[0]);
    }
    await carregarDados();
    setPhase('app');
  };

  const handleLogout = async () => {
    notificacoesMostradas.current = false;
    /* Devolve a navegação ao estado inicial: o próximo login pode ser de
       alguém com outro papel, e sobra de estado da sessão anterior confunde. */
    setFunil('assessor');
    setProdutoFiltro(PRODUTOS[0]);
    setFiltros({ ...FILTROS_VAZIOS });
    setFiltrosAbertos(false);
    setView('kanban');
    if(!MODO_DEMO) await sb.auth.signOut();
    setCurrentUser(null); setLeads([]); setPhase('login');
    setQuery(''); setVendorFilter('all'); setView('kanban');
  };

  /* ---------- Equipe ---------- */
  /* O banco fala snake_case; o estado do app, camelCase. Traduz o patch
     em vez de mandar chaves inexistentes para o Postgres. */
  const perfilParaLocal = (campos) => {
    const local = { ...campos };
    if('especialistas_padrao' in campos){
      local.especialistasPadrao = campos.especialistas_padrao;
      delete local.especialistas_padrao;
    }
    return local;
  };

  const atualizarPerfil = async (userId, campos, mensagem) => {
    if(MODO_DEMO){
      const local = perfilParaLocal(campos);
      const i = demoStore.profiles.findIndex(p => p.id === userId);
      if(i >= 0) demoStore.profiles[i] = { ...demoStore.profiles[i], ...local };
      setUsers(prev => prev.map(u => u.id===userId ? { ...u, ...local } : u));
      pushToast(mensagem, 'success');
      return;
    }
    const { error } = await sb.from('profiles').update(campos).eq('id', userId);
    if(error){ console.error(error); pushToast('Não foi possível salvar a alteração na equipe.', 'error'); return; }
    setUsers(prev => prev.map(u => u.id===userId ? { ...u, ...perfilParaLocal(campos) } : u));
    pushToast(mensagem, 'success');
  };

  const ROTULO_PAPEL = { admin:'administrador', especialista:'especialista', vendedor:'assessor' };

  /* Muda o papel preservando o resto do perfil. Sair de especialista limpa
     os produtos, porque eles só fazem sentido nesse papel — e mantê-los
     escondidos faria a pessoa voltar a receber indicações sem querer. */
  const definirRole = (userId, role) => {
    const alvo = users.find(u => u.id === userId);
    if(!alvo || alvo.role === role) return;
    const campos = { role };
    if(role !== 'especialista') campos.produtos = [];
    atualizarPerfil(userId, campos, alvo.nome + ' agora é ' + (ROTULO_PAPEL[role] || role) + '.');
  };

  const definirProdutos = (userId, produtos) => {
    const alvo = users.find(u => u.id === userId);
    if(!alvo) return;
    atualizarPerfil(userId, { produtos },
      produtos.length
        ? alvo.nome + ' atende ' + produtos.join(' e ') + '.'
        : alvo.nome + ' ficou sem produto atribuído.');
  };

  /* Guarda a dupla no perfil do assessor: é acordo de time, não do cliente. */
  const definirPadrao = (userId, produto, especialistaId) => {
    const alvo = users.find(u => u.id === userId);
    if(!alvo) return;
    const mapa = { ...(alvo.especialistasPadrao || {}) };
    if(especialistaId) mapa[produto] = especialistaId; else delete mapa[produto];
    const nomeEsp = (users.find(u => u.id === especialistaId) || {}).nome;
    atualizarPerfil(userId, { especialistas_padrao: mapa },
      especialistaId ? produto + ' de ' + alvo.nome.split(' ')[0] + ' vai para ' + nomeEsp + '.'
                     : 'Padrão de ' + produto + ' removido.');
  };

  /* Convite: o admin define quem a pessoa será; ela define a própria senha
     ao se cadastrar com esse e-mail. O casamento acontece no banco. */
  const criarConvite = async (dados) => {
    const email = dados.email.trim().toLowerCase();
    if(users.some(u => (u.email || '').toLowerCase() === email)){
      pushToast('Já existe uma conta com esse e-mail.', 'error'); return false;
    }
    if(convites.some(c => c.email.toLowerCase() === email)){
      pushToast('Esse e-mail já foi convidado.', 'error'); return false;
    }
    const novo = { email, nome: dados.nome.trim(), role: dados.role,
      produtos: dados.role === 'especialista' ? dados.produtos : [], criadoEm: Date.now() };

    if(MODO_DEMO){
      demoStore.convites.unshift(novo);
      setConvites([novo, ...convites]);
      pushToast('Convite criado para ' + novo.nome + '.', 'success');
      return true;
    }
    const { error } = await sb.from('convites').insert({
      email: novo.email, nome: novo.nome, role: novo.role,
      produtos: novo.produtos, criado_por: currentUser.id,
    });
    if(error){ console.error(error); pushToast('Não foi possível criar o convite.', 'error'); return false; }
    setConvites([novo, ...convites]);
    pushToast('Convite criado para ' + novo.nome + '.', 'success');
    return true;
  };

  const cancelarConvite = async (email) => {
    if(MODO_DEMO){
      demoStore.convites = demoStore.convites.filter(c => c.email !== email);
    } else {
      const { error } = await sb.from('convites').delete().eq('email', email);
      if(error){ console.error(error); pushToast('Não foi possível cancelar.', 'error'); return; }
    }
    setConvites(convites.filter(c => c.email !== email));
    pushToast('Convite cancelado.', 'success');
  };

  const approveUser = (userId) => {
    const alvo = users.find(u => u.id === userId);
    atualizarPerfil(userId, { status:'ativo' }, (alvo ? alvo.nome : 'Conta') + ' liberado para entrar.');
  };

  /* Redefinir senha é feito pelo próprio usuário, por e-mail: o app nunca
     manipula credenciais de outra pessoa. */
  const resetPin = async (userId) => {
    const alvo = users.find(u => u.id === userId);
    const { data, error } = await sb.from('profiles').select('id').eq('id', userId).maybeSingle();
    if(error || !data){ pushToast('Perfil não encontrado.', 'error'); return; }
    pushToast('Peça para ' + (alvo ? alvo.nome : 'a pessoa') + ' usar "Esqueci minha senha" na tela de entrada.', 'info');
  };

  /* Sem chave de serviço no navegador não dá para apagar a conta de login.
     Marcar como removido bloqueia o acesso pelas políticas do banco. */
  const removeUser = async (userId, destinoId) => {
    const alvo = users.find(u => u.id === userId);
    if(destinoId){
      const daPessoa = ativos(leads).filter(l => l.responsavelId === userId);
      for(const l of daPessoa){
        const movido = stampLead({ ...l, responsavelId: destinoId });
        setLeads(prev => prev.map(x => x.id===l.id ? movido : x));
        await persistir(movido);
      }
    }
    await atualizarPerfil(userId, { status:'removido' },
      (alvo ? alvo.nome : 'Conta') + ' removido' + (destinoId ? ' e carteira transferida.' : '.'));
  };

  const isAdmin = currentUser && currentUser.role === 'admin';
  const pendentes = users.filter(u => u.status === 'pendente');

  /* Pinta a interface conforme o contexto aberto. Fica no body porque o
     cabeçalho é HTML estático, fora da árvore do React. */
  const tema = temaDe(funil, produtoFiltro);
  useEffect(() => {
    document.body.dataset.tema = phase === 'app' ? tema : 'jornada';
    /* O admin transita pelos três contextos: a faixa dourada no cabeçalho
       lembra que ele está vendo tudo, não só a própria carteira. */
    if(phase === 'app' && isAdmin) document.body.dataset.papel = 'admin';
    else delete document.body.dataset.papel;
    const alvo = document.getElementById('contexto-atual');
    if(alvo) alvo.textContent = phase === 'app' ? (TEMAS[tema] || {}).rotulo || '' : '';
  }, [tema, phase, isAdmin]);

  /* Precisa varrer todos os leads: os cards de indicação pertencem ao
     especialista e não aparecem no escopo do assessor. */
  const pendentesIndicacao = useMemo(() => {
    const vivos = ativos(leads);
    return new Set(vivos.filter(l => semIndicacao(vivos, l)).map(l => l.id));
  }, [leads]);

  /* O aviso de entrada considera tudo que é do usuário, sem depender do
     funil aberto ou da aba de produto selecionada. */
  const minhasNotificacoes = useMemo(() => {
    if(!currentUser) return [];
    const meus = ativos(leads).filter(l =>
      !saiuDoQuadro(l) && (isAdmin || l.responsavelId === currentUser.id));
    const hoje = todayISO();
    const indicar = meus.filter(l => pendentesIndicacao.has(l.id)).map(l => ({
      id: l.id + ':indicar', leadId: l.id, lead: l,
      classe: 'indicacao', rotulo: 'Indicação pendente',
      texto: 'Chegou na R4 sem negócio indicado ao especialista',
      data: null, urgencia: 'late',
    }));
    return [...indicar, ...notificacoesDe(meus, hoje)];
  }, [leads, currentUser, isAdmin, pendentesIndicacao]);

  /* Aparece uma vez por sessão, quando há algo pendente. */
  useEffect(() => {
    if(phase !== 'app' || notificacoesMostradas.current) return;
    if(!loadedOnce.current) return;
    notificacoesMostradas.current = true;
    if(minhasNotificacoes.length > 0) setVerNotificacoes(true);
  }, [phase, minhasNotificacoes]);

  /* Especialista só enxerga os produtos que atende; admin e assessor veem todos. */
  const produtosVisiveis = useMemo(() => {
    if(!currentUser) return PRODUTOS;
    if(currentUser.role === 'especialista' && (currentUser.produtos || []).length)
      return PRODUTOS.filter(p => currentUser.produtos.indexOf(p) !== -1);
    return PRODUTOS;
  }, [currentUser]);

  /* O seletor de produto mostra o que há em cada funil: escolher às cegas
     entre dois nomes é pior do que escolher vendo volume e urgência. */
  const negociosPorProduto = useMemo(() => {
    if(!currentUser) return {};
    const meus = ativos(leads).filter(l =>
      l.funil === 'especialista' && !l.ganho && !l.perdido && (
        isAdmin
        || l.responsavelId === currentUser.id
        || (l.origemLeadId && leads.some(o => o.id === l.origemLeadId && o.responsavelId === currentUser.id))
      ));
