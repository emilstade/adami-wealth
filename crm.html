        h('div',{className:'field-hint'}, (ESTEIRAS.find(e=>e.key===initial.esteira)||ESTEIRAS[0]).desc)
      ),
      h('div',{className:'field'},
        h('label',null,'Como chegou'),
        h('select',{ value:initial.origem || '', onChange:set('origem') },
          h('option',{value:''},'Não informado'),
          ORIGENS.map(o => h('option',{key:o, value:o}, o)))
      )
    ) : h(Fragment, null,
      /* Perfil financeiro só no Seguro: é o que orienta a análise de risco
         e a composição da apólice. Consórcio não usa esses dados. */
      seguro ? h('div',{className:'field-row'},
        h('div',{className:'field'},
          h('label',null,'Patrimônio'),
          h('input',{ value:initial.patrimonio || '', onChange:set('patrimonio'),
            inputMode:'decimal', placeholder:'Ex: 1200000',
            onBlur:(e)=>{ const n = parseValor(e.target.value); onChange({ ...initial, patrimonio: n === null ? '' : fmtBRL(n) }); } })
        ),
        h('div',{className:'field'},
          h('label',null,'Renda mensal'),
          h('input',{ value:initial.renda || '', onChange:set('renda'),
            inputMode:'decimal', placeholder:'Ex: 25000',
            onBlur:(e)=>{ const n = parseValor(e.target.value); onChange({ ...initial, renda: n === null ? '' : fmtBRL(n) }); } })
        )
      ) : null,
      seguro ? h('div',{className:'field'},
        h('label',null,'Estado civil'),
        h('select',{ value:initial.estadoCivil || '', onChange:set('estadoCivil') },
          h('option',{value:''},'Não informado'),
          ESTADOS_CIVIS.map(e => h('option',{key:e, value:e}, e)))
      ) : null,
      /* Mesma lista usada na indicação do assessor, escolhida pelo produto
         do card. Vale para os dois CRMs de produto. */
      (INTERESSES[initial.produto] || []).length > 0 ? h('div',{className:'field'},
        h('label',null,'Interesse'),
        h('div',{className:'filtro-chips'},
          INTERESSES[initial.produto].map(i => h('button',{
            key:i, type:'button',
            className:'filtro-chip' + ((initial.briefing || {}).interesse === i ? ' ativo' : ''),
            /* O nome do negócio vem do produto e do interesse — mesma regra
               usada quando o assessor indica, para os dois caminhos gerarem
               o mesmo rótulo no card e na busca. */
            onClick:()=>onChange({ ...initial,
              briefing: { ...(initial.briefing || {}), interesse: i },
              oportunidade: initial.produto + ' — ' + i }),
          }, i))
        )
      ) : null
    ),
    h('div',{className:'field-row'},
      h('div',{className:'field'},
        h('label',null,'Telefone'),
        h('input',{ value:initial.telefone, onChange:set('telefone'), placeholder:'(51) 99999-0000' })
      ),
      h('div',{className:'field'},
        h('label',null,'E-mail'),
        h('input',{ type:'email', value:initial.email, onChange:set('email'), placeholder:'nome@empresa.com' })
      )
    ),
    jornada
      ? h('div',{className:'field-row'},
          h('div',{className:'field'},
            h('label',null, rot.patrimonio),
            h('input',{ value:initial.valorPotencial, onChange:set('valorPotencial'),
              inputMode:'decimal', placeholder:'Ex: 2500000', onBlur:normalizarPatrimonio }),
            /* Em cliente da base, patrimônio e sob gestão são coisas
               diferentes, e o formulário precisa dizer isso: quem corrige o
               patrimônio espera ver a carteira mudar, e ela não muda. */
            h('div',{className:'field-hint'}, (initial.esteira || 'novo') !== 'base'
              ? 'Define o segmento automaticamente.'
              : cadastro
              ? 'Cliente da base: no cadastro, este valor vira o saldo sob gestão. Depois, só movimentação e a importação do BTG o alteram.'
              : 'Não altera o sob gestão' + (parseValor(initial.saldoInicial) !== null ? ' (' + fmtBRL(valorEmCarteira(initial)) + ')' : '')
                + ': ele muda por movimentação ou pela importação do BTG.')
          ),
          h('div',{className:'field'},
            h('label',null,'Segmento'),
            h('select',{ value:initial.segmento, onChange:set('segmento') },
              SEGMENTOS.map(sg => h('option',{key:sg.key, value:sg.key}, sg.key))),
            h('div',{className:'field-hint'}, (SEGMENTOS.find(sg=>sg.key===initial.segmento)||SEGMENTOS[0]).faixa)
          )
        )
      : h('div',{className:'field'},
          h('label',null,'Valor do negócio (opcional)'),
          h('input',{
            value:initial.valorPotencial, onChange:set('valorPotencial'),
            inputMode:'decimal', placeholder:'Ex: 15000',
            onBlur:(e)=>{
              const n = parseValor(e.target.value);
              onChange({ ...initial, valorPotencial: n === null ? '' : fmtBRL(n) });
            },
          }),
          h('div',{className:'field-hint'},'Digite só o número. Ao sair do campo ele é formatado em reais.')
        ),

    /* Offshore em dólar, não em reais: é como o custodiante informa, e o
       número não pode depender da cotação do dia em que foi digitado. O
       segmento continua saindo do patrimônio no Brasil — quem decide isso é o
       processo comercial, não este campo. */
    jornada ? h('div',{className:'field'},
      h('label',null,'Patrimônio offshore (US$)'),
      h('input',{ value:initial.valorOffshore || '', onChange:set('valorOffshore'),
        inputMode:'decimal', placeholder:'Ex: 380000',
        onBlur:(e)=>{ const n = parseValor(e.target.value);
          onChange({ ...initial, valorOffshore: n === null ? '' : fmtUSD(n) }); } }),
      /* Mesma regra do patrimônio no Brasil: o campo é o que o cliente tem,
         e o sob gestão é o que se captou. O texto diz isso a quem esperaria
         ver a carteira mudar ao digitar. */
      h('div',{className:'field-hint'},
        !(clienteDaBase(initial) || initial.ganho)
          ? 'Patrimônio declarado no exterior. Só entra na carteira pelo valor captado, quando a captação for efetivada.'
          : cadastro
          ? 'Cliente da base: no cadastro, este valor vira o saldo offshore sob gestão. Depois, só captação, movimentação offshore e a importação do AuC o alteram.'
          : 'Patrimônio que o cliente tem no exterior. Não altera o sob gestão offshore'
            + (parseValor(initial.saldoInicialOffshore) !== null ? ' (' + fmtUSD(valorEmCarteiraOffshore(initial)) + ')' : '')
            + ': ele muda por movimentação offshore ou pela importação do AuC.')
    ) : null,

    /* Só aparece para quem tem offshore: para a maioria da base seria um
       campo vazio a mais. Quem preenche é a importação do AuC, pela conta
       onshore; aqui é para conferir e, se preciso, corrigir. */
    jornada && (initial.contaOffshore || parseValor(initial.valorOffshore) !== null) ? h('div',{className:'field'},
      h('label',null,'Conta offshore'),
      h('input',{ value:initial.contaOffshore || '', onChange:set('contaOffshore'),
        placeholder:'Ex: BPXX000123' }),
      h('div',{className:'field-hint'}, initial.contaOffshore
        ? 'Ligada pela importação do AuC offshore. Só altere para corrigir um vínculo errado.'
        : 'Em branco até a importação do AuC offshore encontrar este cliente pela conta BTG.')
    ) : null,

    jornada ? h('div',{className:'field-row'},
      h('div',{className:'field'},
        h('label',null, rot.oQueFaz),
        h('input',{ value:initial.profissao || '', onChange:set('profissao'), placeholder:rot.oQueFazPlaceholder })
      ),
      h('div',{className:'field'},
        h('label',null, pj ? 'Onde os recursos estão hoje' : 'Onde o patrimônio está hoje'),
        h('input',{ value:initial.bancoAtual || '', onChange:set('bancoAtual'), placeholder:'Ex: Itaú, XP, imóveis' })
      )
    ) : null,
    /* Some junto com a tag: deixar o campo aqui depois da captação seria um
       controle que não muda nada em tela nenhuma.
       Clicar de novo na mesma temperatura limpa: voltar para "não
       classificado" precisa ser possível sem apagar o cliente e recriar. */
    /* Cliente da base não tem valor nem temperatura de captação no cadastro:
       a captação dele se informa e se confirma na ficha, no bloco "Captação
       em negociação". Um segundo caminho aqui deixaria temperatura sem
       captação, ou captação sem histórico. */
    (initial.ganho || clienteDaBase(initial)) ? null : h('div',{className:'field'},
      h('label',null,'Temperatura'),
      h('div',{className:'filtro-chips'},
        TEMPERATURAS.map(t => h('button',{
          key:t.key, type:'button',
          className:'filtro-chip temp-chip' + ((initial.temperatura || '') === t.key ? ' ativo' : ''),
          onClick:()=>onChange({ ...initial, temperatura: (initial.temperatura || '') === t.key ? '' : t.key }),
        }, h('span',{className:'temp-dot', style:{background:t.cor}}), t.label))
      ),
      h('div',{className:'field-hint'}, temperaturaInfo(initial.temperatura)
        ? descTemperatura(initial.temperatura, initial)
        : 'Sem classificação. Registra como o cliente responde, não em que etapa ele está.')
    ),

    h('div',{className:'field-row'},
      h('div',{className:'field'},
        h('label',null,'Data do último contato'),
        h('input',{ type:'date', value:initial.ultimoContato, onChange:set('ultimoContato') })
      ),
      h('div',{className:'field'},
        h('label',null,'Data do próximo contato'),
        h('input',{ type:'date', value:initial.proximoContato, onChange:set('proximoContato') })
      )
    ),
    h('div',{className:'field-row'},
      h('div',{className:'field'},
        h('label',null,'Etapa'),
        stageEditable
          ? h('select',{ value:initial.etapa, onChange:set('etapa') }, stagesDo(initial.funil).map(s => h('option',{ key:s.key, value:s.key }, etapaLonga(s.key, initial.funil))))
          : h(Fragment, null,
              h('div',{className:'stage-lock'}, h('span',{className:'stage-dot', style:{background:stageInfo(initial.etapa, initial.funil).color}}), etapaLonga(initial.etapa, initial.funil)),
              h('div',{className:'field-hint'}, 'Mude a etapa pelo funil, com um resumo do que foi feito.')
            )
      ),
      h('div',{className:'field'},
        h('label',null,'Responsável pel' + t.art + ' ' + t.sing),
        isAdmin
          ? h('select',{ value:initial.responsavelId, onChange:set('responsavelId') },
              /* Só quem trabalha neste funil. Um cliente da Jornada entregue a
                 um especialista sumia da vista dos assessores — o especialista
                 só enxerga o funil de produto —, e o inverso com um negócio.
                 Quem já está atribuído continua na lista, para um registro
                 antigo não perder o responsável ao ser editado. */
              users.filter(u => u.id === initial.responsavelId
                || (jornada ? u.role !== 'especialista' : (u.role === 'especialista' || u.role === 'admin')))
                .map(u => h('option',{ key:u.id, value:u.id }, u.nome)))
          : h(Fragment,null, h('input',{ value: ownerName || currentUser.nome, disabled:true }))
      )
    ),
    h('div',{className:'field'},
      h('label',null,'Observações'),
      h('textarea',{ value:initial.observacoes, onChange:set('observacoes'), placeholder:'Data do contato, o que foi conversado, retorno do cliente, próximo passo...' })
    )
  );
}

/* ================= Create Modal ================= */
function CreateModal({ onClose, onCreate, users, currentUser, isAdmin, initialStage, funil, grupos, produto }){
  useEsc(onClose);
  /* Todo cliente entra pela primeira etapa: a jornada é sequencial e o
     avanço exige o resumo do que foi feito na reunião. */
  /* O produto vem da aba aberta: sem ele o card nasceria fora de qualquer
     CRM de produto e sumiria da tela logo após ser criado. */
  const [lead, setLead] = useState({ ...emptyLead(currentUser.id),
    funil: funil || 'assessor', etapa: 'Cliente Novo',
    produto: funil === 'especialista' ? (produto || '') : '' });
  const [errors, setErrors] = useState({});
  const submit = () => {
    if(!lead.cliente.trim()){ setErrors({ cliente: 'Informe o nome do cliente.' }); return; }
    onCreate(lead);
  };
  return h('div',{className:'overlay', onClick:(e)=>{ if(e.target===e.currentTarget) onClose(); }},
    h('div',{className:'modal'},
      h('div',{className:'modal-head'}, h('h2',null, funil === 'especialista' && produto ? termos(funil).novo + ' · ' + produto : termos(funil).novo), h('button',{className:'modal-close', onClick:onClose}, h(IconX,{size:18}))),
      h('div',{className:'modal-body'}, h(LeadForm, { grupos, initial: lead, onChange:(v)=>{ setLead(v); if(errors.cliente && v.cliente.trim()) setErrors({}); }, errors, users, currentUser, isAdmin, stageEditable:false, cadastro:true })),
      h('div',{className:'modal-foot'},
        h('button',{className:'btn btn-ghost', onClick:onClose}, 'Cancelar'),
        h('button',{className:'btn btn-primary', onClick:submit}, h(IconPlus,{size:14}), 'Salvar ' + termos(funil).sing)
      )
    )
  );
}

/* ================= Detail Modal ================= */
/* Movimentações e atividades na mesma linha do tempo — quem lê quer a
   história da negociação, não dois registros paralelos. Fica fora do modal
   porque a tela de fechados e perdidos mostra a mesma coisa. */
function linhaDoTempo(lead){
  const historico = (lead && lead.historico) || [];
  const atividades = (lead && lead.atividades) || [];
  return [
    ...historico.map(item => ({
      id: item.id, quando: item.data, ordem: item.data,
      titulo: item.de ? (etapaCurta(item.de, lead.funil) + ' → ' + etapaCurta(item.para, lead.funil))
                      : ('Lead criado em ' + etapaCurta(item.para, lead.funil)),
      corpo: item.resumo, autor: item.autor, marcador: item.correcao ? 'correcao' : 'etapa',
    })),
    ...atividades.map(a => ({
      id: a.id, quando: a.criadoEm, ordem: new Date(a.data + 'T12:00:00').getTime(),
      titulo: tipoAtividadeLabel(a.tipo), corpo: a.nota, autor: a.autor,
      marcador: 'atividade', dataLabel: fmtDate(a.data),
    })),
  ].sort((a,b) => b.ordem - a.ordem);
}

/* Lista de registros, sem edição. Usada no modal e na tela de encerrados. */
function Timeline({ itens }){
  if(itens.length === 0) return h('div',{className:'history-empty'}, 'Nada registrado ainda.');
  return h('div',{className:'history-list'},
    itens.map(item => h('div',{key:item.id, className:'history-item'},
      h('span',{className:'history-item-dot ' + item.marcador}),
      h('div',{className:'history-item-body'},
        h('div',{className:'history-item-top'},
          h('span',{className:'history-item-move'},
            item.marcador === 'correcao' ? 'Correção · ' + item.titulo : item.titulo),
          h('span',{className:'history-item-date'}, item.dataLabel || new Date(item.quando).toLocaleDateString('pt-BR'))
        ),
        h('div',{className:'history-item-resumo'}, item.corpo),
        h('div',{className:'history-item-autor'}, 'por ', item.autor)
      )
    ))
  );
}

/* ================= Ficha do cliente =================
   Modo de consulta: o que o assessor precisa ver antes de uma ligação,
   sem campos de formulário no caminho. A edição fica atrás de um botão. */
function Ficha({ lead, users, grupo }){
  const jornada = (lead.funil || 'assessor') !== 'especialista';
  const info = stageInfo(lead.etapa, lead.funil);
  const rot = rotulosPessoa(lead.tipoPessoa || 'PF');
  const responsavel = (users.find(u => u.id === lead.responsavelId) || {}).nome;
  const cotacao = useCotacao();
  const patrimonio = parseValor(lead.valorPotencial);
  const offshoreUsd = valorEmCarteiraOffshore(lead);
  const emCarteiraOnshore = valorEmCarteira(lead);
  const emCarteira = valorEmCarteiraTotal(lead, cotacao);
  const sla = slaRestante(lead);
  const urgencia = taskUrgency(lead);
  const feitos = onboardingFeitos(lead).length;
  const seguro = lead.produto === 'Seguro';


  const linha = (rotulo, valor, href) => valor ? h('div',{className:'ficha-linha'},
    h('span',{className:'ficha-rotulo'}, rotulo),
    href ? h('a',{className:'ficha-valor link', href}, valor) : h('span',{className:'ficha-valor'}, valor)
  ) : null;

  const tile = (rotulo, valor, classe) => h('div',{className:'ficha-tile ' + (classe || '')},
    h('span',{className:'ficha-tile-rotulo'}, rotulo),
    h('span',{className:'ficha-tile-valor'}, valor)
  );

  return h('div',{className:'ficha'},
    /* Identificação: quem é, em que segmento e em que ponto da jornada. */
    h('div',{className:'ficha-topo'},
      h('div',{className:'ficha-tags'},
        h('span',{className:'ficha-etapa', style:{background:info.color}}, etapaLonga(lead.etapa, lead.funil)),
        temperaturaDe(lead) ? h('span',{className:'ficha-tag'},
          h('span',{className:'temp-dot', style:{background:temperaturaDe(lead).cor}}),
          temperaturaDe(lead).label + (clienteDaBase(lead) ? ' · captação' : '')) : null,
        h('span',{className:'ficha-tag'}, lead.tipoPessoa === 'PJ' ? 'Pessoa jurídica' : 'Pessoa física'),
        jornada ? h('span',{className:'ficha-tag'}, lead.segmento) : null,
        jornada ? h('span',{className:'ficha-tag'},
          (ESTEIRAS.find(e => e.key === (lead.esteira || 'novo')) || ESTEIRAS[0]).label) : null,
        lead.produto ? h('span',{className:'ficha-tag'}, lead.produto) : null,
        lead.grupoFamiliar ? h('span',{className:'ficha-tag gold'}, lead.grupoFamiliar) : null,
        temOffshore(lead) ? h('span',{className:'ficha-tag off'},
          h('span',{className:'off-tag'},'OFF'), lead.contaOffshore ? 'Offshore · ' + lead.contaOffshore : 'Offshore') : null
      ),
      lead.oportunidade ? h('p',{className:'ficha-oportunidade'}, lead.oportunidade) : null
    ),

    /* Os quatro números que decidem se vale ligar agora. */
    h('div',{className:'ficha-tiles'},
      /* `patrimonio === null` não basta mais para dizer "sem dado": existe
         cliente que só tem carteira lá fora. */
      tile(jornada ? (emCarteira > 0 ? 'Sob gestão' : 'Patrimônio estimado') : 'Valor',
        (patrimonio === null && emCarteira === 0) ? '—' : fmtBRLCompact(emCarteira > 0 ? emCarteira : patrimonio),
        emCarteira > 0 ? 'ok' : ''),
      tile('Próximo contato',
        lead.proximoContato ? fmtDate(lead.proximoContato) : 'Sem data',
        urgencia === 'late' ? 'alerta' : urgencia === 'today' ? 'atencao' : ''),
      jornada
        ? tile('SLA da etapa',
            sla === null ? 'Sem prazo' : (sla < 0 ? Math.abs(sla) + 'd em atraso' : sla + 'd restantes'),
            sla !== null && sla < 0 ? 'alerta' : '')
        : tile('Último contato', lead.ultimoContato ? fmtDate(lead.ultimoContato) : '—'),
      jornada
        ? tile('Onboarding', feitos + '/' + ONBOARDING.length, feitos === ONBOARDING.length ? 'ok' : '')
        : tile('Responsável', responsavel || '—')
    ),

    /* Com as duas custódias, o total sozinho esconde a informação que
       interessa: quanto está fora e por qual câmbio isso entrou na conta. */
    (jornada && offshoreUsd >= OFFSHORE_PISO_USD) ? h('div',{className:'ficha-custodias'},
      h('div',{className:'custodia-linha'},
        h('span',{className:'custodia-rotulo'},'Onshore'),
        h('span',{className:'custodia-valor'}, fmtBRL(emCarteiraOnshore))),
      h('div',{className:'custodia-linha'},
        h('span',{className:'custodia-rotulo'}, h('span',{className:'off-tag'},'OFF'), 'Offshore'),
        h('span',{className:'custodia-valor'}, fmtUSD(offshoreUsd))),
      cotacaoValida(cotacao)
        ? h('div',{className:'custodia-nota'},
            'Convertido a ', fmtBRL(cotacao.valor), ' por dólar',
            cotacao.atualizadoEm ? ' · cotação de ' + fmtDate(toISODate(new Date(cotacao.atualizadoEm))) : '',
            ' · total ', h('b',null, fmtBRL(emCarteira)))
        : h('div',{className:'custodia-nota alerta'},
            'Sem cotação do dólar definida: o offshore ainda não entra no total da carteira.')
    ) : null,

    /* Contato e contexto, em leitura corrida. */
    h('div',{className:'ficha-dados'},
      lead.tipoPessoa === 'PJ' ? linha('Contato',
        [lead.contatoNome, lead.contatoCargo].filter(Boolean).join(' · ')) : null,
      linha('Telefone', lead.telefone, lead.telefone ? 'tel:' + lead.telefone.replace(/\D/g,'') : null),
      linha('E-mail', lead.email, lead.email ? 'mailto:' + lead.email : null),
      lead.nascimento ? h('div',{className:'ficha-linha' + (aniversarioHoje(lead) ? ' festa' : '')},
        h('span',{className:'ficha-rotulo'}, lead.tipoPessoa === 'PJ' ? 'Aniversário do contato' : 'Nascimento'),
        h('span',{className:'ficha-valor'}, fmtDate(lead.nascimento),
          lead.tipoPessoa === 'PJ' && aniversarianteDe(lead)
            ? h('span',{className:'ficha-idade'}, ' · ' + aniversarianteDe(lead)) : null,
          idadeEm(lead) ? h('span',{className:'ficha-idade'}, ' · ' + idadeEm(lead) + ' anos') : null,
          aniversarioHoje(lead) ? h('span',{className:'ficha-hoje'},'é hoje') : null)
      ) : null,
      linha(rot.oQueFaz, lead.profissao),
      /* Perfil financeiro: exclusivo do Seguro. */
      seguro ? linha('Patrimônio', lead.patrimonio) : null,
      seguro ? linha('Renda mensal', lead.renda) : null,
      seguro ? linha('Estado civil', lead.estadoCivil) : null,
      jornada ? linha('Recursos hoje em', lead.bancoAtual) : null,
      jornada ? linha('Como chegou', lead.origem) : null,
      linha('Responsável', responsavel),
      lead.ganho && jornada ? linha('Captado em', new Date(lead.ganhoEm).toLocaleDateString('pt-BR')) : null
    ),

    /* Interesse e perfil: vindos da indicação do assessor ou preenchidos
       no cadastro manual. */
    (!jornada && lead.briefing && (lead.briefing.interesse || lead.briefing.perfil)) ? h('div',{className:'brief-ficha'},
      h('div',{className:'brief-titulo'},
        'Indicação do assessor',
        /* Quem indicou fica registrado na primeira linha do histórico. */
        h('span',null, ((lead.historico || [])[0] || {}).autor || '')
      ),
      /* Duas etiquetas numa linha só: o rótulo por extenso ocupava mais
         espaço do que o próprio dado. */
      h('div',{className:'brief-linhas'},
        lead.briefing.interesse ? h('span',{className:'brief-chip'}, lead.briefing.interesse) : null,
        lead.briefing.urgencia ? h('span',{className:'brief-chip'},
          h(Icon,{path:'M12 6v6l4 2M12 22a10 10 0 100-20 10 10 0 000 20z', size:11}),
          lead.briefing.urgencia) : null
      ),
      lead.briefing.perfil ? h('p',{className:'brief-perfil'}, lead.briefing.perfil) : null
    ) : null,

    lead.observacoes ? h('div',{className:'ficha-obs'},
      h('div',{className:'ficha-rotulo'},'Observações'),
      h('p',null, lead.observacoes)
    ) : null
  );
}

function DetailModal({ lead, onClose, onSave, onDelete, users, currentUser, isAdmin, onLose, onWin, onMove, onAddActivity, onCorrectStage, somenteLeitura, onEncaminhar, onTogglePauta, onAddAlerta, onResolverAlerta, onRemoverAlerta, grupos, grupo, pendenteIndicacao, onAddMov, onRemoverMov, onIniciarCaptacao, onConfirmarCaptacao, onEncerrarCaptacao }){
  useEsc(onClose);
  const [draft, setDraft] = useState(lead);
  const [errors, setErrors] = useState({});
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [novaAtiv, setNovaAtiv] = useState({ tipo:'ligacao', data: todayISO(), nota:'' });
  const [novoAlerta, setNovoAlerta] = useState({ tipo:'vencimento', data:'', texto:'' });
  const [alertaErro, setAlertaErro] = useState('');
  const [criandoAlerta, setCriandoAlerta] = useState(false);
  const [novaMov, setNovaMov] = useState({ tipo:'aporte', valor:'', data: todayISO(), nota:'' });
  /* Um extrato por custódia, escolhido aqui. Misturar reais e dólares na
     mesma lista daria uma coluna de números que não podem ser somados. */
  const [custodiaAba, setCustodiaAba] = useState('onshore');
  const [movErro, setMovErro] = useState('');
  const [criandoMov, setCriandoMov] = useState(false);
  /* Cliente da base não tem "Captação efetivada": ele já é carteira, e cada
     captação nova é um aporte — que se repete quantas vezes for, com data e
     valor no extrato, e é dele que sai a captação líquida do mês. O atalho
     do rodapé abre o formulário do extrato já em aporte e onshore, e leva o
     olho até ele. */
  /* O ciclo da captação da base, dentro de Movimentações: um formulário por
     vez — nova (ou alterar), confirmar, encerrar — e o rodapé leva direto ao
     passo seguinte. */
  const captacaoRef = useRef(null);
  const [captacaoForm, setCaptacaoForm] = useState(null); /* null | nova | confirmar | encerrar */
  const [captacaoDados, setCaptacaoDados] = useState({ valor:'', temperatura:'', custodia:'onshore', data: todayISO(), motivo:'' });
  const [captacaoErro, setCaptacaoErro] = useState('');
  const abrirCaptacao = (modo) => {
    setCaptacaoErro('');
    /* Confirmar costuma ser o valor negociado chegando, e alterar parte do
       que já está aberto: os dois vêm preenchidos e continuam editáveis. */
    /* Com captação aberta, os passos seguem na custódia dela; captação nova
       começa na aba em que a pessoa está, e o seletor do formulário troca. */
    const custodia = captacaoAberta ? custodiaCaptacao(draft) : custodiaAba;
    setCaptacaoDados({ valor: draft.valorEmCaptacao || '', temperatura: draft.temperatura || '',
                       custodia, data: todayISO(), motivo:'' });
    setCaptacaoForm(modo);
    /* O extrato mostra um formulário por vez, então o de movimentação fecha. */
    setCustodiaAba(custodia);
    setCriandoMov(false);
    setTimeout(() => {
      const el = captacaoRef.current;
      if(!el) return;
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      const campo = el.querySelector('.captacao-pendente input');
      if(campo) campo.focus({ preventScroll:true });
    }, 0);
  };
  const salvarCaptacao = () => {
    const d = captacaoDados;
    const v = parseValor(d.valor);
    if(captacaoForm !== 'encerrar' && (v === null || v <= 0)){ setCaptacaoErro('Informe um valor maior que zero.'); return; }
    if(captacaoForm === 'confirmar' && !d.data){ setCaptacaoErro('Informe a data em que o dinheiro entrou.'); return; }
    const atualizado = captacaoForm === 'nova' ? onIniciarCaptacao(draft.id, d)
      : captacaoForm === 'confirmar' ? onConfirmarCaptacao(draft.id, d)
      : onEncerrarCaptacao(draft.id, d);
    if(atualizado) setDraft(atualizado);
    setCaptacaoForm(null); setCaptacaoErro('');
  };
  /* O card nasce como ficha de consulta. Editar é uma decisão explícita,
     para o uso do dia a dia não esbarrar em campos de formulário. */
  const [editando, setEditando] = useState(false);
  const [ativErro, setAtivErro] = useState('');
  const [corrigindo, setCorrigindo] = useState(false);
  const [etapaCorrigida, setEtapaCorrigida] = useState(lead.etapa);
  const [motivoCorrecao, setMotivoCorrecao] = useState('');

  const save = () => {
    if(!draft.cliente.trim()){ setErrors({ cliente:'Informe o nome do cliente.' }); return; }
    onSave(draft);
  };

  const historico = draft.historico || [];
  const atividades = draft.atividades || [];
  /* O onboarding não bloqueia a jornada: são trâmites administrativos que
     correm em paralelo às reuniões. */
  const jornadaLead = (draft.funil || 'assessor') !== 'especialista';
  const daBase = jornadaLead && (draft.esteira || 'novo') === 'base';
  const captacaoAberta = daBase && valorCaptacaoNaMoeda(draft) > 0;
  const offshoreAberto = custodiaAba === 'offshore';
  const moeda = offshoreAberto ? fmtUSD : fmtBRL;
  const moedaCompacta = offshoreAberto ? fmtUSDCompact : fmtBRLCompact;
  const totaisMov = totaisMovimentacao(draft, custodiaAba);
  const pauta = jornadaLead ? ONBOARDING : [];
  const feitas = onboardingFeitos(draft);
  const destinos = somenteLeitura ? [] : allowedMoves(draft);

  const registrarMov = () => {
    const v = parseValor(novaMov.valor);
    if(v === null || v <= 0){ setMovErro('Informe um valor maior que zero.'); return; }
    if(!novaMov.data){ setMovErro('Informe a data da movimentação.'); return; }
    const atualizado = onAddMov(draft.id, {
      id: uid('mv'), tipo: novaMov.tipo, valor: moeda(v), data: novaMov.data,
      /* Carimba sempre, inclusive 'onshore': o padrão implícito serve para o
         que já estava gravado, não para o que se grava daqui em diante. */
      custodia: custodiaAba,
      nota: novaMov.nota.trim(), autor: currentUser.nome, criadoEm: Date.now(),
    });
    if(atualizado) setDraft(atualizado);
    setNovaMov({ tipo:'aporte', valor:'', data: todayISO(), nota:'' });
    setMovErro(''); setCriandoMov(false);
  };

  const registrarAlerta = () => {
    if(!novoAlerta.texto.trim()){ setAlertaErro('Escreva o que precisa ser lembrado.'); return; }
    if(!novoAlerta.data){ setAlertaErro('Informe a data do alerta.'); return; }
    const atualizado = onAddAlerta(draft.id, {
      id: uid('al'), tipo: novoAlerta.tipo, texto: novoAlerta.texto.trim(),
      data: novoAlerta.data, autor: currentUser.nome, criadoEm: Date.now(), resolvido:false,
    });
    if(atualizado) setDraft(atualizado);
    setNovoAlerta({ tipo:'vencimento', data:'', texto:'' });
    setAlertaErro(''); setCriandoAlerta(false);
  };

  const registrarAtividade = () => {
    if(!novaAtiv.nota.trim()){ setAtivErro('Descreva o que aconteceu neste contato.'); return; }
    const atividade = {
      id: uid('a'), tipo: novaAtiv.tipo, data: novaAtiv.data || todayISO(),
      nota: novaAtiv.nota.trim(), autor: currentUser.nome, criadoEm: Date.now(),
    };
    const atualizado = onAddActivity(draft.id, atividade);
    if(atualizado) setDraft(atualizado);
    setNovaAtiv({ tipo:'ligacao', data: todayISO(), nota:'' });
    setAtivErro('');
  };

  const aplicarCorrecao = () => {
    if(etapaCorrigida === draft.etapa){ setCorrigindo(false); return; }
    if(!motivoCorrecao.trim()) return;
    onCorrectStage(draft.id, etapaCorrigida, motivoCorrecao.trim());
  };

  const timeline = linhaDoTempo(draft);
  return h('div',{className:'overlay', onClick:(e)=>{ if(e.target===e.currentTarget) onClose(); }},
    h('div',{className:'modal'},
      h('div',{className:'modal-head'},
        h('h2',null, editando ? 'Editar cadastro' : (nomeCliente(draft) || 'Cliente')),
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          (!editando && !somenteLeitura)
            ? h('button',{className:'btn btn-ghost', style:{height:30,padding:'0 11px',fontSize:12},
                onClick:()=>setEditando(true)}, h(IconEditar,{size:13}), 'Editar') : null,
          h('button',{className:'modal-close', onClick:onClose}, h(IconX,{size:18}))
        )
      ),
      h('div',{className:'modal-body'},
        editando
          ? h('fieldset',{className:'form-lock', disabled: somenteLeitura },
              h(LeadForm, { grupos, initial: draft, onChange:(v)=>{ setDraft(v); if(errors.cliente && v.cliente.trim()) setErrors({}); }, errors, users, currentUser, isAdmin, stageEditable:false })
            )
          : h(Ficha,{ lead: draft, users, grupo }),
        h('div',{className:'meta-line'}, 'Criado em ', new Date(draft.criadoEm).toLocaleDateString('pt-BR')),
        somenteLeitura ? h('div',{className:'readonly-note'},
          h(Icon,{path:'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zM8 11V7a4 4 0 118 0v4', size:14}),
          h('span',null,'Você acompanha este card, mas quem edita é ',
            h('strong',null, (users.find(u=>u.id===draft.responsavelId)||{}).nome || 'o responsável'), '.')
        ) : null,

        /* Alertas: avisos com prazo, presos ao cliente. */
        jornadaLead ? h('div',{className:'alertas'},
          h('div',{className:'pauta-head'},
            h('div',{className:'bento-eyebrow'},'Alertas'),
            !somenteLeitura
              ? h('button',{className:'link-btn', onClick:()=>setCriandoAlerta(v => !v)},
                  criandoAlerta ? 'Cancelar' : '+ Novo alerta')
              : null
          ),

          criandoAlerta ? h('div',{className:'alerta-form'},
            h('div',{className:'activity-form-row'},
              h('select',{ className:'select-sm', value:novoAlerta.tipo, 'aria-label':'Tipo de alerta',
                onChange:e=>setNovoAlerta({ ...novoAlerta, tipo:e.target.value }) },
                TIPOS_ALERTA.map(t => h('option',{key:t.key, value:t.key}, t.label))),
              h('input',{ className:'select-sm', type:'date', value:novoAlerta.data, 'aria-label':'Data do alerta',
                onChange:e=>setNovoAlerta({ ...novoAlerta, data:e.target.value }) })
            ),
            h('input',{ className:'alerta-texto', value:novoAlerta.texto,
              placeholder:'Ex: CDB vence e precisa de reaplicação',
              onChange:e=>{ setNovoAlerta({ ...novoAlerta, texto:e.target.value }); if(alertaErro) setAlertaErro(''); },
              onKeyDown:(e)=>{ if(e.key==='Enter') registrarAlerta(); } }),
            alertaErro ? h('div',{className:'field-error'}, alertaErro) : null,
            h('button',{className:'btn btn-ghost', style:{height:32,fontSize:12.5,alignSelf:'flex-start'},
              onClick:registrarAlerta}, h(IconPlus,{size:13}), 'Criar alerta')
          ) : null,

          alertasAbertos(draft).length === 0 && !criandoAlerta
            ? h('div',{className:'history-empty'},'Nenhum alerta ativo para este cliente.')
            : h('div',{className:'alerta-lista'},
                alertasAbertos(draft)
                  .slice().sort((a,b) => (a.data || '').localeCompare(b.data || ''))
                  .map(a => {
                    const st = situacaoAlerta(a, todayISO());
                    return h('div',{key:a.id, className:'alerta-item ' + st},
                      h('span',{className:'task-dot ' + st}),
                      h('div',{className:'alerta-corpo'},
                        h('div',{className:'alerta-linha'},
                          h('span',{className:'alerta-tipo'}, tipoAlertaLabel(a.tipo)),
                          h('span',{className:'alerta-data ' + st},
                            a.data ? fmtDate(a.data) : 'sem data',
                            st === 'late' ? ' · vencido' : st === 'today' ? ' · hoje' : '')
                        ),
                        h('div',{className:'alerta-texto-ver'}, a.texto)
                      ),
                      !somenteLeitura ? h('div',{className:'alerta-acoes'},
                        h('button',{className:'link-btn', title:'Marcar como resolvido',
                          onClick:()=>{ const at = onResolverAlerta(draft.id, a.id); if(at) setDraft(at); }}, 'Resolver'),
                        h('button',{className:'link-btn danger', title:'Excluir alerta',
                          onClick:()=>{ const at = onRemoverAlerta(draft.id, a.id); if(at) setDraft(at); }}, 'Excluir')
                      ) : null
                    );
                  })
              )
        ) : null,

        /* Extrato da carteira: o que entrou e o que saiu, com saldo. */
        jornadaLead ? h('div',{className:'extrato', ref:captacaoRef},
          h('div',{className:'pauta-head'},
            h('div',{className:'bento-eyebrow'},'Movimentações'),
            !somenteLeitura
              ? h('div',{className:'captacao-links'},
                  /* Cliente da base começa captação nova daqui: ela é um
                     aporte que ainda não aconteceu, e mora junto dos que já
                     aconteceram. Com uma aberta, as ações ficam nela. */
                  (daBase && !captacaoAberta && !captacaoForm)
                    ? h('button',{className:'link-btn', onClick:()=>abrirCaptacao('nova')}, '+ Nova captação')
                    : null,
                  h('button',{className:'link-btn', onClick:()=>{ setCaptacaoForm(null); setCriandoMov(v => !v); }},
                    criandoMov ? 'Cancelar' : '+ Registrar'))
              : null
          ),

          /* O alternador só aparece quando há offshore: para a maioria dos
             clientes ele seria um controle de uma opção só. */
          /* Captação offshore também traz o alternador: sem ele, quem começou
             a primeira negociação lá fora não teria como voltar ao onshore. */
          (temOffshore(draft) || valorEmCarteiraOffshore(draft) > 0
            || (captacaoAberta && custodiaCaptacao(draft) === 'offshore')
            || (!!captacaoForm && captacaoDados.custodia === 'offshore'))
            ? h('div',{className:'custodia-switch', role:'group', 'aria-label':'Custódia'},
                CUSTODIAS.map(c => h('button',{
                  key:c.key, type:'button',
                  className: custodiaAba === c.key ? 'active' : '',
                  onClick:()=>{ setCustodiaAba(c.key); setCriandoMov(false);
                    setNovaMov({ tipo:'aporte', valor:'', data: todayISO(), nota:'' }); },
                }, c.label, h('span',{className:'custodia-moeda'}, c.moeda === 'USD' ? 'US$' : 'R$')))
              )
            : null,

          h('div',{className:'extrato-resumo'},
            h('div',{className:'extrato-bloco'},
              h('span',{className:'extrato-rotulo'},'Sob gestão'),
              /* Cheio, e não compacto como os três vizinhos, de propósito: na
                 Jornada este é o único lugar do sistema que mostra o valor sob
                 gestão ao centavo — o tile do topo arredonda e o campo
                 "Patrimônio" só aparece no funil de Seguro. É o bloco largo da
                 linha; quem cuida de não deixar isso virar sobreposição é o
                 flex-wrap do .extrato-resumo, não o encurtamento do número. */
              h('span',{className:'extrato-valor forte'},
                moeda(offshoreAberto ? valorEmCarteiraOffshore(draft) : valorEmCarteira(draft)))),
            h('div',{className:'extrato-bloco'},
              h('span',{className:'extrato-rotulo'},'Aportes'),
              h('span',{className:'extrato-valor entrada'}, moedaCompacta(totaisMov.aportes))),
            h('div',{className:'extrato-bloco'},
              h('span',{className:'extrato-rotulo'},'Retiradas'),
              h('span',{className:'extrato-valor saida'}, moedaCompacta(totaisMov.retiradas))),
            h('div',{className:'extrato-bloco'},
              h('span',{className:'extrato-rotulo'},'Net New Money'),
              h('span',{className:'extrato-valor' + (totaisMov.liquido < 0 ? ' saida' : ' entrada')},
                (totaisMov.liquido >= 0 ? '+' : '−') + moedaCompacta(Math.abs(totaisMov.liquido))))
          ),

          /* Captação da base em negociação, dentro do extrato: é o aporte que
             ainda não aconteceu, logo acima das movimentações que ela vai
             virar quando for confirmada. Tracejada, porque é promessa e não
             saldo. Aberta, aparece na aba da custódia dela; com formulário
             aberto, em qualquer aba. */
          (daBase && (captacaoForm || (captacaoAberta && custodiaAba === custodiaCaptacao(draft))))
            ? h('div',{className:'captacao-pendente'},
                h('div',{className:'captacao-cab'},
                  h('span',{className:'captacao-rotulo'},
                    captacaoForm === 'nova' ? (captacaoAberta ? 'Alterar captação' : 'Nova captação')
                    : captacaoForm === 'confirmar' ? 'Confirmar captação'
                    : captacaoForm === 'encerrar' ? 'Encerrar sem captar'
                    : 'Em negociação' + (custodiaCaptacao(draft) === 'offshore' ? ' · offshore' : '')),
                  somenteLeitura ? null
                    : captacaoForm
                    ? h('button',{className:'link-btn', onClick:()=>{ setCaptacaoForm(null); setCaptacaoErro(''); }}, 'Cancelar')
                    : h('div',{className:'captacao-links'},
                        h('button',{className:'link-btn', onClick:()=>abrirCaptacao('nova')}, 'Alterar'),
                        h('button',{className:'link-btn danger', onClick:()=>abrirCaptacao('encerrar')}, 'Encerrar sem captar'))
                ),

                (captacaoAberta && captacaoForm !== 'nova')
                  ? h('div',{className:'captacao-resumo'},
                      h('span',{className:'captacao-valor'}, moedaCaptacao(draft)(valorCaptacaoNaMoeda(draft))),
                      temperaturaDe(draft)
                        ? h('span',{className:'ficha-tag'},
                            h('span',{className:'temp-dot', style:{background:temperaturaDe(draft).cor}}), temperaturaDe(draft).label)
                        : h('span',{className:'captacao-sem-temp'},'sem temperatura'),
                      h('span',{className:'captacao-sobre'}, 'a mais sobre '
                        + (custodiaCaptacao(draft) === 'offshore'
                            ? fmtUSDCompact(valorEmCarteiraOffshore(draft)) + ' offshore'
                            : fmtBRLCompact(valorEmCarteira(draft)))
                        + ' sob gestão'),
                      (!somenteLeitura && !captacaoForm)
                        ? h('button',{className:'btn btn-ghost captacao-confirmar', onClick:()=>abrirCaptacao('confirmar')},
                            h(IconThumbsUp,{size:13}), 'Confirmar captação')
                        : null)
                  : null,

                captacaoForm === 'nova' ? h('div',{className:'alerta-form'},
                  /* Onde o dinheiro vai entrar: o mesmo alternador do extrato.
                     Trocar reformata o valor e leva a aba junto, para a
                     negociação aparecer onde vai virar aporte. */
                  h('div',{className:'custodia-switch captacao-custodia', role:'group', 'aria-label':'Custódia da captação'},
                    CUSTODIAS.map(c => h('button',{
                      key:c.key, type:'button',
                      className: captacaoDados.custodia === c.key ? 'active' : '',
                      onClick:()=>{
                        setCaptacaoDados(x => { const n = parseValor(x.valor);
                          return { ...x, custodia:c.key, valor: n === null ? '' : (c.key === 'offshore' ? fmtUSD : fmtBRL)(n) }; });
                        setCustodiaAba(c.key);
                      },
                    }, c.label, h('span',{className:'custodia-moeda'}, c.moeda === 'USD' ? 'US$' : 'R$')))
                  ),
                  h('input',{ className:'select-sm', value:captacaoDados.valor, inputMode:'decimal',
                    placeholder:'Quanto vai trazer a mais, em ' + (captacaoDados.custodia === 'offshore' ? 'US$' : 'R$'),
                    'aria-label':'Valor da captação',
                    onChange:e=>{ setCaptacaoDados({ ...captacaoDados, valor:e.target.value }); if(captacaoErro) setCaptacaoErro(''); },
                    onBlur:(e)=>{ const n = parseValor(e.target.value);
                      setCaptacaoDados(x => ({ ...x, valor: n === null ? '' : (x.custodia === 'offshore' ? fmtUSD : fmtBRL)(n) })); } }),
                  h('div',{className:'filtro-chips'},
                    TEMPERATURAS.map(t => h('button',{ key:t.key, type:'button',
                      className:'filtro-chip temp-chip' + (captacaoDados.temperatura === t.key ? ' ativo' : ''),
                      onClick:()=>setCaptacaoDados({ ...captacaoDados, temperatura: captacaoDados.temperatura === t.key ? '' : t.key }) },
                      h('span',{className:'temp-dot', style:{background:t.cor}}), t.label))),
                  h('div',{className:'field-hint'}, captacaoDados.temperatura
                    ? descTemperatura(captacaoDados.temperatura, draft)
                    : 'Temperatura da captação: o quanto ela está para acontecer.'),
                  captacaoErro ? h('div',{className:'field-error'}, captacaoErro) : null,
                  h('button',{className:'btn btn-ghost', style:{height:32,fontSize:12.5,alignSelf:'flex-start'}, onClick:salvarCaptacao},
                    h(IconPlus,{size:13}), captacaoAberta ? 'Salvar alteração' : 'Iniciar captação')
                ) : null,

                captacaoForm === 'confirmar' ? h('div',{className:'alerta-form'},
                  h('div',{className:'activity-form-row'},
                    h('input',{ className:'select-sm', value:captacaoDados.valor, inputMode:'decimal',
                      placeholder:'Valor que entrou, em ' + (captacaoDados.custodia === 'offshore' ? 'US$' : 'R$'),
                      'aria-label':'Valor que entrou',
                      onChange:e=>{ setCaptacaoDados({ ...captacaoDados, valor:e.target.value }); if(captacaoErro) setCaptacaoErro(''); },
                      onBlur:(e)=>{ const n = parseValor(e.target.value);
                        setCaptacaoDados(x => ({ ...x, valor: n === null ? '' : (x.custodia === 'offshore' ? fmtUSD : fmtBRL)(n) })); } }),
                    h('input',{ className:'select-sm', type:'date', value:captacaoDados.data, max: todayISO(),
                      'aria-label':'Data em que entrou',
                      onChange:e=>setCaptacaoDados({ ...captacaoDados, data:e.target.value }) })
                  ),
                  h('div',{className:'field-hint'}, captacaoDados.custodia === 'offshore'
                    ? 'Entra como aporte offshore logo abaixo: soma no sob gestão offshore, em dólar, e a negociação fecha.'
                    : 'Entra como aporte logo abaixo: soma no sob gestão e no Net New Money do mês, e a negociação fecha.'),
                  captacaoErro ? h('div',{className:'field-error'}, captacaoErro) : null,
                  h('button',{className:'btn btn-ghost', style:{height:32,fontSize:12.5,alignSelf:'flex-start',color:'var(--success)'}, onClick:salvarCaptacao},
                    h(IconThumbsUp,{size:13}), 'Confirmar captação')
                ) : null,

                captacaoForm === 'encerrar' ? h('div',{className:'alerta-form'},
                  h('input',{ className:'alerta-texto', value:captacaoDados.motivo,
                    placeholder:'Motivo (opcional). Ex: decidiu manter no outro banco',
                    onChange:e=>setCaptacaoDados({ ...captacaoDados, motivo:e.target.value }),
                    onKeyDown:(e)=>{ if(e.key==='Enter') salvarCaptacao(); } }),
                  h('div',{className:'field-hint'},'Fecha a negociação sem mexer na carteira. Fica registrado no histórico.'),
                  h('button',{className:'btn btn-danger-ghost', style:{height:32,fontSize:12.5,alignSelf:'flex-start'}, onClick:salvarCaptacao},
                    'Encerrar sem captar')
                ) : null
              )
            : null,

          criandoMov ? h('div',{className:'alerta-form'},
            h('div',{className:'activity-form-row'},
              h('select',{ className:'select-sm', value:novaMov.tipo, 'aria-label':'Tipo de movimentação',
                onChange:e=>setNovaMov({ ...novaMov, tipo:e.target.value }) },
                TIPOS_MOVIMENTACAO.map(t => h('option',{key:t.key, value:t.key}, t.label))),
              h('input',{ className:'select-sm', value:novaMov.valor, inputMode:'decimal',
                placeholder: offshoreAberto ? 'Valor em US$' : 'Valor em R$',
                'aria-label': offshoreAberto ? 'Valor em dólares' : 'Valor em reais',
                onChange:e=>{ setNovaMov({ ...novaMov, valor:e.target.value }); if(movErro) setMovErro(''); },
                onBlur:(e)=>{ const n = parseValor(e.target.value); setNovaMov(m => ({ ...m, valor: n === null ? '' : moeda(n) })); } }),
              h('input',{ className:'select-sm', type:'date', value:novaMov.data, 'aria-label':'Data',
                max: todayISO(),
                onChange:e=>setNovaMov({ ...novaMov, data:e.target.value }) })
            ),
            h('input',{ className:'alerta-texto', value:novaMov.nota,
              placeholder:'Observação (opcional). Ex: resgate para compra de imóvel',
              onChange:e=>setNovaMov({ ...novaMov, nota:e.target.value }),
              onKeyDown:(e)=>{ if(e.key==='Enter') registrarMov(); } }),
            movErro ? h('div',{className:'field-error'}, movErro) : null,
            h('button',{className:'btn btn-ghost', style:{height:32,fontSize:12.5,alignSelf:'flex-start'},
              onClick:registrarMov}, h(IconPlus,{size:13}), 'Registrar')
          ) : null,

          movimentacoesDe(draft, custodiaAba).length === 0 && !criandoMov
            ? h('div',{className:'history-empty'},
                offshoreAberto ? 'Nenhuma movimentação offshore registrada.' : 'Nenhuma movimentação registrada.')
            : h('div',{className:'extrato-lista'},
                movimentacoesDe(draft, custodiaAba).map(m => {
                  const saida = m.tipo === 'retirada';
                  return h('div',{key:m.id, className:'extrato-item'},
                    h('span',{className:'extrato-seta ' + (saida ? 'saida' : 'entrada')}, saida ? '↓' : '↑'),
                    h('div',{className:'extrato-corpo'},
                      h('div',{className:'extrato-linha'},
                        h('span',{className:'extrato-tipo'}, saida ? 'Retirada' : 'Aporte'),
                        h('span',{className:'extrato-data'}, fmtDate(m.data))
                      ),
                      m.nota ? h('div',{className:'extrato-nota'}, m.nota) : null,
                      h('div',{className:'extrato-autor'},'por ', m.autor)
                    ),
                    h('span',{className:'extrato-montante ' + (saida ? 'saida' : 'entrada')},
                      (saida ? '−' : '+') + moeda(parseValor(m.valor) || 0)),
                    !somenteLeitura ? h('button',{className:'link-btn danger', title:'Excluir movimentação',
                      onClick:()=>{ const at = onRemoverMov(draft.id, m.id); if(at) setDraft(at); }}, '×') : null
                  );
                })
              )
        ) : null,

        h('div',{className:'history-section'},
          h('h3',null,'Atividades e histórico'),

          somenteLeitura ? null : h('div',{className:'activity-form'},
            h('div',{className:'activity-form-row'},
              h('select',{
                className:'select-sm', value:novaAtiv.tipo, 'aria-label':'Tipo de atividade',
                onChange:e=>setNovaAtiv({ ...novaAtiv, tipo:e.target.value }),
              }, TIPOS_ATIVIDADE.map(t => h('option',{key:t.key, value:t.key}, t.label))),
              h('input',{
                className:'select-sm', type:'date', value:novaAtiv.data, 'aria-label':'Data da atividade',
                max: todayISO(),
                onChange:e=>setNovaAtiv({ ...novaAtiv, data:e.target.value }),
              })
            ),
            h('textarea',{
              value:novaAtiv.nota, placeholder:'O que foi conversado? Qual o próximo passo?',
              onChange:e=>{ setNovaAtiv({ ...novaAtiv, nota:e.target.value }); if(ativErro) setAtivErro(''); },
            }),
            ativErro ? h('div',{className:'field-error'}, ativErro) : null,
            h('button',{className:'btn btn-ghost', style:{height:32,fontSize:12.5,alignSelf:'flex-start'}, onClick:registrarAtividade}, h(IconPlus,{size:13}), 'Registrar atividade')
          ),

          h(Timeline,{ itens: timeline })
        ),

        /* A pauta da reunião atual: o que esta etapa exige, para este
           segmento e esta esteira. */
        pauta.length > 0 ? h('div',{className:'pauta'},
          h('div',{className:'pauta-head'},
            h('div',{className:'bento-eyebrow'},'Onboarding'),
            h('span',{className:'pauta-contador' + (feitas.length === pauta.length ? ' completa' : '')},
              feitas.length + '/' + pauta.length)
          ),
          h('div',{className:'pauta-lista'},
            pauta.map(item => {
              const ok = feitas.indexOf(item.id) !== -1;
              return h('label',{key:item.id, className:'pauta-item' + (ok ? ' feito' : '')},
                h('input',{ type:'checkbox', checked:ok, disabled:somenteLeitura,
                  onChange:()=>{ const at = onTogglePauta(draft.id, item.id); if(at) setDraft(at); } }),
                h('span',null, item.texto)
              );
            })
          ),
          feitas.length < pauta.length && !somenteLeitura
            ? h('div',{className:'pauta-aviso'},
                (pauta.length - feitas.length) + ' pendente(s). Não impede o avanço da jornada.')
            : null
        ) : null,

        /* Consolidado da família: o motivo de existir o grupo. */
        (jornadaLead && grupo && grupo.membros.length > 1) ? h('div',{className:'grupo-box'},
          h('div',{className:'pauta-head'},
            h('div',{className:'bento-eyebrow'}, grupo.nome),
            h('span',{className:'grupo-total'}, fmtBRL(grupo.carteira))
          ),
          h('div',{className:'grupo-sub'},
            grupo.membros.length, ' membros · ',
            grupo.captacao > 0 ? fmtBRLCompact(grupo.captacao) + ' ainda em captação' : 'tudo sob gestão'),
          h('div',{className:'grupo-membros'},
            grupo.outros.map(m => h('div',{key:m.id, className:'grupo-membro'},
              h('span',{className:'grupo-membro-nome'},
                m.tipoPessoa === 'PJ' ? h('span',{className:'pj-tag'},'PJ') : null, nomeCliente(m)),
              h('span',{className:'grupo-membro-valor'},
                valorEmCarteira(m) > 0 ? fmtBRLCompact(valorEmCarteira(m)) : 'em captação')
            ))
          )
        ) : null,

        /* A R4 é o ponto de handoff do processo: é aqui que os gaps viram
           reuniões temáticas com o especialista. */
        !somenteLeitura && draft.funil !== 'especialista' && draft.etapa === 'R4'
          ? h('div',{className:'handoff' + (pendenteIndicacao ? ' pendente' : '')},
              h('div',{className:'handoff-text'},
                h('strong',null, pendenteIndicacao ? 'Indicação pendente' : 'Reunião de produto'),
                h('span',null, pendenteIndicacao
                  ? 'A jornada só avança quando os especialistas encerrarem os negócios indicados.'
                  : 'Indique cada gap identificado no Plano de Liberdade Financeira.')
              ),
              h('button',{className:'btn btn-primary', style:{height:32,padding:'0 12px',fontSize:12},
                onClick:()=>onEncaminhar(draft)}, 'Indicar negócio')
            )
          : null,

        destinos.length > 0 ? h('div',{className:'stage-progress'},
          h('div',{className:'stage-progress-info'},
            destinos.length === 1 ? 'Próximo passo do funil: ' : 'Mover para: ',
            destinos.length === 1 ? h('strong',null, destinos[0]) : null
          ),
          h('div',{className:'stage-progress-actions'},
            destinos.map(destino => h('button',{
              key: destino,
              className: 'btn ' + (destino === destinos[0] ? 'btn-primary' : 'btn-ghost'),
              style:{height:32,padding:'0 12px',fontSize:12},
              onClick:()=>onMove(draft, destino),
            }, destinos.length === 1 ? 'Mover' : destino))
          )
        ) : null,
        isAdmin && !somenteLeitura ? h('div',{className:'admin-fix'},
          corrigindo
            ? h(Fragment, null,
                h('div',{className:'bento-eyebrow', style:{marginBottom:8}},'Corrigir etapa'),
                h('div',{className:'field-row'},
                  h('div',{className:'field', style:{marginBottom:8}},
                    h('select',{ value:etapaCorrigida, onChange:e=>setEtapaCorrigida(e.target.value) },
                      STAGES.map(s => h('option',{key:s.key, value:s.key}, etapaLonga(s.key))))
                  ),
                  h('div',{className:'field', style:{marginBottom:8}},
                    h('input',{ value:motivoCorrecao, onChange:e=>setMotivoCorrecao(e.target.value), placeholder:'Motivo da correção' })
                  )
                ),
                h('div',{style:{display:'flex',gap:8}},
                  h('button',{className:'btn btn-ghost', style:{height:32,fontSize:12}, onClick:()=>{ setCorrigindo(false); setEtapaCorrigida(draft.etapa); setMotivoCorrecao(''); }}, 'Cancelar'),
                  h('button',{className:'btn btn-primary', style:{height:32,fontSize:12}, disabled:!motivoCorrecao.trim() || etapaCorrigida===draft.etapa, onClick:aplicarCorrecao}, 'Aplicar correção')
                )
              )
            : h('div',{className:'admin-fix-call'},
                h('span',null,'Movimento registrado por engano?'),
                h('button',{className:'link-btn', onClick:()=>setCorrigindo(true)}, 'Corrigir etapa')
              )
        ) : null
      ),
      /* Quem só acompanha não vê nenhuma ação de escrita: nem salvar,
         nem desqualificar, nem marcar venda. Só a saída. */
      somenteLeitura
        ? h('div',{className:'modal-foot'},
            h('span',{style:{fontSize:12,color:'var(--ink-faint)'}},'Somente leitura'),
            h('button',{className:'btn btn-ghost', onClick:onClose}, 'Fechar')
          )
        : !editando
        ? h('div',{className:'modal-foot'},
            h('div',{style:{display:'flex',gap:8}},
              isAdmin ? h('button',{className:'btn btn-danger-ghost', onClick:()=>{ setEditando(true); setConfirmDelete(true); }}, h(IconTrash,{size:13}), 'Excluir') : null,
              h('button',{className:'btn btn-danger-ghost', onClick:()=>onLose(draft)}, h(IconThumbsDown,{size:13}), 'Desqualificar'),
              /* Cliente da base: o rodapé leva ao passo seguinte da captação —
                 começar uma, ou confirmar a que está aberta. */
              daBase
                ? (captacaoAberta
                    ? h('button',{className:'btn btn-danger-ghost', style:{color:'var(--success)'}, onClick:()=>abrirCaptacao('confirmar')},
                        h(IconThumbsUp,{size:13}), 'Confirmar captação')
                    : h('button',{className:'btn btn-danger-ghost', style:{color:'var(--success)'}, onClick:()=>abrirCaptacao('nova')},
                        h(IconPlus,{size:13}), 'Nova captação'))
              : (draft.ganho && jornadaLead) ? null
                : h('button',{className:'btn btn-danger-ghost', style:{color:'var(--success)'}, onClick:()=>onWin(draft)},
                    h(IconThumbsUp,{size:13}), jornadaLead ? 'Captação efetivada' : 'Marcar venda')
            ),
            h('button',{className:'btn btn-ghost', onClick:onClose}, 'Fechar')
          )
        : h('div',{className:'modal-foot'},
        confirmDelete
          ? h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
              h('span',{style:{fontSize:12.5,color:'var(--ink-muted)'}},'Excluir este lead?'),
              h('button',{className:'btn btn-danger-ghost', onClick:()=>onDelete(draft.id)}, 'Confirmar'),
              h('button',{className:'btn btn-ghost', onClick:()=>setConfirmDelete(false)}, 'Cancelar')
            )
          : h('div',{style:{display:'flex',gap:8}},
              isAdmin ? h('button',{className:'btn btn-danger-ghost', onClick:()=>setConfirmDelete(true)}, h(IconTrash,{size:13}), 'Excluir') : null,
              h('button',{className:'btn btn-danger-ghost', onClick:()=>onLose(draft)}, h(IconThumbsDown,{size:13}), 'Desqualificar'),
              /* Na edição, cliente da base fica sem o atalho: o foco é o
                 cadastro, e lançar movimentação no meio dela sobrescreveria o
                 rascunho. */
              (daBase || (draft.ganho && jornadaLead)) ? null
                : h('button',{className:'btn btn-danger-ghost', style:{color:'var(--success)'}, onClick:()=>onWin(draft)},
                    h(IconThumbsUp,{size:13}), jornadaLead ? 'Captação efetivada' : 'Marcar venda')
            ),
        h('div',{style:{display:'flex',gap:8}},
          h('button',{className:'btn btn-ghost', onClick:()=>{ setDraft(lead); setErrors({}); setConfirmDelete(false); setEditando(false); }}, 'Cancelar'),
          h('button',{className:'btn btn-primary', onClick:save}, 'Salvar alterações')
        )
      )
    )
  );
}

/* ================= Win deal confirm ================= */
function WinModal({ lead, onClose, onConfirm }){
  useEsc(onClose);
  const [valorFechado, setValorFechado] = useState(lead.valorPotencial || '');
  /* Vem preenchido com o que estava declarado na ficha: captar costuma
     confirmar o valor estimado, não descobri-lo agora. Continua editável
     porque o que entra é o que o custodiante confirmou, não a estimativa. */
  const [valorOffshore, setValorOffshore] = useState(lead.valorOffshore || '');
  const jornada = (lead.funil || 'assessor') !== 'especialista';
  return h('div',{className:'overlay', onClick:(e)=>{ if(e.target===e.currentTarget) onClose(); }},
    h('div',{className:'modal', style:{maxWidth:440}},
      h('div',{className:'modal-head'}, h('h2',null, jornada ? 'Captação efetivada' : 'Marcar como venda'), h('button',{className:'modal-close', onClick:onClose}, h(IconX,{size:18}))),
      h('div',{className:'modal-body'},
        h('p',{style:{fontSize:13.5,color:'var(--ink-muted)',margin:'0 0 16px'}},
          jornada
            ? h(Fragment, null, 'A partir de agora ',
                h('strong',{style:{color:'var(--ink)'}}, lead.cliente || 'este cliente'),
                ' passa a contar no total da carteira. O acompanhamento da jornada continua normalmente.')
            : h(Fragment, null, 'O negócio com ',
                h('strong',{style:{color:'var(--ink)'}}, lead.cliente || 'este cliente'),
                ' vai sair do funil ativo e ser movido para os negócios fechados.')
        ),
        h('div',{className:'field'},
          h('label',null, jornada ? 'Captado no Brasil' : 'Valor final da venda (opcional)'),
          h('input',{
            value:valorFechado, onChange:e=>setValorFechado(e.target.value),
            inputMode:'decimal', placeholder: jornada ? 'Ex: 2500000' : 'Ex: 15000', autoFocus:true,
            onBlur:(e)=>{ const n = parseValor(e.target.value); setValorFechado(n === null ? '' : fmtBRL(n)); },
          })
        ),
        /* A captação é o momento em que o offshore passa a contar: até aqui o
           dinheiro lá fora é do cliente, não da casa. Perguntar depois, na
           ficha, deixaria a carteira menor do que ela é entre uma tela e
           outra — e ninguém volta para corrigir o que já parece pronto. */
        jornada ? h('div',{className:'field'},
          h('label',null,'Captado no exterior (US$)'),
          h('input',{
            value:valorOffshore, onChange:e=>setValorOffshore(e.target.value),
            inputMode:'decimal', placeholder:'Ex: 380000',
            onBlur:(e)=>{ const n = parseValor(e.target.value); setValorOffshore(n === null ? '' : fmtUSD(n)); },
          }),
          h('div',{className:'field-hint'},
            (lead.valorOffshore
              ? 'Veio da ficha do cliente. Ajuste se o que entrou foi diferente.'
              : 'Deixe vazio se não houve captação no exterior.')
            + ' Entra no total da carteira convertido pela cotação do escritório.')
        ) : null
      ),
      h('div',{className:'modal-foot'},
        h('button',{className:'btn btn-ghost', onClick:onClose}, 'Cancelar'),
        h('button',{className:'btn btn-success-solid',
          onClick:()=>onConfirm(lead.id, valorFechado, jornada ? valorOffshore : undefined)},
          h(IconThumbsUp,{size:13}), jornada ? 'Confirmar captação' : 'Confirmar venda')
      )
    )
  );
}

      h('div',{className:'modal-body'},
        h('div',{className:'stage-progress'},
          h('div',{className:'stage-progress-info'}, h('strong',null, etapaLonga(from, lead.funil))),
          h(Icon,{path:'M5 12h14M12 5l7 7-7 7', size:16}),
          h('div',{className:'stage-progress-info'}, h('strong',null, etapaLonga(to, lead.funil)))
        ),
        h('div',{className:'field', style:{marginTop:14}},
          h('label',null, 'Resumo do que foi feito ', h('span',{className:'required'},'*')),
          h('textarea',{ value:resumo, onChange:e=>{ setResumo(e.target.value); if(error) setError(''); }, placeholder:'Ex: Call de apresentação feita, cliente confirmou orçamento e pediu proposta formal.', autoFocus:true })

/* ================= Encaminhamento para especialista =================
   Na R4 o assessor identifica os gaps do Plano de Liberdade Financeira.
   Cada gap vira um card próprio no funil do especialista — uma pauta por
   reunião, conforme o processo. O assessor passa a acompanhar sem editar. */
function EncaminharModal({ lead, especialistas, onClose, onConfirm, jaEncaminhados, padroes }){
  useEsc(onClose);
  const disponiveis = (produto) => especialistas.filter(e =>
    !e.produtos || e.produtos.length === 0 || e.produtos.indexOf(produto) !== -1);

  /* Cada assessor tem sua dupla habitual por produto. O modal já abre com
     ela escolhida — trocar continua possível, mas o caminho comum é um clique. */
  const escolhaInicial = (produto) => {
    const padrao = (padroes || {})[produto];
    if(padrao && disponiveis(produto).some(e => e.id === padrao)) return padrao;
    const opcoes = disponiveis(produto);
    return opcoes.length === 1 ? opcoes[0].id : '';
  };

  const [passo, setPasso] = useState('selecao');   // selecao | briefing
  const [selecao, setSelecao] = useState({});
  const [briefings, setBriefings] = useState({});  // produto -> { valor, interesse, urgencia }
  const [perfil, setPerfil] = useState('');
  const [erro, setErro] = useState('');

  const escolhidos = PRODUTOS.filter(p => selecao[p]);
  const pronto = escolhidos.length > 0 && escolhidos.every(p => selecao[p]);

  const alternar = (produto) => {
    const copia = { ...selecao };
    if(copia[produto] !== undefined) delete copia[produto];
    else copia[produto] = escolhaInicial(produto);
    setSelecao(copia);
  };

  const setBrief = (produto, campo, valor) => setBriefings(prev => ({
    ...prev, [produto]: { ...(prev[produto] || {}), [campo]: valor },
  }));
  const brief = (produto) => briefings[produto] || {};

  const avancar = () => {
    if(!pronto) return;
    /* Pré-preenche o valor com o patrimônio do cliente: na maioria dos casos
       o assessor ajusta, mas partir de zero é pior do que partir de um número. */
    const inicial = {};
    escolhidos.forEach(p => {
      inicial[p] = { valor:'', interesse:'', urgencia:'Até 3 meses', ...(briefings[p] || {}) };
    });
    setBriefings(inicial);
    setPasso('briefing');
  };

  const concluir = () => {
    const faltando = escolhidos.filter(p => !brief(p).interesse);
    if(faltando.length){
      setErro('Informe o interesse em ' + faltando.join(' e ') + '.');
      return;
    }
    onConfirm(lead, selecao, { ...briefings, __perfil: perfil.trim() });
  };

  /* ---- Passo 1: quais produtos e para quem ---- */
  if(passo === 'selecao'){
    return h('div',{className:'overlay', onClick:(e)=>{ if(e.target===e.currentTarget) onClose(); }},
      h('div',{className:'modal', style:{maxWidth:560}},
        h('div',{className:'modal-head'},
          h('h2',null,'Indicar negócio'),
          h('button',{className:'modal-close', onClick:onClose}, h(IconX,{size:18}))),
        h('div',{className:'modal-body'},
          h('p',{style:{fontSize:13.5,color:'var(--ink-muted)',margin:'0 0 4px'}},
            'Criar negócio para ', h('strong',null, nomeCliente(lead)), ' em:'),
          h('p',{className:'field-hint', style:{margin:'0 0 16px'}},
            'Cada produto vira um negócio próprio no funil do especialista, com uma pauta por reunião.'),

          especialistas.length === 0
            ? h('div',{className:'history-empty'},'Nenhum especialista cadastrado ainda. Um admin precisa definir o papel em Equipe.')
            : PRODUTOS.map(produto => {
                const marcado = selecao[produto] !== undefined;
                const enviado = jaEncaminhados.indexOf(produto) !== -1;
                const opcoes = disponiveis(produto);
                return h('div',{key:produto, className:'encaminhar-row' + (marcado ? ' ativo' : '') + (enviado ? ' enviado' : '')},
                  h('label',{className:'encaminhar-check'},
                    h('input',{ type:'checkbox', checked:marcado, disabled:enviado || opcoes.length===0,
                      onChange:()=>alternar(produto) }),
                    h('span',null, produto)
                  ),
                  enviado
                    ? h('span',{className:'encaminhar-tag'},'já encaminhado')
                    : opcoes.length === 0
                      ? h('span',{className:'encaminhar-tag'},'sem especialista')
                      : marcado
                        ? h('div',{style:{display:'flex',alignItems:'center',gap:6}},
                            (padroes||{})[produto] && selecao[produto] === (padroes||{})[produto]
                              ? h('span',{className:'encaminhar-tag'},'padrão') : null,

/* Painel de filtros. Fica abaixo da barra para não competir com a navegação
   e some por inteiro quando não há nada selecionado. */
function FiltrosPanel({ filtros, onChange, funil, aberto, grupos }){
  if(!aberto) return null;
  const jornada = funil !== 'especialista';

  const alternar = (grupo, valor) => {
    const atual = filtros[grupo];
    const novo = atual.indexOf(valor) === -1
      ? [...atual, valor]
      : atual.filter(v => v !== valor);
    onChange({ ...filtros, [grupo]: novo });
  };

  const grupo = (titulo, chave, opcoes) => opcoes.length === 0 ? null : h('div',{className:'filtro-grupo'},
    h('div',{className:'filtro-titulo'}, titulo),
    h('div',{className:'filtro-chips'},
      opcoes.map(o => h('button',{
        key:o.valor, type:'button',
        className:'filtro-chip' + (filtros[chave].indexOf(o.valor) !== -1 ? ' ativo' : ''),
        'aria-pressed': filtros[chave].indexOf(o.valor) !== -1 ? 'true' : 'false',
        onClick:()=>alternar(chave, o.valor),
      }, o.label))
    )
  );

  return h('div',{className:'filtros-panel'},
    /* Período primeiro: "o que fiz no mês" é a pergunta mais frequente. */
    h('div',{className:'filtro-grupo'},
      h('div',{className:'filtro-titulo'},'Período'),
      h('div',{className:'filtro-chips'},
        PERIODOS.map(p => h('button',{
          key:p.valor, type:'button',
          className:'filtro-chip' + (filtros.periodo === p.valor ? ' ativo' : ''),
          onClick:()=>onChange({ ...filtros, periodo:p.valor }),
        }, p.label))
      ),
      filtros.periodo === 'custom' ? h('div',{className:'kpi-datas'},
        h('input',{ className:'select-sm', type:'date', value:filtros.de, 'aria-label':'Data inicial',
          onChange:e=>onChange({ ...filtros, de:e.target.value }) }),
        h('span',{className:'kpi-datas-sep'},'até'),
        h('input',{ className:'select-sm', type:'date', value:filtros.ate, 'aria-label':'Data final',
          onChange:e=>onChange({ ...filtros, ate:e.target.value }) })
      ) : null
    ),

    grupo('Segmento', 'segmento', SEGMENTOS.map(sg => ({ valor:sg.key, label:sg.key }))),
    /* Grupo familiar é lista aberta: com 20 famílias, um chip por família
       viraria um paredão. Aqui o menu escolhe e só o selecionado ocupa espaço. */
    (jornada && (grupos || []).length > 0) ? h('div',{className:'filtro-grupo'},
      h('div',{className:'filtro-titulo'},'Grupo familiar'),
      h('div',{className:'filtro-familia'},
        h('select',{
          className:'select-sm', value:'', 'aria-label':'Adicionar família ao filtro',
          onChange:(e)=>{ if(e.target.value) alternar('grupo', e.target.value); },
        },
          h('option',{value:''},
            filtros.grupo.length === 0 ? 'Todas as famílias' : 'Adicionar outra...'),
          grupos.filter(g => filtros.grupo.indexOf(g) === -1)
            .map(g => h('option',{key:g, value:g}, g))
        ),
        filtros.grupo.length > 0
          ? h('div',{className:'filtro-chips'},
              filtros.grupo.map(g => h('button',{
                key:g, type:'button', className:'filtro-chip ativo',
                title:'Remover ' + g, onClick:()=>alternar('grupo', g),
              }, g, h('span',{className:'filtro-chip-x','aria-hidden':'true'},'×')))
            )
          : null
      )
    ) : null,
    jornada ? grupo('Esteira', 'esteira', ESTEIRAS.map(e => ({ valor:e.key, label:e.label }))) : null,
    grupo('Tipo', 'tipoPessoa', [{ valor:'PF', label:'Pessoa física' }, { valor:'PJ', label:'Pessoa jurídica' }]),
    grupo('Temperatura', 'temperatura',
      TEMPERATURAS.map(t => ({ valor:t.key, label:t.label })).concat([{ valor:'sem', label:'Sem classificação' }])),
    grupo('Situação', 'situacao', SITUACOES
      .filter(x => x.funis.indexOf(jornada ? 'assessor' : 'especialista') !== -1)
      .map(x => ({ valor:x.key, label:x.label }))),
    contarFiltros(filtros) > 0
      ? h('button',{className:'link-btn filtro-limpar', onClick:()=>onChange({ ...FILTROS_VAZIOS })}, 'Limpar filtros')
      : null
  );
}

/* ================= Admin: lost deals ================= */
function OutcomeBoard({ leads, users, onReopen, mode, funil }){
  const nameFor = (id) => (users.find(u=>u.id===id)||{}).nome || 'Sem responsável';
  const isWon = mode === 'won';
  /* Abrir o cliente só para reler o que foi registrado é caro; o histórico
     vem num modal próprio, sem os campos de cadastro no caminho. */
  const [verHistorico, setVerHistorico] = useState(null);
  const especialista = funil === 'especialista';
  const valorDe = (l) => (isWon ? parseValor(l.valorFechado) : parseValor(l.valorPotencial)) || 0;
  const total = leads.reduce((a,l) => a + valorDe(l), 0);

  if(leads.length === 0){
    return h('div',{className:'empty-col', style:{maxWidth:420,margin:'40px auto'}},
      isWon
        ? (especialista ? 'Nenhuma venda fechada por aqui ainda.' : 'Nenhuma captação efetivada por aqui ainda.')
        : (especialista ? 'Nenhum negócio perdido por aqui ainda.' : 'Nenhum cliente desqualificado por aqui ainda.'));
  }

  return h('div',null,
    /* Resumo do que a tela lista: sem ele o assessor precisa somar de cabeça. */
    h('div',{className:'desfecho-resumo' + (isWon ? ' ganho' : ' perda')},
      h('div',{className:'desfecho-bloco'},
        h('span',{className:'desfecho-rotulo'}, isWon
          ? (especialista ? 'Total fechado' : 'Total captado')
          : (especialista ? 'Total perdido' : 'Total desqualificado')),
        h('span',{className:'desfecho-valor'}, fmtBRL(total))
      ),
      h('div',{className:'desfecho-bloco'},
        h('span',{className:'desfecho-rotulo'}, especialista ? 'Negócios' : 'Clientes'),
        h('span',{className:'desfecho-valor'}, leads.length)
      ),
      h('div',{className:'desfecho-bloco'},
        h('span',{className:'desfecho-rotulo'},'Média'),
        h('span',{className:'desfecho-valor'}, leads.length ? fmtBRLCompact(total / leads.length) : '—')
      )
    ),
    h('div',{className:'lost-list'},
    leads.slice().sort((a,b)=>((isWon?b.ganhoEm:b.perdidoEm)||0)-((isWon?a.ganhoEm:a.perdidoEm)||0)).map(lead => {
      const valor = isWon ? parseValor(lead.valorFechado) : parseValor(lead.valorPotencial);
      const dataRef = isWon ? lead.ganhoEm : lead.perdidoEm;
      const registros = linhaDoTempo(lead);
      return h('div',{key:lead.id, className:'lost-row' + (isWon ? ' won' : '')},
        h('div',{className:'lost-row-bar'}),
        h('div',{className:'lost-row-main'},
          h('div',{className:'lost-row-top'},
            h('span',{className:'lost-row-name'}, nomeCliente(lead)),
            valor !== null ? h('span',{className:'lost-row-value mono'}, fmtBRL(valor)) : null
          ),
          lead.oportunidade ? h('div',{className:'lost-row-deal'}, lead.oportunidade) : null,
          (!isWon && lead.motivoPerda) ? h('div',{className:'lost-row-motivo'}, '"', lead.motivoPerda, '"') : null,
          h('div',{className:'lost-row-meta'},
            h('span',{className:'avatar', style:{width:18,height:18,fontSize:8.5}}, initials(nameFor(lead.responsavelId))),
            h('span',null, nameFor(lead.responsavelId)),
            h('span',{className:'mono'}, dataRef ? new Date(dataRef).toLocaleDateString('pt-BR') : '')
          )
        ),
        h('div',{className:'lost-row-acoes'},
          h('button',{
            className:'btn btn-ghost', style:{height:32,padding:'0 12px',fontSize:12},
            onClick:()=>setVerHistorico(lead),
          }, 'Histórico',
             registros.length ? h('span',{className:'lost-row-badge'}, registros.length) : null

          h('button',{className:'btn btn-ghost', style:{height:32,padding:'0 12px',fontSize:12}, onClick:()=>onReopen(lead.id)}, h(IconRefresh,{size:12}), 'Reabrir')
