  .bar-fill{animation:barra-cresce .7s var(--ease) both;transform-origin:left;}
  @keyframes barra-cresce{ from{transform:scaleX(0);} to{transform:scaleX(1);} }

  @media (max-width:1100px){
    .painel-linha{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4);row-gap:22px;}
    .ind{padding-left:0;border-left:none;}
    .ind.largo{grid-column:span 2;}
  }
  @media (max-width:600px){
    .painel-topo{padding:20px;}
    .painel-linha{grid-template-columns:minmax(0,1fr);}
    .ind.largo{grid-column:span 1;}
  }
  @media (prefers-reduced-motion:reduce){
    .ind, .composicao-parte, .bar-fill{animation:none;}
  }

  /* Gráfico de série mensal */
  .grafico-mensal{padding-top:4px;}
  .grafico-svg{width:100%;height:auto;display:block;overflow:visible;}
  .grafico-svg .grade{stroke:var(--border);stroke-width:1;}
  .grafico-svg .grade-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:9.5px;fill:var(--ink-faint);
  }
  .grafico-svg .grafico-mes{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;fill:var(--ink-faint);
  }
  /* Traçado da esquerda para a direita: a linha "acontece" no tempo. */
  .grafico-linha{
    stroke-dasharray:1400;stroke-dashoffset:1400;
    animation:traca 1.1s var(--ease) forwards .15s;
  }
  @keyframes traca{ to{stroke-dashoffset:0;} }
  .grafico-ponto{opacity:0;animation:ponto-entra .3s var(--ease) forwards 1s;}
  @keyframes ponto-entra{ to{opacity:1;} }
  @media (prefers-reduced-motion:reduce){
    .grafico-linha{stroke-dasharray:none;stroke-dashoffset:0;animation:none;}
    .grafico-ponto{opacity:1;animation:none;}
  }

  /* Variação do mês e colunas de entrada no gráfico de carteira */
  .carteira-variacao{
    display:inline-flex;align-items:baseline;gap:8px;margin-bottom:10px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:15px;font-weight:500;color:var(--success);
  }
  .carteira-variacao.baixa{color:var(--danger);}
  .carteira-variacao span{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:400;color:var(--ink-faint);
  }
  .carteira-col{
    fill:var(--primary);opacity:.32;
    animation:barra-sobe .6s var(--ease) both;transform-origin:bottom;transform-box:fill-box;
  }
  @media (prefers-reduced-motion:reduce){ .carteira-col{animation:none;} }

  /* Barra de composição dentro da tabela de produção */
  .producao-barra{
    display:block;width:100%;max-width:210px;height:5px;border-radius:3px;
    background:var(--bg);box-shadow:inset 0 0 0 1px rgba(5,19,42,.05);
    margin-top:7px;overflow:hidden;
  }
  .producao-barra i{
    display:block;height:100%;border-radius:3px;
    animation:barra-cresce .8s var(--ease) both .2s;transform-origin:left;
  }
  /* Conversão como anel: proporção lida como forma, não só como número. */
  .producao-anel{
    display:inline-flex;align-items:center;justify-content:center;
    width:46px;height:46px;border-radius:50%;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11.5px;font-weight:500;color:var(--ink);
    background:conic-gradient(var(--cor) var(--pct), var(--bg) 0);
    position:relative;
  }
  .producao-anel::before{
    content:'';position:absolute;inset:4px;border-radius:50%;background:var(--surface);
  }
  .producao-anel{isolation:isolate;}
  .producao-anel > *{position:relative;z-index:1;}

  .producao-tabela{display:flex;flex-direction:column;}
  .producao-head, .producao-linha{
    display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4, minmax(0,1fr));gap:var(--space-3);align-items:baseline;
  }
  .producao-head{
    padding-bottom:9px;border-bottom:1px solid var(--border);
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.07em;
  }
  .producao-head span:not(:first-child), .producao-linha .producao-num{text-align:right;}
  .producao-linha{padding:12px 0;border-bottom:1px solid var(--border);}
  .producao-linha:last-child{border-bottom:none;}
  .producao-nome{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    font-size:13.5px;font-weight:600;color:var(--ink);
  }
  .producao-nome em{font-style:normal;font-size:11px;font-weight:400;color:var(--ink-faint);}
  .producao-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:13px;color:var(--ink-muted);
    display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  }
  .producao-num.forte{color:var(--ink);font-weight:500;}
  .producao-num em{font-style:normal;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10.5px;color:var(--ink-faint);}
  @media (max-width:720px){
    .producao-head{display:none;}
    .producao-linha{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;}
    .producao-linha .producao-num{align-items:flex-start;text-align:left;}
    .producao-nome{grid-column:span 2;}
  }

  .kpi-filtros{margin-bottom:var(--space-4);}
  .kpi-filtros .select-sm{min-width:190px;}
  .kpi-datas{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .kpi-datas .select-sm{min-width:0;flex:1;}
  .kpi-datas-sep{font-size:11.5px;color:var(--ink-faint);}
  @media (max-width:720px){
    .kpi-filtros .filtro-grupo{width:100%;}
    .kpi-filtros .select-sm{width:100%;min-width:0;}
  }

  .filtro-limpar{align-self:flex-end;margin-left:auto;padding-bottom:5px;}
  .btn.ativo{border-color:var(--primary);color:var(--primary);}
  @media (prefers-reduced-motion:reduce){
    .filtros-panel{animation:none;} .filtro-chip{transition:none;}
  }
  @media (max-width:720px){
    .filtros-panel{gap:var(--space-4);padding:var(--space-4);}
    .filtro-limpar{margin-left:0;align-self:flex-start;}
  }

  /* Ações do quadro: coladas ao kanban, não à navegação do aplicativo */
  .board-actions{
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    margin-bottom:var(--space-3);flex-wrap:wrap;
  }
  .board-actions-left{display:flex;align-items:center;gap:var(--space-3);}
  /* Alternador quadro/lista */
  .modo-switch{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:2px;}
  .modo-switch button{
    display:inline-flex;align-items:center;gap:6px;border:none;background:none;
    padding:5px 11px;border-radius:var(--radius-xs);cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:600;color:var(--ink-muted);
    transition:background .12s var(--ease),color .12s var(--ease);
  }
  .modo-switch button.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-card);}
  .modo-switch button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}

  /* ---------- Lista da base ---------- */
  .lista-wrap{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    overflow:auto;max-height:calc(100vh - 300px);
  }
  .lista{width:100%;border-collapse:collapse;font-size:13px;}
  .lista th{
    position:sticky;top:0;z-index:1;background:var(--surface);
    text-align:left;padding:12px 14px;cursor:pointer;user-select:none;
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
    border-bottom:1px solid var(--border);
  }
  .lista th:hover{color:var(--ink);}
  .lista th.ordenado{color:var(--primary);}
  .lista th:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .lista-seta{margin-left:5px;font-size:9px;}
  .lista td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .lista tbody tr{cursor:pointer;transition:background .12s var(--ease);}
  .lista tbody tr:hover{background:var(--bg);}
  .lista tbody tr:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .lista tbody tr.somente-leitura{opacity:.72;}
  .lista tbody tr:last-child td{border-bottom:none;}
  .lista .num{text-align:right;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;
    font-size:12.5px;color:var(--ink-muted);white-space:nowrap;}
  .lista .num.forte{color:var(--ink);font-weight:500;}
  .lista-cliente{display:block;font-weight:600;color:var(--ink);}
  .lista-sub{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .lista-fraco{color:var(--ink-faint);}
  .lista-chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-muted);}
  .lista-data.late{color:var(--danger);font-weight:500;}
  .lista-data.today{color:var(--gold);font-weight:500;}
  .lista tfoot td{
    position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border-strong);
    border-bottom:none;font-size:11.5px;color:var(--ink-muted);
  }
  @media (prefers-reduced-motion:reduce){
    .modo-switch button, .lista tbody tr{transition:none;}
  }
  @media (max-width:720px){
    .lista-wrap{max-height:none;}
    .lista{font-size:12px;}
    .lista th, .lista td{padding:9px 10px;}
  }

  .board-actions-count{font-size:12px;color:var(--ink-muted);}
  @media (max-width:720px){
    .board-actions{gap:var(--space-2);}
    .board-actions .btn{flex:1;justify-content:center;}
    .board-actions-left{flex:1;}
  }

  /* ---------- Grupo familiar ---------- */
  .grupo-box{
    margin:18px 0 6px;padding:14px 16px;border-radius:var(--radius-md);
    background:var(--navy);border:1px solid var(--navy);color:#fff;
  }
  .grupo-box .pauta-head{border-bottom-color:rgba(255,255,255,.14);}
  .grupo-box .bento-eyebrow{color:#A8BBD6;}
  .grupo-total{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:15px;font-weight:500;color:#fff;
  }
  .grupo-sub{font-size:11.5px;color:#9FB2CE;margin:8px 0 4px;}
  .grupo-membros{display:flex;flex-direction:column;}
  .grupo-membro{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:7px 0;border-bottom:1px solid rgba(255,255,255,.09);
  }
  .grupo-membro:last-child{border-bottom:none;}
  .grupo-membro-nome{font-size:12.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grupo-membro-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:#9FB2CE;flex-shrink:0;
  }
  .grupo-box .pj-tag{background:rgba(255,255,255,.18);}

  /* ---------- Temperatura do lead ---------- */
  /* O ponto colorido carrega a leitura rápida; o texto ao lado existe porque
     cor sozinha não é informação para quem não distingue vermelho de verde. */
  .temp-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;
  }
  /* Temperatura e grupo familiar são dois elementos inline seguidos, sem nó de
     texto entre eles: sem esta margem as duas palavras encostam. */
  .card-temp{
    display:inline-flex;align-items:center;gap:5px;margin-top:6px;margin-right:10px;
    font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-muted);
    text-transform:uppercase;vertical-align:middle;
  }
  .card-temp + .card-grupo{vertical-align:middle;}
  .temp-chip{display:inline-flex;align-items:center;gap:6px;}
  /* No chip selecionado o fundo é navy: o ponto ganha um anel para não sumir. */
  .temp-chip.ativo .temp-dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.55);}
  .ficha-tag .temp-dot{margin-right:5px;vertical-align:middle;}


  /* ---------- Offshore ---------- */
  /* Selo curto: cabe no card, na aba e ao lado de um numero sem empurrar
     nada. "OFF" e o vocabulario que o escritorio ja usa. */
  .off-tag{
    display:inline-flex;align-items:center;justify-content:center;
    padding:1px 5px;border-radius:4px;background:var(--offshore-tint);
    color:var(--offshore);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;
    font-size:9px;font-weight:600;letter-spacing:.06em;flex-shrink:0;
  }
  .view-tab .off-tag{margin-right:5px;}

  .card-offshore{
    display:flex;align-items:center;gap:6px;margin-top:5px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--offshore);
  }
  .card-offshore-valor{font-weight:500;}
  .card-offshore-aviso{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;color:var(--danger);
    text-transform:uppercase;letter-spacing:.04em;
  }
  /* Captação em negociação do cliente da base: dourado, o tom de "Em
     captação" no painel, para o card e o indicador falarem a mesma língua. */
  .card-captacao{
    display:flex;align-items:center;gap:6px;margin-top:5px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--gold);
  }
  .card-captacao-rotulo{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .card-captacao-valor{font-weight:500;}
  .hero-offshore{
    display:flex;align-items:center;gap:6px;margin-top:6px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11.5px;color:#9FB2CE;
  }
  .hero-offshore .off-tag{background:rgba(255,255,255,.14);color:#CFE3E0;}
  .ficha-tag.off{background:var(--offshore-tint);border-color:#CFE3E0;color:var(--offshore);}
  .ficha-tag.off .off-tag{background:transparent;padding:0;margin-right:5px;}

  /* Composicao das custodias na ficha: o total consolidado sozinho esconde
     quanto esta fora, que e a pergunta seguinte de quem abre o cliente. */
  .ficha-custodias{
    border:1px solid var(--border);border-radius:var(--radius-md);
    padding:12px 14px;background:var(--bg);
  }
  .custodia-linha{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:4px 0;
  }
  .custodia-rotulo{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.04em;font-weight:600;
  }
  .custodia-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:13.5px;color:var(--ink);font-weight:500;
  }
  .custodia-nota{
    margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--ink-muted);line-height:1.5;
  }
  .custodia-nota.alerta{color:var(--danger);}

  /* Alternador do extrato. Nao e filtro: e a escolha de qual conta se esta
     olhando, e as duas nunca aparecem juntas porque nao se somam. */
  .custodia-switch{display:flex;gap:4px;margin-bottom:10px;}
  .custodia-switch button{
    display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);
    font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
  }
  .custodia-switch button.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .custodia-switch button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  .custodia-moeda{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;opacity:.7;
  }

  /* A cotacao explica todo numero convertido na tela; por isso abre a pagina
     em vez de ficar escondida numa tela de configuracao. */
  .cotacao-box{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 16px;margin-bottom:var(--space-4);
    border:1px solid var(--border);border-left:3px solid var(--offshore);
    border-radius:var(--radius-md);background:var(--surface);
  }
  .cotacao-valor{display:flex;align-items:baseline;gap:6px;min-width:max-content;}
  .cotacao-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:19px;font-weight:500;color:var(--ink);
  }
  .cotacao-rotulo{font-size:12px;color:var(--ink-muted);}
  .cotacao-nota{font-size:11.5px;color:var(--ink-muted);line-height:1.5;}
  .cotacao-box .link-btn{margin-left:auto;}
  .cotacao-box.vazia{
    border-left-color:var(--danger);background:var(--danger-tint);
    justify-content:space-between;
  }
  .cotacao-box.vazia strong{color:var(--ink);font-size:13px;}
  .cotacao-box.vazia span{font-size:12.5px;color:var(--ink-muted);}
  .cotacao-box.editando{align-items:flex-end;}
  .cotacao-campo{display:flex;flex-direction:column;gap:4px;}
  .cotacao-campo label{
    font-size:11px;font-weight:600;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.04em;
  }
  .cotacao-campo input{max-width:140px;}

  /* Linha do extrato consolidado do escritorio: mesma forma da do cliente,
     mas clicavel, porque daqui se abre o cliente. */
  .extrato-item.como-botao{
    width:100%;text-align:left;border:none;background:none;font-family:inherit;
    cursor:pointer;border-radius:var(--radius-sm);
  }
  .extrato-item.como-botao:hover{background:var(--bg);}
  .extrato-item.como-botao:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .lista-nota{
    margin-left:7px;padding:1px 6px;border-radius:10px;background:var(--gold-tint);
    color:#6E5719;font-size:10px;font-weight:600;white-space:nowrap;
  }

  /* Marcador no card do quadro */
  .card-grupo{
    display:inline-block;margin-top:6px;font-size:10.5px;color:var(--gold);
    font-weight:600;letter-spacing:.02em;
  }

  /* ---------- Ficha do cliente ---------- */
  .ficha{display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-2);}
  .ficha-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .ficha-etapa{
    padding:3px 10px;border-radius:20px;color:#fff;
    font-size:11px;font-weight:600;letter-spacing:.02em;
  }
  .ficha-tag{
    padding:3px 10px;border-radius:20px;background:var(--bg);
    border:1px solid var(--border);color:var(--ink-muted);font-size:11px;font-weight:500;
  }
  .ficha-tag.gold{background:var(--gold-tint);border-color:#E8DCB8;color:#6E5719;}
  .ficha-oportunidade{
    margin:10px 0 0;font-size:14px;color:var(--ink);line-height:1.45;
  }

  /* Quatro números lado a lado: a leitura de 3 segundos antes de uma ligação */
  /* 2x2 e não quatro em linha: no modal de 520px, quatro colunas dão 109px de
     tile e 83px de conteúdo — menos do que "7d restantes" (101px) ou
     "3d em atraso" precisam, e o valor saía por cima do tile vizinho. Em 2x2
     cada tile fica com 226px, folgado para qualquer valor que a base produza.
     O minmax(0,…) é o de sempre: sem ele a coluna volta a crescer com o
     conteúdo em vez de dividir o espaço. */
  .ficha-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .ficha-tile{
    display:flex;flex-direction:column;gap:5px;padding:11px 12px;min-width:0;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);
  }
  .ficha-tile-rotulo{
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.06em;
  }
  .ficha-tile-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:14px;font-weight:500;color:var(--ink);
    line-height:1.2;word-break:break-word;
  }
  .ficha-tile.ok{background:var(--success-tint);border-color:#CFE3D8;}
  .ficha-tile.ok .ficha-tile-valor{color:var(--success);}
  .ficha-tile.alerta{background:var(--danger-tint);border-color:#F0CFCC;}
  .ficha-tile.alerta .ficha-tile-valor{color:var(--danger);}
  .ficha-tile.atencao{background:var(--gold-tint);border-color:#E8DCB8;}
  .ficha-tile.atencao .ficha-tile-valor{color:#6E5719;}

  .ficha-dados{display:flex;flex-direction:column;}
  .ficha-linha{
    display:flex;align-items:baseline;gap:var(--space-4);padding:9px 2px;
    border-bottom:1px solid var(--border);
  }
  .ficha-linha:last-child{border-bottom:none;}
  .ficha-rotulo{
    flex:0 0 130px;font-size:11px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.05em;
  }
  .ficha-valor{font-size:13.5px;color:var(--ink);min-width:0;word-break:break-word;}
  .ficha-valor.link{color:var(--primary);text-decoration:none;}
  .ficha-valor.link:hover{text-decoration:underline;}
  .ficha-obs{
    padding:12px 14px;background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius-md);
  }
  .ficha-obs p{margin:6px 0 0;font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap;}

  @media (max-width:720px){
    .ficha-tiles{grid-template-columns:repeat(2, minmax(0,1fr));}
    .ficha-linha{flex-direction:column;gap:2px;}
    .ficha-rotulo{flex:none;}
  }

  /* ---------- Briefing da indicação ---------- */
  .brief-bloco{
    padding:14px;margin-bottom:12px;background:var(--bg);
    border:1px solid var(--border);border-radius:var(--radius-md);
  }
  .brief-bloco:last-of-type{margin-bottom:0;}
  .brief-titulo{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:12px;
  }
  .brief-titulo span{font-size:11.5px;font-weight:400;color:var(--ink-muted);}
  .brief-bloco .filtro-chip{font-size:11.5px;padding:5px 10px;}

  .brief-ficha{
    padding:11px 14px;background:var(--gold-tint);
    border:1px solid #E8DCB8;border-radius:var(--radius-md);
  }
  .brief-ficha .brief-titulo{color:#6E5719;margin-bottom:8px;}
  .brief-ficha .brief-titulo span{color:#8A7233;}
  .brief-linhas{display:flex;flex-wrap:wrap;gap:6px;}
  .brief-chip{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
    background:rgba(255,255,255,.7);border:1px solid #E8DCB8;
    font-size:11.5px;font-weight:500;color:#6E5719;
  }
  .brief-perfil{
    margin:9px 0 0;padding-top:9px;border-top:1px solid #E8DCB8;
    font-size:12.5px;line-height:1.5;color:var(--ink);white-space:pre-wrap;
  }
  .card-urgente{
    display:inline-block;margin-top:6px;padding:2px 7px;border-radius:10px;
    background:var(--danger-tint);color:var(--danger);font-size:10.5px;font-weight:600;
  }

  /* Ações e histórico na tela de encerrados */
  .lost-row-acoes{display:flex;gap:8px;flex-shrink:0;align-items:center;}
  .lost-row-badge{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;color:var(--ink-faint);
    background:var(--bg);border-radius:10px;padding:1px 6px;margin-left:2px;
  }
  .hist-resumo{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .hist-motivo{padding-top:14px;}
  .hist-motivo p{margin:5px 0 0;font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap;}
  @media (max-width:720px){
    .lost-row-acoes{width:100%;}
    .lost-row-acoes .btn{flex:1;justify-content:center;}
  }

  /* Aniversário: presente só no dia */
  .card-aniversario{
    display:inline-block;margin-top:6px;padding:3px 8px;border-radius:10px;
    background:var(--gold-tint);color:#6E5719;font-size:10.5px;font-weight:600;
  }
  .ficha-linha.festa .ficha-valor{color:#6E5719;font-weight:600;}
  .ficha-idade{color:var(--ink-faint);font-weight:400;}
  .ficha-hoje{
    margin-left:8px;padding:2px 7px;border-radius:10px;
    background:var(--gold);color:#fff;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;
  }

  .pending-dot{
    display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;
    margin-left:2px;border-radius:10px;background:var(--gold);color:#fff;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;font-weight:500;
  }

  @media (max-width:720px){
    .team-row{flex-wrap:wrap;}
    .team-row-actions{width:100%;justify-content:flex-start;}
    .activity-form-row{flex-direction:column;}
  }

  /* ---------- KPI dashboard ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(6, minmax(0,1fr));gap:var(--space-3);margin-bottom:var(--space-1);}
  .kpi-tile{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;min-width:0;
    position:relative;overflow:hidden;
    animation:bento-in .4s var(--ease) both;
  }
  /* Filete de estado no topo: a cor do tile é lida antes do número. */
  .kpi-tile::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--border-strong);
  }
  .kpi-tile.offshore::before{background:var(--offshore);}
  .kpi-tile.success::before{background:var(--success);}
  .kpi-tile.danger::before{background:var(--danger);}
  .kpi-tile.gold::before{background:var(--gold);}
  .kpi-tile:nth-child(2){animation-delay:.05s;}
  .kpi-tile:nth-child(3){animation-delay:.1s;}
  .kpi-tile:nth-child(4){animation-delay:.15s;}
  .kpi-tile:nth-child(5){animation-delay:.2s;}
  @media (prefers-reduced-motion:reduce){ .kpi-tile{animation:none;} }
  .kpi-tile.span2{grid-column:span 2;}
  .kpi-tile .kpi-label{font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:var(--space-2);}
  .kpi-tile .kpi-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:29px;font-weight:500;color:var(--ink);
    line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  .kpi-tile .kpi-sub{font-size:11.5px;color:var(--ink-faint);margin-top:var(--space-2);}
  .kpi-tile.navy{
    grid-column:span 2;grid-row:span 2;justify-content:space-between;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(176,138,46,.16) 0%, rgba(176,138,46,0) 58%),
      var(--navy);
    border-color:var(--navy);box-shadow:var(--shadow-navy);position:relative;overflow:hidden;
  }
  /* Segundo número do herói: o mês corrente, separado por um filete. */
  .heroi-mes{
    margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.14);
  }
  .heroi-mes .kpi-label{margin-bottom:5px;}
  .heroi-mes-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:21px;font-weight:500;color:#6FCFA1;
    line-height:1;letter-spacing:-.02em;white-space:nowrap;
  }
  .heroi-mes-var{
    margin-left:8px;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:#6FCFA1;
  }
  .heroi-mes-var.baixa{color:#F0918A;}

  .kpi-tile.navy::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold);opacity:.85;}
  .kpi-tile.navy .kpi-label{color:#A8BBD6;}
  .kpi-tile.navy .kpi-num{color:#fff;font-size:clamp(26px,3vw,36px);}
  .kpi-tile.navy .kpi-sub{color:#9FB2CE;}
  .kpi-tile.success .kpi-num{color:var(--success);}
  .kpi-tile.danger .kpi-num{color:var(--danger);}
  .kpi-tile.gold .kpi-num{color:var(--gold);}

  /* Medidor de conversão: a barra carrega o dado, o número só confirma */
  .kpi-meter{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:var(--space-3);}
  .kpi-meter-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .4s var(--ease);}
  @media (prefers-reduced-motion:reduce){ .kpi-meter-fill{transition:none;} }

  .kpi-section{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-5) var(--space-6);margin-top:var(--space-3);min-width:0;
  }
  .kpi-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4);}
  .kpi-section-head h2{font-size:15px;font-weight:600;margin:0;color:var(--ink);letter-spacing:-.01em;}
  .kpi-section-head span{
    font-size:10.5px;color:var(--ink-faint);text-align:right;
    text-transform:uppercase;letter-spacing:.07em;font-weight:600;
  }
  /* Bento das seções: 4/2 em vez de 1/1 — o funil e a série mensal precisam de largura */
  /* Mesmo motivo do .painel-duplo: sem o minmax(0,…) a proporção 4:2 é só uma
     sugestão — a coluna cresce até caber o nome mais longo e estoura o pai. */
  /* Cabecalho de bloco fora de uma .kpi-section: separa a carteira offshore
     do resto de "Minha carteira" sem precisar de mais uma caixa. */
  .offshore-head{margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--border);}
  .offshore-head h2{display:flex;align-items:center;gap:8px;}

  .kpi-two-col{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,2fr);gap:var(--space-3);margin-top:var(--space-3);}
  .kpi-two-col .kpi-section{margin-top:0;}

  .bar-row{margin-bottom:16px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row-topo{
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);
    margin-bottom:7px;
  }
  .bar-row-label{
    display:flex;align-items:baseline;gap:8px;min-width:0;
    font-size:13px;color:var(--ink);font-weight:500;
  }
  .bar-row-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Posição só onde a ordem carrega informação: rankings. */
  .bar-row-pos{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;font-weight:500;
    color:var(--ink-faint);background:var(--bg);border-radius:4px;
    padding:2px 5px;flex-shrink:0;align-self:center;
  }
  .bar-row-label .stage-dot{align-self:center;}
  .bar-row-value{display:flex;align-items:baseline;gap:8px;flex-shrink:0;}
  .bar-row-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:14px;font-weight:500;
    color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .bar-row-sec{font-size:11px;color:var(--ink-faint);}

  .bar-track{
    position:relative;height:8px;background:var(--bg);border-radius:5px;
    box-shadow:inset 0 0 0 1px rgba(5,19,42,.04);
  }
  .bar-fill{height:100%;border-radius:5px;}
  /* Trilha tracejada em vez de barra zerada: ausência de dado tem forma própria. */
  .bar-track.tracejada{
    background:repeating-linear-gradient(90deg,
      var(--border) 0 6px, transparent 6px 12px);
    box-shadow:none;opacity:.7;
  }
  /* Ausência de dado é informação, não ruído: precisa ser lida sem esforço.
     O tom fraco padrão passa no contraste, mas some em texto pequeno. */
  .bar-row.vazio .bar-row-label{color:var(--ink-muted);}
  .bar-row.vazio .bar-row-num{
    color:var(--ink-muted);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:11.5px;font-weight:500;letter-spacing:0;
  }
  .bar-row.vazio .bar-track.tracejada{opacity:1;}

  /* Marca da meta sobre a trilha: o realizado lido contra o prazo. */
  .bar-meta{
    position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;
    background:var(--ink-faint);opacity:.55;
  }
  .bar-meta.passou{background:var(--danger);opacity:.9;}
  .bar-row-meta-label{
    font-size:10.5px;color:var(--ink-faint);margin-top:5px;
  }

  .month-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:150px;padding-top:10px;}
  .month-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .month-bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
  .month-bar{width:9px;border-radius:3px 3px 0 0;min-height:2px;}
  .month-label{font-size:10.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;}
  /* Quebra em vez de transbordar: são três rótulos lado a lado que já não
     cabiam abaixo de ~830px de janela. */
  .month-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--ink-muted);margin-top:14px;}
  .month-legend-item{display:flex;align-items:center;gap:6px;}
  .month-legend-dot{width:8px;height:8px;border-radius:2px;}

  .empty-kpi{
    font-size:12.5px;color:var(--ink-faint);text-align:center;padding:28px 16px;
    background:var(--bg);border:1px dashed var(--border-strong);border-radius:var(--radius-md);
  }

  @media (max-width:1180px){
    .kpi-grid{grid-template-columns:repeat(4, minmax(0,1fr));}
    .kpi-two-col{grid-template-columns:minmax(0,1fr);}
  }
  @media (max-width:720px){
    .kpi-grid{grid-template-columns:repeat(2, minmax(0,1fr));gap:var(--space-2);}
    .kpi-tile.navy{grid-column:span 2;grid-row:span 1;}
    .kpi-tile.span2{grid-column:span 1;}
    .kpi-tile{padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);}
    .kpi-section{padding:var(--space-4);border-radius:var(--radius-md);}
  }

  /* ---------- Print report ---------- */
  .print-header{display:none;}
  .print-header .print-brand{display:flex;align-items:center;gap:9px;}
  .print-header .print-brand .brand-mark{background:var(--gold);}
  .print-header .print-brand span{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:18px;color:var(--navy);}
  .print-header h1{font-size:20px;margin:10px 0 2px;}
  .print-header .print-meta{font-size:11.5px;color:var(--ink-muted);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;}
  .print-header hr{border:none;border-top:2px solid var(--gold);margin:14px 0 18px;}

  @media print{
    @page{ margin:14mm; }
    body{ background:#fff; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    .no-print, .masthead, .topbar, .save-banner, .toast-stack, .overlay, .overview-toggle{ display:none !important; }
    .print-header{ display:block; }
    #app{ max-width:none; padding:0; }
    .kpi-grid{ grid-template-columns:repeat(3, minmax(0,1fr)); }
    .kpi-grid > *{ grid-column:span 1 !important; grid-row:auto !important; }
    .kpi-tile.navy .kpi-num{ font-size:22px; }
    .kpi-two-col{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .kpi-section, .kpi-tile{ break-inside:avoid; box-shadow:none; animation:none !important; }
    .kpi-section{ margin-top:14px; padding:14px 16px; }

    /* O painel é escuro na tela; no papel ele volta ao claro. Sem isto o
       PDF sai com texto claro sobre fundo branco — ilegível. */
    .painel{
      --bg:#F4F6F9; --surface:#FFFFFF;
      --ink:#0F1B2D; --ink-muted:#54627A; --ink-faint:#8A97AB;
      --border:#E2E6ED; --border-strong:#CCD3DD;
      --primary:#195AB4; --primary-tint:#E8F0FB;
      --success:#2F7A57; --success-tint:#E7F3EC;
      --danger:#B4453E;  --danger-tint:#FAEBEA;
      --gold:#B08A2E;    --gold-tint:#F7F0DC;
      display:block;background:#fff;padding:0;box-shadow:none;border-radius:0;
    }
    /* Os filtros descrevem o recorte no cabeçalho impresso; a coluna de
       controles não tem função no papel. */
    .painel-lado{ display:none !important; }
    .painel .painel-linha{
      grid-template-columns:repeat(3, minmax(0,1fr));row-gap:14px;
      background:#fff;border:1px solid var(--border);
    }
    .painel .ind{ animation:none !important; border-left-color:var(--border); }
    .painel .ind-rotulo{ color:#54627A; }
    .painel .ind-valor{ color:#0F1B2D; }
    .painel .ind-contexto{ color:#8A97AB; }
    .painel .ind.ouro .ind-valor{ color:#8A6A18; }
    .painel .ind.verde .ind-valor{ color:#2F7A57; }
    .painel .ind.alerta .ind-valor{ color:#B4453E; }
    .painel-duplo{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .painel-caixa, .painel .kpi-section{ break-inside:avoid; border:1px solid var(--border); }
    .painel-area{ gap:14px; }
    .rosca-total{ fill:#0F1B2D; }
    .rosca-legenda-total, .grafico-svg .grade-num, .grafico-svg .grafico-mes{ fill:#8A97AB; }
    .rosca-fatia, .barra-v-fill, .bar-fill, .grafico-linha, .grafico-ponto,
    .composicao-parte, .producao-barra i{ animation:none !important; }
    .grafico-linha{ stroke-dasharray:none !important; stroke-dashoffset:0 !important; }
    .grafico-ponto{ opacity:1 !important; }
    .barras-v{ height:150px; overflow:visible; }
  }

  .required{color:var(--danger);}
  .meta-line{font-size:11px;color:var(--ink-faint);margin-top:16px;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;}

  /* ---------- Lost deals ---------- */
  /* Resumo do desfecho no topo da lista */
  .desfecho-resumo{
    display:flex;gap:var(--space-6);flex-wrap:wrap;
    padding:16px 20px;margin-bottom:var(--space-4);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    border-left:3px solid var(--border-strong);
  }
  .desfecho-resumo.ganho{border-left-color:var(--success);}
  .desfecho-resumo.perda{border-left-color:var(--danger);}
  .desfecho-bloco{display:flex;flex-direction:column;gap:3px;}
  .desfecho-rotulo{
    font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .desfecho-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:19px;font-weight:500;
    color:var(--ink);letter-spacing:-.02em;white-space:nowrap;
  }
  .desfecho-resumo.ganho .desfecho-bloco:first-child .desfecho-valor{color:var(--success);}
  .desfecho-resumo.perda .desfecho-bloco:first-child .desfecho-valor{color:var(--danger);}

  .lost-list{display:flex;flex-direction:column;gap:8px;}
  .lost-row{
    display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;padding-right:12px;
  }
  .lost-row-bar{width:4px;background:var(--danger);flex-shrink:0;}
  .lost-row-main{flex:1;min-width:0;padding:11px 13px;}
  .lost-row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .lost-row-name{font-size:13.5px;font-weight:600;color:var(--ink);}
  .lost-row-value{font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .lost-row-deal{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .lost-row-motivo{font-size:12px;color:var(--ink-faint);font-style:italic;margin-top:5px;}
  .lost-row-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-faint);margin-top:8px;}
  .lost-row button{align-self:center;flex-shrink:0;}
  .lost-row.won .lost-row-bar{background:var(--success);}
  .lost-row.won .lost-row-value{color:var(--success);}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:28px 26px;box-shadow:var(--shadow-card);
  }
  .login-logo{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .login-card h2{font-size:18px;margin:0 0 4px;font-weight:700;}
  .login-card .sub{font-size:12.5px;color:var(--ink-muted);margin-bottom:20px;}
  .user-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;max-height:220px;overflow-y:auto;}
  .user-pick{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);
    border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;font-family:inherit;
  }
  .user-pick:hover{border-color:var(--primary);background:var(--primary-tint);}
  .user-pick.selected{border-color:var(--primary);background:var(--primary-tint);}
  .user-pick .name{font-size:13.5px;font-weight:600;flex:1;}
  .login-divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:11.5px;margin:18px 0;}
  .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border);}

<script type="module">
const { createElement: h, useState, useEffect, useRef, useMemo, useContext,
        createContext, Fragment } = React;

/* A cotação atravessa quase toda a interface — card, ficha, indicadores,
   visão offshore. Passá-la de props em props obrigaria a tocar em componentes
   que não têm nada a ver com câmbio. As funções de cálculo continuam
   recebendo-a por parâmetro, porque são puras e é assim que os testes as
   exercitam; só as telas leem do contexto. */
const CotacaoContext = createContext(null);
const useCotacao = () => useContext(CotacaoContext);
const ReactDOM = window.ReactDOM;

/* ================= Grupo familiar =================
   O escritório atende famílias, não só pessoas: patrimônio de cônjuges,
   filhos e holdings precisa ser lido junto. O grupo é sugerido pelo
   sobrenome, mas nunca aplicado sozinho — cônjuge com sobrenome diferente
   e holding PJ quebram a inferência automática, e um agrupamento errado
   contamina a leitura consolidada. */
const PARTICULAS = ['de','da','do','das','dos','e','del','di','van','von','ltda','sa','me','eireli'];

function sugerirGrupo(nome){
  if(!nome) return '';
  const partes = nome.trim().split(/\s+/)
    .map(p => p.replace(/[.,]/g,''))
    /* Descarta o que é só dígito: os clientes vindos da base do BTG carregam o
       número da conta no nome (o export traz só o primeiro nome, e sem a conta
       15 "Maria" ficariam indistinguíveis). Sem isso a sugestão virava
       "Família 009990001". */
    .filter(p => p.length > 1 && !/^\d+$/.test(p) && PARTICULAS.indexOf(p.toLowerCase()) === -1);
  if(partes.length < 2) return '';
  const ultimo = partes[partes.length - 1];
  return 'Família ' + ultimo.charAt(0).toUpperCase() + ultimo.slice(1);
}

const gruposExistentes = (leads) => Array.from(
  new Set(ativos(leads).map(l => (l.grupoFamiliar || '').trim()).filter(Boolean))
).sort((a,b) => a.localeCompare(b,'pt-BR'));

/* Membros do mesmo grupo, com o consolidado que justifica a existência dele. */
function grupoDe(leads, lead, cotacao){
  const nome = (lead.grupoFamiliar || '').trim();
  if(!nome) return null;
  const membros = ativos(leads).filter(l =>
    (l.grupoFamiliar || '').trim() === nome && (l.funil || 'assessor') !== 'especialista' && !l.perdido);
  return {
    nome, membros,
    outros: membros.filter(l => l.id !== lead.id),
    /* O consolidado da família soma as duas custódias de cada membro: é a
       leitura de multi family office, não a de uma conta. */
    carteira: membros.reduce((acc,l) => acc + valorEmCarteiraTotal(l, cotacao), 0),
    carteiraOffshore: membros.reduce((acc,l) => acc + valorEmCarteiraOffshore(l), 0),
    captacao: membros.reduce((acc,l) => acc + valorEmCaptacao(l, cotacao), 0),
  };
}

/* ================= Filtros =================
   Cada situação é uma pergunta que o assessor faz ao olhar o quadro:
   "quem está travado?", "quem tem documento pendente?", "o que ainda
   não captei?". O predicado fica junto do rótulo para não haver um
   mapa de nomes e outro de regras. */
const SITUACOES = [
  { key:'alerta',     label:'Com alerta',        funis:['assessor','especialista'],
    testa:(l, hoje) => alertasUrgentes(l, hoje).length > 0 },
  { key:'atrasado',   label:'Contato atrasado',  funis:['assessor','especialista'],
    testa:(l, hoje) => !!l.proximoContato && l.proximoContato < hoje },
  { key:'semContato', label:'Sem próximo contato', funis:['assessor','especialista'],
    testa:(l) => !l.proximoContato },
  { key:'sla',        label:'SLA estourado',     funis:['assessor'],
    testa:(l) => { const r = slaRestante(l); return r !== null && r < 0; } },
  { key:'onboarding', label:'Onboarding pendente', funis:['assessor'],
    testa:(l) => onboardingPendentes(l).length > 0 },
  { key:'captado',    label:'Captação efetivada', funis:['assessor'],
    testa:(l) => !!l.ganho },
  { key:'emCaptacao', label:'Em captação',       funis:['assessor'],
    testa:(l) => valorCaptacaoNaMoeda(l) > 0 },
  { key:'offshore',   label:'Com offshore',       funis:['assessor'],
    testa:(l) => temOffshore(l) },
];

const FILTROS_VAZIOS = { periodo:'all', de:'', ate:'', segmento:[], esteira:[], tipoPessoa:[], situacao:[], grupo:[], temperatura:[] };

const PERIODOS = [
  { valor:'all', label:'Tudo' },
  /* Padrão dos indicadores: a captação líquida é contabilizada por mês do
     calendário e recomeça do zero quando o mês vira. */
  { valor:'mes', label:'Este mês' },
  { valor:'30',  label:'30 dias' },
  { valor:'60',  label:'60 dias' },
  { valor:'90',  label:'90 dias' },
  { valor:'365', label:'12 meses' },
  { valor:'custom', label:'Escolher datas' },
];

/* Início do período, em ms. 'mes' é o mês do calendário, não 30 dias
   corridos: virando o mês a captação recomeça do zero, e 30 dias misturariam
   o fim de um mês com o começo do outro. Um lugar só para os três recortes
   (quadro, indicadores, fluxo) — cada um fazia a conta à mão com Number(),
   e 'mes' viraria NaN em silêncio no que fosse esquecido. */
function inicioDoPeriodo(periodo){
  if(periodo === 'mes'){
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  }
  return Date.now() - Number(periodo) * 86400000;
}

/* Data que representa o registro: o desfecho, quando houve, senão a criação.
   É a mesma referência usada nos indicadores, para as duas telas concordarem. */
function dataDeReferencia(lead){
  return lead.ganhoEm || lead.perdidoEm || lead.criadoEm || 0;
}

function dentroDoPeriodo(lead, f){
  if(!f || !f.periodo || f.periodo === 'all') return true;
  const ref = dataDeReferencia(lead);
  if(f.periodo === 'custom'){
    if(f.de && ref < new Date(f.de + 'T00:00:00').getTime()) return false;
    if(f.ate && ref > new Date(f.ate + 'T23:59:59').getTime()) return false;
    return true;
  }
  return ref >= inicioDoPeriodo(f.periodo);
}
const contarFiltros = (f) => Object.keys(f).reduce((acc,k) =>
  acc + (Array.isArray(f[k]) ? f[k].length : 0), 0) + (f.periodo && f.periodo !== 'all' ? 1 : 0);

/* Dentro de um grupo os valores somam (OU); entre grupos, restringem (E).
   É o comportamento que as pessoas esperam de filtro por caixinhas. */
function aplicarFiltros(leads, filtros, hoje){
  if(contarFiltros(filtros) === 0) return leads;
  return leads.filter(l => {
    if(!dentroDoPeriodo(l, filtros)) return false;
    if(filtros.segmento.length   && filtros.segmento.indexOf(l.segmento) === -1) return false;
    if(filtros.esteira.length    && filtros.esteira.indexOf(l.esteira || 'novo') === -1) return false;
    if(filtros.tipoPessoa.length && filtros.tipoPessoa.indexOf(l.tipoPessoa || 'PF') === -1) return false;
    /* 'sem' é uma escolha legítima: serve para achar quem ainda não foi
       classificado, que é o que faz a temperatura virar rotina.
       Captado não entra em recorte nenhum de temperatura — nem no 'sem', que
       existe para achar prospect por classificar, não gente que já é cliente. */
    if(filtros.temperatura.length){
      if(l.ganho) return false;
      if(filtros.temperatura.indexOf(l.temperatura || 'sem') === -1) return false;
    }
    if(filtros.grupo.length && filtros.grupo.indexOf((l.grupoFamiliar || '').trim()) === -1) return false;
    if(filtros.situacao.length){
      const bate = filtros.situacao.some(k => {
        const sit = SITUACOES.find(x => x.key === k);
        return sit && sit.testa(l, hoje);
      });
      if(!bate) return false;
    }
    return true;
  });
}

/* ================= Alertas =================
   Aviso com prazo preso ao cliente. O tipo classifica; o texto é livre,
   porque o que precisa ser lembrado varia caso a caso. */
const TIPOS_ALERTA = [
  { key:'vencimento', label:'Vencimento' },
  { key:'renovacao',  label:'Renovação'  },
  { key:'documento',  label:'Documento'  },
  { key:'aniversario',label:'Aniversário'},
  /* Nasce da conferência semanal com o BTG, não da mão de alguém: saldo que
     mudou além do rendimento sem movimentação lançada que o explique. */
  { key:'divergencia',label:'Divergência de saldo'},
  { key:'outro',      label:'Outro'      },
];
const tipoAlertaLabel = (k) => (TIPOS_ALERTA.find(t => t.key === k) || { label:'Aviso' }).label;

const alertasAbertos = (lead) => ((lead && lead.alertas) || []).filter(a => !a.resolvido);

/* Situação do alerta em relação a hoje. Espelha a lógica de urgência que o
   CRM já usa nos contatos, para o vocabulário visual não se multiplicar. */
function situacaoAlerta(alerta, hoje){
  if(alerta.resolvido) return 'ok';
  if(!alerta.data) return 'none';
  if(alerta.data < hoje) return 'late';
  if(alerta.data === hoje) return 'today';
  return 'ok';
}

/* Alertas que pedem ação: vencidos ou vencendo hoje. */
function alertasUrgentes(lead, hoje){
  return alertasAbertos(lead).filter(a => {
    const st = situacaoAlerta(a, hoje);
    return st === 'late' || st === 'today';
  });
}

/* Reúne tudo que pede ação hoje: alertas vencidos ou do dia, e contatos
   agendados que passaram. Uma fonte só, consumida pelo aviso de entrada e
   pelo bloco de notificações — assim os dois nunca discordam. */
function notificacoesDe(leads, hoje){
  const itens = [];
  leads.forEach(lead => {
    if(aniversarioHoje(lead, hoje)){
      const anos = idadeEm(lead, hoje);
      itens.push({
        id: lead.id + ':aniversario', leadId: lead.id, lead,
        classe: 'aniversario', rotulo: 'Aniversário',
        texto: (lead.tipoPessoa === 'PJ' ? aniversarianteDe(lead) + ' completa' : 'Completa')
          + (anos ? ' ' + anos + ' anos hoje' : ' aniversário hoje'),
        data: hoje, urgencia: 'today',
      });
    }
    alertasUrgentes(lead, hoje).forEach(a => itens.push({
      id: lead.id + ':' + a.id, leadId: lead.id, lead,
      classe: 'alerta', rotulo: tipoAlertaLabel(a.tipo), texto: a.texto,
      data: a.data, urgencia: situacaoAlerta(a, hoje),
    }));
    if(lead.proximoContato && lead.proximoContato <= hoje){
      itens.push({
        id: lead.id + ':contato', leadId: lead.id, lead,
        classe: 'contato', rotulo: 'Contato agendado',
        texto: etapaCurta(lead.etapa, lead.funil) + (lead.oportunidade ? ' · ' + lead.oportunidade : ''),
        data: lead.proximoContato,
        urgencia: lead.proximoContato < hoje ? 'late' : 'today',
      });
    }
  });
  /* Vencidos primeiro, e dentro deles o mais antigo no topo. */
  const peso = { late:0, today:1 };
  return itens.sort((a,b) =>
    (peso[a.urgencia] - peso[b.urgencia]) || (a.data || '').localeCompare(b.data || ''));
}

/* ================= Aniversário =================
   Derivado da data de nascimento, não gravado como alerta: assim ele se
   repete todo ano sozinho e não deixa registros mortos para trás. */
function aniversarioHoje(lead, hoje){
  if(!lead || !lead.nascimento) return false;
  /* Compara só mês e dia — o ano do nascimento é irrelevante aqui. */
  const ref = hoje || todayISO();
  if(lead.nascimento.slice(5) === ref.slice(5)) return true;
  /* 29/02 não existe em ano comum. diasParaAniversario já empurra a data
     para 1º de março; sem o mesmo tratamento aqui o cliente ficava travado
     em "faltam 0 dias" e a notificação nunca disparava. */
  if(lead.nascimento.slice(5) === '02-29' && ref.slice(5) === '03-01'){
    const ano = Number(ref.slice(0,4));
    const bissexto = (ano % 4 === 0 && ano % 100 !== 0) || ano % 400 === 0;
    return !bissexto;
  }
  return false;
}

/* Em PJ o aniversário é do contato, não da empresa: é a pessoa que recebe
   a ligação. Quando não há contato cadastrado, cai no nome da conta. */
function aniversarianteDe(lead){
  if(!lead) return '';
  if(lead.tipoPessoa === 'PJ') return (lead.contatoNome || '').trim() || lead.cliente || '';
  return lead.cliente || '';
}

/* Idade completada hoje. */
function idadeEm(lead, hoje){
  if(!lead || !lead.nascimento) return null;
  const ref = hoje || todayISO();
  let anos = Number(ref.slice(0,4)) - Number(lead.nascimento.slice(0,4));
  /* Subtrair só os anos dava a idade do fim do ano: quem nasce em dezembro
     aparecia um ano mais velho durante quase toda a ficha. Enquanto o
     aniversário não chega, a idade ainda não foi completada. */
  if(ref.slice(5) < lead.nascimento.slice(5)) anos -= 1;
  return anos > 0 && anos < 200 ? anos : null;
}

/* Dias até o próximo aniversário, para ordenar listas de proximidade. */
function diasParaAniversario(lead, hoje){
  if(!lead || !lead.nascimento) return null;
  const ref = hoje || todayISO();
  const [ano] = ref.split('-').map(Number);
  const alvo = new Date(ano + '-' + lead.nascimento.slice(5) + 'T12:00:00');
  const base = new Date(ref + 'T12:00:00');
  if(alvo < base) alvo.setFullYear(ano + 1);
  return Math.round((alvo - base) / 86400000);
}

/* ================= Movimentações da carteira =================
   Aporte soma, retirada subtrai. O patrimônio deixa de ser um número fixo
   e passa a ser saldo: o que entrou na largada, mais o que o cliente
   aportou depois, menos o que retirou. */
const TIPOS_MOVIMENTACAO = [
  { key:'aporte',   label:'Aporte',   sinal: 1 },
  { key:'retirada', label:'Retirada', sinal: -1 },
];
const sinalMov = (tipo) => tipo === 'retirada' ? -1 : 1;

/* ================= Custódia: onshore e offshore =================
   O mesmo cliente pode ter recursos no Brasil e lá fora. São duas custódias
   do mesmo relacionamento, não dois clientes: um card só, dois saldos, uma
   jornada. Por isso offshore não é funil nem etapa — é patrimônio.

   Guardado em dólar porque é assim que o custodiante informa. Converter na
   entrada apagaria o valor original e o número envelheceria sem que ninguém
   soubesse por qual cotação ele tinha passado. */
const CUSTODIAS = [
  { key:'onshore',  label:'Onshore',  moeda:'BRL', desc:'Recursos no Brasil' },
  { key:'offshore', label:'Offshore', moeda:'USD', desc:'Recursos no exterior, em dólar' },
];
/* Movimentação sem custódia é onshore: é o que todas as gravadas até aqui
   são, e assumir isso evita uma migração de dado que não muda nada. */
const custodiaDe = (m) => (m && m.custodia) === 'offshore' ? 'offshore' : 'onshore';
const ehOffshore = (m) => custodiaDe(m) === 'offshore';

const movimentacoesDe = (lead, custodia) => ((lead && lead.movimentacoes) || [])
  .filter(m => !custodia || custodiaDe(m) === custodia)
  .slice().sort((a,b) => (b.data || '').localeCompare(a.data || ''));

/* Saldo das movimentações até uma data (ou todas, se não informada).
   Sempre de UMA custódia: somar reais com dólares daria um número que não
   existe em moeda nenhuma. */
function saldoMovimentacoes(lead, ate, custodia){
  const qual = custodia || 'onshore';
  return ((lead && lead.movimentacoes) || []).reduce((acc, m) => {
    if(custodiaDe(m) !== qual) return acc;
    if(ate && m.data && m.data > ate) return acc;
    const v = parseValor(m.valor);
    return acc + (v === null ? 0 : v * sinalMov(m.tipo));
  }, 0);
}

function totaisMovimentacao(lead, custodia){
  const qual = custodia || 'onshore';
  const lista = ((lead && lead.movimentacoes) || []).filter(m => custodiaDe(m) === qual);
  const soma = (tipo) => lista.filter(m => m.tipo === tipo)
    .reduce((a,m) => a + (parseValor(m.valor) || 0), 0);
  const aportes = soma('aporte'), retiradas = soma('retirada');
  return { aportes, retiradas, liquido: aportes - retiradas, quantidade: lista.length };
}

/* ================= Cotação do dólar =================
   Decisão do escritório, não cotação de mercado buscada na hora: dois
   relatórios do mesmo dia têm de dar o mesmo número, e um indicador que muda
   sozinho entre duas aberturas da tela não se consegue conferir. O admin
   define, o banco registra quando e por quem, e toda tela que converte diz
   por qual cotação converteu. */
const COTACAO_CHAVE = 'usd_brl';
const cotacaoValida = (c) => !!c && typeof c.valor === 'number' && isFinite(c.valor) && c.valor > 0;

/* ================= Patrimônio sob gestão =================
   "Total da carteira" é o que o assessor já administra, não o que espera
   administrar. Cliente da base entra somando desde o cadastro, porque os
   recursos já estão dentro de casa. Cliente novo só entra depois que a
   captação é efetivada — antes disso ele é potencial, não carteira. */
function valorEmCarteira(lead){
  const base = valorInicialEmCarteira(lead);
  if(base === null) return 0;
  /* Nunca negativo: uma retirada maior que o registrado indica dado
     incompleto, não patrimônio negativo. */
  return Math.max(0, base + saldoMovimentacoes(lead));
}

/* O que entrou quando o cliente passou a ser gerido, antes das movimentações.

   Cliente da base tem coluna própria para isso (`saldoInicial`), separada do
   patrimônio do formulário. Eram a mesma, e corrigir o patrimônio mexia no
   sob gestão sem movimentação nenhuma — dinheiro entrando e saindo da
   carteira por digitação. Agora o sob gestão só muda por movimentação ou
   pela importação do BTG.

   `valorPotencial` fica como reserva para o registro gravado antes da coluna
   existir; a primeira gravação o congela (congelarSaldoInicial). */
function valorInicialEmCarteira(lead){
  if(!lead || (lead.funil || 'assessor') === 'especialista') return null;
  if(lead.perdido) return null;
  if((lead.esteira || 'novo') === 'base'){
    const saldo = parseValor(lead.saldoInicial);
    return saldo !== null ? saldo : (parseValor(lead.valorPotencial) || 0);
  }
  if(lead.ganho) return parseValor(lead.valorFechado) || parseValor(lead.valorPotencial) || 0;
  return null;
}

/* Na hora de gravar um cliente da base que ainda não tem saldo próprio,
   guarda o que ele tinha ANTES da edição. Sem isso o registro antigo — saldo
   dentro do patrimônio — seguiria mexendo no sob gestão na primeira vez que
   alguém corrigisse o patrimônio. No cadastro não há "antes": o patrimônio
   informado é o saldo que já está em casa, que é o que "base" quer dizer.
   Vazio vira zero, e não reserva: senão digitar o patrimônio depois faria o
   sob gestão aparecer do nada. */
function congelarSaldoInicial(atual, editado){
  if(!editado || (editado.funil || 'assessor') === 'especialista') return editado;
  if((editado.esteira || 'novo') !== 'base') return editado;
  if(parseValor(editado.saldoInicial) !== null) return editado;
  const origem = atual && (atual.esteira || 'novo') === 'base' ? atual.valorPotencial : editado.valorPotencial;
  const v = parseValor(origem);
  return { ...editado, saldoInicial: fmtBRL(v === null ? 0 : v) };
}

/* O mesmo congelamento, do lado de fora. Vale para quem já é carteira —
   cliente da base e cliente captado —, porque é nele que o campo do
   formulário deixou de ser o saldo. Prospect não congela: o offshore dele é
   declarado mesmo, e só vira carteira pelo valor da captação. Sem offshore
   nenhum congela em zero: descobrir dinheiro lá fora depois não é captar. */
function congelarSaldoInicialOffshore(atual, editado){
  if(!editado || (editado.funil || 'assessor') === 'especialista') return editado;
  if((editado.esteira || 'novo') !== 'base' && !editado.ganho) return editado;
  if(parseValor(editado.saldoInicialOffshore) !== null) return editado;
  const v = parseValor(atual ? atual.valorOffshore : editado.valorOffshore);
  return { ...editado, saldoInicialOffshore: fmtUSD(v === null ? 0 : v) };
}

/* O cliente entrou na carteira? Vale para as duas custódias: quem tem só
   offshore continua sendo carteira.

   Existe porque a captação líquida e o fluxo offshore somavam movimentação de
   quem AINDA NÃO era carteira — um aporte lançado num prospect antes da
   captação efetivada entrava no indicador sem entrar no total, e a invariante
   "sem filtro de período, captação líquida bate com o total da carteira"
   deixava de valer. `serieDeEventos` já fazia esse corte (`inicial === null`);
   os dois indicadores não faziam. */
function naCarteira(lead){
  return valorInicialEmCarteira(lead) !== null || valorInicialOffshore(lead) !== null;
}

/* ---- A mesma carteira, do lado de fora ----
   A regra de entrada é a de sempre, de propósito: enquanto a captação não se
   efetiva o dinheiro é do cliente, não da casa — e isso não muda por estar
   em Nassau. Tudo aqui é dólar; a conversão acontece só na leitura. */
/* O que entrou sob gestão lá fora, antes das movimentações, mora em coluna
   própria (`saldoInicialOffshore`), separada do "Patrimônio offshore" do
   formulário. Eram o mesmo campo, e anotar dinheiro que o cliente tem em
   outro lugar somava na carteira sem captação nenhuma. O que vale para a
   carteira é o que se captou: captação efetivada, movimentação offshore ou
   importação do AuC. `valorOffshore` fica como reserva para o registro
   gravado antes da coluna, e a primeira gravação o congela
   (congelarSaldoInicialOffshore). */
function valorInicialOffshore(lead){
  if(!lead || (lead.funil || 'assessor') === 'especialista') return null;
  if(lead.perdido) return null;
  if((lead.esteira || 'novo') !== 'base' && !lead.ganho) return null;
  const saldo = parseValor(lead.saldoInicialOffshore);
  if(saldo !== null) return saldo;
  /* Quem já é carteira e nunca teve offshore começa em ZERO, não em "sem
     carteira offshore". Com nulo, valorEmCarteiraOffshore descartava as
     movimentações: a primeira captação offshore confirmada de um cliente da
     base entrava no fluxo — que só pergunta se ele é carteira — e não
     entrava no sob gestão. */
  const declarado = parseValor(lead.valorOffshore);
  return declarado !== null ? declarado : 0;
}
function valorEmCarteiraOffshore(lead){
  const base = valorInicialOffshore(lead);
  if(base === null) return 0;
  return Math.max(0, base + saldoMovimentacoes(lead, null, 'offshore'));
}
/* Abaixo disso o saldo é resíduo — US$ 0,03 de uma conta esvaziada — e não
   relacionamento. O valor continua gravado como veio e continua somando no
   total; só não faz o cliente aparecer como offshore (selo, filtro, lista),
   nem gera alerta na importação: 0,5% de três centavos é um décimo de
   centavo, e qualquer variação viraria divergência. */
const OFFSHORE_PISO_USD = 100;
/* O maior entre o declarado e o que está em carteira: prospect só tem o
   declarado, e cliente com aporte lançado sobre um saldo de centavos tem
   carteira de verdade. */
const temOffshore = (lead) => !!lead &&
  Math.max(parseValor(lead.valorOffshore) || 0, valorEmCarteiraOffshore(lead)) >= OFFSHORE_PISO_USD;

/* ---- Consolidado ----
   Sem cotação não se inventa uma: o offshore fica de fora da soma e a tela
   diz que ficou. Um número convertido por um câmbio que ninguém definiu é
   pior do que um número que se assume incompleto. */
const emReais = (usd, cotacao) => cotacaoValida(cotacao) ? usd * cotacao.valor : null;
function valorEmCarteiraTotal(lead, cotacao){
  const convertido = emReais(valorEmCarteiraOffshore(lead), cotacao);
  return valorEmCarteira(lead) + (convertido === null ? 0 : convertido);
}

/* A captação da base pode ser no Brasil ou lá fora. O valor negociado fica
   na moeda da custódia escolhida — reais ou dólares — e só vira real na
   leitura, pela cotação, como todo o offshore. */
const custodiaCaptacao = (lead) => (lead && lead.captacaoCustodia === 'offshore') ? 'offshore' : 'onshore';
const moedaCaptacao = (lead) => custodiaCaptacao(lead) === 'offshore' ? fmtUSD : fmtBRL;

/* O que ainda está em jogo, na moeda em que está. Cliente novo: o patrimônio
   potencial, até a captação se efetivar. Cliente da base: o valor da
   captação nova em negociação — ele já é carteira, e o que está em jogo é o
   dinheiro a mais, nunca o patrimônio que já está em casa. */
function valorCaptacaoNaMoeda(lead){
  if(!lead || (lead.funil || 'assessor') === 'especialista') return 0;
  if(lead.perdido) return 0;
  if((lead.esteira || 'novo') === 'base') return parseValor(lead.valorEmCaptacao) || 0;
  if(lead.ganho) return 0;
  return parseValor(lead.valorPotencial) || 0;
}

/* O mesmo, em reais, para somar. A captação offshore entra convertida pela
   cotação do escritório; sem cotação fica fora da soma — a regra de todo o
   offshore: número convertido por um câmbio que ninguém definiu é pior do
   que um total que se assume incompleto. */
function valorEmCaptacao(lead, cotacao){
  const v = valorCaptacaoNaMoeda(lead);
  if(!v || !clienteDaBase(lead) || custodiaCaptacao(lead) === 'onshore') return v;
  const brl = emReais(v, cotacao);
  return brl === null ? 0 : brl;
}

/* O aporte de um cliente da base que estava em negociação É a captação
   chegando: sai de "em captação" o que entrou na carteira. Sem isso o mesmo
   dinheiro aparece duas vezes — no sob gestão e ainda em captação. Aporte
   maior que o negociado zera; menor abate, e o resto segue em negociação.
   Só na mesma custódia: dólar não abate real, nem real abate dólar. */
function abaterCaptacao(lead, mov){
  if(!clienteDaBase(lead) || !mov || mov.tipo !== 'aporte' || custodiaDe(mov) !== custodiaCaptacao(lead)) return lead;
  const aberto = parseValor(lead.valorEmCaptacao);
  if(!aberto) return lead;
  const resto = Math.max(0, aberto - (parseValor(mov.valor) || 0));
  return resto > 0
    ? { ...lead, valorEmCaptacao: moedaCaptacao(lead)(resto) }
    : { ...lead, valorEmCaptacao: '', captacaoCustodia: '' };
}

/* ---- Captação da base: informar, depois confirmar ----
   "Tenho um cliente com X comigo, começamos a negociar mais Y, e está quente."
   O ciclo tem três pontos e cada um fica no histórico: começa (valor e
   temperatura), termina com o dinheiro entrando — vira aporte — ou termina
   sem entrar. A temperatura da base é a dessa negociação e fecha junto com
   ela: um "quente" no card de quem já trouxe o dinheiro diria a coisa errada. */
const sufixoTemperatura = (k) => temperaturaInfo(k) ? ' · ' + temperaturaInfo(k).label.toLowerCase() : '';
const entradaHistorico = (lead, resumo, autor, quando) =>
  ({ id: uid('h'), de: lead.etapa, para: lead.etapa, data: quando || Date.now(), resumo, autor });

/* Começa ou altera a negociação. Alterar é o mesmo passo com o valor antigo
   no histórico: a temperatura muda ao longo da conversa, e é essa trajetória
   que o admin quer poder ler depois. */
function iniciarCaptacao(lead, { valor, temperatura, custodia, autor, quando } = {}){
  const v = parseValor(valor);
  if(!clienteDaBase(lead) || !v || v <= 0) return lead;
  const c = custodia === 'offshore' ? 'offshore' : 'onshore';
  const fmt = c === 'offshore' ? fmtUSD : fmtBRL;
  const rotulo = c === 'offshore' ? 'Captação offshore' : 'Captação';
  const antes = parseValor(lead.valorEmCaptacao) || 0;
  /* O valor anterior sai na moeda em que estava: trocar de custódia no meio
     da negociação também é trajetória. */
  const resumo = antes > 0
    ? rotulo + ' atualizada · ' + moedaCaptacao(lead)(antes) + ' → ' + fmt(v) + sufixoTemperatura(temperatura)
    : rotulo + ' iniciada · ' + fmt(v) + sufixoTemperatura(temperatura);
  return { ...lead, valorEmCaptacao: fmt(v), captacaoCustodia: c, temperatura: temperatura || '',
    historico: [...(lead.historico || []), entradaHistorico(lead, resumo, autor, quando)] };
}

/* O dinheiro entrou: vira aporte onshore com a data informada, e por isso
   soma no sob gestão e na captação líquida do mês. Grava o que ENTROU, não o
   que foi negociado — se diferirem, o histórico guarda os dois. */
function confirmarCaptacao(lead, { valor, data, autor, quando } = {}){
  const v = parseValor(valor);
  const negociado = parseValor(lead.valorEmCaptacao) || 0;
  if(!clienteDaBase(lead) || !negociado || !v || v <= 0 || !data) return lead;
  const agora = quando || Date.now();
  /* O aporte nasce na custódia da negociação: captação offshore soma no sob
     gestão offshore, em dólar. */
  const custodia = custodiaCaptacao(lead);
  const fmt = moedaCaptacao(lead);
  const mov = { id: uid('mv'), tipo:'aporte', valor: fmt(v), data, custodia,
                nota:'Captação confirmada', autor, criadoEm: agora };
  const resumo = (custodia === 'offshore' ? 'Captação offshore confirmada · ' : 'Captação confirmada · ')
    + fmt(v) + ' entrou' + (v !== negociado ? ' (negociado ' + fmt(negociado) + ')' : '');
  return { ...lead, valorEmCaptacao: '', captacaoCustodia: '', temperatura: '',
    movimentacoes: [...(lead.movimentacoes || []), mov],
    historico: [...(lead.historico || []), entradaHistorico(lead, resumo, autor, agora)] };
}

/* Não aconteceu: fecha sem mexer na carteira. */
function encerrarCaptacao(lead, { motivo, autor, quando } = {}){
  const negociado = parseValor(lead.valorEmCaptacao) || 0;
  if(!clienteDaBase(lead) || !negociado) return lead;
  const resumo = (custodiaCaptacao(lead) === 'offshore' ? 'Captação offshore encerrada sem entrada · ' : 'Captação encerrada sem entrada · ')
    + moedaCaptacao(lead)(negociado) + ((motivo || '').trim() ? ' · ' + motivo.trim() : '');
  return { ...lead, valorEmCaptacao: '', captacaoCustodia: '', temperatura: '',
    historico: [...(lead.historico || []), entradaHistorico(lead, resumo, autor, quando)] };
}

/* Na jornada, captar não encerra o acompanhamento: o cliente segue para as
   próximas reuniões. No funil do especialista, fechar encerra o negócio. */
function saiuDoQuadro(lead){
  if(lead.perdido) return true;
  return (lead.funil || 'assessor') === 'especialista' && lead.ganho;
}

/* A jornada termina quando o último especialista encerra o atendimento:
   todo encaminhamento virou venda ou perda. Enquanto houver um em aberto,
   o cliente continua na R4. */
function encaminhamentosDe(leads, origemId){
  return ativos(leads).filter(l => l.origemLeadId === origemId && l.funil === 'especialista');
}
/* O especialista encerrou a parte dele quando fechou, perdeu, ou empurrou
   para Contato Futuro — nos três casos não há mais trabalho ativo em cima
   daquela indicação, e a jornada do cliente pode ser dada por cumprida. */
function encerradoPeloEspecialista(lead){
  return !!lead && (lead.ganho || lead.perdido || lead.etapa === 'Contato Futuro');
}

/* R4 sem nenhuma indicação criada: o assessor chegou na reunião de produto
   e fechou o modal sem encaminhar. Fica pendente até resolver. */
function semIndicacao(leads, lead){
  if(!lead || (lead.funil || 'assessor') === 'especialista') return false;
  if(lead.etapa !== 'R4') return false;
  return encaminhamentosDe(leads, lead.id).length === 0;
}

function jornadaConcluida(leads, origem){
  if(!origem || (origem.funil || 'assessor') === 'especialista') return false;
  const filhos = encaminhamentosDe(leads, origem.id);
  return filhos.length > 0 && filhos.every(encerradoPeloEspecialista);
}

   Formalidades de abertura de conta. Pertencem ao cliente, não à reunião:

/* Pauta efetiva deste cliente nesta etapa. */
function pautasDe(lead){

    (!i.esteiras  || i.esteiras.indexOf(lead.esteira || 'novo') !== -1)
  );

/* ================= Temperatura do lead =================
   Leitura de engajamento, não de etapa: um cliente pode estar na R2 e frio,
   ou na R1 e quente. Por isso é campo próprio e não sai da etapa nem do SLA —
   quem sabe a temperatura é quem falou com a pessoa.
   Fica em branco de propósito enquanto ninguém classificou: inventar "morno"
   por padrão daria a toda a base uma leitura que ninguém fez. */
const TEMPERATURAS = [
  { key:'quente', label:'Quente', cor:'#C0392B', desc:'Engajado, decisão à vista' },
  { key:'morno',  label:'Morno',  cor:'#B08A2E', desc:'Interessado, sem data definida' },
  { key:'frio',   label:'Frio',   cor:'#5B7086', desc:'Sem resposta ou sem prioridade agora' },
];
const temperaturaInfo = (k) => TEMPERATURAS.find(t => t.key === k) || null;

/* Temperatura é leitura de prospecção: mede o quanto o cliente está engajado
   em virar cliente. Efetivada a captação, a pergunta deixou de existir — ele
   já está em casa, e um selo "morno" ao lado de quem acabou de trazer 2 mi
   diria a coisa errada sobre a relação.

   O valor continua gravado, e não apagado: se a captação for revertida, o
   cliente volta a ser prospect com a última leitura que alguém fez dele. */
const clienteDaBase = (lead) => !!lead
  && (lead.funil || 'assessor') !== 'especialista' && (lead.esteira || 'novo') === 'base';

/* Cliente da base só tem temperatura com captação aberta: a dele é a da
   negociação, e sem negociação não há o que medir. */
const temperaturaDe = (lead) => (lead && lead.ganho) ? null
  : (clienteDaBase(lead) && !(valorCaptacaoNaMoeda(lead) > 0)) ? null
  : temperaturaInfo(lead && lead.temperatura);

   já está em casa, e o que se mede é o dinheiro a mais — quanto
   (valorEmCaptacao) e com que chance. Mesma coluna e mesma escala do

   colunas deixariam uma delas sempre vazia. Muda o texto, num lugar só
   (`clienteDaBase`, declarada acima de temperaturaDe, que depende dela). */
const TEMPERATURA_BASE_DESC = {
  quente:'Captação à vista: valor e decisão próximos',
  morno: 'Em negociação, sem data definida',
  frio:  'Parada, ou sem prioridade agora',
};
function descTemperatura(k, lead){
  const t = temperaturaInfo(k);
  if(!t) return null;
  return clienteDaBase(lead) ? TEMPERATURA_BASE_DESC[k] : t.desc;
}

/* O que o especialista precisa saber antes do primeiro contato. Os interesses
   mudam por produto: carta de crédito e apólice não têm a mesma natureza. */

  'Seguro':    ['Vida', 'Residencial', 'Automóvel', 'Empresarial', 'Saúde', 'Responsabilidade civil'],
