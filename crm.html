<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pipeline — CRM Comercial</title>
<style>
  /* As fontes vem do Google como melhoria: se a rede bloquear, o CRM
   cai na tipografia do proprio portal, nao em Times e Arial. */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --navy:#05132A;
    --navy-2:#0C2246;
    --bg:#F4F6F9;
    --surface:#FFFFFF;
    --ink:#0C1626;
    --ink-muted:#5C6B7F;
    --ink-faint:#95A1B0;
    --border:#E2E6ED;
    --border-strong:#CCD3DD;
    --primary:#195AB4;
    --primary-hover:#124685;
    --primary-tint:#E7EFFB;
    --danger:#B3403A;
    --danger-tint:#FBEBEA;
    --success:#2F7A56;
    --success-tint:#E6F1EC;
    --gold:#B08A2E;
    --gold-tint:#F7F0DC;
    /* Offshore ganha cor propria porque e uma custodia, nao um estado: nao
       pode se confundir com o verde de ganho nem com o dourado de captacao.
       Teal fica longe dos dois e do azul da Jornada. */
    --offshore:#0F766E;
    --offshore-tint:#E4F1EF;
    --amber:#B08A2E;
    --amber-tint:#F7F0DC;

    --stage-novo:#8A97A8;      --stage-novo-tint:#EEF1F5;
    --stage-r1:#4A7FC9;        --stage-r1-tint:#E9F1FB;
    --stage-r2:#195AB4;        --stage-r2-tint:#E7EFFB;
    --stage-r21:#B08A2E;       --stage-r21-tint:#F7F0DC;
    --stage-r3:#0C2246;        --stage-r3-tint:#E8EAF0;
    --stage-r4:#7A5CA8;        --stage-r4-tint:#EFEAF6;
    /* mantidos por compatibilidade com o gerador de PDF */
    --stage-negociando:#B08A2E;--stage-negociando-tint:#F7F0DC;
    --stage-futuro:#0C2246;    --stage-futuro-tint:#E8EAF0;

    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:16px;
    --radius-xl:20px;

    --space-1:4px;  --space-2:8px;  --space-3:12px;
    --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;

    --shadow-card:0 1px 2px rgba(5,19,42,.06), 0 1px 1px rgba(5,19,42,.04);
    --shadow-raised:0 2px 4px rgba(5,19,42,.05), 0 8px 20px -8px rgba(5,19,42,.12);
    --shadow-navy:0 2px 6px rgba(5,19,42,.18), 0 16px 36px -12px rgba(5,19,42,.34);
    --shadow-modal:0 20px 60px rgba(5,19,42,.28);

    --ease:cubic-bezier(.2,.7,.3,1);

    /* Altura útil da coluna. O piso de 660px garante cinco cards à vista
       mesmo em janela baixa; acima disso, a coluna usa o que a tela oferece.
       Quando o piso vence, a página rola — preferível a mostrar dois cards.
       760px = cabeçalho da coluna (~75) + 5 cards (~130) + espaçamentos (~32). */
    --altura-coluna:max(760px, calc(100vh - 340px));
  }
  .overview-fechada{ --altura-coluna:max(760px, calc(100vh - 200px)); }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Foco visível em toda a interface — nenhuma ação fica invisível no teclado */
  :where(button, a, input, select, textarea):focus-visible{
    outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--radius-xs);
  }
  h1,h2,h3,.font-display{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;}

  /* ---------- Números não quebram ----------
     Valores como "R$ 31,8M" têm um espaço interno, e em coluna estreita o
     navegador quebra ali, jogando a moeda numa linha e o número em outra.
     A regra vale para tudo que usa a face de dados; os poucos blocos de
     texto corrido em mono são excetuados logo abaixo. */
  .mono, .view-tab .count, .hero-figure, .tile-figure, .attention-count,
  .attention-row-when, .colapsada-count, .column-count, .column-total,
  .lead-card-value, .lead-card-dates .val, .history-item-date, .sla-chip,
  .produto-tab-num, .pauta-contador, .card-pauta, .pj-tag, .alerta-data,
  .notif-data, .rosca-valor, .rosca-pct, .ind-valor, .composicao-valor,
  .composicao-qtd, .carteira-variacao, .producao-anel, .producao-num,
  .grupo-total, .grupo-membro-valor, .ficha-tile-valor, .lost-row-badge,
  .pending-dot, .kpi-tile .kpi-num, .bar-row-pos, .bar-row-num, .barra-v-num,
  .month-label, .meta-line{
    white-space:nowrap;
  }
  /* Estes são texto, não número: precisam quebrar. */
  .csv-dump, .print-header .print-meta{ white-space:normal; }
  .csv-dump{ white-space:pre; }
  .mono{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;}

  /* ---------- Masthead ---------- */
  .masthead{
    background:var(--navy);border-bottom:2px solid var(--gold);
    padding:14px 28px;display:flex;align-items:baseline;gap:12px;
  }
  .masthead-inner{max-width:1440px;margin:0 auto;width:100%;display:flex;align-items:baseline;gap:10px;}
  .masthead .wordmark{
    font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:19px;color:#fff;letter-spacing:.01em;
  }
  .masthead .tagline{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11.5px;color:#9FB2CE;text-transform:uppercase;letter-spacing:.08em;
  }
  /* Nome do contexto ao lado da marca: reforça a cor com palavra, para quem
     não distingue os tons e para deixar a mudança explícita. */
  .masthead .contexto{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:600;
    color:var(--acento);letter-spacing:.06em;text-transform:uppercase;
    padding-left:12px;margin-left:2px;border-left:1px solid rgba(255,255,255,.18);
  }
  .masthead .contexto:empty{display:none;}

  /* ---------- Temas por contexto ----------
     Cada CRM tem fundo, acento e filete próprios. A identidade não muda:
     o navy e a serifada continuam iguais nos três. */
  body{ --acento:var(--gold); }

  body[data-tema="jornada"]{
    --bg:#F4F6F9;
    --acento:#B08A2E;
  }
  /* Consórcio: grafite. Neutro e sóbrio, sem competir com o navy da marca. */
  body[data-tema="consorcio"]{
    --bg:#F1F2F4;
    --acento:#8B94A3;
    --primary:#2E343D;      --primary-hover:#1D2229;
    --primary-tint:#E7E9ED;
  }
  /* Seguro: verde profundo, ligado a proteção e continuidade. */
  body[data-tema="seguro"]{
    --bg:#F1F6F3;
    --acento:#2E7D5B;
    --primary:#1F6B52;      --primary-hover:#175540;
    --primary-tint:#E2EFE9;
  }

  body[data-tema] .masthead{ border-bottom-color:var(--acento); }

  /* Admin: visão de tudo. Um fio dourado acima do cabeçalho marca isso sem
     competir com a cor do contexto, que continua sendo a informação principal. */
  body[data-papel="admin"] .masthead{
    border-top:3px solid var(--gold);
    background:linear-gradient(180deg, #0A1F3D 0%, var(--navy) 100%);
  }
  body[data-papel="admin"] .masthead .wordmark::after{
    content:'Admin';
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:9px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--navy);
    background:var(--gold);border-radius:3px;padding:2px 5px;
    margin-left:9px;vertical-align:3px;
  }
  /* A coluna do kanban acompanha o fundo, senão o cinza destoa do tema. */
  body[data-tema="consorcio"] .column{ background:#E7E9ED; border-color:#DBDFE6; }
  body[data-tema="consorcio"] .column.colapsada{ background:#E7E9ED; border-color:#DBDFE6; }
  body[data-tema="consorcio"] .column-body::-webkit-scrollbar-thumb{ background:#A7AFBC; }
  body[data-tema="seguro"] .column{ background:#E7F0EA; border-color:#D6E4DB; }
  body[data-tema="seguro"] .column.colapsada{ background:#E7F0EA; border-color:#D6E4DB; }
  body[data-tema="seguro"] .column-body::-webkit-scrollbar-thumb{ background:#9DBCAB; }

  #app{max-width:1440px;margin:0 auto;padding:24px 28px 64px;}

  /* ---------- Header ---------- */
  /* Duas faixas: título e ferramentas em cima, navegação embaixo. A
     separação existe para nada mudar de lugar ao trocar de tela — controle
     que dança atrasa o aprendizado de quem está começando. */
  .topbar{
    /* A EXCEÇÃO à regra do minmax(0,…), e ela não é acadêmica: as duas
       variantes foram medidas a 900px.
         minmax(0,1fr)          → o título encolhe abaixo do conteúdo e
                                  "Indicadores", que é palavra só, vaza 16px.
         minmax(min-content,1fr)→ a coluna do título vira 610px, sobra 203px
                                  para as ferramentas e o body rola 422px.
         1fr                    → correto.
       Cabeçalho não é grade de número: aqui o `1fr` cru é a forma certa, e
       trocá-lo por minmax quebra de um jeito ou de outro. */
    display:grid;grid-template-columns:1fr auto;align-items:center;
    gap:var(--space-3) var(--space-4);
    margin-bottom:var(--space-5);padding-bottom:var(--space-4);
    border-bottom:1px solid var(--border);
  }
  .topbar-nav{
    grid-column:1 / -1;order:2;
    display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;
  }
  /* A busca reserva o próprio espaço mesmo onde não se aplica. */
  /* A busca é o elemento elástico da barra: `flex-shrink:0` a travava em 198px
     a 900px, e na visão de desqualificados — cujo título é o mais longo — a
     linha estourava 7px e o body passava a rolar. Encolher até 180px dá 18px
     de folga, absorve o pior título e mantém a barra estável: nada quebra
     linha nem muda de posição ao navegar, que é a regra do cabeçalho. */
  .busca-slot{width:clamp(180px, 22vw, 300px);flex:0 1 auto;min-width:180px;}
  .busca-slot.oculta{visibility:hidden;pointer-events:none;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-mark{
    width:9px;height:9px;border-radius:2px;background:var(--gold);
    display:inline-block;transform:rotate(45deg);
  }
  .brand h1{font-size:23px;font-weight:600;margin:0;letter-spacing:-0.015em;color:var(--navy);}
  .brand span{color:var(--ink-muted);font-size:13px;}

  .topbar-actions{
    display:flex;align-items:center;gap:10px;justify-content:flex-end;
    grid-column:2;order:1;min-width:0;
  }
  /* Um <select> se dimensiona pela opção mais longa, não pela selecionada: com
     a equipe real, "Marcelo Donizeti Arruda de Oliveira Junior" esticava o
     seletor para 303px e estourava a barra em janela de ~900px. O teto corta só
     o rótulo fechado — a lista aberta segue mostrando o nome inteiro. Deixar a
     barra quebrar não serviria: ela é fixa por convenção, nada pode mudar de
     posição ao navegar. */
  .topbar-actions select{max-width:200px;text-overflow:ellipsis;}
  .search-wrap{position:relative;flex:1;max-width:320px;min-width:180px;}
  .search-wrap input{
    width:100%;height:38px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--surface);padding:0 12px 0 34px;font-size:13.5px;color:var(--ink);
    font-family:inherit;outline:none;transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--primary);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}

  .select-sm{
    height:38px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
    padding:0 10px;font-size:13px;color:var(--ink);font-family:inherit;outline:none;
  }
  .select-sm:focus{border-color:var(--primary);}

  .btn{
    display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;
    border-radius:var(--radius);border:1px solid transparent;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;transition:background .15s, border-color .15s;white-space:nowrap;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-ghost{background:var(--surface);border-color:var(--border);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--border-strong);}
  .btn-danger-ghost{background:var(--surface);border-color:var(--border);color:var(--danger);}
  .btn-danger-ghost:hover{background:var(--danger-tint);border-color:var(--danger);}
  .btn-danger-solid{background:var(--danger);color:#fff;}
  .btn-danger-solid:hover{background:#8F332E;}
  .btn-success-solid{background:var(--success);color:#fff;}
  .btn-success-solid:hover{background:#245F44;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .view-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:3px;}
  .view-tab{
    height:32px;padding:0 13px;border:none;border-radius:7px;background:none;color:var(--ink-muted);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;
  }
  .view-tab.active{background:var(--primary);color:#fff;}
  .view-tab .count{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;background:rgba(255,255,255,.25);
    border-radius:10px;padding:1px 6px;
  }
  .view-tab:not(.active) .count{background:var(--bg);color:var(--ink-faint);}
  /* Operação, não aba: ponta direita da faixa de navegação, com a borda
     direita na mesma linha do botão de sair logo acima. `margin-left:auto`
     resolve sem medida fixa — faixa e ferramentas terminam na mesma borda da
     grade — e, se a faixa quebrar em janela estreita, ele cai para a direita
     da linha de baixo em vez de ficar solto à esquerda. */
  .nav-importacao{margin-left:auto;}
  .nav-importacao.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .save-banner{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--danger-tint);border:1px solid var(--danger);color:var(--danger);
    border-radius:var(--radius);padding:10px 14px;font-size:12.5px;margin-bottom:16px;
  }
  .save-banner .btn{height:30px;padding:0 12px;font-size:12px;color:var(--danger);border-color:var(--danger);}

  /* ---------- User / role chips ---------- */
  .user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:24px;background:var(--surface);}
  .avatar{
    width:26px;height:26px;border-radius:50%;background:var(--primary-tint);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Fraunces',Georgia,'Times New Roman',serif;flex-shrink:0;
  }
  .user-chip .name{font-size:12.5px;font-weight:600;}
  .role-badge{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:2px 7px;border-radius:20px;
  }
  .role-badge.admin{background:var(--amber-tint);color:var(--amber);}
  .role-badge.vendedor{background:var(--primary-tint);color:var(--primary);}

  /* ---------- Bento ---------- */
  /* Grade de 6 colunas. Os blocos declaram o próprio span, o auto-flow resolve o resto. */
  .bento{
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-3);margin-bottom:var(--space-6);
  }
  .bento-block{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;min-width:0;
  }
  .bento-hero{grid-column:span 2;grid-row:span 2;}
  .bento-tile{grid-column:span 1;justify-content:space-between;gap:var(--space-3);}
  .bento-wide{grid-column:span 2;grid-row:span 2;}

  /* Eyebrow: mesma família das labels de formulário, para o vocabulário visual não se multiplicar */
  .bento-eyebrow{
    font-size:10.5px;font-weight:600;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.07em;
  }

  /* --- Bloco herói --- */
  .bento-block.navy{
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(176,138,46,.16) 0%, rgba(176,138,46,0) 58%),
      var(--navy);
    border-color:var(--navy);box-shadow:var(--shadow-navy);position:relative;overflow:hidden;
    justify-content:space-between;gap:var(--space-4);
  }
  .bento-block.navy::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold);opacity:.85;
  }
  .bento-block.navy .bento-eyebrow{color:#A8BBD6;}
  .hero-figure{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-weight:500;color:#fff;
    font-size:clamp(26px,3.2vw,38px);line-height:1;letter-spacing:-.02em;margin-top:var(--space-2);
    font-variant-numeric:tabular-nums;
  }
  /* O 3.2vw acima escala pela JANELA, mas a caixa do herói é 2/6 da grade: entre
     1280px e 1440px a caixa encolhe mais rápido que a fonte, e
     "R$ 685.879.709,12" saía para fora do cartão. Aqui o número passa a escalar
     pela própria caixa. O @supports mantém o vw como reserva onde container
     query não existir — sem ele, um navegador antigo ficaria sem font-size. */
  @supports (container-type: inline-size){
    .bento-hero{container-type:inline-size;}
    .hero-figure{font-size:clamp(20px,8.5cqw,38px);}
  }
  .hero-sub{font-size:12px;color:#9FB2CE;margin-top:var(--space-2);}
  .hero-sub strong{color:#fff;font-weight:600;}

  /* --- Assinatura: espectro do funil em uma única faixa --- */
  .spectrum{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px;background:rgba(255,255,255,.08);}
  .spectrum-seg{min-width:3px;transition:flex-grow .4s var(--ease);}
  .spectrum-legend{
    display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);margin-top:var(--space-3);
  }
  .spectrum-key{display:flex;align-items:center;gap:5px;font-size:11px;color:#9FB2CE;}
  .spectrum-key b{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-weight:500;color:#fff;font-size:11px;
  }
  .spectrum-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
  .spectrum-empty{font-size:12px;color:#9FB2CE;}

  /* --- Tiles pequenos --- */
  .tile-figure{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:26px;font-weight:500;color:var(--ink);
    line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .tile-label{font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:6px;line-height:1.35;}
  .stat-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .bento-tile.alert{background:var(--danger-tint);border-color:#F0CFCC;}
  .bento-tile.alert .tile-figure{color:var(--danger);}
  .bento-tile.alert .tile-label{color:#8F423D;}
  .bento-tile.clear{background:var(--success-tint);border-color:#CFE3D8;}
  .bento-tile.clear .tile-figure{color:var(--success);}
  .bento-tile.clear .tile-label{color:#2A6349;}

  /* --- Bloco de atenção --- */
  .bento-wide .attention-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);
    padding-bottom:var(--space-3);border-bottom:1px solid var(--border);
  }
  .attention-count{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:15px;font-weight:500;color:var(--danger);
  }
  .attention-count.zero{color:var(--success);}
  /* Altura travada: sem isso a lista cresce e estica a linha inteira da grade,
     aumentando o herói e os tiles junto. Agora ela rola dentro do bloco. */
  .attention-list{
    display:flex;flex-direction:column;margin-top:var(--space-1);
    flex:1;min-height:0;max-height:172px;overflow-y:auto;
    scrollbar-gutter:stable;padding-right:4px;
    scrollbar-width:thin;scrollbar-color:#C3CCD9 transparent;
  }
  .attention-list::-webkit-scrollbar{width:7px;}
  .attention-list::-webkit-scrollbar-track{background:transparent;}
  .attention-list::-webkit-scrollbar-thumb{background:#C3CCD9;border-radius:20px;}
  .attention-list::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}
  .attention-row{
    display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--border);
    padding:9px 2px;cursor:pointer;font-family:inherit;border-radius:var(--radius-xs);
    transition:background .12s var(--ease);
  }
  .attention-row:last-child{border-bottom:none;}
  .attention-row:hover{background:var(--bg);}
  .attention-row:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .attention-row .task-dot{margin-top:0;}
  .attention-row-main{flex:1;min-width:0;}
  .attention-row-name{
    display:block;font-size:12.5px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .attention-row-stage{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .attention-row-when{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;flex-shrink:0;text-align:right;
  }
  .attention-row-when.late{color:var(--danger);}
  .attention-row-when.today{color:var(--gold);}
  .attention-more{font-size:11px;color:var(--ink-faint);padding-top:var(--space-2);}
  .attention-empty{
    flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;
    font-size:12.5px;color:var(--ink-muted);
  }
  .attention-empty span{font-size:11.5px;color:var(--ink-faint);}

  /* Entrada escalonada — um único momento orquestrado, no carregamento da view */
  .bento-block{animation:bento-in .34s var(--ease) both;}
  .bento-block:nth-child(2){animation-delay:.04s;}
  .bento-block:nth-child(3){animation-delay:.08s;}
  .bento-block:nth-child(4){animation-delay:.12s;}
  .bento-block:nth-child(5){animation-delay:.16s;}
  .bento-block:nth-child(6){animation-delay:.2s;}
  @keyframes bento-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  @media (max-width:1180px){
    .bento{grid-template-columns:repeat(4, minmax(0,1fr));}
    .bento-wide{order:9;grid-column:span 4;grid-row:span 1;}
    .bento-wide .attention-list{max-height:none;}
  }
  @media (max-width:720px){
    .bento{grid-template-columns:repeat(2, minmax(0,1fr));gap:var(--space-2);}
    .bento-hero{grid-column:span 2;grid-row:span 1;}
    .bento-wide{grid-column:span 2;}
    .bento-block{padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);}
  }
  @media (prefers-reduced-motion:reduce){
    .bento-block{animation:none;}
    .spectrum-seg{transition:none;}
  }

  /* ---------- Kanban ---------- */
  .board{display:flex;gap:var(--space-3);overflow-x:auto;padding-bottom:var(--space-3);align-items:flex-start;}
  .column{
    flex:0 0 272px;min-width:272px;background:#EDF0F6;border:1px solid #E4E8EF;
    border-radius:var(--radius-lg);padding:var(--space-3);
    /* Cada coluna rola por conta própria: com uma etapa cheia, a página
       inteira crescia e as outras colunas ficavam fora de alcance. */
    display:flex;flex-direction:column;
    max-height:var(--altura-coluna);min-height:220px;
  }
  /* Filete da etapa: identifica a coluna sem precisar colorir todo o bloco */
  .column-rule{height:3px;border-radius:2px;margin-bottom:11px;opacity:.9;}
  .column-head{padding:0 2px 10px;}
  /* O nome da etapa é uma frase ("R3 · Apresentação do wealth planning"), não
     mais um código de duas letras: o título quebra em duas linhas e o grupo da
     direita fica fixo no topo. Sem min-width:0 o texto empurraria a contagem
     para fora da coluna. */
  .column-title{display:flex;align-items:flex-start;gap:8px;justify-content:space-between;}
  .column-title-left{display:flex;align-items:flex-start;gap:7px;min-width:0;}
  .column-title .stage-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
  .column-title-left span{
    font-size:11.5px;font-weight:600;color:var(--ink);text-transform:uppercase;
    letter-spacing:.06em;line-height:1.35;min-width:0;
  }
  .column-title > span{flex-shrink:0;}
  /* Botão de recolher: aparece no hover da coluna, para não poluir o cabeçalho */
  .column-toggle{
    display:flex;align-items:center;justify-content:center;width:20px;height:20px;
    border:none;background:none;color:var(--ink-faint);cursor:pointer;padding:0;
    border-radius:4px;opacity:0;transition:opacity .12s,background .12s,color .12s;
  }
  .column:hover .column-toggle{opacity:1;}
  .column-toggle:focus-visible{opacity:1;}
  .column-toggle:hover{background:var(--surface);color:var(--ink);}

  /* Coluna recolhida: faixa vertical com a contagem sempre visível */
  .column.colapsada{
    flex:0 0 46px;min-width:46px;display:flex;flex-direction:column;align-items:center;
    gap:10px;padding:10px 0 14px;cursor:pointer;font-family:inherit;
    background:#EDF0F6;border:1px solid #E4E8EF;border-radius:var(--radius-lg);
    transition:background .12s,border-color .12s;
  }
  .column.colapsada:hover{background:#E6EAF2;border-color:var(--border-strong);}
  .column.colapsada:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  .colapsada-rule{width:22px;height:3px;border-radius:2px;flex-shrink:0;}
  .colapsada-count{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:12px;font-weight:500;color:var(--ink);
  }
  .colapsada-nome{
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-size:11px;font-weight:600;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
  }
  @media (prefers-reduced-motion:reduce){
    .column-toggle, .column.colapsada{transition:none;}
  }

  .column-count{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--ink-muted);
    background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 7px;
  }
  .column-total{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:12.5px;font-weight:500;color:var(--ink-muted);
    margin-top:5px;padding:0 2px;
  }
  .column-body{
    display:flex;flex-direction:column;gap:8px;min-height:80px;border-radius:8px;
    padding:2px;transition:background .12s;
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    /* Espaço reservado para a barra: sem isso o conteúdo pula ao surgir. */
    scrollbar-gutter:stable;padding-right:6px;
    scrollbar-width:thin;scrollbar-color:#A9B4C4 #DDE3EC;
  }
  /* Barra sempre visível: quando ela some, o corte no fim da coluna parece
     conteúdo truncado em vez de conteúdo rolável. */
  /* Sem isto os itens encolhem para caber na altura disponível, em vez de
     transbordar — e sem transbordo não existe rolagem. Vale para toda lista
     em coluna com altura limitada. */
  .column-body > *,
  .attention-list > *,
  .notif-lista > *,
  .user-list > *{flex-shrink:0;}

  .column-body::-webkit-scrollbar{width:9px;}
  .column-body::-webkit-scrollbar-track{background:#DDE3EC;border-radius:20px;}
  .column-body::-webkit-scrollbar-thumb{background:#A9B4C4;border-radius:20px;}
  .column-body::-webkit-scrollbar-thumb:hover{background:var(--ink-muted);}
  .column-body.drag-over{background:var(--primary-tint);}
  .column-body.drag-over-invalid{background:var(--danger-tint);}
  .empty-col{
    border:1.5px dashed var(--border-strong);border-radius:8px;
    padding:16px 10px;text-align:center;color:var(--ink-faint);font-size:12px;
  }
  .column-add{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    background:none;border:none;border-radius:8px;padding:8px;margin-top:8px;
    color:var(--ink-muted);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .column-add:hover{background:var(--surface);color:var(--primary);}

  /* ---------- Card ---------- */
  .lead-card{
    display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    box-shadow:var(--shadow-card);cursor:grab;overflow:hidden;
    transition:border-color .14s var(--ease), box-shadow .14s var(--ease), transform .14s var(--ease);
  }
  .lead-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-raised);transform:translateY(-1px);}
  @media (prefers-reduced-motion:reduce){ .lead-card{transition:none;} .lead-card:hover{transform:none;} }
  .lead-card.dragging{opacity:.4;}
  .lead-card-bar{width:4px;flex-shrink:0;}
  .lead-card-body{padding:10px 12px 11px;flex:1;min-width:0;}
  .lead-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
  .lead-card-top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .lead-card-name{font-size:13.5px;font-weight:600;color:var(--ink);margin:0;line-height:1.35;}
  .task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
  .task-dot.late{background:var(--danger);}
  .task-dot.today{background:var(--gold);}
  .task-dot.ok{background:#4E8B6B;}
  .task-dot.none{background:var(--border-strong);}
  .lose-btn{
    display:flex;align-items:center;justify-content:center;width:20px;height:20px;flex-shrink:0;
    border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--ink-faint);
    cursor:pointer;padding:0;transition:background .12s,color .12s,border-color .12s;
  }
  .lose-btn:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
  .win-btn{
    display:flex;align-items:center;justify-content:center;width:20px;height:20px;flex-shrink:0;
    border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--ink-faint);
    cursor:pointer;padding:0;transition:background .12s,color .12s,border-color .12s;
  }
  .win-btn:hover{background:var(--success);border-color:var(--success);color:#fff;}
  .lead-card-deal{font-size:11.5px;color:var(--ink-muted);margin:2px 0 6px;}
  .lead-card-value{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:12.5px;font-weight:600;color:var(--primary);margin:2px 0 6px;}
  .lead-card-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);margin-top:3px;}
  .lead-card-row svg{flex-shrink:0;color:var(--ink-faint);}
  .lead-card-foot{
    display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;
    border-top:1px solid var(--border);
  }
  .lead-card-dates{font-size:10px;color:var(--ink-faint);}
  .lead-card-dates .val{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;color:var(--ink-muted);}
  .lead-card-owner-avatar{width:20px;height:20px;font-size:9px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,29,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;
  }
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:var(--shadow-modal);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-head h2{font-size:16px;margin:0;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--ink-muted);padding:4px;border-radius:6px;}
  .modal-close:hover{background:var(--bg);color:var(--ink);}
  .modal-body{padding:20px 22px;max-height:64vh;overflow-y:auto;}
  /* Mesmo cuidado dos números: rótulo de botão é nowrap e item flex não encolhe
     abaixo do próprio conteúdo, então uma linha sem `wrap` estoura o modal em
     vez de apertar. A ficha em edição chega a cinco botões (Excluir,
     Desqualificar, Captação efetivada, Cancelar, Salvar alterações) — mais do
     que cabe em 520px. Quebrar a linha é a saída; encolher rótulo, não.
     A regra vale para os doze .modal-foot do arquivo, todos com dois filhos. */
  .modal-foot{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    flex-wrap:wrap;
    padding:16px 22px;border-top:1px solid var(--border);
  }
  /* Os dois grupos são montados com style inline no JS; o wrap deles mora aqui
     para não repetir a propriedade em cada ponto de montagem. */
  .modal-foot > *{flex-wrap:wrap;}
  /* Ao quebrar, `space-between` deixaria de alinhar o grupo da direita — com
     um item só na segunda linha ele iria para a esquerda. O auto o mantém à
     direita nas duas situações, e a ação primária não muda de lugar. */
  .modal-foot > *:last-child{margin-left:auto;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.02em;
  }
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;
    font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
  .field input:disabled{background:var(--bg);color:var(--ink-muted);}
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
  .field-error{color:var(--danger);font-size:11.5px;margin-top:4px;}
  .field-hint{color:var(--ink-faint);font-size:11.5px;margin-top:4px;}
  /* min-height e não height: o nome da etapa é uma frase e "R2.1 ·
     Apresentação do relatório consolidado" ocupa três linhas em campo estreito.
     Com altura fixa o texto sairia por baixo da borda, sem aviso. */
  .stage-lock{
    display:flex;align-items:center;gap:7px;min-height:38px;padding:7px 11px;border-radius:8px;
    border:1px solid var(--border);background:var(--bg);font-size:13.5px;font-weight:600;
    color:var(--ink);line-height:1.3;
  }
  .stage-lock .stage-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  .stage-progress{
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 6px;
    padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);
    flex-wrap:wrap;
  }
  .stage-progress-info{font-size:12px;color:var(--ink-muted);}
  .stage-progress-info strong{color:var(--ink);font-weight:600;}
  .stage-progress-actions{display:flex;gap:6px;flex-wrap:wrap;}
  @media (max-width:720px){
    .stage-progress-actions{width:100%;}
    .stage-progress-actions .btn{flex:1;justify-content:center;}
  }

  .history-section h3{font-size:13px;font-weight:600;margin:20px 0 10px;color:var(--ink);}
  .history-list{display:flex;flex-direction:column;gap:10px;}
  .history-item{display:flex;gap:10px;}
  .history-item-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:5px;}
  .history-item-body{flex:1;min-width:0;}
  .history-item-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .history-item-move{font-size:12.5px;font-weight:600;color:var(--ink);}
  .history-item-date{font-size:10.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;flex-shrink:0;}
  .history-item-resumo{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}
  .history-item-autor{font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
  .history-empty{font-size:12px;color:var(--ink-faint);}

  .csv-dump{
    width:100%;min-height:220px;resize:vertical;border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:10px 12px;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11.5px;line-height:1.5;
    white-space:pre;overflow:auto;outline:none;
  }
  .csv-dump:focus{border-color:var(--primary);}

  /* ---------- Encaminhamento e handoff ---------- */
  .encaminhar-row{
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    padding:11px 12px;margin-bottom:8px;border:1px solid var(--border);
    border-radius:var(--radius-md);background:var(--surface);
  }
  .encaminhar-row.ativo{border-color:var(--primary);background:var(--primary-tint);}
  .encaminhar-row.enviado{opacity:.6;}
  .encaminhar-check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;}
  .encaminhar-check input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
  .encaminhar-tag{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}
  .encaminhar-row .select-sm{max-width:200px;}

  .handoff{
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    margin:18px 0 6px;padding:12px 14px;border-radius:var(--radius-md);
    background:var(--gold-tint);border:1px solid #E8DCB8;flex-wrap:wrap;
  }
  /* Pendente vira alerta: não é mais um convite, é algo travando a jornada. */
  .handoff.pendente{background:var(--danger-tint);border-color:#F0CFCC;}
  .handoff.pendente .handoff-text strong{color:var(--danger);}
  .handoff.pendente .handoff-text span{color:#8F423D;}
  .handoff-text{display:flex;flex-direction:column;gap:2px;}
  .handoff-text strong{font-size:12.5px;color:#6E5719;}
  .handoff-text span{font-size:11.5px;color:#8A7233;}

  .readonly-note{
    display:flex;align-items:center;gap:9px;margin-bottom:var(--space-4);
    padding:10px 12px;border-radius:var(--radius-md);
    background:var(--bg);border:1px solid var(--border);
    font-size:12.5px;color:var(--ink-muted);
  }
  .readonly-note strong{color:var(--ink);font-weight:600;}

  /* Alternância entre os dois funis */
  .funil-switch{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;}
  .funil-switch button{
    border:none;background:none;padding:6px 12px;border-radius:var(--radius-xs);
    font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-muted);cursor:pointer;
    transition:background .12s var(--ease),color .12s var(--ease);
  }
  .funil-switch button.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-card);}

  /* Selo de SLA no card */
  .sla-chip{
    display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;font-weight:500;
  }
  .sla-chip.ok{background:var(--success-tint);color:var(--success);}
  .sla-chip.perto{background:var(--gold-tint);color:#6E5719;}
  .sla-chip.estourado{background:var(--danger-tint);color:var(--danger);}

  /* ---------- Avisos ---------- */
  .toast-stack{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
    width:max-content;max-width:calc(100vw - 32px);
  }
  .toast{
    background:var(--navy);color:#fff;padding:11px 18px;border-radius:var(--radius-md);font-size:13px;
    box-shadow:var(--shadow-modal);max-width:420px;text-align:center;
    animation:toast-in .22s var(--ease) both;
  }
  .toast.success{background:var(--success);}
  .toast.error{background:var(--danger);}
  /* A atualização da base termina em aviso, não em sucesso, quando deixou
     divergência para alguém responder: verde diria que acabou. */
  .toast.warn{background:var(--gold);color:var(--navy);}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ .toast{animation:none;} }

  /* ---------- Atualização da base BTG ---------- */
  .imp-drop{
    border:1px dashed var(--border);border-radius:var(--radius-lg);
    padding:48px 32px;text-align:center;background:var(--surface);
  }
  /* Cor explícita: .painel remapeia os tokens para tema escuro, e um título
     sem color herda o tom claro do resto do app — fica escuro sobre escuro. */
  .imp-drop h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:20px;margin:0 0 8px;color:var(--ink);}
  .imp-drop p{color:var(--ink-muted);font-size:13px;max-width:52ch;margin:0 auto 20px;line-height:1.6;}
  .imp-drop-mark{
    display:block;width:32px;height:3px;background:var(--gold);
    border-radius:2px;margin:0 auto 18px;
  }
  /* O input nativo é feio e não aceita estilo; o rótulo faz o papel do botão.
     Escondido com clip e não com display:none, senão o teclado não o alcança. */
  /* Escondido do olho mas alcançável pelo teclado — display:none tiraria o
     input da ordem de foco e o rótulo deixaria de ser operável sem mouse.
     `overflow:hidden` é o que impede a caixa de 1px de acusar transbordo na
     auditoria de layout. */
  .imp-file{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
  .imp-file:focus-visible + .imp-botao{outline:2px solid var(--primary);outline-offset:2px;}
  .imp-botao{cursor:pointer;display:inline-flex;}
  .imp-erro{
    color:var(--danger);background:var(--danger-tint);border-radius:var(--radius-md);
    padding:10px 14px;font-size:13px;margin:18px auto 0;max-width:60ch;
  }
  .imp-cabecalho{
    display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
    justify-content:space-between;margin-bottom:20px;
  }
  .imp-cabecalho-texto{min-width:0;}
  .imp-cabecalho h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:20px;margin:0 0 4px;color:var(--ink);}
  /* Sem esta regra o .sub herdava o navy do texto de página e sumia no painel
     escuro — e é nele que estão o arquivo, as linhas lidas e a data da posição. */
  .imp-cabecalho .sub{color:var(--ink-muted);font-size:13px;margin:0;}
  /* Rótulo de botão não quebra: o rodapé precisa poder virar duas linhas em
     vez de transbordar. Ver a nota sobre nowrap nas convenções. */
  .imp-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;}
  .imp-secao{
    border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px 18px;margin-top:14px;background:var(--surface);
  }
  .imp-secao.grave{border-color:var(--danger);background:var(--danger-tint);}
  .imp-secao-cab{
    display:flex;align-items:center;gap:10px;width:100%;
    background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;
  }
  .imp-secao-titulo{font-weight:600;font-size:14px;color:var(--ink);}
  .imp-secao-count{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;background:var(--navy);color:#fff;
    border-radius:999px;padding:1px 8px;
  }
  .imp-secao.grave .imp-secao-count{background:var(--danger);}
  .imp-secao-seta{margin-left:auto;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:15px;color:var(--ink-muted);}
  .imp-secao-exp{color:var(--ink-muted);font-size:12px;line-height:1.6;margin:8px 0 0;max-width:80ch;}
  .imp-lista{margin-top:14px;border-top:1px solid var(--border);max-height:420px;overflow-y:auto;}
  /* Sem largura fixa por coluna: os valores são mono e não quebram, então uma
     grade de frações faria o patrimônio de 8 dígitos passar por cima do
     vizinho. Cada bloco se mede pelo conteúdo e a linha quebra quando falta. */
  .imp-linha{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;
    padding:9px 2px;border-bottom:1px solid var(--border);font-size:13px;
  }
  .imp-linha:last-child{border-bottom:0;}
  .imp-linha.clicavel{cursor:pointer;}
  .imp-linha:hover{background:var(--bg);}
  .imp-nome{flex:1 1 220px;min-width:0;font-weight:500;color:var(--ink);}
  .imp-conta{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--ink-muted);margin-left:8px;}
  .imp-de,.imp-para,.imp-delta{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:12px;min-width:max-content;}
  .imp-para{color:var(--ink);}
  .imp-de{color:var(--ink-muted);}
  .imp-seta{color:var(--ink-muted);}
  .imp-delta.pos{color:var(--success);}
  .imp-delta.neg{color:var(--danger);}
  .imp-delta.neutro{color:var(--ink-muted);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;}
  .imp-campos{font-size:11px;color:var(--ink-muted);flex:0 1 auto;min-width:max-content;}
  .imp-rodape{color:var(--ink-muted);font-size:12px;margin-top:16px;}

  /* ---------- Avançar etapa pelo card (toque e teclado) ---------- */
  .lead-card-advance{
    display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
    margin-top:9px;padding:7px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--primary);font-family:inherit;font-size:11.5px;font-weight:600;
    cursor:pointer;transition:background .12s var(--ease),border-color .12s var(--ease);
  }
  .lead-card-advance:hover{background:var(--primary-tint);border-color:var(--primary);}
  /* No mouse, arrastar continua sendo o caminho principal: o botão só aparece no hover
     ou no foco, para não poluir a coluna. No toque, fica sempre visível. */
  @media (hover:hover) and (pointer:fine){
    .lead-card-advance{display:none;}
    .lead-card:hover .lead-card-advance,
    .lead-card:focus-within .lead-card-advance{display:flex;}
  }

  /* ---------- Funil vazio ---------- */
  .board-empty{
    max-width:460px;margin:56px auto;text-align:center;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-8) var(--space-6);
    box-shadow:var(--shadow-card);
  }
  .board-empty-mark{
    width:12px;height:12px;border-radius:3px;background:var(--gold);
    display:inline-block;transform:rotate(45deg);margin-bottom:var(--space-4);
  }
  .board-empty h2{font-size:19px;margin:0 0 var(--space-2);color:var(--navy);}
  .board-empty p{font-size:13.5px;color:var(--ink-muted);margin:0 0 var(--space-5);line-height:1.55;}

  /* ---------- Recolher visão geral ---------- */
  .overview-toggle{display:flex;justify-content:flex-end;margin-bottom:var(--space-2);}
  .overview-toggle .link-btn{display:flex;align-items:center;gap:5px;}
  .overview-chevron{display:flex;transition:transform .18s var(--ease);}
  .overview-chevron.closed{transform:rotate(-90deg);}
  @media (prefers-reduced-motion:reduce){ .overview-chevron{transition:none;} }

  /* ---------- Registro de atividades ---------- */
  .activity-form{
    display:flex;flex-direction:column;gap:8px;background:var(--bg);
    border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-4);
  }
  .activity-form-row{display:flex;gap:8px;}
  .activity-form-row .select-sm{flex:1;min-width:0;}
  .activity-form textarea{
    width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;
    font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;
    resize:vertical;min-height:56px;transition:border-color .15s;
  }
  .activity-form textarea:focus{border-color:var(--primary);}

  .history-item-dot.atividade{background:var(--ink-faint);}
  .history-item-dot.correcao{background:var(--gold);}

  /* ---------- Correção de etapa (admin) ---------- */
  .admin-fix{
    margin-top:var(--space-4);padding:var(--space-3) var(--space-4);
    background:var(--gold-tint);border:1px solid #E8DCB8;border-radius:var(--radius-md);
  }
  .admin-fix-call{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);font-size:12.5px;color:#6E5719;}

  /* ---------- Equipe ---------- */
  .convite-form{
    display:flex;flex-direction:column;padding:16px;margin-bottom:var(--space-5);
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);
  }
  .convite-form .field:last-of-type{margin-bottom:0;}

  .team-section{margin-bottom:var(--space-5);}
  .team-section:last-child{margin-bottom:0;}
  .team-section h3{font-size:13px;font-weight:600;margin:0 0 var(--space-3);color:var(--ink);}
  .team-row{
    display:flex;align-items:center;gap:var(--space-3);padding:11px 12px;margin-bottom:8px;
    border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);
  }
  .team-row:last-child{margin-bottom:0;}
  .team-row.pending{background:var(--gold-tint);border-color:#E8DCB8;}
  .team-row.danger{background:var(--danger-tint);border-color:#F0CFCC;align-items:flex-start;}
  /* A linha quebra quando o nome não cabe ao lado das ações. Sem isso, os
     seis botões (422px num modal de 620px) deixavam 63px para o nome, e
     "Rodrigues" sozinho mede 66px: o nome escapava da linha. O nome reserva
     200px; faltando, as ações descem e se alinham à direita. */
  .team-row{flex-wrap:wrap;}
  .team-row-main{flex:1 1 200px;min-width:0;}
  .team-row-actions{margin-left:auto;}
  .team-row-name{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:2px;}
  .team-row-you{color:var(--ink-faint);font-weight:400;}
  .team-row-note{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .team-row-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .team-row-actions .btn{height:30px;padding:0 10px;font-size:11.5px;}

  .dupla-row{
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    padding:8px 0;font-size:12.5px;color:var(--ink);border-bottom:1px solid var(--border);
  }
  .dupla-row:last-of-type{border-bottom:none;}
  .dupla-row .select-sm{max-width:220px;}

  /* Card de acompanhamento: sem cursor de arraste e com cadeado discreto */
  .lead-card.somente-leitura{cursor:pointer;}
  .lead-card.somente-leitura:hover{transform:none;}
  .card-lock{display:inline-flex;align-items:center;color:var(--ink-faint);flex-shrink:0;}

  /* fieldset é usado só para desabilitar o formulário inteiro de uma vez;
     precisa perder a aparência nativa para não alterar o layout. */
  .form-lock{border:none;margin:0;padding:0;min-width:0;}
  .form-lock[disabled] input,
  .form-lock[disabled] select,
  .form-lock[disabled] textarea{
    background:var(--bg);color:var(--ink-muted);cursor:default;opacity:1;
  }

  /* Segundo nível de navegação. Mecanismo diferente do seletor principal de
     propósito: pílula compete com pílula, sublinhado se lê como subordinado.
     O número em mono e o alerta dão o que escolher — não só qual nome clicar. */
  .produto-tabs{display:flex;gap:var(--space-1);align-self:stretch;align-items:stretch;}
  .produto-tab{
    display:flex;align-items:center;gap:7px;padding:0 12px;
    border:none;background:none;cursor:pointer;font-family:inherit;
    border-bottom:2px solid transparent;color:var(--ink-faint);
    transition:color .14s var(--ease),border-color .14s var(--ease);
    position:relative;
  }
  .produto-tab:hover{color:var(--ink-muted);}
  .produto-tab.active{color:var(--navy);border-bottom-color:var(--gold);}
  .produto-tab:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;border-radius:var(--radius-xs);}
  .produto-tab-nome{font-size:12.5px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;}
  .produto-tab.active .produto-tab-nome{font-weight:600;}
  .produto-tab-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;font-weight:500;
    min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink-faint);
    transition:background .14s var(--ease),color .14s var(--ease);
  }
  .produto-tab.active .produto-tab-num{background:var(--navy);color:#fff;}
  /* Ponto de atenção: existe negócio com contato atrasado neste produto. */
  .produto-tab-alerta{
    width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0;
  }
  @media (prefers-reduced-motion:reduce){
    .produto-tab, .produto-tab-num{transition:none;}
  }
  @media (max-width:720px){
    .produto-tabs{width:100%;border-bottom:1px solid var(--border);}
    .produto-tab{flex:1;justify-content:center;}
  }

  /* ---------- Pauta da reunião ---------- */
  .pauta{
    margin:18px 0 6px;padding:14px 16px;border-radius:var(--radius-md);
    background:var(--surface);border:1px solid var(--border);
  }
  .pauta-head{
    display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--border);
  }
  .pauta-contador{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11.5px;font-weight:500;
    color:var(--ink-faint);padding:2px 8px;border-radius:10px;background:var(--bg);
  }
  .pauta-contador.completa{background:var(--success-tint);color:var(--success);}
  .pauta-lista{display:flex;flex-direction:column;}
  .pauta-item{
    display:flex;align-items:flex-start;gap:10px;padding:10px 2px;cursor:pointer;
    font-size:13px;line-height:1.45;color:var(--ink);
    border-bottom:1px solid var(--border);
  }
  .pauta-item:last-child{border-bottom:none;}
  .pauta-item input{margin-top:1px;width:15px;height:15px;accent-color:var(--success);cursor:pointer;flex-shrink:0;}
  .pauta-item input:disabled{cursor:default;}
  /* Riscado é a forma mais direta de mostrar "isso já saiu da lista". */
  .pauta-item.feito span{color:var(--ink-faint);text-decoration:line-through;}
  .pauta-aviso{
    margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--ink-muted);
  }

  /* Progresso da pauta no card do quadro */
  .card-pauta{
    display:inline-flex;align-items:center;gap:5px;margin-top:8px;
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;color:var(--ink-faint);
  }
  .card-pauta-barra{
    width:34px;height:3px;border-radius:2px;background:var(--border);overflow:hidden;
  }
  .card-pauta-barra i{display:block;height:100%;background:var(--gold);border-radius:2px;}
  .card-pauta.completa{color:var(--success);}
  .card-pauta.completa .card-pauta-barra i{background:var(--success);}

  /* Seletor PF/PJ: dois blocos com rótulo e explicação, porque a sigla
     sozinha não basta para quem usa o sistema pela primeira vez. */
  .tipo-pessoa{display:flex;gap:8px;}
  .tipo-pessoa button{
    flex:1;display:flex;flex-direction:column;gap:1px;align-items:flex-start;
    padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);cursor:pointer;font-family:inherit;text-align:left;
    transition:border-color .14s var(--ease),background .14s var(--ease);
  }
  .tipo-pessoa button:hover{border-color:var(--border-strong);}
  .tipo-pessoa button.active{border-color:var(--primary);background:var(--primary-tint);}
  .tipo-pessoa button strong{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
  .tipo-pessoa button span{font-size:11px;color:var(--ink-faint);}
  .tipo-pessoa button.active strong{color:var(--primary);}

  /* Marcador de PJ no card, discreto o bastante para não competir com o nome */
  .pj-tag{
    display:inline-block;margin-right:6px;padding:1px 5px;border-radius:3px;
    background:var(--navy);color:#fff;font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;
    font-size:9px;font-weight:500;letter-spacing:.04em;vertical-align:1px;
  }
  @media (prefers-reduced-motion:reduce){ .tipo-pessoa button{transition:none;} }


  /* ---------- Extrato da carteira ---------- */
  .extrato{
    margin:18px 0 6px;padding:14px 16px;border-radius:var(--radius-md);
    background:var(--surface);border:1px solid var(--border);
  }
  /* Flex que quebra, e não grade de colunas rígidas: os valores são mono com
     white-space:nowrap, então numa coluna estreita demais eles não apertam nem
     quebram — transbordam por cima do bloco vizinho. Já aconteceu com um
     patrimônio de 8 dígitos ao lado de "R$ 0". Preferimos a linha virar 2x2 a
     sobrepor texto: número truncado ou sobreposto é número errado. */
  .extrato-resumo{
    display:flex;flex-wrap:wrap;gap:var(--space-3);
    padding:12px 0;margin-bottom:4px;border-bottom:1px solid var(--border);
  }
  /* min-width:max-content é o que impede o transbordo: o bloco nunca fica
     menor que o número que carrega. */
  .extrato-bloco{
    display:flex;flex-direction:column;gap:3px;
    flex:1 1 auto;min-width:max-content;
  }
  .extrato-rotulo{
    font-size:9.5px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .extrato-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:13px;font-weight:500;
    color:var(--ink-muted);white-space:nowrap;
  }
  .extrato-valor.forte{color:var(--ink);font-size:14px;}
  .extrato-valor.entrada{color:var(--success);}
  .extrato-valor.saida{color:var(--danger);}

  .extrato-lista{display:flex;flex-direction:column;max-height:230px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:#C3CCD9 transparent;}
  .extrato-lista > *{flex-shrink:0;}
  .extrato-item{
    display:flex;align-items:flex-start;gap:10px;padding:10px 2px;
    border-bottom:1px solid var(--border);
  }
  .extrato-item:last-child{border-bottom:none;}
  /* Seta em vez de cor sozinha: a direção do dinheiro não pode depender
     de distinguir verde de vermelho. */
  .extrato-seta{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;line-height:1;
  }
  .extrato-seta.entrada{background:var(--success-tint);color:var(--success);}
  .extrato-seta.saida{background:var(--danger-tint);color:var(--danger);}
  .extrato-corpo{flex:1;min-width:0;}
  .extrato-linha{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .extrato-tipo{font-size:12.5px;font-weight:600;color:var(--ink);}
  .extrato-data{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .extrato-nota{font-size:12px;color:var(--ink-muted);margin-top:3px;line-height:1.45;}
  .extrato-autor{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
  .extrato-montante{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:13px;font-weight:500;
    flex-shrink:0;white-space:nowrap;
  }
  .extrato-montante.entrada{color:var(--success);}
  .extrato-montante.saida{color:var(--danger);}
  /* Sem regra de largura para .extrato-resumo aqui: o flex-wrap acima já faz
     a linha virar 2x2 sozinha, na largura em que os números deixam de caber —
     que é mais preciso do que um ponto de corte fixo em 720px. */

  /* ---------- Alertas ---------- */
  .alertas{
    margin:18px 0 6px;padding:14px 16px;border-radius:var(--radius-md);
    background:var(--surface);border:1px solid var(--border);
  }
  .alerta-form{display:flex;flex-direction:column;gap:8px;padding:10px 0 4px;}
  /* Captação da base em negociação, dentro do extrato. Tracejada em dourado:
     é promessa, não saldo — a mesma gramática de "ausência de dado tem forma
     própria", e o dourado de "Em captação" no card e no painel. */
  .captacao-pendente{
    margin:12px 0 4px;padding:10px 12px;border-radius:var(--radius-sm);
    border:1px dashed var(--gold);background:var(--bg);
  }
  .captacao-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .captacao-rotulo{
    font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);
  }
  .captacao-links{display:flex;gap:14px;}
  .captacao-custodia{align-self:flex-start;margin:0;}
  /* Quebra em vez de apertar: o valor é mono e nowrap, e o botão também. */
  .captacao-resumo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0 2px;}
  .captacao-valor{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:18px;font-weight:600;color:var(--ink);}
  .captacao-sobre{font-size:12px;color:var(--ink-muted);}
  .captacao-sem-temp{font-size:12px;color:var(--ink-muted);font-style:italic;}
  .captacao-confirmar{margin-left:auto;height:32px;font-size:12.5px;color:var(--success);}
  .alerta-texto{
    width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 11px;font-size:13.5px;font-family:inherit;color:var(--ink);
    background:var(--surface);outline:none;transition:border-color .15s;
  }
  .alerta-texto:focus{border-color:var(--primary);}
  .alerta-lista{display:flex;flex-direction:column;}
  .alerta-item{
    display:flex;align-items:flex-start;gap:10px;padding:11px 2px;
    border-bottom:1px solid var(--border);
  }
  .alerta-item:last-child{border-bottom:none;}
  .alerta-item .task-dot{margin-top:5px;flex-shrink:0;}
  .alerta-corpo{flex:1;min-width:0;}
  .alerta-linha{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .alerta-tipo{font-size:11px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;}
  .alerta-data{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--ink-faint);}
  .alerta-data.late{color:var(--danger);font-weight:500;}
  .alerta-data.today{color:var(--gold);font-weight:500;}
  .alerta-texto-ver{font-size:13px;color:var(--ink);margin-top:3px;line-height:1.45;}
  .alerta-acoes{display:flex;gap:10px;flex-shrink:0;}
  .link-btn.danger{color:var(--danger);}

  /* Selo no card do quadro */
  /* Valor e situação na mesma linha. Cabem juntos até valores na casa das
     centenas de milhões; acima disso o selo desce sozinho. */
  .valor-linha{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 6px;
  }
  .valor-linha .lead-card-value{margin:0;}
  .tag-gestao{
    display:inline-flex;align-items:center;padding:2px 7px;flex-shrink:0;
    border-radius:10px;background:var(--success-tint);color:var(--success);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
  }
  .lead-card-value.gerido{color:var(--success);}

  .card-alerta{
    display:flex;align-items:flex-start;gap:5px;margin-top:7px;padding:5px 8px;
    border-radius:var(--radius-xs);background:var(--gold-tint);color:#6E5719;
    font-size:11px;line-height:1.35;
  }
  .card-alerta.vencido{background:var(--danger-tint);color:var(--danger);}
  .card-alerta svg{flex-shrink:0;margin-top:1px;}
  .card-alerta span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  .attention-alertas{
    margin-left:8px;font-size:10px;font-weight:500;color:var(--gold);
    text-transform:none;letter-spacing:0;
  }

  /* Lista de notificações no aviso de entrada */
  .notif-lista{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;}
  .notif-item{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--border);
    padding:11px 2px;cursor:pointer;font-family:inherit;border-radius:var(--radius-xs);
    transition:background .12s var(--ease);
  }
  .notif-item:last-of-type{border-bottom:none;}
  .notif-item:hover{background:var(--bg);}
  .notif-item:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .notif-item .task-dot{margin-top:5px;flex-shrink:0;}
  .notif-corpo{flex:1;min-width:0;}
  .notif-cliente{display:block;font-size:13px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .notif-texto{display:block;font-size:11.5px;color:var(--ink-muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .notif-data{font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;flex-shrink:0;color:var(--ink-faint);}
  .notif-data.late{color:var(--danger);}
  .notif-data.today{color:var(--gold);}
  @media (prefers-reduced-motion:reduce){ .notif-item{transition:none;} }

  /* ---------- Filtros ---------- */
  .filtros-panel{
    display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--space-5);
    padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    animation:bento-in .2s var(--ease) both;
  }
  .filtro-grupo{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .filtro-titulo{
    font-size:10.5px;font-weight:600;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.07em;
  }
  .filtro-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .filtro-chip{
    padding:5px 11px;border:1px solid var(--border);border-radius:20px;
    background:var(--surface);color:var(--ink-muted);cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:500;white-space:nowrap;
    transition:border-color .12s var(--ease),background .12s var(--ease),color .12s var(--ease);
  }
  .filtro-chip:hover{border-color:var(--border-strong);color:var(--ink);}
  .filtro-chip.ativo{background:var(--navy);border-color:var(--navy);color:#fff;}
  .filtro-chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  .filtro-familia{display:flex;flex-direction:column;gap:8px;}
  .filtro-familia .select-sm{height:32px;font-size:12px;max-width:230px;}
  .filtro-chip-x{margin-left:7px;opacity:.7;font-size:13px;line-height:1;}
  .filtro-chip.ativo:hover .filtro-chip-x{opacity:1;}

  /* Barra de filtros dos indicadores: um pouco mais larga, porque tem
     seletores além dos chips. */
  /* Tabela de produção: números alinhados à direita para comparação vertical */
  /* =========================================================
     PAINEL DE INDICADORES — mesa escura
     Os tokens são redefinidos dentro do painel: as seções, barras e
     tabelas que já existiam passam a renderizar em fundo escuro sem
     precisar de uma segunda versão de cada componente.
     ========================================================= */
  .painel{
    --bg:#0B1D33;
    --surface:#12263F;
    --ink:#F2F6FB;
    --ink-muted:#A9BCD4;
    --ink-faint:#7B92AE;
    --border:#1E3653;
    --border-strong:#2C4A6E;
    --primary:#3D8BE0;
    --primary-tint:#16304D;
    --success:#3FBF8A;
    --success-tint:#12352A;
    --danger:#E8736B;
    --danger-tint:#3A1F20;
    --gold:#D8B25A;
    --gold-tint:#332C15;

    display:grid;grid-template-columns:236px minmax(0,1fr);gap:var(--space-4);
    background:#081627;border-radius:var(--radius-xl);
    padding:var(--space-4);margin:0 0 var(--space-5);
    box-shadow:var(--shadow-navy);
  }
  .painel-lado{min-width:0;}
  /* A tela offshore não tem coluna de filtros: a barra dela fica fora do
     painel, em tema claro, como nas outras telas de recorte. */
  /* Telas sem barra lateral: uma coluna só. Sem isto o conteúdo cai na coluna
     estreita da grade de duas colunas do painel de indicadores, e a tela
     inteira nasce com 236px de largura. */
  .painel.offshore, .painel.importacao{grid-template-columns:minmax(0,1fr);}
  .painel-area{display:flex;flex-direction:column;gap:var(--space-4);min-width:0;}

  /* Caixas do painel: as seções herdadas já usam .kpi-section, então a caixa
     nova só precisa igualar a moldura. */
  .painel-caixa, .painel .kpi-section{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);
    box-shadow:none;margin-top:0;
  }
  .painel .kpi-two-col{gap:var(--space-4);margin-top:0;}
  .painel-caixa-titulo{
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);
    font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:15px;font-weight:600;color:var(--ink);
    padding-bottom:12px;margin-bottom:var(--space-4);border-bottom:1px solid var(--border);
  }
  .painel-caixa-titulo span{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .painel .kpi-section-head{border-bottom-color:var(--border);}
  .painel .kpi-section-head h2{color:var(--ink);}
  .painel .filtros-panel.em-coluna .filtro-grupo{width:100%;}
  .painel .filtros-panel.em-coluna .select-sm{width:100%;min-width:0;}
  .painel .filtros-panel{
    background:var(--surface);border-color:var(--border);
    flex-direction:column;gap:var(--space-4);padding:var(--space-4);
    position:sticky;top:var(--space-4);
  }
  .painel .filtro-chip{background:var(--bg);border-color:var(--border);color:var(--ink-muted);}
  .painel .filtro-chip:hover{border-color:var(--border-strong);color:var(--ink);}
  .painel .filtro-chip.ativo{background:var(--primary);border-color:var(--primary);color:#fff;}
  .painel .select-sm{background:var(--bg);border-color:var(--border);color:var(--ink);}
  .painel .bar-track{background:var(--bg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);}
  .painel .empty-kpi{background:var(--bg);border-color:var(--border-strong);}
  .painel .producao-linha, .painel .producao-head{border-bottom-color:var(--border);}
  .painel .producao-anel::before{background:var(--surface);}
  .painel .producao-barra{background:var(--bg);box-shadow:none;}
  .painel .bar-row-pos{background:var(--bg);}
  .painel .grafico-svg .grade{stroke:var(--border);}

  /* A faixa de números perde o fundo próprio: o painel inteiro já é escuro. */
  .painel .painel-linha{
    display:grid;grid-template-columns:1.5fr repeat(5, minmax(0,1fr));gap:var(--space-4);
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);
    position:relative;overflow:hidden;
  }
  .painel .painel-linha::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold);
  }
  .painel .ind{border-left-color:var(--border);}
  /* Marcador de seção: separa os dois mundos do painel sem virar mais uma
     caixa. Régua dourada à esquerda, como o filete da marca. */
  .painel-secao{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:var(--space-2) 0 var(--space-1) 14px;margin-top:var(--space-2);
    border-left:3px solid var(--gold);
  }
  .painel-secao:first-child{margin-top:0;}
  .painel-secao-nome{
    font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:19px;font-weight:600;color:var(--ink);
    letter-spacing:-.01em;
  }
  .painel-secao-desc{
    font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
  }

  /* minmax(0,1fr) e não 1fr: `1fr` é `minmax(auto,1fr)`, e o mínimo `auto` é o
     min-content — a coluna não encolhe abaixo do que carrega. Com a base real,
     "Marcelo Donizeti Arruda de Oliveira Junior" na carteira por assessor abria
     a coluna para 662px e a grade inteira transbordava o painel. O zero deixa a
     coluna encolher e o conteúdo lidar com o próprio excesso. */
  .painel-duplo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4);}

  /* Rosca */
  .rosca{display:flex;align-items:center;gap:var(--space-5);flex-wrap:wrap;}
  .rosca-grafico{width:150px;flex-shrink:0;}
  .rosca-grafico svg{width:100%;height:auto;overflow:visible;}
  .rosca-fatia{
    animation:rosca-gira .9s var(--ease) both;transform-origin:70px 70px;
  }
  @keyframes rosca-gira{ from{opacity:0;transform:rotate(-25deg) scale(.9);} to{opacity:1;transform:none;} }
  .rosca-total{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:15px;font-weight:500;fill:var(--ink);
  }
  .rosca-total.longo{font-size:12px;}
  .rosca-legenda-total{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:8.5px;fill:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.12em;
  }
  .rosca-legenda{flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px;}
  /* minmax(0,1fr) e não 1fr: item de grade não encolhe abaixo do conteúdo por
     padrão, então com `Exclusive R$ 213,8M 31%` a linha estourava a legenda.
     Quem cede espaço é o rótulo, nunca o número — o valor e a porcentagem são
     mono com nowrap e ficam inteiros; o nome ganha reticência se faltar
     espaço. É a ordem de prioridade certa: nome cortado ainda se entende,
     número cortado é número errado. */
  .rosca-item{display:grid;grid-template-columns:9px minmax(0,1fr) auto auto;align-items:center;gap:9px;}
  .rosca-ponto{width:9px;height:9px;border-radius:2px;}
  .rosca-nome{
    font-size:12.5px;color:var(--ink-muted);
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .rosca-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:12.5px;font-weight:500;color:var(--ink);
  }
  .rosca-pct{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;color:var(--ink-faint);
    background:var(--bg);border-radius:10px;padding:1px 6px;min-width:38px;text-align:center;
  }

  /* Barras verticais */
  .barras-v{display:flex;align-items:flex-end;gap:var(--space-3);height:210px;overflow-x:auto;padding-bottom:4px;}
  .barra-v-col{
    /* 84px e não 58: o rótulo é mono e nowrap, e na largura antiga "R$
       876,8mil" (73px) transbordava 15px por cima da coluna vizinha, em
       silêncio. Os 76px seguintes cobriam o real e não o dólar: o gráfico
       "Offshore por assessor" usa o mesmo componente, e "US$ 538,8mil" mede
       80px. "US$ …mil" é o rótulo mais largo que os formatos compactos
       produzem (12 caracteres). A faixa inteira rola na horizontal
       (.barras-v tem overflow-x:auto), então alargar a coluna empurra para o
       scroll em vez de sobrepor. */
    flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;
  }
  .barra-v-num{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:11px;color:var(--ink);
    white-space:nowrap;
  }
  .barra-v-trilha{
    flex:1;width:100%;display:flex;align-items:flex-end;
    background:var(--bg);border-radius:var(--radius-xs);overflow:hidden;
  }
  .barra-v-fill{
    width:100%;border-radius:var(--radius-xs) var(--radius-xs) 0 0;
    animation:barra-sobe .7s var(--ease) both;transform-origin:bottom;
  }
  @keyframes barra-sobe{ from{transform:scaleY(0);} to{transform:scaleY(1);} }
  .barra-v-nome{
    font-size:10.5px;color:var(--ink-faint);text-align:center;line-height:1.3;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }

  @media (max-width:1400px){
    .painel .painel-linha{grid-template-columns:repeat(3, minmax(0,1fr));row-gap:22px;}
    .painel .ind.largo{grid-column:span 3;}
    .painel .ind:nth-child(4){padding-left:0;border-left:none;}
  }
  @media (max-width:1080px){
    .painel{grid-template-columns:minmax(0,1fr);}
    .painel .filtros-panel{position:static;flex-direction:row;flex-wrap:wrap;}
    .painel .painel-linha{grid-template-columns:repeat(2, minmax(0,1fr));row-gap:20px;}
    .painel .ind.largo{grid-column:span 2;}
    .painel .ind:nth-child(odd){padding-left:0;border-left:none;}
    .painel-duplo{grid-template-columns:minmax(0,1fr);}
  }
  @media (max-width:600px){
    .painel .painel-linha{grid-template-columns:minmax(0,1fr);}
    .painel .ind.largo{grid-column:span 1;}
  }
  /* A faixa da seção offshore tem quatro campos, e não os seis da faixa de
     abertura. Regras próprias, depois das media queries da faixa padrão, para
     não herdar as três colunas dela. */
  .painel .painel-linha.offshore-linha,
  .painel .painel-linha.linha-4{grid-template-columns:repeat(4, minmax(0,1fr));}
  @media (max-width:1400px){
    .painel .painel-linha.offshore-linha,
    .painel .painel-linha.linha-4{grid-template-columns:repeat(2, minmax(0,1fr));row-gap:22px;}
    .painel .offshore-linha .ind:nth-child(4),
    .painel .linha-4 .ind:nth-child(4){padding-left:14px;border-left:1px solid var(--border);}
    .painel .offshore-linha .ind:nth-child(odd),
    .painel .linha-4 .ind:nth-child(odd){padding-left:0;border-left:none;}
  }
  @media (max-width:600px){
    .painel .painel-linha.offshore-linha,
    .painel .painel-linha.linha-4{grid-template-columns:minmax(0,1fr);}
    .painel .offshore-linha .ind,
    .painel .linha-4 .ind{padding-left:0;border-left:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .rosca-fatia, .barra-v-fill{animation:none;}
  }

  /* =========================================================
     PAINEL DE INDICADORES — repaginação
     A faixa navy no topo inverte a página: o panorama vem em fundo
     escuro, as análises em papel branco. A separação é o que faz o
     gestor saber onde olhar primeiro.
     ========================================================= */
  .painel-topo{
    background:
      radial-gradient(130% 150% at 88% -20%, rgba(176,138,46,.20) 0%, rgba(176,138,46,0) 60%),
      linear-gradient(168deg, #0A2143 0%, var(--navy) 62%);
    border-radius:var(--radius-xl);
    padding:26px 28px 22px;
    margin-bottom:var(--space-5);
    box-shadow:var(--shadow-navy);
    position:relative;overflow:hidden;
  }
  .painel-topo::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--gold);
  }

  .painel-linha{
    display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4, minmax(0,1fr));gap:var(--space-5);
    padding-bottom:24px;
  }

  .ind{
    display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden;
    padding-left:16px;border-left:1px solid rgba(255,255,255,.12);
    animation:ind-entra .5s var(--ease) both;
  }
  .ind:first-child{padding-left:0;border-left:none;}
  .ind:nth-child(2){animation-delay:.06s;}
  .ind:nth-child(3){animation-delay:.12s;}
  .ind:nth-child(4){animation-delay:.18s;}
  .ind:nth-child(5){animation-delay:.24s;}
  @keyframes ind-entra{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }

  .ind-rotulo{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;
    color:#8FA6C6;text-transform:uppercase;letter-spacing:.13em;
  }
  .ind-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-weight:500;color:#fff;
    /* Fluido: com seis colunas na faixa, tamanho fixo estoura em telas
       médias. O piso de 17px mantém a leitura. */
    font-size:clamp(17px, 1.55vw, 25px);
    line-height:1.05;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .ind.largo .ind-valor{font-size:clamp(24px, 2.9vw, 40px);}
  .ind-rotulo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ind-contexto{font-size:11px;color:#93A8C6;line-height:1.35;}
  .ind.ouro .ind-valor{color:#E3C77A;}
  .ind.verde .ind-valor{color:#6FCFA1;}
  .ind.alerta .ind-valor{color:#F0918A;}

  /* Composição da carteira: uma faixa contínua, não um gráfico à parte.
     Mesma gramática do espectro do funil. */
  .composicao{padding-top:20px;border-top:1px solid rgba(255,255,255,.12);}
  .composicao-faixa{
    display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;
    background:rgba(255,255,255,.07);
  }
  .composicao-parte{
    height:100%;min-width:2px;
    animation:composicao-cresce .8s var(--ease) both .3s;transform-origin:left;
  }
  @keyframes composicao-cresce{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
  .composicao-legenda{
    display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-6);margin-top:14px;
  }
  .composicao-item{display:flex;align-items:baseline;gap:7px;}
  .composicao-ponto{width:7px;height:7px;border-radius:2px;flex-shrink:0;align-self:center;}
  .composicao-nome{font-size:12px;color:#C4D2E6;}
  .composicao-valor{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:12.5px;font-weight:500;color:#fff;
  }
  .composicao-qtd{
    font-family:'IBM Plex Mono',Consolas,Menlo,'Courier New',monospace;font-size:10.5px;color:#8FA6C6;
    background:rgba(255,255,255,.09);border-radius:10px;padding:1px 6px;
  }

  /* Seções de análise: cabeçalho com filete e mais respiro que o resto do app */
  .kpi-section-head h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:16px;letter-spacing:-.01em;}
  .kpi-section-head{
    padding-bottom:12px;border-bottom:1px solid var(--border);
    margin-bottom:var(--space-4);
  }

  /* Barras crescem ao abrir a página, em cascata */
