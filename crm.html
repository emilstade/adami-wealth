    const mapa = {};
    PRODUTOS.forEach(prod => {
      const doProduto = meus.filter(l => l.produto === prod);
      mapa[prod] = {
        total: doProduto.length,
        atrasados: doProduto.filter(l => taskUrgency(l) === 'late').length,
      };
    });
    return mapa;
  }, [leads, currentUser, isAdmin]);

  /* Mantém a aba num produto válido quando o conjunto visível muda. */
  useEffect(() => {
    if(produtosVisiveis.length && produtosVisiveis.indexOf(produtoFiltro) === -1)
      setProdutoFiltro(produtosVisiveis[0]);
  }, [produtosVisiveis]);

  /* Os funis nunca se misturam na tela, e dentro de Negócios cada produto
     é um CRM independente. */
  const scopedLeads = useMemo(() => {
    if(!currentUser) return [];
    let vivos = ativos(leads).filter(l => (l.funil || 'assessor') === funil);
    if(funil === 'especialista') vivos = vivos.filter(l => l.produto === produtoFiltro);
    if(!isAdmin) return vivos.filter(l =>
      l.responsavelId === currentUser.id
      /* O assessor acompanha o card que gerou, em modo leitura. */
      || (funil === 'especialista' && l.origemLeadId && leads.some(o => o.id === l.origemLeadId && o.responsavelId === currentUser.id))
    );
    if(vendorFilter === 'all') return vivos;
    return vivos.filter(l => l.responsavelId === vendorFilter);
  }, [leads, currentUser, isAdmin, vendorFilter, funil, produtoFiltro]);

  /* No funil de Negócios o assessor apenas acompanha: os cards chegam por
     encaminhamento, não por cadastro manual. Criar cabe ao especialista. */
  /* Roda antes da tela de login existir, então precisa tolerar sessão nula:
     ao sair de uma conta de especialista o funil continua em "Negócios". */
  const podeCriar = !!currentUser &&
    (funil !== 'especialista' || isAdmin || currentUser.role === 'especialista');

  /* Edição pertence a quem é responsável. Acompanhar não é editar. */
  const podeEditar = (lead) => !!lead && !!currentUser && (isAdmin || lead.responsavelId === currentUser.id);

  /* Busca agora cobre também a oportunidade e o produto — antes um negócio só
     era encontrável pelo nome, telefone ou e-mail do cliente. */
  const buscar = (lista, q) => {
    if(!q) return lista;
    return lista.filter(l =>
      (l.cliente||'').toLowerCase().includes(q) ||
      (l.conta||'').toLowerCase().includes(q) ||
      (l.contaOffshore||'').toLowerCase().includes(q) ||
      (l.telefone||'').toLowerCase().includes(q) ||
      (l.email||'').toLowerCase().includes(q) ||
      (l.oportunidade||'').toLowerCase().includes(q) ||
      (l.produtoServico||'').toLowerCase().includes(q)
    );
  };

  const hojeISO = todayISO();
  const refinar = (lista) => aplicarFiltros(buscar(lista, query.trim().toLowerCase()), filtros, hojeISO);

  const filtered  = useMemo(() => refinar(scopedLeads.filter(l => !saiuDoQuadro(l))), [scopedLeads, query, filtros]);
  const lostLeads = useMemo(() => refinar(scopedLeads.filter(l => l.perdido)), [scopedLeads, query, filtros]);
  const wonLeads  = useMemo(() => refinar(scopedLeads.filter(l => l.ganho)), [scopedLeads, query, filtros]);

  /* Recorte temporal dos indicadores: a data que importa é a do desfecho,
     ou a de criação para quem ainda está em aberto. */
  /* Recorte dos indicadores. Não passa por scopedLeads de propósito: a
     gestão filtra pela barra da própria página, sem depender da aba de
     produto nem do funil aberto. Devolve os dois lados separados, para o
     admin ver carteira e produção na mesma tela. */
  const kpiRecorte = useMemo(() => {
    if(!currentUser) return { jornada: [], negocios: [] };
    const vivos = ativos(leads);

    const dentroDoPeriodo = (l) => {
      const ref = l.ganhoEm || l.perdidoEm || l.criadoEm || 0;
      if(kpiFiltros.periodo === 'custom'){
        if(kpiFiltros.de && ref < new Date(kpiFiltros.de + 'T00:00:00').getTime()) return false;
        if(kpiFiltros.ate && ref > new Date(kpiFiltros.ate + 'T23:59:59').getTime()) return false;
        return true;
      }
      if(kpiFiltros.periodo === 'all') return true;
      return ref >= inicioDoPeriodo(kpiFiltros.periodo);
    };

    /* No funil de produto, "assessor" é quem originou a indicação. */
    const doAssessor = (l) => {
      if(kpiFiltros.assessor === 'all') return true;
      if((l.funil || 'assessor') !== 'especialista') return l.responsavelId === kpiFiltros.assessor;
      const origem = vivos.find(o => o.id === l.origemLeadId);
      return !!origem && origem.responsavelId === kpiFiltros.assessor;
    };

    /* Mesma regra do filtro do quadro: 'sem' é escolha legítima, e é dela que
       sai a leitura "quanto da carteira ninguém classificou ainda". */
    const naTemperatura = (l) => !kpiFiltros.temperatura.length
      || (!l.ganho && kpiFiltros.temperatura.indexOf(l.temperatura || 'sem') !== -1);

    const meu = (l) => isAdmin || l.responsavelId === currentUser.id;
    /* O período recorta só o lado da produção. A carteira é estoque — quem
       está sob gestão continua sob gestão quando o mês vira — e o que nela é
       fluxo (captação, aportes, retiradas) já é recortado por data dentro do
       cálculo, em dentroDoRecorte. Recortar o CLIENTE pela data de cadastro
       tirava da carteira quem entrou antes do período: com "30 dias", a base
       inteira sumia do total, e com "Este mês" como padrão sumiria sempre. */
    const base = vivos.filter(l => meu(l) && doAssessor(l) && naTemperatura(l));

    return {
      jornada: base.filter(l => (l.funil || 'assessor') !== 'especialista'),
      negocios: base.filter(l => l.funil === 'especialista' && dentroDoPeriodo(l)
        && (kpiFiltros.produtos.length === 0 || kpiFiltros.produtos.indexOf(l.produto) !== -1)
        && (kpiFiltros.especialista === 'all' || l.responsavelId === kpiFiltros.especialista)),
    };
  }, [leads, currentUser, isAdmin, kpiFiltros]);

  /* Para quem não é admin, o painel segue o funil aberto. */
  const kpiLeads = funil === 'especialista' ? kpiRecorte.negocios : kpiRecorte.jornada;

  /* A cotacao e uma decisao do escritorio: grava, recarrega e todo numero
     convertido na tela muda junto, porque todos leem do mesmo contexto. */
  const salvarCotacao = async (valor) => {
    await upsertConfig(COTACAO_CHAVE, valor);
    setCotacao({ valor, atualizadoEm: Date.now(), atualizadoPor: currentUser ? currentUser.id : null });
    pushToast('Cotação atualizada para ' + fmtBRL(valor) + ' por dólar.', 'success');
  };

  /* Aplica a mudança na tela na hora e grava só aquele negócio no banco. */
  const mutate = (id, fn) => {
    const atual = leads.find(l => l.id === id);
    if(!atual) return null;
    const novo = stampLead(fn(atual));
    setLeads(prev => prev.map(l => l.id===id ? novo : l));
    persistir(novo);
    return novo;
  };

  /* Aplica a prévia da atualização semanal. Recebe exatamente o objeto que a
     tela mostrou — nada é recalculado aqui, senão a prévia deixaria de ser
     uma promessa do que vai acontecer.

     Grava em lote: uma chamada por cliente faria centenas de idas ao servidor
     e deixaria a carteira do escritório meio atualizada se a conexão caísse
     no meio. */
  const aplicarImportacaoBase = async (res) => {
    const agora = Date.now(), hoje = todayISO();
    /* Offshore grava e escreve em dólar: é a moeda de valorOffshore. */
    const off = res.tipo === 'offshore';
    const fmt = off ? fmtUSD : fmtBRL;
    const novos = res.atualizacoes.map((a) => {
      const l = leads.find(x => x.id === a.lead.id) || a.lead;
      const novo = { ...l, ...a.patch };
      const notas = [];

      if(Math.abs(a.delta) >= 0.01){
        /* O que se grava é o valor INICIAL, não o saldo do arquivo: as
           movimentações lançadas pelo assessor continuam somando por cima e
           seriam contadas duas vezes. Ver btgValorAlvo e btgCampoValor. */
        novo[a.campoValor] = fmt(a.valorAlvo);
        notas.push(a.vinculo ? 'saldo inicial ' + fmt(a.saldoBTG)
          : 'saldo ' + fmt(a.saldoAtual) + ' → ' + fmt(a.saldoBTG)
            + ' (' + (a.delta >= 0 ? '+' : '−') + fmt(Math.abs(a.delta)) + ')');
      }
      for(const c of a.campos) notas.unshift(!c.de && a.vinculo
        ? c.rotulo.toLowerCase() + ' ' + c.para + ' vinculada'
        : c.rotulo.toLowerCase() + ': ' + (c.de || '—') + ' → ' + c.para);

      /* Histórico só quando há o que contar: divergência fora da faixa ou
         mudança de cadastro. Rendimento dentro de 0,5% atualiza o saldo em
         silêncio.

         O motivo é de escala, e só aparece no volume real: quase toda conta
         rende alguma coisa toda semana, então registrar a variação de todas
         somaria ~52 entradas por cliente por ano, todas dizendo "rendeu
         0,2%". O histórico da ficha é cronológico — em um ano as transições
         que importam (R1→R2, a captação efetivada, a indicação na R4)
         ficariam soterradas sob extrato de rendimento.

         Nada se perde em auditoria: o saldo continua sendo o do arquivo, e o
         que se descarta é o registro de uma variação que ninguém iria ler. */
      if(a.alerta || a.campos.length){
        novo.historico = [...(l.historico || []), {
          id: uid('h'), de: l.etapa, para: l.etapa, data: agora,
          resumo: (off ? 'Base BTG offshore · ' : 'Base BTG · ') + notas.join(' · ') + (a.alerta ? ' · fora da faixa de rendimento' : ''),
          autor: currentUser.nome,
        }];
      }

      /* O alerta é o que devolve a divergência para quem consegue explicá-la.
         O admin vê o número no resumo; quem liga para o cliente é o assessor,
         e é no card dele que o aviso precisa estar. */
      if(a.alerta){
        novo.alertas = [...(l.alertas || []), {
          id: uid('al'), tipo: 'divergencia',
          texto: (off ? 'Saldo offshore do BTG variou ' : 'Saldo do BTG variou ') + (a.delta >= 0 ? '+' : '−') + fmt(Math.abs(a.delta))
            + ' sem movimentação lançada que explique. Confirmar com o cliente se houve aporte ou resgate.',
          data: hoje, autor: currentUser.nome, criadoEm: agora, resolvido: false,
        }];
      }
      return stampLead(novo);
    });

    /* Conta nova com código reconhecido: nasce card, na hora, com o
       assessor já vinculado pelo código — é a mesma autorização que já
       valia para transferir carteira existente. Sem código, a conta
       continua só listada; cadastro manual, como sempre foi.
       Offshore nunca cria: a conta lá fora só existe depois que a onshore
       existe, pela conta onshore. */
    const criados = off ? [] : (res.novas || []).filter(n => n.donoPorCodigo).map((n) => {
      const historico = [{ id: uid('h'), de: null, para: 'Cliente Novo', data: agora,
        resumo: 'Cadastrado pela importação da base BTG · vínculo pelo código ' + n.codigo,
        autor: currentUser.nome }];
      return stampLead(congelarSaldoInicialOffshore(null, congelarSaldoInicial(null, {
        ...emptyLead(n.donoPorCodigo.id),
        cliente: n.nome, conta: n.conta,
        etapa: 'Cliente Novo', funil: 'assessor', esteira: 'base',
        segmento: segmentoPorPatrimonio(n.saldo) || 'Advisory',
        saldoInicial: fmtBRL(n.saldo),
        origem: 'Base BTG', criadoEm: agora, etapaDesde: agora,
        historico, atividades: [],
      })));
    });

    if(!novos.length && !criados.length) return;
    const porId = new Map(novos.map(l => [l.id, l]));
    setLeads(prev => [...prev.map(l => porId.has(l.id) ? porId.get(l.id) : l), ...criados]);
    setSaveStatus('saving');
    try {
      await upsertLeads([...novos, ...criados]);
      setSaveStatus(pendentesSalvar.current.size ? 'error' : 'idle');
    } catch(e){
      console.error('Falha ao gravar a atualização da base', e);
      setSaveStatus('error');
      throw e;
    }
    const qtdAlertas = res.resumo.alertas;
    const partes = [];
    if(novos.length) partes.push(novos.length + (novos.length === 1 ? ' cliente atualizado' : ' clientes atualizados'));
    if(criados.length) partes.push(criados.length + (criados.length === 1 ? ' cliente cadastrado' : ' clientes cadastrados'));
    if(qtdAlertas) partes.push(qtdAlertas + (qtdAlertas === 1 ? ' divergência sinalizada' : ' divergências sinalizadas'));
    pushToast(partes.join(' · '), qtdAlertas ? 'warn' : 'success');
  };

  const createLead = (lead) => {
    const historico = [{ id: uid('h'), de: null, para: lead.etapa, data: Date.now(), resumo: 'Lead criado', autor: currentUser.nome }];
    /* Cliente da base nasce com o saldo sob gestão separado do patrimônio. */
    const novo = stampLead({ ...congelarSaldoInicialOffshore(null, congelarSaldoInicial(null, lead)), historico, atividades: [] });
    setLeads(prev => [...prev, novo]);
    persistir(novo);
    setCreating(false);
    pushToast(termos(funil).Sing + ' cadastrado.', 'success');
  };

  const saveLead = (draft) => {
    /* Editar o patrimônio não mexe no sob gestão: o saldo anterior à edição
       fica guardado antes de o rascunho substituir o registro. */
    mutate(draft.id, (atual) => congelarSaldoInicialOffshore(atual, congelarSaldoInicial(atual, draft)));
    setOpenLead(null);
    pushToast('Alterações salvas.', 'success');
  };

  /* Exclusão lógica: um registro apagado de vez não sobrevive à mesclagem
     entre sessões e voltaria a existir no próximo save de outra pessoa. */
  const deleteLead = (id) => {
    if(!isAdmin) return;
    mutate(id, l => ({ ...l, excluido:true, excluidoEm: Date.now() }));
    setOpenLead(null);
    pushToast(termos(funil).Sing + ' excluído.', 'success');
  };

  /* Desfecho no funil do especialista pode encerrar a jornada do cliente de
     origem. A verificação roda sobre a lista já atualizada, senão o próprio
     card recém-encerrado ainda apareceria em aberto. */
  /* Sincroniza a jornada do cliente com o estado das indicações. Vale nos dois
     sentidos: conclui quando todos os especialistas encerram, e devolve para a
     R4 se algum voltar a trabalhar o negócio. Um lugar só, para as duas
     direções nunca discordarem. */
  const sincronizarJornada = (leadEspecialista) => {
    if(!leadEspecialista || leadEspecialista.funil !== 'especialista') return;
    const origemId = leadEspecialista.origemLeadId;
    if(!origemId) return;

    setLeads(prev => {
      const origem = prev.find(l => l.id === origemId);
      if(!origem) return prev;

      const concluida = jornadaConcluida(prev, origem);
      const mover = (para, resumo) => {
        const entrada = { id: uid('h'), de: origem.etapa, para, data: Date.now(),
          resumo, autor: 'Sistema', automatico: true };
        const atualizado = stampLead({ ...origem, etapa: para, etapaDesde: Date.now(),
          historico: [...(origem.historico || []), entrada] });
        persistir(atualizado);
        return prev.map(l => l.id === origemId ? atualizado : l);
      };

      if(origem.etapa === 'R4' && concluida){
        pushToast('Jornada de ' + (nomeCliente(origem) || 'cliente') + ' concluída.', 'success');
        return mover('Jornada Concluída', 'Todas as indicações foram encerradas pelos especialistas.');
      }
      if(origem.etapa === 'Jornada Concluída' && !concluida){
        return mover('R4', 'Um especialista voltou a trabalhar a indicação.');
      }
      return prev;
    });
  };

  const confirmLose = (id, motivo) => {
    /* O saldo offshore de quem foi captado sai junto com o valor captado;
       o da base é saldo de verdade e fica. */
    const atualizado = mutate(id, l => ({ ...l, perdido:true, motivoPerda:motivo, perdidoEm:Date.now(), ganho:false, valorFechado:'', ganhoEm:null,
      ...((l.esteira || 'novo') !== 'base' ? { saldoInicialOffshore:'' } : {}) }));
    setLosingLead(null); setOpenLead(null);
    pushToast('Negócio movido para perdidos.', 'success');
    sincronizarJornada(atualizado);
  };

  const confirmWin = (id, valorFechado, valorOffshore) => {
    const atualizado = mutate(id, l => ({
      ...l, ganho:true, valorFechado, ganhoEm:Date.now(), perdido:false, motivoPerda:'', perdidoEm:null,
      /* Só a Jornada tem custódia. No funil de produto o campo nem aparece, e
         um argumento ausente não pode apagar o que já estava gravado. */
      /* O offshore captado vai para o saldo, não para o patrimônio
         declarado: o cliente pode ter mais lá fora do que trouxe. O
         declarado só é preenchido se estava vazio. */
      ...(valorOffshore === undefined ? {} : {
        saldoInicialOffshore: fmtUSD(parseValor(valorOffshore) || 0),
        ...(parseValor(l.valorOffshore) === null && parseValor(valorOffshore) ? { valorOffshore } : {}),
      }),
    }));
    setWinningLead(null); setOpenLead(null);
    const off = parseValor(valorOffshore);
    pushToast(funil === 'especialista'
      ? 'Venda registrada.'
      : 'Captação efetivada.' + (off ? ' ' + fmtUSD(off) + ' entram na carteira offshore.' : ''), 'success');
    sincronizarJornada(atualizado);
  };

  /* Reabrir devolve o negócio à etapa em que ele estava, não ao início do funil. */
  const reopenLead = (id) => {
    const atualizado = mutate(id, l => ({ ...l, perdido:false, motivoPerda:'', perdidoEm:null, ganho:false, valorFechado:'', ganhoEm:null,
      ...((l.esteira || 'novo') !== 'base' ? { saldoInicialOffshore:'' } : {}) }));
    const lead = leads.find(l => l.id === id);
    pushToast('Reaberto em ' + (lead ? etapaLonga(lead.etapa, lead.funil) : 'sua etapa anterior') + '.', 'success');

    sincronizarJornada(atualizado);
  };

  const addMovimentacao = (leadId, mov) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    /* Aporte de cliente da base em negociação abate a captação em aberto:
       é o mesmo dinheiro, e ele não pode estar nos dois lugares. */
    const atualizado = mutate(leadId, l => abaterCaptacao({ ...l, movimentacoes: [...(l.movimentacoes || []), mov] }, mov));
    const antes = parseValor(lead.valorEmCaptacao) || 0;
    const depois = atualizado ? (parseValor(atualizado.valorEmCaptacao) || 0) : antes;
    pushToast((mov.tipo === 'retirada' ? 'Retirada' : 'Aporte') + ' de '
      + (custodiaDe(mov) === 'offshore' ? fmtUSD : fmtBRL)(parseValor(mov.valor) || 0) + ' registrado.'
      + (depois < antes ? (depois > 0 ? ' Restam ' + moedaCaptacao(lead)(depois) + ' em negociação.' : ' Captação em negociação concluída.') : ''),
      'success');
    return atualizado;
  };

  /* Captação da base: informar, confirmar, encerrar. Cada passo grava só a
     linha do cliente e devolve o registro para a ficha se atualizar. */
  const passoCaptacao = (leadId, passo, dados, mensagem) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    const atualizado = mutate(leadId, l => passo(l, { ...dados, autor: currentUser.nome }));
    pushToast(mensagem(lead), 'success');
    return atualizado;
  };
  const iniciarCaptacaoLead = (leadId, dados) => passoCaptacao(leadId, iniciarCaptacao, dados,
    (l) => (parseValor(l.valorEmCaptacao) || 0) > 0
      ? 'Captação atualizada.'
      : (dados.custodia === 'offshore' ? 'Captação offshore de ' + fmtUSD(parseValor(dados.valor) || 0)
                                       : 'Captação de ' + fmtBRL(parseValor(dados.valor) || 0)) + ' iniciada.');
  const confirmarCaptacaoLead = (leadId, dados) => passoCaptacao(leadId, confirmarCaptacao, dados,
    (l) => 'Captação confirmada: ' + moedaCaptacao(l)(parseValor(dados.valor) || 0)
      + (custodiaCaptacao(l) === 'offshore' ? ' entraram na carteira offshore.' : ' entraram na carteira.'));
  const encerrarCaptacaoLead = (leadId, dados) => passoCaptacao(leadId, encerrarCaptacao, dados,
    () => 'Captação encerrada sem entrada.');

  const removerMovimentacao = (leadId, movId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    return mutate(leadId, l => ({ ...l, movimentacoes: (l.movimentacoes || []).filter(m => m.id !== movId) }));
  };

  const addAlerta = (leadId, alerta) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    const atualizado = mutate(leadId, l => ({ ...l, alertas: [...(l.alertas || []), alerta] }));
    pushToast('Alerta de ' + tipoAlertaLabel(alerta.tipo).toLowerCase() + ' criado.', 'success');
    return atualizado;
  };

  /* Resolver mantém o registro: o alerta some da lista ativa mas fica no
     histórico do cliente, com quem resolveu e quando. */
  const resolverAlerta = (leadId, alertaId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    return mutate(leadId, l => ({
      ...l,
      alertas: (l.alertas || []).map(a => a.id === alertaId
        ? { ...a, resolvido:true, resolvidoEm: Date.now(), resolvidoPor: currentUser.nome }
        : a),
    }));
  };

  const removerAlerta = (leadId, alertaId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    return mutate(leadId, l => ({ ...l, alertas: (l.alertas || []).filter(a => a.id !== alertaId) }));
  };

  const toggleOnboarding = (leadId, itemId) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || !podeEditar(lead)) return null;
    const feitos = onboardingFeitos(lead);
    const marcado = feitos.indexOf(itemId) !== -1;
    const novos = marcado ? feitos.filter(x => x !== itemId) : [...feitos, itemId];
    return mutate(leadId, l => ({ ...l, pautas: { ...(l.pautas || {}), onboarding: novos } }));
  };

  const addActivity = (leadId, atividade) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead) return null;
    const atualizado = mutate(leadId, l => ({
      ...l,
      atividades: [...(l.atividades || []), atividade],
      /* A atividade é a evidência do contato: ela move a data do último contato. */
      ultimoContato: (!l.ultimoContato || atividade.data > l.ultimoContato) ? atividade.data : l.ultimoContato,
    }));
    pushToast(tipoAtividadeLabel(atividade.tipo) + ' registrada.', 'success');
    return atualizado;
  };

  /* Válvula de escape da trava de trajeto: o admin corrige um movimento errado,
     e a correção fica registrada na linha do tempo como tal. */
  const correctStage = (leadId, para, motivo) => {
    if(!isAdmin) return;
    const lead = leads.find(l => l.id === leadId);
    if(!lead) return;
    const entry = { id: uid('h'), de: lead.etapa, para, data: Date.now(), resumo: motivo, autor: currentUser.nome, correcao: true };
    mutate(leadId, l => ({ ...l, etapa: para, historico: [...(l.historico || []), entry] }));
    setOpenLead(null);
    pushToast('Etapa corrigida para ' + para + '.', 'success');
  };

  /* Gera um card por produto no funil do especialista, mantendo o vínculo
     com a origem para o assessor acompanhar o desfecho sem poder editar. */
  const confirmarEncaminhamento = async (lead, selecao, briefings) => {
    const produtos = Object.keys(selecao).filter(p => selecao[p]);
    if(produtos.length === 0) return;
    const agora = Date.now();
    const perfil = (briefings && briefings.__perfil) || '';
    const novos = produtos.map(produto => {
      const b = (briefings && briefings[produto]) || {};
      return stampLead({
      ...emptyLead(selecao[produto]),
      /* Nome já composto, e não a conta em coluna: `conta` tem índice único
         no banco, e duas linhas não podem representar a mesma conta do BTG.
         O card do especialista é um retrato, não um segundo registro daquele
         cliente — mas o especialista precisa saber qual Maria é. */
      cliente: nomeCliente(lead), oportunidade: produto + (b.interesse ? ' — ' + b.interesse : ''),
      telefone: lead.telefone, email: lead.email,
      segmento: lead.segmento, esteira: lead.esteira,
      tipoPessoa: lead.tipoPessoa, contatoNome: lead.contatoNome, contatoCargo: lead.contatoCargo,
      grupoFamiliar: lead.grupoFamiliar,
      funil: 'especialista', etapa: 'Cliente Novo', produto,
      origemLeadId: lead.id, etapaDesde: agora,
      responsavelId: selecao[produto],
      /* O valor aqui é o do negócio indicado, não o patrimônio do cliente. */
      valorPotencial: b.valor || '',
      briefing: { interesse: b.interesse || '', urgencia: b.urgencia || '', perfil },
      observacoes: 'Indicado por ' + currentUser.nome + ' a partir da R4.',
      historico: [{ id: uid('h'), de: null, para: 'Cliente Novo', data: agora,
        resumo: 'Indicado por ' + currentUser.nome + ' · ' + produto
          + (b.interesse ? ' · ' + b.interesse : '')
          + (b.urgencia ? ' · urgência: ' + b.urgencia.toLowerCase() : ''),
        autor: currentUser.nome }],
    });
    });

    setLeads(prev => [...prev, ...novos]);
    for(const n of novos){ await persistir(n); }

    const nomeDe = (id) => (users.find(u=>u.id===id)||{}).nome || 'especialista';
    mutate(lead.id, l => ({
      ...l,
      historico: [...(l.historico||[]), { id: uid('h'), de: l.etapa, para: l.etapa, data: agora,
        resumo: 'Indicado para ' + produtos.map(p => p + ' (' + nomeDe(selecao[p]) + ')').join(', '),
        autor: currentUser.nome, encaminhamento: true }],
    }));

    setEncaminhando(null);
    setOpenLead(null);
    setProdutoFiltro(produtos[0]);
    pushToast(produtos.length > 1
      ? produtos.length + ' negócios indicados.'
      : produtos[0] + ' indicado para ' + nomeDe(selecao[produtos[0]]) + '.', 'success');
  };

  const requestMove = (leadId, targetStage) => {
    const lead = leads.find(l => l.id === leadId);
    if(!lead || lead.etapa === targetStage) return;
    if(!podeEditar(lead)){
      pushToast('Este negócio é do especialista. Você acompanha, mas não edita.', 'error');
      return;
    }
    if(!canMove(lead, targetStage)){
      const opcoes = allowedMoves(lead);
      pushToast(opcoes.length === 0
        ? 'De "' + etapaLonga(lead.etapa, lead.funil) + '" não há movimentação permitida.'
        : 'Trajeto não permitido: de "' + etapaLonga(lead.etapa, lead.funil) + '" só é possível ir para '
          + listarEtapas(opcoes.map(e => etapaLonga(e, lead.funil))) + '.', 'error');
      return;
    }
    /* O destino viaja junto: com vários caminhos possíveis, a etapa de
       chegada não dá mais para deduzir a partir da etapa atual. */
    setMovingLead({ lead, to: targetStage });
  };

  const confirmMove = (id, to, resumo) => {
    const atualizado = mutate(id, l => {
      const entry = { id: uid('h'), de: l.etapa, para: to, data: Date.now(), resumo, autor: currentUser.nome };
      return { ...l, etapa: to, etapaDesde: Date.now(), historico: [...(l.historico||[]), entry] };
    });
    setMovingLead(null);
    setOpenLead(null);
    pushToast('Movido para ' + to + '.', 'success');
    /* A R4 é a reunião de produto: ao chegar nela, o encaminhamento é o
       próximo passo natural, então o modal abre sem exigir um clique extra. */
    const alvo = leads.find(l => l.id === id);
    if(to === 'R4' && alvo && (alvo.funil || 'assessor') === 'assessor'){
      setEncaminhando({ ...alvo, etapa: 'R4' });
    }
    /* Mover para Contato Futuro encerra a indicação; sair de lá a reabre. */
    sincronizarJornada(atualizado);
  };

  if(phase === 'loading'){
    return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'240px',color:'var(--ink-muted)',gap:8,fontSize:13.5}}, h(IconLoader,{size:16}), 'Carregando pipeline...');
  }

  if(phase === 'chaves'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:500}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}),
          h('h2',null, chaveSecreta ? 'Chave secreta no lugar da pública' : invertido ? 'Chaves trocadas' : 'Chaves inválidas')),
        h('p',{className:'sub'}, chaveSecreta
          ? 'Essa é a chave secreta do projeto (service_role). Ela ignora todas as regras de acesso do banco e não pode ficar num arquivo que roda no navegador. Use a chave publicável:'
          : invertido
          ? 'A URL e a chave parecem estar em campos invertidos. A ordem correta é:'
          : 'Não foi possível conectar com esses valores. Confira se estão assim:'),
        h('div',{className:'csv-dump', style:{minHeight:0,whiteSpace:'pre-wrap',padding:'10px 12px'}},
          "const SUPABASE_URL      = 'https://SEUPROJETO.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_...';"),
        erroCliente ? h('p',{className:'sub', style:{marginTop:12,color:'var(--danger)'}}, erroCliente) : null,
        h('p',{className:'sub', style:{marginTop:12,marginBottom:0}},'A URL começa com https:// e termina em .supabase.co. A chave começa com sb_publishable_.')
      )
    );
  }

  if(phase === 'semlib'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:460}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Biblioteca não carregou')),
        h('p',{className:'sub'},'A biblioteca supabase-js não carregou. Ela é servida pelo próprio portal, em vendor/supabase-js-2.min.js — confirme que a pasta vendor subiu junto com o crm.html.'),
        h('button',{className:'btn btn-primary', style:{width:'100%',justifyContent:'center'}, onClick:()=>window.location.reload()}, 'Tentar de novo')
      )
    );
  }

  /* Erra cedo e explica: sem as chaves, nada mais faz sentido. */
  if(phase === 'config'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:460}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Falta configurar o banco')),
        h('p',{className:'sub'},'Abra este arquivo em um editor de texto e substitua as duas constantes no início do script:'),
        h('div',{className:'csv-dump', style:{minHeight:0,whiteSpace:'pre-wrap',padding:'10px 12px'}},
          "const SUPABASE_URL      = 'https://xxxxx.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_...';"),
        h('p',{className:'sub', style:{marginTop:14,marginBottom:0}},'Os dois valores estão no painel do Supabase, em Project Settings > API. Use a chave publicável — nunca a service_role, que ignora as regras de acesso do banco.')
      )
    );
  }

  if(phase === 'bloqueado'){
    const pendente = motivoBloqueio === 'pendente';
    return h('div',{className:'tela-aviso', style:{maxWidth:520,margin:'80px auto',padding:'0 24px',textAlign:'center'}},
      h('h1',{style:{fontFamily:"'Fraunces',Georgia,serif",color:'#1B2A4A',fontSize:24,marginBottom:12}},
        pendente ? 'Acesso aguardando liberação' : 'Sem acesso ao CRM'),
      h('p',{style:{lineHeight:1.6,color:'#4A5568',marginBottom:10}},
        pendente
          ? 'A sua conta existe e você continua logado no portal. Falta um master liberar o seu acesso ao CRM na tela de Equipe.'
          : 'A sua conta não tem perfil no CRM. Peça a um master para definir o seu papel na tela de Equipe do hub.'),
      h('p',{style:{fontSize:13,color:'#8A93A6',marginBottom:22}},
        'Os outros módulos do portal continuam funcionando normalmente.'),
      h('button',{className:'btn btn-primary',
        onClick:()=>{ window.location.href='index.html'; }}, 'Voltar ao portal')
    );
  }

  if(phase === 'login'){
    return h(LoginScreen,{ onLogin:handleLogin, onRegister:handleRegister, onReset:handleReset,
      demo: MODO_DEMO ? demoStore.profiles.filter(p => p.status === 'ativo') : null, onEntrarDemo:entrarDemo });
  }

  const especialistaView = funil === 'especialista';
  const viewTitle = view==='perdidos'
      ? (especialistaView ? 'Negócios perdidos' : 'Clientes desqualificados')
    : view==='ganhos'
      ? (especialistaView ? 'Negócios fechados' : 'Captações efetivadas')
    : view==='kpis' ? (isAdmin ? 'Indicadores' : rotuloIndicadores(false, funil))
    : view==='offshore' ? 'Carteira offshore'
    : view==='importacao' ? 'Atualização da base'
    : especialistaView ? produtoFiltro + ' · negócios em andamento'
    : 'Jornada do cliente';

  /* A cotacao entra aqui e nao em cada tela: o consolidado tem de ser o
     mesmo numero em todas elas. */
  return h(CotacaoContext.Provider, { value: cotacao },
    saveStatus === 'error' ? h('div',{className:'save-banner'},
      h('span',null, 'Não foi possível gravar no banco. As alterações continuam nesta tela, mas se perdem se você fechar a aba antes de salvar.'),
      h('button',{className:'btn btn-ghost', onClick:retrySave}, 'Tentar salvar de novo')
    ) : null,
    h('div',{className:'topbar'},
      h('div',{className:'brand'}, h('span',{className:'brand-mark'}), h('h1',null, viewTitle)),
      /* NAVEGAÇÃO — faixa própria, ordem fixa. As abas de produto ficam por
         último de propósito: quando aparecem, nada antes delas se move. */
      h('div',{className:'topbar-nav'},
        /* Especialista só enxerga o próprio funil; assessor e admin alternam. */
        (isAdmin || currentUser.role !== 'especialista') ? h('div',{className:'funil-switch', role:'group', 'aria-label':'Funil'},
          h('button',{className: funil==='assessor' ? 'active' : '', onClick:()=>setFunil('assessor')}, 'Jornada'),
          h('button',{className: funil==='especialista' ? 'active' : '', onClick:()=>setFunil('especialista')}, 'Negócios')
        ) : null,
        /* Todo mundo enxerga os próprios encerrados e os próprios números.
           O recorte por responsável já acontece no cálculo, então o acesso
           não precisava ser restrito ao admin. */
        h('div',{className:'view-tabs'},
          h('button',{className:'view-tab' + (view==='kanban' ? ' active':''), onClick:()=>setView('kanban')}, 'Funil'),
          /* Só na Jornada, e só para o admin: o funil de produto não tem
             custódia, e a carteira do assessor é uma só — a leitura offshore
             dele vive dentro de "Minha carteira", sem tela separada. */
          (isAdmin && funil !== 'especialista')
            ? h('button',{className:'view-tab' + (view==='offshore' ? ' active':''), onClick:()=>setView('offshore')}, 'Offshore')
            : null,
          h('button',{className:'view-tab' + (view==='kpis' ? ' active':''), onClick:()=>setView('kpis')},
            h(IconBarChart,{size:12}), rotuloIndicadores(isAdmin, funil)),
          h('button',{className:'view-tab' + (view==='ganhos' ? ' active':''), onClick:()=>setView('ganhos')},
            rotuloDesfecho(funil, 'ganho'), h('span',{className:'count'}, wonLeads.length)),
          h('button',{className:'view-tab' + (view==='perdidos' ? ' active':''), onClick:()=>setView('perdidos')},
            rotuloDesfecho(funil, 'perdido'), h('span',{className:'count'}, lostLeads.length))
        ),
        /* Cada produto é um CRM próprio: quadro, colunas e números separados.
           A aba só lista o que a pessoa pode ver — especialista enxerga apenas
           os produtos que atende. */
        funil === 'especialista' && produtosVisiveis.length > 1
          ? h('div',{className:'produto-tabs', role:'tablist', 'aria-label':'Produto'},
              produtosVisiveis.map(prod => {
                const resumo = negociosPorProduto[prod] || { total:0, atrasados:0 };
                const ativa = produtoFiltro === prod;
                return h('button',{
                  key:prod, className:'produto-tab' + (ativa ? ' active' : ''),
                  role:'tab', 'aria-selected': ativa ? 'true' : 'false',
                  onClick:()=>setProdutoFiltro(prod),
                  title: resumo.atrasados
                    ? resumo.atrasados + ' com contato atrasado'
                    : resumo.total + ' em andamento',
                },
                  h('span',{className:'produto-tab-nome'}, prod),
                  h('span',{className:'produto-tab-num'}, resumo.total),
                  resumo.atrasados > 0 ? h('span',{className:'produto-tab-alerta'}) : null
                );
              })
            )
          : null,
        /* Atualizar base não é uma leitura da carteira, é uma operação sobre
           ela — por isso sai das abas e vai para a ponta direita da faixa,
           embaixo das ferramentas, com a borda direita na mesma linha do
           botão de sair. Só do admin e só na Jornada: o arquivo do BTG é a
           carteira inteira do escritório, e o funil de produto não tem conta
           no banco para reconciliar. Sendo o último item, sumir no funil de
           produto não desloca nada. */
        (isAdmin && funil !== 'especialista')
          ? h('button',{className:'btn btn-ghost nav-importacao' + (view==='importacao' ? ' active':''),
              onClick:()=>setView('importacao')},
              h(IconUpload,{size:14}), 'Atualizar base')
          : null
      ),
      h('div',{className:'topbar-actions'},
        /* FERRAMENTAS — sempre nas mesmas posições. A busca reserva o
           espaço dela mesmo onde não se aplica, senão tudo à direita
           desliza ao trocar de tela. */
        h('div',{className:'busca-slot' + (view === 'kpis' || view === 'offshore' ? ' oculta' : '')},
          h('div',{className:'search-wrap'}, h(IconSearch,{size:15}),
            h('input',{ placeholder:'Buscar por nome, telefone ou e-mail', value:query,
              onChange:e=>setQuery(e.target.value), tabIndex: (view === 'kpis' || view === 'offshore') ? -1 : 0 }))
        ),
        isAdmin ? h('select',{ className:'select-sm', value:vendorFilter, onChange:e=>setVendorFilter(e.target.value) },
          h('option',{value:'all'}, 'Toda a equipe'),
          users.map(u => h('option',{ key:u.id, value:u.id }, u.nome))
        ) : null,
        isAdmin ? h('button',{className:'btn btn-ghost', onClick:()=>setManagingTeam(true)},
          h(IconUsers,{size:14}), 'Equipe',
          pendentes.length > 0 ? h('span',{className:'pending-dot', title:pendentes.length + ' conta(s) aguardando aprovação'}, pendentes.length) : null
        ) : null,
        h('div',{className:'user-chip'},
          h('span',{className:'avatar'}, initials(currentUser.nome)),
          h('span',{className:'name'}, currentUser.nome)
        ),
        h('button',{className:'btn btn-ghost', onClick:handleLogout, title:'Sair'}, h(IconLogout,{size:14}))
      )
    ),
    view==='kanban' ? h('div',{className: (overviewOpen && filtered.length > 0) ? '' : 'overview-fechada'},
      /* Em notebook a visão geral come altura do funil — dá para recolher. */
      filtered.length > 0 ? h('div',{className:'overview-toggle'},
        h('button',{
          className:'link-btn', 'aria-expanded': overviewOpen ? 'true' : 'false',
          onClick:()=>setOverviewOpen(v => !v),
        },
          h('span',{className:'overview-chevron' + (overviewOpen ? '' : ' closed')}, h(IconChevron,{size:13})),
          overviewOpen ? 'Recolher visão geral' : 'Mostrar visão geral'
        )
      ) : null,
      overviewOpen && filtered.length > 0 ? h(PipelineOverview,{ leads: filtered, onOpen:setOpenLead, funil }) : null,

      /* Ações do quadro coladas ao quadro: filtrar e cadastrar são operações
         sobre os cards, não sobre a navegação do aplicativo. */
      h('div',{className:'board-actions'},
        h('div',{className:'board-actions-left'},
          h('button',{
            className:'btn btn-ghost' + (filtrosAbertos ? ' ativo' : ''),
            onClick:()=>setFiltrosAbertos(v => !v),
            'aria-expanded': filtrosAbertos ? 'true' : 'false',
          }, h(IconFiltro,{size:14}), 'Filtros',
             contarFiltros(filtros) > 0 ? h('span',{className:'pending-dot'}, contarFiltros(filtros)) : null),
          /* Quadro e lista respondem perguntas diferentes sobre a mesma base,
             então convivem como duas leituras, não como telas separadas. */
          h('div',{className:'modo-switch', role:'group', 'aria-label':'Forma de visualização'},
            h('button',{ className: modoBoard === 'quadro' ? 'active' : '',
              onClick:()=>setModoBoard('quadro'), title:'Ver como funil' },
              h(IconQuadro,{size:13}), 'Quadro'),
            h('button',{ className: modoBoard === 'lista' ? 'active' : '',
              onClick:()=>setModoBoard('lista'), title:'Ver a base em lista' },
              h(IconLista,{size:13}), 'Lista')
          ),
          contarFiltros(filtros) > 0
            ? h('span',{className:'board-actions-count'},
                filtered.length, filtered.length === 1 ? ' resultado' : ' resultados')
            : null
        ),
        podeCriar
          ? h('button',{className:'btn btn-primary', onClick:()=>{ setQuickAddStage(null); setCreating(true); }},
              h(IconPlus,{size:14}), termos(funil).novo)
          : null
      ),
      h(FiltrosPanel,{ filtros, onChange:setFiltros, funil, aberto:filtrosAbertos, grupos }),

      modoBoard === 'lista'
      ? h(ListaClientes,{
          leads: filtered, onOpen:setOpenLead, users,
          showOwner: isAdmin && vendorFilter === 'all',
          funil, podeEditar,
        })
      : h(Board,{
        leads: filtered, onOpen:setOpenLead, users,
        showOwner:isAdmin && vendorFilter==='all',
        onQuickAdd:(stage)=>{ setQuickAddStage(stage); setCreating(true); },
        onLose:(lead)=>setLosingLead(lead), onWin:(lead)=>setWinningLead(lead),
        onRequestMove:requestMove,
        emptyAll: filtered.length === 0 && !query.trim(),
        funil, podeEditar, podeCriar, pendentesIndicacao,
      })
    ) : (view==='ganhos' || view==='perdidos') ? h(Fragment, null,
      h('div',{className:'board-actions'},
        h('div',{className:'board-actions-left'},
          h('button',{
            className:'btn btn-ghost' + (filtrosAbertos ? ' ativo' : ''),
            onClick:()=>setFiltrosAbertos(v => !v),
            'aria-expanded': filtrosAbertos ? 'true' : 'false',
          }, h(IconFiltro,{size:14}), 'Filtros',
             contarFiltros(filtros) > 0 ? h('span',{className:'pending-dot'}, contarFiltros(filtros)) : null)
        )
      ),
      h(FiltrosPanel,{ filtros, onChange:setFiltros, funil, aberto:filtrosAbertos, grupos }),
      view==='ganhos'
        ? h(OutcomeBoard,{ leads: wonLeads, users, onReopen:reopenLead, mode:'won', funil })
        : h(OutcomeBoard,{ leads: lostLeads, users, onReopen:reopenLead, mode:'lost', funil })
    )
    : (view==='offshore' && isAdmin)
      ? h(Fragment, null,
          h('div',{className:'board-actions'},
            h('div',{className:'board-actions-left'}),
            h('button',{className:'btn btn-primary', onClick:()=>window.print()},
              h(IconPrinter,{size:14}), 'Imprimir / salvar PDF')
          ),
          h(KpiFiltros,{ filtros:kpiFiltros, onChange:setKpiFiltros, funil, users, leads,
            simples:!isAdmin }),
          h(OffshoreView,{
            leads: kpiRecorte.jornada, users, filtros: kpiFiltros,
            currentUser, isAdmin, onOpen:setOpenLead, onSalvarCotacao:salvarCotacao })
        )
    : (view==='importacao' && isAdmin)
      ? h(ImportacaoBaseView,{ leads, users, currentUser,
          onAplicar: aplicarImportacaoBase, onOpen: setOpenLead })
    : view==='kpis'
      ? h(Fragment, null,
          /* Impressão vive na página que ela imprime, não na barra do
             aplicativo: assim os controles do topo não mudam de tela para tela. */
          h('div',{className:'board-actions'},
            h('div',{className:'board-actions-left'}),
            h('div',{style:{display:'flex',gap:8}},
              h('button',{className:'btn btn-ghost', title:'Gera o arquivo pelo jsPDF. Pode ser bloqueado dentro do preview.', onClick:()=>{
                try{
                  const kpiStats = computeKpiStats(kpiLeads, kpiLeads, users);
                  const scopeLabel = vendorFilter === 'all' ? 'Toda a equipe' : ((users.find(u=>u.id===vendorFilter)||{}).nome || 'Toda a equipe');
                  generateKpiPdf(kpiStats, { scopeLabel: scopeLabel + ' · ' + periodoLabel(kpiFiltros), generatedAt: new Date().toLocaleString('pt-BR'), generatedBy: currentUser.nome });
                }catch(e){
                  console.error(e);
                  pushToast('O download foi bloqueado aqui. Use "Imprimir / salvar PDF".', 'error');
                }
              }}, h(IconDownload,{size:14}), 'Baixar arquivo'),
              h('button',{className:'btn btn-primary', onClick:()=>window.print()},
                h(IconPrinter,{size:14}), 'Imprimir / salvar PDF')
            )
          ),
          isAdmin ? null : h(KpiFiltros,{
            filtros:kpiFiltros, onChange:setKpiFiltros, funil, users, leads, simples:true }),
          isAdmin
            ? h(AdminKpis,{ jornada: kpiRecorte.jornada, negocios: kpiRecorte.negocios,
                users, currentUser, filtros: kpiFiltros, onFiltros: setKpiFiltros, leads })
            : (funil === 'especialista'
          /* Só o funil e o produto abertos: passar a base inteira misturava a
             jornada e os dois CRMs de produto na evolução mensal e no ranking,
             contando duas vezes o cliente indicado para Consórcio e Seguro. */
          ? h(KpisView,{
              scopedLeads: kpiLeads,
              allLeads: kpiLeads,
              users, vendorFilter, currentUser, periodo: kpiFiltros })
          : h(AssessoriaKpis,{ scopedLeads: kpiLeads, users, vendorFilter, currentUser, periodo: kpiFiltros }))
        )
    : null,
    creating ? h(CreateModal,{ funil, grupos, produto: produtoFiltro, onClose:()=>{ setCreating(false); setQuickAddStage(null); }, onCreate:createLead, users, currentUser, isAdmin, initialStage:quickAddStage }) : null,
    openLead ? h(DetailModal,{ lead:openLead, grupos, grupo: grupoDe(leads, openLead, cotacao),
      pendenteIndicacao: pendentesIndicacao.has(openLead.id), somenteLeitura: !podeEditar(openLead), onEncaminhar:(l)=>setEncaminhando(l), onClose:()=>setOpenLead(null), onSave:saveLead, onDelete:deleteLead, users, currentUser, isAdmin, onLose:(lead)=>{ setOpenLead(null); setLosingLead(lead); }, onWin:(lead)=>{ setOpenLead(null); setWinningLead(lead); }, onMove:(lead, to)=>requestMove(lead.id, to), onAddActivity:addActivity, onCorrectStage:correctStage, onTogglePauta:toggleOnboarding, onAddAlerta:addAlerta, onResolverAlerta:resolverAlerta, onRemoverAlerta:removerAlerta, onAddMov:addMovimentacao, onRemoverMov:removerMovimentacao,
      onIniciarCaptacao:iniciarCaptacaoLead, onConfirmarCaptacao:confirmarCaptacaoLead, onEncerrarCaptacao:encerrarCaptacaoLead }) : null,
    managingTeam ? h(TeamModal,{ onClose:()=>setManagingTeam(false), users, leads, onDefinirRole:definirRole, onDefinirProdutos:definirProdutos, onApprove:approveUser, onRemove:removeUser, onResetPin:resetPin, onSetPadrao:definirPadrao, currentUser,
      convites, onConvidar:criarConvite, onCancelarConvite:cancelarConvite }) : null,
    losingLead ? h(LoseModal,{ lead:losingLead, onClose:()=>setLosingLead(null), onConfirm:confirmLose }) : null,
    winningLead ? h(WinModal,{ lead:winningLead, onClose:()=>setWinningLead(null), onConfirm:confirmWin }) : null,
    movingLead ? h(MoveModal,{ lead:movingLead.lead, from:movingLead.lead.etapa, to:movingLead.to, onClose:()=>setMovingLead(null), onConfirm:confirmMove }) : null,
    verNotificacoes ? h(NotificacoesModal,{
      itens: minhasNotificacoes,
      onClose:()=>setVerNotificacoes(false),
      onAbrir:(leadId)=>{
        const alvo = leads.find(l => l.id === leadId);
        setVerNotificacoes(false);
        if(alvo){ setFunil(alvo.funil || 'assessor'); if(alvo.produto) setProdutoFiltro(alvo.produto); setOpenLead(alvo); }
      },
    }) : null,
    encaminhando ? h(EncaminharModal,{
      lead: encaminhando,
      especialistas: users.filter(u => u.role === 'especialista' && u.status === 'ativo'),
      jaEncaminhados: leads.filter(l => l.origemLeadId === encaminhando.id && !l.excluido).map(l => l.produto),
      padroes: ((users.find(u => u.id === encaminhando.responsavelId) || {}).especialistasPadrao) || {},
      onClose:()=>{
        const alvo = encaminhando;
        setEncaminhando(null);
        /* Sem indicação o cliente trava na R4, então o fechamento avisa
           em vez de deixar a pendência passar em silêncio. */
        if(alvo && pendentesIndicacao.has(alvo.id)){
          pushToast('Nenhum negócio indicado. O cliente fica pendente na R4.', 'error');
        }
      },
      onConfirm:confirmarEncaminhamento,
    }) : null,
    h('div',{className:'toast-stack', role:'status', 'aria-live':'polite'},
      toasts.map(t => h('div',{key:t.id, className:'toast ' + t.tipo}, t.mensagem))
    )
  );
}

/* Sem isto, qualquer exceção durante a renderização desmonta a árvore inteira
   e o usuário vê uma página em branco, sem nenhuma pista do que aconteceu. */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro){ return { erro }; }
  componentDidCatch(erro, info){ console.error('Falha na interface:', erro, info); }
  render(){
    if(!this.state.erro) return this.props.children;
    const e = this.state.erro;
    const msg = (e && e.message) ? e.message : String(e);
    const pilha = (e && e.stack) ? String(e.stack) : '';
    /* A primeira linha do stack costuma apontar o componente culpado; o resto
       é rastro interno do React e não ajuda a identificar a causa. */
    const origem = pilha.split('\n').slice(0,4).join('\n');
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card', style:{maxWidth:560}},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Algo quebrou na tela')),
        h('p',{className:'sub'},'Seus dados estão salvos. Copie a mensagem abaixo para identificar a causa.'),
        h('div',{style:{padding:'12px 14px',background:'var(--danger-tint)',border:'1px solid #F0CFCC',
          borderRadius:'var(--radius-md)',color:'var(--danger)',fontSize:13,fontWeight:600,
          wordBreak:'break-word',marginBottom:12}}, msg),
        h('div',{className:'csv-dump', style:{minHeight:0,maxHeight:150,whiteSpace:'pre-wrap',fontSize:10.5}}, origem),
        h('button',{className:'btn btn-primary', style:{width:'100%',justifyContent:'center',marginTop:14}, onClick:()=>window.location.reload()}, 'Recarregar')
      )
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(h(ErrorBoundary, null, h(App)));
</script>
