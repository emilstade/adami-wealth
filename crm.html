const ESTADOS_CIVIS = ['Solteiro(a)', 'Casado(a)', 'União estável', 'Divorciado(a)', 'Viúvo(a)'];

const ORIGENS = ['Indicação', 'Prospecção', 'Carteira da base', 'Evento', 'Mídia', 'Outro'];

/* PF e PJ pedem informações diferentes e são chamados por nomes diferentes.
   Centralizar aqui evita que os rótulos divirjam pela tela. */
function rotulosPessoa(tipo){
  return tipo === 'PJ'
    ? { nome:'Razão social', nomePlaceholder:'Ex: Têxtil Serrana Ltda',
        oQueFaz:'Ramo de atuação', oQueFazPlaceholder:'Ex: Indústria têxtil',
        patrimonio:'Patrimônio ou caixa no Brasil' }
    : { nome:'Nome do cliente', nomePlaceholder:'Ex: Marcos Almeida',
        oQueFaz:'Profissão', oQueFazPlaceholder:'Ex: Cirurgião-dentista',
        patrimonio:'Patrimônio no Brasil' };
}

/* O card da jornada é um cliente; o do especialista é um negócio. A interface
   inteira usa estes termos para não falar "negócio" a quem gerencia carteira. */
/* O admin lê o escritório; o assessor lê a própria carteira; o especialista
   lê a produção dele. Mesma tela, perguntas diferentes. */
function rotuloIndicadores(isAdmin, funil){
  if(isAdmin) return 'KPIs';
  return funil === 'especialista' ? 'Minha produção' : 'Minha carteira';
}

/* Na jornada, o desfecho é captação; no funil de produto, é venda. */
function rotuloDesfecho(funil, tipo){
  const especialista = funil === 'especialista';
  if(tipo === 'ganho') return especialista ? 'Fechados' : 'Captados';
  return especialista ? 'Perdidos' : 'Desqualificados';
}

function termos(funil){
  return funil === 'especialista'
    ? { art:'o', sing:'negócio', plur:'negócios', Sing:'Negócio', Plur:'Negócios', novo:'Novo negócio' }
    : { art:'o', sing:'cliente', plur:'clientes', Sing:'Cliente', Plur:'Clientes', novo:'Novo cliente' };
}

/* O segmento é função do patrimônio, conforme o processo comercial.
   Sugerimos automaticamente e deixamos o assessor sobrepor. */
function segmentoPorPatrimonio(valor){
  if(valor === null || valor === undefined) return null;
  if(valor >= 5000000) return 'Private';
  if(valor >= 1000000) return 'Exclusive';
  return 'Advisory';
}

/* ================= O nome que se lê =================
   Padrão do escritório: "Nome Sobrenome · conta". A conta entra porque o
   export do BTG traz só o primeiro nome, e há 84 primeiros nomes cobrindo 273
   contas — sem ela o assessor não sabe qual Maria é qual.

   Mas a conta mora em COLUNA PRÓPRIA e se junta ao nome só aqui, na leitura.
   É a mesma decisão de `etapaCurta`/`etapaLonga`: o banco guarda o dado, a
   tela compõe a apresentação. Colada dentro do texto, ela atrapalharia a busca
   por nome, quebraria a ordenação alfabética e obrigaria quem digitasse o
   sobrenome a recolar os dígitos à mão.

   Cliente cadastrado pela tela ainda não tem conta, e aparece só com o nome —
   até o assessor preencher a conta na ficha, quando ele passa a ser
   reconciliado pela atualização semanal. */
function nomeCliente(lead){
  if(!lead) return '';
  const nome  = (lead.cliente || '').trim();
  const conta = (lead.conta || '').trim();
  if(!conta) return nome || 'Sem nome';
  if(!nome) return conta;
  /* Defesa contra o formato antigo, em que a conta vinha colada no texto: sem
     isto o card mostraria "Silvana · 4417029 · 4417029". A importação
     normaliza o dado, mas a tela não pode depender de ela já ter rodado. */
  if(nome.endsWith(conta)) return nome;
  return nome + ' · ' + conta;
}

/* O nome cru, sem a conta — para o formulário, que edita o dado, e para
   qualquer lugar que precise do texto que o assessor digitou. */
function nomeSemConta(cliente, conta){
  const nome = (cliente || '').trim();
  const c = (conta || '').trim();
  if(!c || !nome.endsWith(c)) return nome;
  return nome.replace(new RegExp('\\s*[·\\-–]?\\s*' + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'), '').trim();
}

/* ================= Atualização semanal da base BTG =================
   Toda semana chega um export do BTG com a carteira inteira. Antes isto era
   um .sql gerado fora e colado no SQL Editor; agora é uma tela de admin.

   A reconciliação é por `conta`, nunca por nome: o export traz só o primeiro
   nome e há 84 primeiros nomes cobrindo 273 contas. Nome é rótulo, conta é
   identidade.

   O que a importação NÃO faz, por decisão: não cria cliente que ainda não
   existe, não exclui quem sumiu do arquivo e não transfere carteira entre
   assessores. Os três casos são sinalizados para alguém decidir. Um export
   incompleto não pode derrubar a carteira do escritório em silêncio. */

/* O BTG manda o saldo, nunca o movimento: não há como distinguir aporte novo
   de valorização de mercado olhando dois arquivos. Por isso a diferença nunca
   vira movimentação — viraria capitação líquida inflada pela alta da bolsa.
   Ela sobrescreve o saldo, entra no histórico e, quando não se explica pelo
   que o assessor lançou, gera alerta. */
const BTG_FAIXA_RENDIMENTO = 0.005; /* 0,5% por importação semanal. O CDI roda
   perto de 0,25% na semana; o dobro disso cabe a oscilação de renda variável
   sem virar ruído toda segunda-feira. */

/* Quanto o CRM acha que o cliente tem hoje, na mesma régua do arquivo.
   Quem já está na carteira compara pelo saldo administrado; quem ainda não
   entrou (prospect em captação) só tem o potencial declarado para comparar. */
function btgSaldoAtual(lead){
  if(valorInicialEmCarteira(lead) === null) return parseValor(lead.valorPotencial) || 0;
  return valorEmCarteira(lead);
}

/* Qual coluna carrega o valor inicial deste cliente. Não é sempre a mesma:
   cliente da base entra pelo `valorPotencial`, cliente novo entra pelo que foi
   efetivamente captado (`valorFechado`) — é o que valorInicialEmCarteira lê.
   Gravar sempre em valorPotencial deixaria a carteira de quem foi captado
   inalterada, e a importação pareceria funcionar sem funcionar. */
function btgCampoValor(lead){
  /* Cliente da base: o saldo tem coluna própria, e o patrimônio do
     formulário não é mais tocado pela importação. */
  if((lead.esteira || 'novo') === 'base') return 'saldoInicial';
  if(lead.ganho && parseValor(lead.valorFechado) !== null) return 'valorFechado';
  return 'valorPotencial';
}

/* O valor a gravar para que btgSaldoAtual(lead) passe a bater com o arquivo.
   Precisa descontar as movimentações: o que se grava é o valor INICIAL, e a
   carteira soma os lançamentos por cima. Gravar o saldo do BTG direto contaria
   os aportes duas vezes — e o assessor veria a carteira crescer sozinha toda
   segunda-feira. */
function btgValorAlvo(lead, saldoBTG){
  if(valorInicialEmCarteira(lead) === null) return saldoBTG;
  return Math.max(0, saldoBTG - saldoMovimentacoes(lead));
}

/* ---- A coluna do código do assessor ----
   Opcional: sem ela, tudo segue como antes — o assessor do arquivo vira
   aviso e ninguém troca de carteira. Com ela, o vínculo é aplicado, porque
   um código é intenção explícita, não um nome parecido.

   O cabeçalho é aceito em várias grafias porque quem monta a planilha
   escreve como lhe parece natural, e recusar o arquivo por causa de um
   acento seria a pior forma de ensinar o formato. */
const CHAVE_COL = (s) => String(s == null ? '' : s)
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[^a-z0-9]/g, '');

const COL_CODIGO = new Set([
  'codigoassessor','codigodoassessor','codassessor','coddoassessor',
  'idassessor','iddoassessor','assessorid','assessorcodigo','codigoaai',
]);

/* Devolve o nome EXATO do cabeçalho no arquivo, para poder ler a célula. */
function acharColunaCodigo(linhas){
  for(const c of Object.keys((linhas && linhas[0]) || {})){
    if(COL_CODIGO.has(CHAVE_COL(c))) return c;
  }
  return '';
}

/* Código como chave, não como texto: comparação sem maiúscula e sem espaço
   à toa, igual ao índice único do banco. */
const chaveCodigo = (s) => String(s == null ? '' : s).trim().toUpperCase();

/* A conta como chave de comparação, não como texto. Os dois exports do BTG
   trazem 9 dígitos com zeros à esquerda (009990002), mas basta alguém abrir o
   .xlsx no Excel e salvar para eles sumirem — e "9990002" deixaria de casar
   com "009990002" em silêncio: o cliente apareceria como conta nova. */
const chaveConta = (s) => String(s == null ? '' : s).trim().replace(/^0+(?=\d)/, '');

/* Só a Jornada e só quem não foi excluído. O card do especialista leva o nome
   composto como texto justamente para não disputar a conta com o cliente. */
function mapaPorConta(leads){
  const porConta = new Map();
  for(const l of (leads || [])){
    if(l.excluido) continue;
    if((l.funil || 'assessor') !== 'assessor') continue;
    const k = chaveConta(l.conta);
    if(k) porConta.set(k, l);
  }
  return porConta;
}

/* Compara o arquivo com a base e devolve o que mudou, sem gravar nada.
   Pura de propósito: a prévia mostra exatamente o que a aplicação vai fazer,
   porque é o mesmo resultado. */
function reconciliarBaseBTG(linhas, leads, users){
  const norm = (s) => String(s == null ? '' : s).trim();
  const porConta = mapaPorConta(leads);
  const nomeDoUsuario = (id) => {
    const u = (users || []).find(x => x.id === id);
    return u ? u.nome : '';
  };

  /* Quem é cada código. Só entra quem tem código cadastrado; duas pessoas
     com o mesmo código não acontecem, porque o banco tem índice único —
     mas se um dia acontecer, a primeira ganha e a segunda vira desconhecida,
     o que é melhor do que sortear a carteira. */
  const porCodigo = new Map();
  for(const u of (users || [])){
    const k = chaveCodigo(u.codigo);
    if(k && !porCodigo.has(k)) porCodigo.set(k, u);
  }
  const colCodigo = acharColunaCodigo(linhas);
  /* Coluna presente mas ninguém cadastrado: ler o código não levaria a
     lugar nenhum, e cada linha viraria "código desconhecido". Melhor
     ignorar a coluna e dizer isso uma vez só, no rodapé da prévia. */
  const usaCodigo = !!colCodigo && porCodigo.size > 0;

  const atualizacoes = [], novas = [], trocaAssessor = [], semConta = [];
  const codigosDesconhecidos = new Map();
  const vistas = new Set();

  for(const d of (linhas || [])){
    const conta = norm(d['Conta']);
    if(!conta){ semConta.push(d); continue; }
    vistas.add(chaveConta(conta));
    const nome = norm(d['Nome']);
    const saldoBTG = Math.round((parseFloat(d['Sob Gestão'] ?? d['PL Total']) || 0) * 100) / 100;
    const assessorBTG = norm(d['Assessor']);

    /* O código, quando a planilha traz. Célula vazia não é erro: é linha que
       não quis dizer nada sobre assessor, e o vínculo atual fica de pé. */
    const codigo = usaCodigo ? chaveCodigo(d[colCodigo]) : '';
    const donoPorCodigo = codigo ? porCodigo.get(codigo) : null;
    if(codigo && !donoPorCodigo){
      if(!codigosDesconhecidos.has(codigo)) codigosDesconhecidos.set(codigo, []);
      codigosDesconhecidos.get(codigo).push({ conta, nome });
    }

    const lead = porConta.get(chaveConta(conta));

    if(!lead){
      /* Com código reconhecido, a conta nova ganha card sozinha — é o mesmo
         código que autoriza transferência, agora autorizando também quem
         recebe a carteira que ainda não tinha registro nenhum. Sem código,
         segue a regra antiga: só a lista, cadastro é manual. */
      novas.push({ conta, nome, saldo: saldoBTG,
        assessor: (donoPorCodigo && donoPorCodigo.nome) || assessorBTG,
        codigo, donoPorCodigo });
      continue;
    }

    const saldoAtual = btgSaldoAtual(lead);
    const delta = Math.round((saldoBTG - saldoAtual) * 100) / 100;
    /* A faixa mede sobre o maior dos dois: evita divisão por zero e trata
       igual quem cresceu e quem encolheu. */
    const base = Math.max(saldoAtual, saldoBTG);
    const limiar = base * BTG_FAIXA_RENDIMENTO;
    /* As movimentações já estão dentro de saldoAtual, então `delta` é o que
       sobra DEPOIS de descontar o que o assessor lançou. Não há segunda
       subtração a fazer: um aporte de 300k lançado na semana deixa aqui só o
       rendimento dos dias entre o lançamento e o export. */
    const dentroDaFaixa = Math.abs(delta) <= limiar;
    const mudouSaldo = Math.abs(delta) >= 0.01;

    /* `campos` é o que a prévia mostra; `patch` é o que a gravação aplica.
       Os dois saem do mesmo lugar de propósito: se divergissem, a tela
       prometeria uma coisa e o banco receberia outra. */
    const campos = [], patch = {};
    const cmp = (campo, rotulo, atual, novo) => {
      if(norm(novo) && norm(atual) !== norm(novo)){
        campos.push({ rotulo, de: norm(atual), para: norm(novo) });
        patch[campo] = norm(novo);
      }
    };
    cmp('email', 'E-mail', lead.email, d['E-Mail Comunicação']);
    cmp('profissao', 'Profissão', lead.profissao, d['Profissão / Setor']);

    /* O padrão do nome, garantido a cada importação.

       Duas coisas acontecem aqui, e nenhuma delas encurta um nome:

       1. LIMPEZA. A base carregada trazia a conta colada no texto
          ("Silvana · 4417029") porque não havia coluna para ela. Agora há, e a
          tela compõe — o texto colado viraria conta repetida. A importação
          descola.

       2. COMPLEMENTO. Se o arquivo trouxer um nome MAIOR do que o nosso, ele
          completa: é assim que a correção em bloco vai acontecer no dia em que
          o BTG mandar o export com sobrenome.

       O que ela nunca faz é ENCURTAR. Hoje o arquivo traz só o primeiro nome:
       adotá-lo cegamente apagaria, toda semana, exatamente os sobrenomes que
       este padrão existe para ter. Por isso a comparação é por prefixo — o
       arquivo só ganha quando acrescenta. */
    const nomeLimpo = nomeSemConta(lead.cliente, conta);
    const arquivoAmplia = nome && nome.length > nomeLimpo.length
      && nome.toLowerCase().startsWith(nomeLimpo.toLowerCase());
    const nomeAlvo = arquivoAmplia ? nome : nomeLimpo;
    if(nomeAlvo && nomeAlvo !== (lead.cliente || '').trim()){
      campos.push({ rotulo:'Nome', de: (lead.cliente || '').trim() || '—', para: nomeAlvo });
      patch.cliente = nomeAlvo;
    }

    const segmentoNovo = segmentoPorPatrimonio(saldoBTG);
    if(segmentoNovo && segmentoNovo !== lead.segmento){
      campos.push({ rotulo:'Segmento', de: lead.segmento || '—', para: segmentoNovo });
      patch.segmento = segmentoNovo;
    }

    const respAtual = nomeDoUsuario(lead.responsavelId);

    /* CÓDIGO x NOME — a diferença é o que se faz com a divergência.

       O código foi digitado por quem monta a planilha, olhando a tela de
       Equipe: é uma instrução, e a importação a cumpre — grava o vínculo e
       registra no histórico do cliente.

       O nome vem do export do BTG, e continua valendo a regra antiga: vira
       aviso, nunca transferência. "RAFAEL" pode ser dois Rafaéis, e mover
       carteira mexe em comissão e em relacionamento. */
    let vinculoAssessor = null;
    if(donoPorCodigo && donoPorCodigo.id !== lead.responsavelId){
      vinculoAssessor = { de: respAtual || '—', para: donoPorCodigo.nome, id: donoPorCodigo.id, codigo };
      campos.push({ rotulo:'Assessor', de: respAtual || '—', para: donoPorCodigo.nome });
      patch.responsavelId = donoPorCodigo.id;
    }

    /* Só reclama do nome quando não houve código mandando: com código, o
       nome do BTG já foi respondido, e o aviso seria ruído. */
    const divergeAssessor = !donoPorCodigo && !!assessorBTG && !!respAtual
      && assessorBTG.toUpperCase() !== respAtual.toUpperCase();
    if(divergeAssessor) trocaAssessor.push({ conta, nome, lead, de: respAtual, para: assessorBTG });

    if(mudouSaldo || campos.length){
      atualizacoes.push({
        conta, nome, lead,
        saldoAtual, saldoBTG, delta, limiar,
        /* Fora da faixa e sem lançamento que explique: é isto que vira alerta
           no card e entra no resumo do admin. */
        alerta: mudouSaldo && !dentroDaFaixa,
        segmento: segmentoNovo,
        campoValor: btgCampoValor(lead),
        valorAlvo: btgValorAlvo(lead, saldoBTG),
        vinculoAssessor,
        campos, patch,
      });
    }
  }

  /* Quem a base tem e o arquivo não trouxe. Não se mexe: uma linha faltando
     por erro de export não pode apagar carteira. */
  const ausentes = [];
  for(const [chave, lead] of porConta){
    if(!vistas.has(chave)) ausentes.push({ conta: (lead.conta || '').trim(), lead, saldo: btgSaldoAtual(lead) });
  }

  const comAlerta = atualizacoes.filter(a => a.alerta);
  const desconhecidos = [...codigosDesconhecidos.entries()]
    .map(([codigo, contas]) => ({ codigo, contas }));
  return {
    tipo: 'onshore',
    atualizacoes, novas, ausentes, trocaAssessor, conflitos: [], semConta,
    /* A prévia precisa saber por que a coluna não foi usada: "tem coluna e
       não fez nada" é exatamente o tipo de silêncio que esconde erro. */
    colunaCodigo: colCodigo, usaCodigo, codigosDesconhecidos: desconhecidos,
    resumo: {
      linhas: (linhas || []).length,
      conciliadas: vistas.size - novas.length,
      alteradas: atualizacoes.length,
      alertas: comAlerta.length,
      novas: novas.length,
      novasComCodigo: novas.filter(n => n.donoPorCodigo).length,
      ausentes: ausentes.length,
      trocas: trocaAssessor.length,
      vinculosAssessor: atualizacoes.filter(a => a.vinculoAssessor).length,
      deltaTotal: atualizacoes.reduce((a, x) => a + x.delta, 0),
    },
  };
}

/* ---- Export offshore (AuC) ----
   Outro relatório do BTG, outra forma: uma linha por conta offshore, com a
   conta onshore do mesmo cliente ao lado e o saldo em dólar. Não traz
   assessor, e não precisa: a conta onshore leva ao cliente, e o cliente já
   sabe de quem é. O arquivo não tem voz sobre a carteira de ninguém.

   O resto é a mesma disciplina do onshore — não cria cliente, não mexe em
   quem sumiu, saldo sobrescreve e nunca vira movimentação, faixa de 0,5%. */

/* A mesma régua de btgSaldoAtual, do lado de fora. */
function btgSaldoOffshoreAtual(lead){
  if(valorInicialOffshore(lead) === null) return parseValor(lead.valorOffshore) || 0;
  return valorEmCarteiraOffshore(lead);
}

/* A mesma armadilha de btgValorAlvo: grava-se o valor INICIAL, e as
   movimentações offshore somam por cima. Aqui não há a segunda armadilha —
   valorInicialOffshore lê sempre valorOffshore, seja cliente da base ou
   captado, então a coluna é uma só. */
/* Onde o saldo do AuC é gravado: quem já é carteira (base ou captado)
   recebe no saldo offshore; prospect ainda não captado recebe no declarado,
   que é o que ele é. Gravar sempre no declarado deixaria a carteira intacta
   — a mesma armadilha de btgCampoValor. */
function btgCampoValorOffshore(lead){
  return ((lead.esteira || 'novo') === 'base' || lead.ganho) ? 'saldoInicialOffshore' : 'valorOffshore';
}

function btgValorAlvoOffshore(lead, saldoBTG){
  if(valorInicialOffshore(lead) === null) return saldoBTG;
  return Math.max(0, saldoBTG - saldoMovimentacoes(lead, null, 'offshore'));
}

/* A coluna Data vem como número de série do Excel (46274 = 09/09/2026). */
const dataDoExcel = (v) => {
  const n = parseFloat(v);
  if(!isFinite(n) || n < 1) return '';
  return new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 864e5).toISOString().slice(0, 10);
};

function reconciliarOffshoreBTG(linhas, leads){
  const norm = (s) => String(s == null ? '' : s).trim();
  const r2 = (n) => Math.round(n * 100) / 100;
  const porConta = mapaPorConta(leads);

  /* Quem já tem cada conta offshore. A coluna tem índice único, e gravar a
     mesma conta em dois clientes não derrubaria só aquela linha: derrubaria
     o lote inteiro no banco. */
  const donoOffshore = new Map();
  for(const l of porConta.values()){
    const k = norm(l.contaOffshore).toUpperCase();
    if(k) donoOffshore.set(k, l);
  }

  /* Agrupa pela onshore antes de reconciliar. Duas contas offshore na mesma
     onshore não aparecem hoje; se aparecerem, aplicar uma depois da outra
     faria a segunda apagar a primeira sem ninguém ver. */
  const grupos = new Map(), semConta = [];
  let lidas = 0;
  for(const d of (linhas || [])){
    const contaOn = norm(d['Conta Onshore']), contaOff = norm(d['Conta Offshore']).toUpperCase();
    /* O relatório termina com uma linha de rodapé ("Filtros aplicados: …")
       na coluna Data. Não é conta sem número: é o relatório descrevendo a
       si mesmo, e contá-la como linha ignorada assustaria à toa. */
    if(!contaOn && !contaOff) continue;
    lidas++;
    if(!contaOn){ semConta.push(d); continue; }
    const k = chaveConta(contaOn);
    if(!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push({ d, contaOn, contaOff });
  }

  const atualizacoes = [], novas = [], conflitos = [];
  const vistos = new Set(), datas = new Set();

  for(const [k, itens] of grupos){
    const { d, contaOn, contaOff } = itens[0];
    const nome = norm(d['Cliente']);
    const saldoBTG = r2(parseFloat(d['Total AuC (USD)']) || 0);
    const data = dataDoExcel(d['Data']);
    if(data) datas.add(data);
    const lead = porConta.get(k);

    /* Conta onshore que a base não tem — hoje, contas zeradas no Brasil que
       ficaram fora da carga. Não cria, pelo mesmo motivo do onshore: esteira
       e etapa precisam de quem conhece o caso. Cadastrado o cliente com essa
       conta, a importação seguinte faz o vínculo sozinha. */
    if(!lead){ novas.push({ conta: contaOn, contaOffshore: contaOff, nome, saldo: saldoBTG }); continue; }

    vistos.add(lead.id);
    if(itens.length > 1){
      conflitos.push({ conta: (lead.conta || contaOn).trim(), lead, nome,
        motivo: itens.length + ' contas offshore na mesma onshore: ' + itens.map(i => i.contaOff).join(', ') });
      continue;
    }
    const dono = donoOffshore.get(contaOff);
    if(dono && dono.id !== lead.id){
      conflitos.push({ conta: (lead.conta || contaOn).trim(), lead, nome,
        motivo: contaOff + ' já está ligada a ' + nomeCliente(dono) });
      continue;
    }

    const contaAtual = norm(lead.contaOffshore).toUpperCase();
    /* Primeira vez que esta conta aparece ligada ao cliente. Sair de zero não
       é divergência, é o começo do registro: sem esta distinção, a primeira
       importação acenderia um alerta em cada um dos clientes offshore. */
    const vinculo = !contaAtual;

    const saldoAtual = btgSaldoOffshoreAtual(lead);
    const delta = r2(saldoBTG - saldoAtual);
    const base = Math.max(saldoAtual, saldoBTG);
    const limiar = base * BTG_FAIXA_RENDIMENTO;
    const dentroDaFaixa = Math.abs(delta) <= limiar;
    const mudouSaldo = Math.abs(delta) >= 0.01;

    const campos = [], patch = {};
    if(contaOff && contaOff !== contaAtual){
      campos.push({ rotulo:'Conta offshore', de: contaAtual, para: contaOff });
      patch.contaOffshore = contaOff;
    }

    if(mudouSaldo || campos.length){
      atualizacoes.push({
        conta: (lead.conta || contaOn).trim(), contaOffshore: contaOff, nome, lead,
        saldoAtual, saldoBTG, delta, limiar, vinculo,
        alerta: !vinculo && mudouSaldo && !dentroDaFaixa && base >= OFFSHORE_PISO_USD,
        campoValor: btgCampoValorOffshore(lead),
        valorAlvo: btgValorAlvoOffshore(lead, saldoBTG),
        campos, patch,
      });
    }
  }

  /* Quem já tinha conta offshore ligada e não veio nesta semana. Mesmo
     motivo do onshore: um export truncado não pode apagar carteira. */
  const ausentes = [];
  for(const lead of porConta.values()){
    if(norm(lead.contaOffshore) && !vistos.has(lead.id))
      ausentes.push({ conta: (lead.conta || '').trim(), lead, saldo: btgSaldoOffshoreAtual(lead) });
  }

  return {
    tipo: 'offshore',
    atualizacoes, novas, ausentes, trocaAssessor: [], conflitos, semConta,
    resumo: {
      linhas: lidas,
      conciliadas: vistos.size,
      alteradas: atualizacoes.length,
      alertas: atualizacoes.filter(a => a.alerta).length,
      vinculos: atualizacoes.filter(a => a.vinculo).length,
      novas: novas.length,
      ausentes: ausentes.length,
      trocas: 0,
      conflitos: conflitos.length,
      deltaTotal: atualizacoes.reduce((a, x) => a + x.delta, 0),
      dataPosicao: [...datas].sort().pop() || '',
    },
  };
}

/* Leitor de xlsx no navegador — mesma lógica do gera-import.js, que lê o zip
   e o XML à mão em vez de trazer uma biblioteca. Aqui o motivo é outro e mais
   forte: o app é um arquivo só, sem build, e cada CDN a mais é uma dependência
   externa no caminho de uma tela que mexe na carteira inteira.

   O inflate vem do próprio navegador (DecompressionStream), então não há
   implementação de deflate escrita à mão para manter. */
async function lerXlsx(arrayBuffer){
  const buf = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);
  const td = new TextDecoder('utf-8');
  const arqs = {};
  let i = 0;
  while(i < buf.length - 4){
    if(dv.getUint32(i, true) !== 0x04034b50){ i++; continue; }
    const metodo   = dv.getUint16(i + 8,  true);
    const compTam  = dv.getUint32(i + 18, true);
    const nomeTam  = dv.getUint16(i + 26, true);
    const extraTam = dv.getUint16(i + 28, true);
    const nome = td.decode(buf.subarray(i + 30, i + 30 + nomeTam));
    const ini = i + 30 + nomeTam + extraTam;
    if(compTam > 0){
      const dados = buf.subarray(ini, ini + compTam);
      arqs[nome] = metodo === 8 ? await inflarRaw(dados) : dados;
      i = ini + compTam;
    } else { i = ini; }
  }
  /* Sem nenhuma entrada de zip, o arquivo não é um .xlsx — um CSV renomeado,
     um PDF, um export corrompido. Dizer isso em português poupa quem opera
     de decifrar "xl/worksheets/sheet1.xml". */
  if(!Object.keys(arqs).length){
    throw new Error('Este arquivo não é uma planilha .xlsx. Exporte do BTG em Excel (.xlsx) e envie de novo.');
  }
  return montarLinhas(arqs, td);
}

async function inflarRaw(dados){
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('Este navegador não sabe descompactar o arquivo. Use Chrome, Edge ou Firefox atualizados.');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([dados]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

const desescaparXml = (s) => String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>')
  .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');

/* O BTG usa dois geradores de planilha. O da carteira escreve o XML
   clássico: sharedStrings, e cada célula com o próprio endereço (r="B7"). O
   do AuC offshore escreve com prefixo de namespace (<x:row>, <x:c>), texto
   inline, célula SEM endereço e as vazias fechadas em si mesmas
   (<x:c s="9" />). Ler só o primeiro formato devolvia "planilha vazia" no
   segundo; ler o segundo sem contar as vazias deslocaria as colunas — o
   total cairia na coluna de produtos. Por isso a posição vem do endereço
   quando existe, e da contagem quando não. */
const semPrefixoXml = (s) => s.replace(/<(\/?)[A-Za-z][\w.-]*:/g, '<$1');
const colunaIndice = (letras) => [...letras].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;

function montarLinhas(arqs, td){
  const ss = arqs['xl/sharedStrings.xml'] ? semPrefixoXml(td.decode(arqs['xl/sharedStrings.xml'])) : '';
  const strs = [];
  for(const m of ss.matchAll(/<si>([\s\S]*?)<\/si>/g)){
    let t = '';
    for(const tm of m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)) t += tm[1];
    strs.push(desescaparXml(t));
  }
  const alvo = arqs['xl/worksheets/sheet1.xml'];
  if(!alvo) throw new Error('A planilha não tem uma primeira aba legível (xl/worksheets/sheet1.xml).');
  const sh = semPrefixoXml(td.decode(alvo));
  const linhas = [];
  for(const rm of sh.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)){
    const cel = {};
    let pos = -1;
    for(const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const attrs = cm[1], corpo = cm[2] || '';
      const ref = (attrs.match(/\br="([A-Z]+)\d+"/) || [])[1];
      pos = ref ? colunaIndice(ref) : pos + 1;
      const tipo = (attrs.match(/\bt="([^"]+)"/) || [])[1];
      let v = (corpo.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
      if(tipo === 'inlineStr') v = desescaparXml((corpo.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1] || '');
      else if(tipo === 's') v = strs[+v];
      if(v !== undefined) cel[pos] = v;
    }
    linhas.push(cel);
  }
  if(!linhas.length) throw new Error('A planilha está vazia.');
  const cab = linhas[0], cols = Object.keys(cab);
  return linhas.slice(1).map((l) => {
    const o = {};
    for(const c of cols) o[String(cab[c]).trim()] = (l[c] === undefined ? '' : String(l[c]).trim());
    return o;
  }).filter(o => Object.values(o).some(v => v !== ''));
}

/* Dois exports passam pela mesma tela, e ela reconhece qual é pelas colunas:
   quem sobe o arquivo não precisa dizer. Conferir na entrada evita a falha
   silenciosa clássica: planilha errada, tudo "sem alteração", ninguém nota. */
const BTG_COLUNAS = {
  onshore:  ['Conta', 'Nome'],
  offshore: ['Conta Onshore', 'Conta Offshore', 'Total AuC (USD)'],
};
/* O BTG já trocou o nome dessa coluna uma vez (Sob Gestão -> PL Total).
   Aceitar as duas grafias evita quebrar de novo se um export antigo voltar
   a circular, e cobre a planilha atual sem exigir edição manual. */
const COL_SALDO_ONSHORE = ['Sob Gestão', 'PL Total'];
/* A coluna de código do assessor NÃO entra nesta lista: ela é opcional, e
   exigi-la quebraria o export do BTG como ele vem. */
function identificarExport(linhas){
  const cols = Object.keys((linhas && linhas[0]) || {});
  const tipo = cols.includes('Conta Offshore') ? 'offshore' : 'onshore';
  const faltando = BTG_COLUNAS[tipo].filter(c => !cols.includes(c));
  if(tipo === 'onshore' && !COL_SALDO_ONSHORE.some(c => cols.includes(c))){
    faltando.push(COL_SALDO_ONSHORE.join(' ou '));
  }
  if(faltando.length){
    throw new Error('A planilha não tem ' + faltando.join(', ')
      + '. Colunas encontradas: ' + (cols.join(', ') || 'nenhuma') + '.');
  }
  return tipo;
}

/* SLA entre etapas, em dias, conforme o processo comercial. */
const SLA_DIAS = { 'R1':3, 'R2':7, 'R2.1':7, 'R3':7 };

/* O funil importa: 'R1' se chama "Apresentação institucional" na Jornada e
   continua sendo só "R1" no funil de produto. Sem ele, a busca acha sempre a
   primeira lista e o especialista leria o vocabulário do assessor. */
function stageInfo(name, funil){
  const lista = funil === 'especialista' ? STAGES_ESPECIALISTA : STAGES_ASSESSOR;
  const outra = funil === 'especialista' ? STAGES_ASSESSOR : STAGES_ESPECIALISTA;
  return lista.find(s => s.key === name)
      || outra.find(s => s.key === name)
      || lista[0];
}
/* Código da reunião: cabe em tabela, gráfico e coluna recolhida. */
const etapaCurta = (name, funil) => stageInfo(name, funil).curto || name;
/* Nome por extenso: código mais o que se apresenta naquela reunião. Onde os
   dois são iguais — Prospect, Negociando — repetir seria ruído. */
function etapaLonga(name, funil){
  const s = stageInfo(name, funil);
  const curto = s.curto || name;
  return s.label && s.label !== curto ? curto + ' · ' + s.label : curto;
}

const PERIODO_LABEL = {
  all:'Todo o período', mes:'Este mês', '30':'Últimos 30 dias', '60':'Últimos 60 dias',
  '90':'Últimos 90 dias', '365':'Últimos 12 meses',
};
/* Frase que descreve o recorte aplicado, para o cabeçalho impresso. */
function descreverRecorte(f, users){
  const partes = [periodoLabel(f)];
  const nomeDe = (id) => (users.find(u => u.id === id) || {}).nome;
  if(f && f.assessor && f.assessor !== 'all')
    partes.push('assessor: ' + (nomeDe(f.assessor) || '—'));
  if(f && f.produtos && f.produtos.length)
    partes.push('produto: ' + f.produtos.join(' e '));
  if(f && f.especialista && f.especialista !== 'all')
    partes.push('especialista: ' + (nomeDe(f.especialista) || '—'));
  if(f && f.temperatura && f.temperatura.length)
    partes.push('temperatura: ' + f.temperatura
      .map(k => k === 'sem' ? 'sem classificação' : (temperaturaInfo(k) || { label:k }).label.toLowerCase())
      .join(' e '));
  if(partes.length === 1) partes.push('todos os assessores e produtos');
  return partes.join(' · ');
}

function periodoLabel(f){
  /* Aceita tanto a chave antiga quanto o objeto de filtros, para o cabeçalho
     impresso descrever o intervalo escolhido à mão. */
  if(typeof f === 'string') return PERIODO_LABEL[f] || PERIODO_LABEL.all;
  if(!f) return PERIODO_LABEL.all;
  if(f.periodo === 'custom'){
    if(f.de && f.ate) return fmtDate(f.de) + ' a ' + fmtDate(f.ate);
    if(f.de) return 'a partir de ' + fmtDate(f.de);
    if(f.ate) return 'até ' + fmtDate(f.ate);
    return PERIODO_LABEL.all;
  }
  /* No papel, "Este mês" não diz qual: o relatório impresso em setembro e
     relido em outubro tem de dizer que é de setembro. */
  if(f.periodo === 'mes'){
    const s = new Date().toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  return PERIODO_LABEL[f.periodo] || PERIODO_LABEL.all;
}

/* Trajeto permitido, por funil. O destino depende também da esteira:
   cliente da base pula o institucional e entra direto na R2. */
const FLOW_ASSESSOR = {
  'Cliente Novo':   ['R1'],
  'R1':             ['R2'],
  'R2':             ['R2.1', 'R3'],
  'R2.1':           ['R3'],
  'R3':             ['R4'],
  /* Terminal para o assessor: só a conclusão dos especialistas leva daqui
     para Jornada Concluída, e isso acontece automaticamente. */
  'R4':             [],
  'Jornada Concluída': [],
};
/* Trajeto do especialista: o mesmo do processo comercial original, onde R1 e R2
   podem ir direto para Negociando ou Contato Futuro. */
const FLOW_ESPECIALISTA = {
  'Cliente Novo':   ['R1'],
  'R1':             ['R2', 'Negociando', 'Contato Futuro'],
  'R2':             ['Negociando', 'Contato Futuro'],
  'Negociando':     ['Contato Futuro'],
  'Contato Futuro': ['Negociando'],
};

/* Recebe o lead inteiro, não só a etapa: a esteira altera a saída de
   "Cliente Novo", e o funil decide qual mapa consultar. */
function allowedMoves(lead){
  if(!lead) return [];
  if(lead.funil === 'especialista') return FLOW_ESPECIALISTA[lead.etapa] || [];
  if(lead.etapa === 'Cliente Novo') return lead.esteira === 'base' ? ['R2'] : ['R1'];
  return FLOW_ASSESSOR[lead.etapa] || [];
}
function canMove(lead, to){ return allowedMoves(lead).indexOf(to) !== -1; }
/* Destino principal: usado onde só cabe uma ação, como o botão do card. */
function nextStage(lead){ return allowedMoves(lead)[0] || null; }

/* Dias restantes no SLA da etapa atual. Negativo significa atrasado.
   null quando a etapa não tem prazo definido no processo. */
function slaRestante(lead){
  const prazo = SLA_DIAS[lead.etapa];
  if(!prazo || !lead.etapaDesde) return null;
  const decorridos = Math.floor((Date.now() - lead.etapaDesde) / 86400000);
  return prazo - decorridos;
}

function listarEtapas(lista){
  if(lista.length === 0) return 'nenhuma etapa';
  if(lista.length === 1) return '"' + lista[0] + '"';
  return '"' + lista.slice(0,-1).join('", "') + '" ou "' + lista[lista.length-1] + '"';
}

function uid(prefix){ return (prefix||'id') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y.slice(2)}`;
}
/* Data local, não UTC. toISOString() adianta o dia a partir das 21h no horário de Brasília,
   o que fazia contatos do mesmo dia aparecerem como atrasados. */
function toISODate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayISO(){ return toISODate(new Date()); }
function tsToISODate(ts){ return toISODate(new Date(ts)); }
function parseValor(v){
  if(v===null || v===undefined || v==='') return null;
  const n = Number(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));
  return isNaN(n) ? null : n;
}
/* ---- Fronteira de dinheiro ----
   O formulário aceita o que a pessoa digita ("2.500.000", "R$ 1,5"), o banco
   guarda numeric. A conversão fica só aqui: nenhuma tela precisa saber que
   os dois formatos existem. */

/* parseValor devolve 0 quando não há dígito nenhum ('abc'), o que era
   tolerável enquanto a coluna era texto e ninguém somava do lado do banco.
   Gravar esse 0 em numeric criaria um patrimônio zero silencioso — pior do
   que campo vazio, porque entra nos indicadores como se fosse informado. */
function valorParaBanco(v){
  if(v === null || v === undefined || String(v).trim() === '') return null;
  if(!/\d/.test(String(v))) return null;
  return parseValor(v);
}

/* numeric volta como '2500000.00'; devolver isso ao input mostraria os
   centavos zerados que a pessoa nunca digitou. */
function valorDoBanco(v){
  if(v === null || v === undefined || v === '') return '';
  const n = Number(v);
  return isNaN(n) ? '' : String(n);
}

function fmtBRL(n){
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}
/* Dólar escrito à brasileira — "US$ 380.000,00" — porque quem lê a tela lê em
   português. O símbolo muda; a pontuação, não. */
function fmtUSD(n){
  return 'US$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}
function taskUrgency(lead){
  if(!lead.proximoContato) return 'none';
  if(lead.proximoContato < todayISO()) return 'late';
  if(lead.proximoContato === todayISO()) return 'today';
  return 'ok';
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

const configurado = !SUPABASE_URL.startsWith('COLE_AQUI') && !SUPABASE_ANON_KEY.startsWith('COLE_AQUI');

/* A biblioteca vem de CDN e pode falhar (rede, bloqueador, offline).
   Sem esta checagem, chamar createClient num objeto inexistente derruba
   o módulo antes do React montar — e a tela fica em branco, sem pista. */
const libPronta = typeof window.supabase !== 'undefined' && !!window.supabase.createClient;

/* Trocar URL e chave de lugar é um engano fácil, e createClient com um
   endereço inválido lança antes de qualquer tela existir. Detectar aqui
   permite explicar o problema em vez de morrer em branco. */
const pareceChave = (v) => /^(sb_publishable_|sb_secret_|eyJ)/.test(v.trim());
const invertido = pareceChave(SUPABASE_URL) || /^https?:\/\//.test(SUPABASE_ANON_KEY.trim());

/* A service_role ignora a Row Level Security inteira. Colada aqui, ela fica
   à vista de qualquer um que abra o HTML e entrega a carteira toda da
   empresa a quem souber olhar. O painel do Supabase mostra as duas chaves
   lado a lado, então a troca é um engano fácil — e silencioso, porque o app
   funcionaria normalmente. Recusar é a única forma de o erro aparecer. */
const chaveSecreta = /^(sb_secret_|service_role)/.test(SUPABASE_ANON_KEY.trim())
  || /"role"\s*:\s*"service_role"/.test(SUPABASE_ANON_KEY);

/* O painel do Supabase mostra a URL em telas diferentes, algumas já com
   /rest/v1 ou barra no fim. O gateway recusa qualquer caminho extra, então
   reduzimos ao domínio antes de criar o cliente. */
function normalizarUrl(u){
  try{ return new URL(u.trim()).origin; }
  catch(e){ return u.trim().replace(/\/+$/,''); }
}

let sb = null;
let erroCliente = '';
if(configurado && libPronta && !invertido && !chaveSecreta){
  try{
    sb = window.supabase.createClient(normalizarUrl(SUPABASE_URL), SUPABASE_ANON_KEY.trim());
  }catch(e){
    console.error('createClient falhou:', e);
    erroCliente = e.message || String(e);
  }
}

/* O banco usa snake_case; o app inteiro já fala camelCase. Estes dois tradutores
   isolam a diferença para que nenhum componente de tela precise mudar. */
function leadFromRow(r){
  return {
    id: r.id, cliente: r.cliente || '', oportunidade: r.oportunidade || '',
    telefone: r.telefone || '', email: r.email || '', observacoes: r.observacoes || '',
    responsavelId: r.responsavel_id || '',
    ultimoContato: r.ultimo_contato || '', proximoContato: r.proximo_contato || '',
    etapa: r.etapa, produtoServico: r.produto_servico || '',
    valorPotencial: valorDoBanco(r.valor_potencial), valorFechado: valorDoBanco(r.valor_fechado),
    /* Saldo sob gestão do cliente da base, separado do patrimônio. */
    saldoInicial: valorDoBanco(r.saldo_inicial),
    /* O mesmo, lá fora: saldo offshore sob gestão, em dólar. */
    saldoInicialOffshore: valorDoBanco(r.saldo_inicial_offshore),
    /* Cliente da base: a captação nova em negociação, em reais. */
    valorEmCaptacao: valorDoBanco(r.valor_em_captacao),
    /* Em que custódia — e por isso em que moeda — está o valor acima. */
    captacaoCustodia: r.captacao_custodia || '',
    /* Em dólar, sempre. A conversão para real acontece na leitura, pela
       cotação que o admin mantém — nunca na gravação. */
    valorOffshore: valorDoBanco(r.valor_offshore),
    perdido: !!r.perdido, motivoPerda: r.motivo_perda || '',
    perdidoEm: r.perdido_em ? new Date(r.perdido_em).getTime() : null,
    ganho: !!r.ganho, ganhoEm: r.ganho_em ? new Date(r.ganho_em).getTime() : null,
    excluido: !!r.excluido, excluidoEm: r.excluido_em ? new Date(r.excluido_em).getTime() : null,
    historico: r.historico || [], atividades: r.atividades || [], alertas: r.alertas || [],
    briefing: r.briefing || {}, movimentacoes: r.movimentacoes || [],
    funil: r.funil || 'assessor', segmento: r.segmento || 'Advisory', esteira: r.esteira || 'novo',
    origem: r.origem || '', profissao: r.profissao || '', bancoAtual: r.banco_atual || '',
    tipoPessoa: r.tipo_pessoa || 'PF', contatoNome: r.contato_nome || '', contatoCargo: r.contato_cargo || '',
    /* Chave de reconciliação da atualização semanal da base. Sem ela nos dois
       tradutores, o assessor digita a conta na ficha e ela some no recarregar. */
    conta: r.conta || '',
    /* A conta do outro lado. Não é chave de nada — o vínculo vem pela conta
       onshore — mas é o número que o assessor precisa para falar com o BTG
       sobre o dinheiro lá fora. */
    contaOffshore: r.conta_offshore || '',
    nascimento: r.nascimento || '',
    grupoFamiliar: r.grupo_familiar || '',
    temperatura: r.temperatura || '',
    patrimonio: r.patrimonio || '', renda: r.renda || '', estadoCivil: r.estado_civil || '',
    produto: r.produto || '', origemLeadId: r.origem_lead_id || null,
    pautas: r.pautas || {},
    etapaDesde: r.etapa_desde ? new Date(r.etapa_desde).getTime() : null,
    criadoEm: r.criado_em ? new Date(r.criado_em).getTime() : Date.now(),
    atualizadoEm: r.atualizado_em ? new Date(r.atualizado_em).getTime() : 0,
  };
}
const ts = (ms) => ms ? new Date(ms).toISOString() : null;
function leadToRow(l){
  return {
    id: l.id, cliente: l.cliente || '', oportunidade: l.oportunidade || '',
    telefone: l.telefone || '', email: l.email || '', observacoes: l.observacoes || '',
    responsavel_id: l.responsavelId || null,
    ultimo_contato: l.ultimoContato || null, proximo_contato: l.proximoContato || null,
    etapa: l.etapa, produto_servico: l.produtoServico || '',
    valor_potencial: valorParaBanco(l.valorPotencial), valor_fechado: valorParaBanco(l.valorFechado),
    saldo_inicial: valorParaBanco(l.saldoInicial),
    saldo_inicial_offshore: valorParaBanco(l.saldoInicialOffshore),
    valor_em_captacao: valorParaBanco(l.valorEmCaptacao),
    /* Só existe com captação aberta: sem valor, a custódia não diz nada. */
    captacao_custodia: parseValor(l.valorEmCaptacao) ? custodiaCaptacao(l) : null,
    valor_offshore: valorParaBanco(l.valorOffshore),
    perdido: !!l.perdido, motivo_perda: l.motivoPerda || '', perdido_em: ts(l.perdidoEm),
    ganho: !!l.ganho, ganho_em: ts(l.ganhoEm),
    excluido: !!l.excluido, excluido_em: ts(l.excluidoEm),
    historico: l.historico || [], atividades: l.atividades || [], alertas: l.alertas || [],
    briefing: l.briefing || {}, movimentacoes: l.movimentacoes || [],
    funil: l.funil || 'assessor', segmento: l.segmento || 'Advisory', esteira: l.esteira || 'novo',
    origem: l.origem || null, profissao: l.profissao || null, banco_atual: l.bancoAtual || null,
    tipo_pessoa: l.tipoPessoa || 'PF', contato_nome: l.contatoNome || null, contato_cargo: l.contatoCargo || null,
    /* null e não '': a coluna tem índice único parcial, e vários '' colidiriam
       entre si — quem não tem conta precisa ficar nulo para ficar de fora. */
    conta: (l.conta || '').trim() || null,
    /* Mesmo motivo: índice único parcial. */
    conta_offshore: (l.contaOffshore || '').trim().toUpperCase() || null,
    nascimento: l.nascimento || null,
    grupo_familiar: (l.grupoFamiliar || '').trim() || null,
    temperatura: l.temperatura || null,
    patrimonio: l.patrimonio || null, renda: l.renda || null, estado_civil: l.estadoCivil || null,
    produto: l.produto || null, origem_lead_id: l.origemLeadId || null,
    pautas: l.pautas || {},
    etapa_desde: ts(l.etapaDesde) || new Date().toISOString(),
    criado_em: ts(l.criadoEm) || new Date().toISOString(),
    atualizado_em: new Date().toISOString(),
  };
}

async function fetchLeads(){
  if(MODO_DEMO) return demoStore.leads.map(l => ({ ...l }));
  const { data, error } = await sb.from('leads').select('*');
  if(error) throw error;
  return (data || []).map(leadFromRow);
}

/* Cada mutação grava só a linha daquele negócio. Dois vendedores editando leads
   diferentes deixam de colidir: a sobrescrita do pipeline inteiro, que o
   armazenamento em bloco permitia, não é mais possível. */
/* Gravação em lote, para a atualização semanal da base. Uma chamada por
   cliente faria centenas de idas ao servidor numa tela só; o Supabase aceita
   o array direto. Em blocos porque um upsert de 500 linhas estoura o limite
   de tamanho da requisição. */
async function upsertLeads(lista){
  if(!lista.length) return;
  if(MODO_DEMO){
    for(const lead of lista){
      const i = demoStore.leads.findIndex(l => l.id === lead.id);
      if(i >= 0) demoStore.leads[i] = { ...lead }; else demoStore.leads.push({ ...lead });
    }
    return;
  }
  const BLOCO = 100;
  for(let i = 0; i < lista.length; i += BLOCO){
    const { error } = await sb.from('leads').upsert(lista.slice(i, i + BLOCO).map(leadToRow));
    if(error) throw error;
  }
}

async function upsertLead(lead){
  if(MODO_DEMO){
    const i = demoStore.leads.findIndex(l => l.id === lead.id);
    if(i >= 0) demoStore.leads[i] = { ...lead }; else demoStore.leads.push({ ...lead });
    return;
  }
  const { error } = await sb.from('leads').upsert(leadToRow(lead));
  if(error) throw error;
}

/* A cotação mora numa tabela de configuração de uma linha só. Poderia ser
   uma constante no arquivo, mas então trocá-la exigiria republicar o CRM —
   e quem acompanha o câmbio é o escritório, não quem edita o código. */
async function fetchConfig(chave){
  if(MODO_DEMO) return demoStore.config[chave] ? { ...demoStore.config[chave] } : null;
  const { data, error } = await sb.from('configuracoes').select('*').eq('chave', chave).maybeSingle();
  if(error) throw error;
  if(!data) return null;
  return {
    valor: Number(data.valor),
    atualizadoEm: data.atualizado_em ? new Date(data.atualizado_em).getTime() : null,
    atualizadoPor: data.atualizado_por || null,
  };
}

async function upsertConfig(chave, valor){
  if(MODO_DEMO){
    demoStore.config[chave] = { valor, atualizadoEm: Date.now(), atualizadoPor: null };
    return;
  }
  const { error } = await sb.from('configuracoes').upsert({
    chave, valor: String(valor), atualizado_em: new Date().toISOString(),
  });
  if(error) throw error;
}

/* O codigo do assessor mora em perfis, tabela do portal, que o CRM nao
   enxerga. A funcao codigos_assessores devolve so o par id/codigo -- o
   suficiente para a importacao traduzir a planilha, sem abrir o resto.

   Tolerante de proposito: num banco onde o SQL do codigo ainda nao rodou a
   funcao nao existe, e a importacao volta a casar pelo nome, como antes. */
async function fetchCodigos(){
  if(MODO_DEMO) return {};
  try{
    const { data, error } = await sb.rpc('codigos_assessores');
    if(error) throw error;
    const m = {};
    for(const r of (data || [])) if(r && r.codigo) m[r.user_id] = String(r.codigo);
    return m;
  }catch(e){
    console.warn('Sem codigos de assessor; a importacao vai casar pelo nome.', e);
    return {};
  }
}

async function fetchProfiles(){
  if(MODO_DEMO) return demoStore.profiles.map(p => ({ ...p }));
  const [{ data, error }, codigos] = await Promise.all([
    sb.from('profiles').select('*').order('nome'),
    fetchCodigos(),
  ]);
  if(error) throw error;
  return (data || []).map(p => ({ id:p.id, nome:p.nome, role:p.role, status:p.status, produtos:p.produtos || [], especialistasPadrao:p.especialistas_padrao || {}, codigo: codigos[p.id] || '' }));
}

/* ================= Fechar com Esc =================
   Todo modal já fecha ao clicar fora; o teclado precisava do mesmo caminho.
   Um listener por modal faria todos responderem à mesma tecla e fechariam
   em cascata, então o listener é único e a pilha diz quem está por cima:
   com o LoseModal aberto sobre a ficha, Esc fecha só a confirmação. */
const pilhaEsc = [];
window.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  const topo = pilhaEsc[pilhaEsc.length - 1];
  if(topo) topo.fechar();
});

function useEsc(onClose){
  /* O ref evita reassinar a pilha a cada render por causa da identidade
     nova do onClose, mantendo a ordem de empilhamento estável. */
  const fechar = useRef(onClose);
  fechar.current = onClose;
  useEffect(() => {
    const item = { fechar: () => { if(fechar.current) fechar.current(); } };
    pilhaEsc.push(item);
    return () => {
      const i = pilhaEsc.indexOf(item);
      if(i >= 0) pilhaEsc.splice(i, 1);
    };
  }, []);
}

function LoginScreen({ onLogin, onRegister, onReset, demo, onEntrarDemo }){
  const [mode, setMode] = useState('entrar');   // entrar | criar | aguardando | recuperar | enviado
  const [nome, setNome] = useState('');
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const campo = (label, props) => h('div',{className:'field'}, h('label',null,label), h('input',props));

  const entrar = async () => {
    if(!email.trim() || !senha){ setError('Informe e-mail e senha.'); return; }
    setBusy(true); setError('');
    const res = await onLogin(email.trim(), senha);
    setBusy(false);
    if(res !== true) setError(res);
  };

  const criar = async () => {
    if(!nome.trim()){ setError('Informe seu nome.'); return; }
    if(!email.trim()){ setError('Informe seu e-mail.'); return; }
    if(senha.length < 8){ setError('A senha precisa ter pelo menos 8 caracteres.'); return; }
    setBusy(true); setError('');
    const res = await onRegister(nome.trim(), email.trim(), senha);
    setBusy(false);
    if(res === true) setMode('aguardando'); else setError(res);
  };

  const recuperar = async () => {
    if(!email.trim()){ setError('Informe o e-mail da sua conta.'); return; }
    setBusy(true); setError('');
    const res = await onReset(email.trim());
    setBusy(false);
    if(res === true) setMode('enviado'); else setError(res);
  };

  const rodape = (texto, alvo, rotulo) => h('div',{style:{textAlign:'center',marginTop:14}},
    h('span',{style:{fontSize:12.5,color:'var(--ink-muted)'}}, texto, ' '),
    h('button',{className:'link-btn', onClick:()=>{ setMode(alvo); setError(''); }}, rotulo)
  );

  if(mode === 'aguardando'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card'},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Conta criada')),
        h('p',{className:'sub'},'Um administrador precisa liberar seu acesso antes do primeiro login. Assim que isso acontecer, entre normalmente com seu e-mail e senha.'),
        h('button',{className:'btn btn-ghost', style:{width:'100%',justifyContent:'center'}, onClick:()=>{ setMode('entrar'); setSenha(''); }}, 'Voltar para a entrada')
      )
    );
  }

  if(mode === 'enviado'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card'},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Link enviado')),
        h('p',{className:'sub'},'Se existe uma conta com esse e-mail, o link para criar uma nova senha chegou na caixa de entrada. Vale conferir o spam.'),
        h('button',{className:'btn btn-ghost', style:{width:'100%',justifyContent:'center'}, onClick:()=>{ setMode('entrar'); setError(''); }}, 'Voltar para a entrada')
      )
    );
  }

  if(mode === 'recuperar'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card'},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Recuperar acesso')),
        h('p',{className:'sub'},'Enviamos um link para você definir uma nova senha.'),
        campo('E-mail',{ type:'email', value:email, autoComplete:'email', onChange:e=>setEmail(e.target.value), placeholder:'nome@empresa.com', autoFocus:true }),
        error ? h('div',{className:'field-error'}, error) : null,
        h('button',{className:'btn btn-primary', style:{width:'100%',justifyContent:'center',marginTop:6}, disabled:busy, onClick:recuperar}, busy ? 'Enviando...' : 'Enviar link'),
        rodape('Lembrou a senha?','entrar','Entrar')
      )
    );
  }

  if(mode === 'criar'){
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card'},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Criar minha conta')),
        h('p',{className:'sub'},'Sua conta entra como vendedor(a) e precisa da aprovação de um administrador antes do primeiro acesso.'),
        campo('Seu nome',{ value:nome, onChange:e=>setNome(e.target.value), placeholder:'Ex: João Pedro', autoComplete:'name' }),
        campo('E-mail',{ type:'email', value:email, onChange:e=>setEmail(e.target.value), placeholder:'nome@empresa.com', autoComplete:'email' }),
        campo('Senha',{ type:'password', value:senha, onChange:e=>setSenha(e.target.value), placeholder:'Mínimo de 8 caracteres', autoComplete:'new-password' }),
        error ? h('div',{className:'field-error'}, error) : null,
        h('button',{className:'btn btn-primary', style:{width:'100%',justifyContent:'center',marginTop:6}, disabled:busy, onClick:criar}, busy ? 'Criando...' : 'Criar conta'),
        rodape('Já tem conta?','entrar','Entrar')
      )
    );
  }

  /* No modo demonstração o acesso é por papel, sem senha: o objetivo é
     percorrer os fluxos, não exercitar a autenticação. */
  if(demo){
    const papel = { admin:'Admin · vê tudo', vendedor:'Assessor · só a carteira dele', especialista:'Especialista · funil de produto' };
    return h('div',{className:'login-screen'},
      h('div',{className:'login-card'},
        h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Modo demonstração')),
        h('p',{className:'sub'},'Dados de exemplo em memória. Nada é salvo — recarregar restaura tudo. Escolha por quem entrar:'),
        h('div',{className:'user-list'},
          demo.map(u => h('button',{ key:u.id, className:'user-pick', onClick:()=>onEntrarDemo(u.id) },
            h('span',{className:'avatar'}, initials(u.nome)),
            h('span',{className:'name'}, u.nome,
              h('span',{style:{display:'block',fontSize:11,color:'var(--ink-faint)',fontWeight:400}}, papel[u.role] || u.role))
          ))
        )
      )
    );
  }

  return h('div',{className:'login-screen'},
    h('div',{className:'login-card'},
      h('div',{className:'login-logo'}, h('span',{className:'brand-mark'}), h('h2',null,'Entrar no Pipeline')),
      h('p',{className:'sub'},'Use o e-mail e a senha da sua conta.'),
      campo('E-mail',{ type:'email', value:email, autoComplete:'email', onChange:e=>{ setEmail(e.target.value); setError(''); }, placeholder:'nome@empresa.com', autoFocus:true }),
      campo('Senha',{ type:'password', value:senha, autoComplete:'current-password', onChange:e=>{ setSenha(e.target.value); setError(''); },
        onKeyDown:(e)=>{ if(e.key==='Enter') entrar(); }, placeholder:'••••••••' }),
      error ? h('div',{className:'field-error'}, error) : null,
      h('button',{className:'btn btn-primary', style:{width:'100%',justifyContent:'center',marginTop:6}, disabled:busy, onClick:entrar}, busy ? 'Entrando...' : 'Entrar'),
      h('div',{style:{textAlign:'center',marginTop:10}}, h('button',{className:'link-btn', onClick:()=>{ setMode('recuperar'); setError(''); }}, 'Esqueci minha senha')),
      h('div',{className:'login-divider'}, 'ou'),
      rodape('Primeira vez aqui?','criar','Criar minha conta')
    )
  );
}

/* ================= Lead Card ================= */
function LeadCard({ lead, onOpen, onDragStart, onDragEnd, dragging, ownerName, showOwner, onLose, onWin, onAdvance, editavel, pendenteIndicacao }){
  const cotacao = useCotacao();
  const info = stageInfo(lead.etapa, lead.funil);
  const urgency = taskUrgency(lead);
  const urgencyLabel = { late:'Contato atrasado', today:'Contato hoje', ok:'Em dia', none:'Sem próximo contato' }[urgency];
  /* O card mostra o consolidado; a parcela lá fora vem logo abaixo, em dólar.
     Esconder o offshore aqui obrigaria a abrir o cliente para saber por que
     dois cards de patrimônio parecido têm pesos diferentes na carteira. */
  const offshoreUsd = valorEmCarteiraOffshore(lead);
  const emGestao = valorEmCarteiraTotal(lead, cotacao);
  const sobGestao = emGestao > 0;
  const valor = sobGestao ? emGestao : parseValor(lead.valorPotencial);
  const proxima = nextStage(lead);
  const hojeCard = todayISO();
  const urgentes = alertasUrgentes(lead, hojeCard);
  /* role/tabIndex em vez de <button> porque o card contém botões próprios,
     e botão dentro de botão é HTML inválido. */
  return h('div', {
    className: 'lead-card' + (dragging ? ' dragging' : '') + (editavel ? '' : ' somente-leitura'),
    draggable: editavel,
    role: 'button',
    tabIndex: 0,
    'aria-label': (nomeCliente(lead) || 'Lead sem nome') + ' — ' + etapaLonga(lead.etapa, lead.funil) + ' — ' + urgencyLabel,
    onDragStart: (e)=>{
      if(!editavel){ e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', lead.id); onDragStart(lead.id);
    },
    onDragEnd: onDragEnd,
    onClick: ()=>onOpen(lead),
    onKeyDown: (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onOpen(lead); }
    },
  },
    h('div',{className:'lead-card-bar', style:{background:info.color}}),
    h('div',{className:'lead-card-body'},
      h('div',{className:'lead-card-top'},
        h('p',{className:'lead-card-name'},
          lead.tipoPessoa === 'PJ' ? h('span',{className:'pj-tag'},'PJ') : null,
          nomeCliente(lead)),
        h('div',{className:'lead-card-top-actions'},
          h('span',{className:'task-dot ' + urgency, title:urgencyLabel}),
          /* Cliente da base já é carteira: captação nova dele é aporte, no
             extrato da ficha, e não um desfecho marcado no card. */
          (editavel && !((lead.funil || 'assessor') !== 'especialista' && (lead.esteira || 'novo') === 'base')) ? h('button',{
            className:'win-btn', title:'Marcar como venda',
            onClick:(e)=>{ e.stopPropagation(); onWin(lead); }
          }, h(IconThumbsUp,{size:12})) : null,
          editavel ? h('button',{
            className:'lose-btn', title:'Desqualificar negócio',
            onClick:(e)=>{ e.stopPropagation(); onLose(lead); }
          }, h(IconThumbsDown,{size:12})) : null,
          /* Deixa explícito no quadro que este card é de acompanhamento. */
          editavel ? null : h('span',{className:'card-lock', title:'Você acompanha, mas não edita'},
            h(Icon,{path:'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zM8 11V7a4 4 0 118 0v4', size:11}))
        )
      ),
      /* PJ muda quem se procura: mostrar o contato evita abrir o card só para isso. */
      /* Alerta vencido não pode ficar escondido dentro do card. */
      urgentes.length > 0
        ? h('div',{className:'card-alerta' + (urgentes.some(a => a.data < hojeCard) ? ' vencido' : '')},
            h(Icon,{path:'M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z', size:11}),
            h('span',null, urgentes.length === 1
              ? tipoAlertaLabel(urgentes[0].tipo) + ': ' + urgentes[0].texto
              : urgentes.length + ' alertas para hoje ou vencidos')
          )
        : null,
      /* Fechar o modal da R4 sem indicar deixa o cliente parado; o card avisa. */
      pendenteIndicacao ? h('div',{className:'card-alerta vencido'},
        h(Icon,{path:'M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z', size:11}),
        h('span',null,'Indicação pendente')
      ) : null,
      /* Só no dia: um lembrete permanente viraria ruído. */
      aniversarioHoje(lead, hojeCard) ? h('p',{className:'card-aniversario'},
        '🎂 ' + (lead.tipoPessoa === 'PJ'
          ? 'Aniversário de ' + aniversarianteDe(lead)
          : 'Aniversário hoje')
        + (idadeEm(lead, hojeCard) ? ' · ' + idadeEm(lead, hojeCard) + ' anos' : '')
      ) : null,
      /* Temperatura no quadro: quem varre a coluna procura justamente por
         quem está quente. Escondê-la atrás do hover anularia o campo. */
      temperaturaDe(lead) ? h('div',{className:'card-temp',
          title: clienteDaBase(lead) ? 'Temperatura da captação em negociação' : 'Temperatura de captação'},
        h('span',{className:'temp-dot', style:{background:temperaturaDe(lead).cor}}),
        temperaturaDe(lead).label
      ) : null,
      lead.grupoFamiliar ? h('p',{className:'card-grupo'}, lead.grupoFamiliar) : null,
      (lead.briefing && lead.briefing.urgencia === 'Imediata')
        ? h('p',{className:'card-urgente'},'Urgência imediata') : null,
      (lead.tipoPessoa === 'PJ' && lead.contatoNome)
        ? h('p',{className:'lead-card-deal'}, lead.contatoNome, lead.contatoCargo ? ' · ' + lead.contatoCargo : '')
        : (lead.oportunidade ? h('p',{className:'lead-card-deal'}, lead.oportunidade) : null),
      /* Depois da captação, o card mostra o que está sob gestão — já com
         aportes e retiradas — em vez do patrimônio estimado da prospecção. */
      valor !== null ? h('div',{className:'valor-linha'},
        h('span',{className:'lead-card-value' + (sobGestao ? ' gerido' : '')}, fmtBRL(valor)),
        sobGestao ? h('span',{className:'tag-gestao'},'Sob gestão') : null
      ) : null,
      /* Quando não há cotação, o valor em dólar aparece do mesmo jeito — é o
         que existe. O que a tela não faz é fingir que ele já está somado. */
      offshoreUsd >= OFFSHORE_PISO_USD ? h('div',{className:'card-offshore',
        title: cotacaoValida(cotacao) ? 'Já somado no valor acima' : 'Ainda não somado: falta a cotação do dólar'},
        h('span',{className:'off-tag'},'OFF'),
        h('span',{className:'card-offshore-valor'}, fmtUSDCompact(offshoreUsd)),
        cotacaoValida(cotacao) ? null : h('span',{className:'card-offshore-aviso'},'fora do total')
      ) : null,
      /* Cliente da base com captação em negociação: o valor acima é o que já
         está em casa; esta linha é o que está em jogo. */
      (clienteDaBase(lead) && valorCaptacaoNaMoeda(lead) > 0) ? h('div',{className:'card-captacao',
        title: custodiaCaptacao(lead) === 'offshore'
          ? 'Captação offshore em negociação com este cliente da base'
          : 'Captação em negociação com este cliente da base'},
        h('span',{className:'card-captacao-rotulo'}, custodiaCaptacao(lead) === 'offshore' ? 'Em captação · off' : 'Em captação'),
        h('span',{className:'card-captacao-valor'},
          (custodiaCaptacao(lead) === 'offshore' ? fmtUSDCompact : fmtBRLCompact)(valorCaptacaoNaMoeda(lead)))
      ) : null,
      /* O rodapé só existe quando há responsável a mostrar: datas de contato
         e telefone saíram do card e seguem na ficha. */
      showOwner ? h('div',{className:'lead-card-foot'},
        h('span',{className:'avatar lead-card-owner-avatar', title:ownerName || 'Sem responsável'}, initials(ownerName))
      ) : null,
      /* Arrastar não dispara em telas de toque. Este botão dá o mesmo caminho
         pelo teclado e pelo dedo, reaproveitando o fluxo de movimentação. */
      (proxima && editavel) ? h('button',{
        className:'lead-card-advance', type:'button',
        onClick:(e)=>{ e.stopPropagation(); onAdvance(lead.id, proxima); },
        title:'Avançar para ' + etapaLonga(proxima, lead.funil),
      }, 'Avançar para ' + etapaCurta(proxima, lead.funil), h(Icon,{path:'M5 12h14M12 5l7 7-7 7', size:12})) : null
    )
  );
}

/* ================= Lead Form ================= */
/* `cadastro` diz se o formulário está criando ou editando. Não dá para
   deduzir do registro: o cliente carregado da base nasce sem histórico, e
   parecia recém-criado. */
function LeadForm({ initial, onChange, errors, users, currentUser, isAdmin, stageEditable, grupos, cadastro }){
  const set = (field) => (e) => onChange({ ...initial, [field]: e.target.value });
  const ownerName = (users.find(u=>u.id===initial.responsavelId) || {}).nome || '';
  const jornada = (initial.funil || 'assessor') !== 'especialista';
  const t = termos(initial.funil);
  const pj = (initial.tipoPessoa || 'PF') === 'PJ';
  const rot = rotulosPessoa(initial.tipoPessoa || 'PF');
  const sugestao = sugerirGrupo(initial.cliente);
  const seguro = initial.produto === 'Seguro';

  /* O patrimônio define o segmento. Ao sair do campo, sugerimos o segmento
     correspondente — o assessor ainda pode trocar, mas não precisa calcular. */
  const normalizarPatrimonio = (e) => {
    const n = parseValor(e.target.value);
    const patch = { ...initial, valorPotencial: n === null ? '' : fmtBRL(n) };
    if(jornada && n !== null){
      const sugerido = segmentoPorPatrimonio(n);
      if(sugerido) patch.segmento = sugerido;
    }
    onChange(patch);
  };

  return h(Fragment, null,
    /* Primeiro campo de propósito: ele determina o que o resto do
       formulário pergunta e como o cliente é chamado. */
    jornada ? h('div',{className:'field'},
      h('label',null,'Tipo de cliente'),
      h('div',{className:'tipo-pessoa', role:'radiogroup', 'aria-label':'Tipo de cliente'},
        ['PF','PJ'].map(tp => h('button',{
          key:tp, type:'button', role:'radio', 'aria-checked': (initial.tipoPessoa||'PF')===tp ? 'true':'false',
          className: (initial.tipoPessoa||'PF')===tp ? 'active' : '',
          onClick:()=>onChange({ ...initial, tipoPessoa: tp }),
        },
          h('strong',null, tp),
          h('span',null, tp === 'PF' ? 'Pessoa física' : 'Pessoa jurídica')
        ))
      )
    ) : null,

    h('div',{className:'field'},
      h('label',null, rot.nome, ' ', h('span',{className:'required'},'*')),
      /* O campo edita o nome cru. A conta é composta na leitura, então digitar
         "Silvana Antunes" aqui já produz "Silvana Antunes · 4417029" no card:
         ninguém precisa recolar dígitos. E se o valor vier do formato antigo,
         com a conta colada, nomeSemConta a devolve limpa para edição. */
      h('input',{ value:nomeSemConta(initial.cliente, initial.conta), onChange:set('cliente'),
        placeholder:rot.nomePlaceholder }),
      errors.cliente ? h('div',{className:'field-error'}, errors.cliente) : null
    ),

    /* Só na Jornada: conta é do banco, e o funil de produto não tem custódia.
       Cliente cadastrado aqui nasce sem conta e é isso mesmo — ela chega
       depois, quando o BTG abre. Preenchê-la é o que faz o cliente entrar na
       atualização semanal da base. */
    jornada ? h('div',{className:'field'},
      h('label',null,'Conta BTG'),
      h('input',{ value:initial.conta || '', onChange:set('conta'),
        inputMode:'numeric', placeholder:'Ex: 4417029' }),
      h('div',{className:'field-hint'}, initial.conta
        ? 'O card mostra ' + nomeCliente({ cliente: nomeSemConta(initial.cliente, initial.conta), conta: initial.conta }) + '.'
        : 'Em branco enquanto a conta não abre. Assim que preenchida, o cliente passa a ser conciliado pela atualização semanal da base.')
    ) : null,

    jornada ? h('div',{className:'field'},
      h('label',null, pj ? 'Aniversário do contato principal' : 'Data de nascimento'),
      h('input',{ type:'date', value:initial.nascimento || '', max: todayISO(),
        onChange:set('nascimento') }),
      h('div',{className:'field-hint'}, pj
        ? 'Empresa não faz aniversário que renda uma ligação; quem faz é a pessoa com quem se fala.'
        : 'Gera um lembrete automático no dia, todo ano.')
    ) : null,

    /* PJ: com quem se fala dentro da empresa. */
    (jornada && pj) ? h('div',{className:'field-row'},
      h('div',{className:'field'},
        h('label',null,'Contato principal'),
        h('input',{ value:initial.contatoNome || '', onChange:set('contatoNome'), placeholder:'Ex: Helena Prass' })
      ),
      h('div',{className:'field'},
        h('label',null,'Cargo do contato'),
        h('input',{ value:initial.contatoCargo || '', onChange:set('contatoCargo'), placeholder:'Ex: Diretora financeira' })
      )
    ) : null,

    jornada ? h('div',{className:'field'},
      h('label',null,'Grupo familiar'),
      h('input',{
        value: initial.grupoFamiliar || '', onChange:set('grupoFamiliar'),
        list:'grupos-familiares', placeholder:'Ex: Família Prass',

        : h('div',{className:'field-hint'},'Une cônjuges, filhos e holdings numa leitura só.')
    ) : null,

    jornada ? h('div',{className:'field-row'},
      h('div',{className:'field'},
        h('label',null,'Esteira'),
        h('select',{ value:initial.esteira, onChange:set('esteira') },
